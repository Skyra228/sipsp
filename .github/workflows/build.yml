          package com.example.spacesplayer
          
          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.RadialGradient
          import android.graphics.RectF
          import android.graphics.Shader
          import android.util.AttributeSet
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.max
          import kotlin.math.sin
          
          class AmbientGlowView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null
          ) : View(context, attrs) {
          
              private val glowPaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private var primaryColor: Int = Color.parseColor("#55C87A42")
              private var secondaryColor: Int = Color.parseColor("#339E472A")
              private var colorAnimator: ValueAnimator? = null
          
              fun setGlowColor(rgbColor: Int) {
                  val r = Color.red(rgbColor)
                  val g = Color.green(rgbColor)
                  val b = Color.blue(rgbColor)
                  val targetPrimary = Color.argb(115, max(r, 90), max(g, 55), max(b, 40))
                  val targetSecondary = Color.argb(65, (r * 0.7f).toInt(), (g * 0.5f).toInt(), (b * 0.6f).toInt())
          
                  colorAnimator?.cancel()
                  val startP = primaryColor
                  val startS = secondaryColor
                  colorAnimator = ValueAnimator.ofFloat(0f, 1f).apply {
                      duration = 650L
                      addUpdateListener { anim ->
                          val f = anim.animatedValue as Float
                          primaryColor = blendArgb(startP, targetPrimary, f)
                          secondaryColor = blendArgb(startS, targetSecondary, f)
                          invalidate()
                      }
                      start()
                  }
              }
          
              private fun blendArgb(c1: Int, c2: Int, ratio: Float): Int {
                  val inv = 1f - ratio
                  val a = (Color.alpha(c1) * inv + Color.alpha(c2) * ratio).toInt()
                  val r = (Color.red(c1) * inv + Color.red(c2) * ratio).toInt()
                  val g = (Color.green(c1) * inv + Color.green(c2) * ratio).toInt()
                  val b = (Color.blue(c1) * inv + Color.blue(c2) * ratio).toInt()
                  return Color.argb(a, r, g, b)
              }
          
              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (w <= 0f || h <= 0f) return
          
                  val radius = max(w, h) * 0.78f
                  glowPaint.shader = RadialGradient(
                      w * 0.5f,
                      h * 0.24f,
                      radius,
                      intArrayOf(primaryColor, secondaryColor, Color.TRANSPARENT),
                      floatArrayOf(0f, 0.52f, 1f),
                      Shader.TileMode.CLAMP
                  )
                  canvas.drawRect(0f, 0f, w, h, glowPaint)
              }
          }
          
          class WaveformSeekBar @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null
          ) : View(context, attrs) {
          
              var maxProgress: Int = 100
                  set(value) {
                      field = max(1, value)
                      invalidate()
                  }
          
              var progress: Int = 0
                  set(value) {
                      field = value.coerceIn(0, maxProgress)
                      invalidate()
                  }
          
              var isPlayingWave: Boolean = false
                  set(value) {
                      field = value
                      if (value) postInvalidateOnAnimation() else invalidate()
                  }
          
              var onSeekListener: ((Int, Boolean) -> Unit)? = null
              var onSeekConfirmListener: ((Int) -> Unit)? = null
          
              private var isDragging = false
              private var phase = 0f
          
              private val barHeights = FloatArray(48) { i ->
                  val norm = i / 48f
                  val envelope = sin(norm * Math.PI).toFloat()
                  val detail = (0.35f + 0.65f * abs(sin(i * 1.7f) * cos(i * 0.85f))).toFloat()
                  (0.18f + 0.82f * envelope * detail).coerceIn(0.16f, 1f)
              }
          
              private val activeBarPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL
              }
              private val inactiveBarPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL
                  color = Color.parseColor("#38FFFFFF")
              }
              private val trackBgPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL
                  color = Color.parseColor("#2AFFFFFF")
              }
              private val trackActivePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL
              }
              private val thumbGlowPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL
                  color = Color.parseColor("#66FFB74D")
              }
              private val thumbPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL
                  color = Color.parseColor("#FFD180")
              }
              private val rect = RectF()
          
              fun setSeedFromTitle(title: String) {
                  val h = title.hashCode()
                  for (i in barHeights.indices) {
                      val norm = i.toFloat() / barHeights.size
                      val env = sin(norm * Math.PI).toFloat()
                      val pseudo = abs(sin((i * 2.1f) + (h % 97) * 0.13f) * cos(i * 0.9f + (h % 53) * 0.19f)).toFloat()
                      barHeights[i] = (0.18f + 0.82f * env * (0.3f + 0.7f * pseudo)).coerceIn(0.16f, 1f)
                  }
                  invalidate()
              }
          
              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (w <= 0f || h <= 0f) return
          
                  val density = resources.displayMetrics.density
                  val padH = 10f * density
                  val usableW = (w - padH * 2f).coerceAtLeast(1f)
                  val ratio = (progress.toFloat() / maxProgress.toFloat()).coerceIn(0f, 1f)
                  val playheadX = padH + usableW * ratio
          
                  val waveBottom = h * 0.68f
                  val maxWaveHeight = h * 0.56f
                  val count = barHeights.size
                  val step = usableW / count
                  val barWidth = (step * 0.52f).coerceAtLeast(2f * density)
          
                  activeBarPaint.shader = LinearGradient(
                      padH, 0f, playheadX.coerceAtLeast(padH + 10f), 0f,
                      Color.parseColor("#FFE082"),
                      Color.parseColor("#FF8A50"),
                      Shader.TileMode.CLAMP
                  )
          
                  if (isPlayingWave) {
                      phase += 0.11f
                  }
          
                  for (i in 0 until count) {
                      val cx = padH + i * step + step * 0.5f
                      var frac = barHeights[i]
                      if (isPlayingWave) {
                          val dist = abs(cx - playheadX) / usableW
                          if (dist < 0.22f) {
                              val boost = sin(phase + i * 0.7f) * 0.14f * (1f - dist / 0.22f)
                              frac = (frac + boost).coerceIn(0.15f, 1f)
                          }
                      }
                      val barH = maxWaveHeight * frac
                      val top = waveBottom - barH
                      rect.set(cx - barWidth * 0.5f, top, cx + barWidth * 0.5f, waveBottom)
                      val paint = if (cx <= playheadX) activeBarPaint else inactiveBarPaint
                      canvas.drawRoundRect(rect, barWidth * 0.5f, barWidth * 0.5f, paint)
                  }
          
                  val lineY = h * 0.84f
                  val lineHalfH = 2.0f * density
          
                  rect.set(padH, lineY - lineHalfH, padH + usableW, lineY + lineHalfH)
                  canvas.drawRoundRect(rect, lineHalfH, lineHalfH, trackBgPaint)
          
                  trackActivePaint.shader = LinearGradient(
                      padH, lineY, playheadX.coerceAtLeast(padH + 1f), lineY,
                      Color.parseColor("#FFE082"),
                      Color.parseColor("#FF9E44"),
                      Shader.TileMode.CLAMP
                  )
                  rect.set(padH, lineY - lineHalfH, playheadX, lineY + lineHalfH)
                  canvas.drawRoundRect(rect, lineHalfH, lineHalfH, trackActivePaint)
          
                  val thumbR = if (isDragging) 6.5f * density else 5.0f * density
                  canvas.drawCircle(playheadX, lineY, thumbR * 2.1f, thumbGlowPaint)
                  canvas.drawCircle(playheadX, lineY, thumbR, thumbPaint)
          
                  if (isPlayingWave) {
                      postInvalidateDelayed(45L)
                  }
              }
          
              override fun onTouchEvent(event: MotionEvent): Boolean {
                  val density = resources.displayMetrics.density
                  val padH = 10f * density
                  val usableW = (width - padH * 2f).coerceAtLeast(1f)
                  val touchRatio = ((event.x - padH) / usableW).coerceIn(0f, 1f)
                  val newProg = (touchRatio * maxProgress).toInt()
          
                  when (event.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          parent?.requestDisallowInterceptTouchEvent(true)
                          isDragging = true
                          progress = newProg
                          onSeekListener?.invoke(progress, true)
                          invalidate()
                          return true
                      }
                      MotionEvent.ACTION_MOVE -> {
                          progress = newProg
                          onSeekListener?.invoke(progress, true)
                          invalidate()
                          return true
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          parent?.requestDisallowInterceptTouchEvent(false)
                          isDragging = false
                          progress = newProg
                          onSeekConfirmListener?.invoke(progress)
                          invalidate()
                          return true
                      }
                  }
                  return super.onTouchEvent(event)
              }
          }
