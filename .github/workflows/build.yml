              private fun showSleepTimerDialog() {
                  val options = arrayOf(
                      "Выключить таймер",
                      "Через 15 минут",
                      "Через 30 минут",
                      "Через 45 минут",
                      "Через 60 минут"
                  )
                  val minutesMap = intArrayOf(0, 15, 30, 45, 60)
                  AlertDialog.Builder(this)
                      .setTitle("🌙 Таймер сна")
                      .setItems(options) { _, which ->
                          sleepTimer?.cancel()
                          val mins = minutesMap[which]
                          if (mins == 0) {
                              btnSleep.text = "🌙"
                              Toast.makeText(this, "Таймер сна отключён", Toast.LENGTH_SHORT).show()
                          } else {
                              sleepTimer = object : CountDownTimer(mins * 60 * 1000L, 60000L) {
                                  override fun onTick(millisUntilFinished: Long) {
                                      val mLeft = (millisUntilFinished / 60000L) + 1
                                      btnSleep.text = "🌙 ${mLeft}м"
                                  }
                                  override fun onFinish() {
                                      player.pause()
                                      btnSleep.text = "🌙"
                                      Toast.makeText(this@MainActivity, "Таймер сна остановил музыку", Toast.LENGTH_LONG).show()
                                  }
                              }.start()
                              Toast.makeText(this, "Музыка остановится через $mins мин.", Toast.LENGTH_SHORT).show()
                          }
                      }
                      .show()
              }

              private fun getSavedTracks(prefKey: String): ArrayList<SpaceItem> {
                  val prefs = getSharedPreferences("spaces_v7", Context.MODE_PRIVATE)
                  val raw = prefs.getString(prefKey, "[]") ?: "[]"
                  val list = ArrayList<SpaceItem>()
                  try {
                      val arr = JSONArray(raw)
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          list.add(
                              SpaceItem(
                                  idKey = o.optString("idKey"),
                                  title = o.optString("title"),
                                  subtitle = o.optString("subtitle"),
                                  url = o.optString("url"),
                                  isFolder = false,
                                  directMp3 = o.optString("directMp3")
                              )
                          )
                      }
                  } catch (_: Exception) {}
                  return list
              }

              private fun saveTracksList(prefKey: String, list: List<SpaceItem>) {
                  val arr = JSONArray()
                  for (item in list.take(150)) {
                      val o = JSONObject()
                      o.put("idKey", item.idKey)
                      o.put("title", item.title)
                      o.put("subtitle", item.subtitle)
                      o.put("url", item.url)
                      o.put("directMp3", item.directMp3)
                      arr.put(o)
                  }
                  getSharedPreferences("spaces_v7", Context.MODE_PRIVATE)
                      .edit().putString(prefKey, arr.toString()).apply()
              }

              private fun isFavorite(item: SpaceItem): Boolean {
                  return getSavedTracks("favorites").any { it.idKey == item.idKey || it.title == item.title }
              }

              private fun toggleFavorite(item: SpaceItem): Boolean {
                  val favs = getSavedTracks("favorites")
                  val existingIdx = favs.indexOfFirst { it.idKey == item.idKey || it.title == item.title }
                  return if (existingIdx >= 0) {
                      favs.removeAt(existingIdx)
                      saveTracksList("favorites", favs)
                      false
                  } else {
                      favs.add(0, item)
                      saveTracksList("favorites", favs)
                      true
                  }
              }

              private fun addToHistory(item: SpaceItem) {
                  val hist = getSavedTracks("history")
                  hist.removeAll { it.idKey == item.idKey || it.title == item.title }
                  hist.add(0, item)
                  saveTracksList("history", hist)
              }

              private fun showSavedList(prefKey: String, label: String) {
                  loadJob?.cancel()
                  progressBar.visibility = View.GONE
                  nextPageUrl = null
                  updateMirrorBadge()

                  val saved = getSavedTracks(prefKey)
                  items.clear()
                  seenKeys.clear()
                  items.addAll(saved)
                  adapter.notifyDataSetChanged()

                  tvStatus.text = if (saved.isNotEmpty()) "$label (${saved.size})" else "$label: пока пусто"
              }

              private fun downloadCurrentTrack() {
                  val cur = currentPlayingItem
                  if (cur == null) {
                      Toast.makeText(this, "Сначала выберите и запустите трек", Toast.LENGTH_SHORT).show()
                      return
                  }
                  uiScope.launch {
                      Toast.makeText(this@MainActivity, "Подготовка скачивания «${cur.title}»...", Toast.LENGTH_SHORT).show()
                      val mp3Url = resolveStreamUrl(cur)
                      if (mp3Url.isEmpty()) {
                          Toast.makeText(this@MainActivity, "Не удалось получить прямую ссылку на MP3", Toast.LENGTH_SHORT).show()
                          return@launch
                      }
                      try {
                          val safeFileName = "${cur.subtitle} - ${cur.title}"
                              .replace(Regex("[\\\\/:*?\"<>|]"), "_")
                              .take(90) + ".mp3"

                          val cookieHeader = allCookies.values.joinToString("; ") { "${it.name}=${it.value}" }
                          val req = DownloadManager.Request(Uri.parse(mp3Url))
                              .setTitle(cur.title)
                              .setDescription("Скачивание из Spaces Музыка")
                              .addRequestHeader("User-Agent", MusicEngine.USER_AGENT)
                              .addRequestHeader("Referer", cur.url)
                              .addRequestHeader("Cookie", cookieHeader)
                              .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                              .setDestinationInExternalPublicDir(Environment.DIRECTORY_MUSIC, "SpacesPlayer/$safeFileName")

                          val dm = getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                          dm.enqueue(req)
                          Toast.makeText(this@MainActivity, "Загрузка началась в папку Music/SpacesPlayer!", Toast.LENGTH_LONG).show()
                      } catch (e: Exception) {
                          Toast.makeText(this@MainActivity, "Ошибка загрузки: ${e.message}", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

