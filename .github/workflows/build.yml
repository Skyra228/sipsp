              // ───────── Сеть ─────────

              private fun toAbsoluteUrl(path: String): String {
                  val clean = path.trim()
                  return when {
                      clean.startsWith("http://") || clean.startsWith("https://") -> clean
                      clean.startsWith("//") -> "https:$clean"
                      clean.startsWith("/") -> baseHost + clean
                      else -> "$baseHost/$clean"
                  }
              }

              private fun pathOf(url: String): String = Uri.parse(url).path ?: ""

              private fun httpGetHtml(full: String): Pair<String, String>? {
                  return try {
                      val req = Request.Builder().url(full)
                          .header("User-Agent", "Mozilla/5.0 (compatible; SpacesPlayer/8.1)")
                          .header("Accept-Language", "ru,en;q=0.8")
                          .header("Referer", "$baseHost/")
                          .build()
                      httpClient.newCall(req).execute().use { resp ->
                          if (!resp.isSuccessful) return null
                          val html = resp.body?.string() ?: return null
                          Pair(html, resp.request.url.toString())
                      }
                  } catch (_: Exception) {
                      null
                  }
              }

              // Spaces отдаёт Lite-разметку (она и разбирается ниже). Если сайт вдруг отдал Mobile, один раз переключаем на Lite.
              private fun fetchDoc(urlOrPath: String): Document? {
                  val full = toAbsoluteUrl(urlOrPath)
                  var res = httpGetHtml(full) ?: return null
                  var doc = Jsoup.parse(res.first, res.second)
                  if (!liteChecked) {
                      liteChecked = true
                      val sw = doc.selectFirst("a[href*='dtype=lite']")
                      if (sw != null) {
                          httpGetHtml(sw.absUrl("href"))
                          res = httpGetHtml(full) ?: return null
                          doc = Jsoup.parse(res.first, res.second)
                      }
                  }
                  val finalUri = Uri.parse(res.second)
                  val finalHost = "${finalUri.scheme}://${finalUri.host}"
                  if (finalHost.contains("spcs") || finalHost.contains("spaces")) baseHost = finalHost
                  return doc
              }

              private fun loadSection(urlOrPath: String, mode: TabMode, title: String, addToHistory: Boolean) {
                  loadJob?.cancel()
                  isLoadingMore = false
                  loadedPages.clear()
                  val fullTarget = toAbsoluteUrl(urlOrPath)
                  if (addToHistory && currentEntry.url != fullTarget) {
                      navHistory.push(currentEntry)
                  }
                  currentEntry = NavEntry(fullTarget, mode, title)
                  updateMirrorBadge()

                  progressBar.visibility = View.VISIBLE
                  tvStatus.text = "Загрузка: $title..."

                  loadJob = uiScope.launch {
                      val doc = withContext(Dispatchers.IO) {
                          var d = fetchDoc(fullTarget)
                          // На страницах жанра/исполнителя показан только превью: идём в полный список «Все → /tracks/»
                          if (d != null && mode == TabMode.FOLDER_VIEW && !pathOf(fullTarget).endsWith("/tracks/")) {
                              val all = d.select("a[href]").map { it.absUrl("href") }.firstOrNull {
                                  val p = pathOf(it)
                                  p.startsWith("/music-online/") && p.endsWith("/tracks/")
                              }
                              if (all != null) d = fetchDoc(all) ?: d
                          }
                          d
                      }
                      progressBar.visibility = View.GONE
                      updateMirrorBadge()

                      if (doc != null) {
                          nextPageUrl = findNextPageUrl(doc)
                          val parsed = parseList(doc, mode)
                          items.clear()
                          seenKeys.clear()
                          for (i in parsed) {
                              if (seenKeys.add(i.idKey)) items.add(i)
                          }
                          adapter.notifyDataSetChanged()
                          rvTracks.scrollToPosition(0)
                          val tracks = items.count { !it.isFolder }
                          val folders = items.count { it.isFolder }
                          tvStatus.text = when {
                              tracks > 0 -> "$title • Треков: $tracks"
                              folders > 0 -> "$title • Элементов: $folders"
                              else -> "$title • Ничего не найдено"
                          }
                      } else {
                          tvStatus.text = "Ошибка загрузки: $title"
                      }
                  }
              }

              private fun loadNextPage() {
                  val next = nextPageUrl ?: return
                  if (!loadedPages.add(next)) {
                      nextPageUrl = null
                      return
                  }
                  isLoadingMore = true
                  progressBar.visibility = View.VISIBLE
                  val mode = currentEntry.tabMode
                  loadJob = uiScope.launch {
                      try {
                          val doc = withContext(Dispatchers.IO) { fetchDoc(next) }
                          progressBar.visibility = View.GONE
                          if (doc != null) {
                              nextPageUrl = findNextPageUrl(doc)
                              var added = 0
                              for (m in parseList(doc, mode)) {
                                  if (seenKeys.add(m.idKey)) {
                                      items.add(m)
                                      added++
                                  }
                              }
                              if (added > 0) adapter.notifyDataSetChanged()
                          } else {
                              nextPageUrl = null
                          }
                      } finally {
                          isLoadingMore = false
                      }
                  }
              }

              // ───────── Парсер Spaces «Музыка онлайн» ─────────

              private fun parseList(doc: Document, mode: TabMode): List<SpaceItem> {
                  return when (mode) {
                      TabMode.ARTISTS -> parseFolders(doc, artistRe, "Исполнитель")
                      TabMode.GENRES -> parseFolders(doc, tagRe, "Жанр")
                      else -> {
                          val tracks = parseTracks(doc)
                          if (tracks.isNotEmpty()) tracks else parseFolders(doc, artistRe, "Исполнитель")
                      }
                  }
              }

              private fun parseTracks(doc: Document): List<SpaceItem> {
                  val out = ArrayList<SpaceItem>()
                  val seen = HashSet<String>()
                  for (a in doc.select("a[href]")) {
                      val abs = a.absUrl("href")
                      if (abs.isEmpty()) continue
                      val path = pathOf(abs)
                      val viewId = viewRe.matchEntire(path)?.groupValues?.get(1) ?: ""
                      val catId = if (viewId.isEmpty()) (catalogTrackRe.matchEntire(path)?.groupValues?.get(1) ?: "") else ""
                      if (viewId.isEmpty() && catId.isEmpty()) continue

                      val title = a.text().replace(Regex("""\s+"""), " ").trim()
                      if (!hasLetters(title) || isGenericWord(title)) continue

                      val key = if (viewId.isNotEmpty()) "v$viewId" else "c$catId"
                      if (!seen.add(key)) continue

                      val artist = artistBefore(a)
                      val mp3 = rowMp3(a, viewId)
                      out.add(SpaceItem("track_$key", title.take(90), artist.ifEmpty { "Spaces" }.take(60), abs, false, mp3))
                  }
                  return out
              }

              // В списке исполнитель стоит текстом перед ссылкой: «Исполнитель: <a>Название</a>»
              private fun artistBefore(a: Element): String {
                  var node: Element? = a
                  var depth = 0
                  while (node != null && depth < 3) {
                      val sb = StringBuilder()
                      var n: Node? = node.previousSibling()
                      while (n != null) {
                          if (n is TextNode) {
                              sb.insert(0, n.text())
                          } else if (n is Element) {
                              val tag = n.tagName()
                              if (tag == "br" || tag == "div" || tag == "table" || tag == "p" || tag == "li" || tag == "tr") break
                              if (tag == "a" && n.attr("href").contains("/music/view/")) break
                              sb.insert(0, n.text())
                          }
                          n = n.previousSibling()
                      }
                      val s = sb.toString()
                          .replace(Regex("""^\s*\d+\s*[.)]\s*"""), "")
                          .replace(Regex("""\s+"""), " ")
                          .trim()
                          .trimEnd(':')
                          .trim()
                      if (hasLetters(s)) return s
                      node = node.parent()
                      depth++
                  }
                  return ""
              }

              // Прямая mp3-ссылка бывает прямо в строке списка (иконка ⬇). Берём её, только если строка содержит один трек.
              private fun rowMp3(a: Element, fileId: String): String {
                  var node: Element? = a.parent()
                  var depth = 0
                  while (node != null && depth < 4) {
                      val distinct = node.select(trackSelector).map { it.attr("href") }.toSet().size
                      if (distinct > 1) break
                      val link = node.select("a[href*='.mp3']").firstOrNull {
                          fileId.isEmpty() || it.attr("href").contains("/$fileId/")
                      }
                      if (link != null) return link.absUrl("href")
                      node = node.parent()
                      depth++
                  }
                  return ""
              }

              private fun parseFolders(doc: Document, re: Regex, subtitle: String): List<SpaceItem> {
                  val out = ArrayList<SpaceItem>()
                  val seen = HashSet<String>()
                  for (a in doc.select("a[href]")) {
                      val abs = a.absUrl("href")
                      if (abs.isEmpty()) continue
                      val path = pathOf(abs)
                      if (!re.matches(path)) continue
                      val name = (a.selectFirst("b, strong")?.text() ?: a.text()).trim()
                      if (name.length !in 2..60 || !hasLetters(name)) continue
                      if (Regex("""^\d+\..*""").matches(name)) continue
                      if (Regex("""[\d.]+""").matches(name)) continue
                      if (!seen.add(path)) continue
                      out.add(SpaceItem("folder_$path", name, subtitle, abs, true))
                  }
                  return out
              }

              private fun hasLetters(s: String) = Regex("""[\p{L}\d]""").containsMatchIn(s)

              private fun isGenericWord(t: String) = t.lowercase().trim() in setOf("скачать", "слушать", "играть", "файл", "mp3", "все", "показать все")

              private fun findNextPageUrl(doc: Document): String? {
                  for (a in doc.select("a[href]")) {
                      val t = a.text().lowercase().replace('ё', 'е').trim()
                      if (t.contains("вперед") || t == "»" || t == ">") {
                          val h = a.absUrl("href")
                          if (h.isNotEmpty() && h != currentEntry.url && !loadedPages.contains(h)) return h
                      }
                  }
                  return null
              }

              private fun onItemClicked(pos: Int) {
                  if (pos !in items.indices) return
                  val item = items[pos]
                  if (item.isFolder) {
                      val mode = TabMode.FOLDER_VIEW
                      loadSection(item.url, mode, item.title, addToHistory = true)
                  } else {
                      retriedOnce = false
                      startPlayback(item, fresh = false)
                  }
              }

              // ───────── Получение прямой ссылки на mp3 ─────────

              private fun pickMp3(doc: Document, id: String, best: Boolean): String {
                  val links = doc.select("a[href*='.mp3']").map { it.absUrl("href") }
                      .filter { it.isNotEmpty() && (id.isEmpty() || it.contains("/$id/")) }
                  if (links.isEmpty()) return ""
                  // Сегмент после id: 0 = оригинал (320 кбит), 192/128/64/32 = битрейт
                  val order = if (best) listOf("0", "192", "128", "64", "32") else listOf("192", "128", "0", "64", "32")
                  if (id.isNotEmpty()) {
                      for (q in order) {
                          val hit = links.firstOrNull { it.contains("/$id/$q/") }
                          if (hit != null) return hit
                      }
                  }
                  return links.first()
              }

              private suspend fun resolveStreamUrl(item: SpaceItem, forDownload: Boolean = false, fresh: Boolean = false): String {
                  if (!fresh && !forDownload && item.directMp3.isNotEmpty()) return item.directMp3
                  return withContext(Dispatchers.IO) {
                      var doc = fetchDoc(item.url) ?: return@withContext item.directMp3
                      var id = viewRe.find(pathOf(item.url))?.groupValues?.get(1) ?: ""
                      if (id.isEmpty()) {
                          // Страница каталога: переходим на страницу файла /music/view/ID/
                          val v = doc.select("a[href*='/music/view/']").firstOrNull()
                          if (v != null) {
                              val vu = v.absUrl("href")
                              id = viewRe.find(pathOf(vu))?.groupValues?.get(1) ?: ""
                              doc = fetchDoc(vu) ?: doc
                          }
                      }
                      val mp3 = pickMp3(doc, id, forDownload)
                      if (mp3.isNotEmpty() && !forDownload) item.directMp3 = mp3
                      mp3
                  }
              }

              private fun startPlayback(item: SpaceItem, fresh: Boolean) {
                  currentPlayingItem = item
                  adapter.selectedKey = item.idKey
                  adapter.notifyDataSetChanged()

                  btnFavTrack.text = if (isFavorite(item)) "❤️" else "♡"
                  tvNowPlayingTitle.text = item.title
                  tvNowPlayingSub.text = "Загрузка потока..."
                  progressBar.visibility = View.VISIBLE

                  val reqId = ++playRequestId
                  uiScope.launch {
                      val mp3 = resolveStreamUrl(item, fresh = fresh)
                      if (reqId != playRequestId) return@launch
                      progressBar.visibility = View.GONE
                      if (mp3.isEmpty()) {
                          tvNowPlayingSub.text = "Не удалось получить MP3"
                          return@launch
                      }
                      tvNowPlayingSub.text = item.subtitle
                      pushHistory(item)

                      val ds = DefaultHttpDataSource.Factory()
                          .setUserAgent(MusicEngine.USER_AGENT)
                          .setAllowCrossProtocolRedirects(true)
                          .setDefaultRequestProperties(mapOf("Referer" to item.url))

                      val meta = MediaMetadata.Builder().setTitle(item.title).setArtist(item.subtitle).build()
                      val mediaItem = MediaItem.Builder().setUri(mp3).setMediaMetadata(meta).build()
                      player.setMediaSource(DefaultMediaSourceFactory(ds).createMediaSource(mediaItem))
                      player.prepare()
                      player.play()
                  }
              }

              private fun currentListIndex(): Int {
                  val key = currentPlayingItem?.idKey ?: return -1
                  return items.indexOfFirst { it.idKey == key }
              }

              private fun playNextTrack() {
                  val cur = currentListIndex()
                  if (cur < 0) return
                  val next = (cur + 1 until items.size).firstOrNull { !items[it].isFolder }
                  if (next != null) {
                      retriedOnce = false
                      startPlayback(items[next], fresh = false)
                      rvTracks.scrollToPosition(next)
                  } else if (nextPageUrl != null && !isLoadingMore) {
                      loadNextPage()
                  }
              }

              private fun playPrevTrack() {
                  val cur = currentListIndex()
                  if (cur < 0) return
                  val prev = (cur - 1 downTo 0).firstOrNull { !items[it].isFolder }
                  if (prev != null) {
                      retriedOnce = false
                      startPlayback(items[prev], fresh = false)
                      rvTracks.scrollToPosition(prev)
                  }
              }

              private fun formatTime(ms: Long): String {
                  if (ms <= 0) return "0:00"
                  return String.format("%d:%02d", (ms / 1000) / 60, (ms / 1000) % 60)
              }

              override fun onBackPressed() {
                  if (!goBack()) super.onBackPressed()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  sleepTimer?.cancel()
                  handler.removeCallbacksAndMessages(null)
                  uiScope.cancel()
                  controllerFuture?.let { MediaController.releaseFuture(it) }
              }

              inner class SpaceAdapter(private val list: List<SpaceItem>, private val onClick: (Int) -> Unit) :
                  RecyclerView.Adapter<SpaceAdapter.VH>() {
                  var selectedKey: String? = null

                  inner class VH(v: View) : RecyclerView.ViewHolder(v) {
                      val tvCover: TextView = v.findViewById(R.id.tvCover)
                      val tvTitle: TextView = v.findViewById(R.id.tvTitle)
                      val tvSubtitle: TextView = v.findViewById(R.id.tvSubtitle)
                      val tvPlayIcon: TextView = v.findViewById(R.id.tvPlayIcon)
                  }

                  override fun onCreateViewHolder(p0: ViewGroup, p1: Int): VH =
                      VH(LayoutInflater.from(p0.context).inflate(R.layout.item_track, p0, false))

                  override fun onBindViewHolder(holder: VH, position: Int) {
                      val item = list[position]
                      holder.tvTitle.text = item.title
                      holder.tvSubtitle.text = item.subtitle
                      if (item.isFolder) {
                          holder.tvCover.text = "📁"
                          holder.tvTitle.setTextColor(0xFFFFFFFF.toInt())
                          holder.tvPlayIcon.text = "›"
                      } else {
                          holder.tvCover.text = "♫"
                          val sel = item.idKey == selectedKey
                          holder.tvTitle.setTextColor(if (sel) 0xFFFFCC00.toInt() else 0xFFFFFFFF.toInt())
                          holder.tvPlayIcon.text = if (sel) "⏸" else "▶"
                      }
                      holder.itemView.setOnClickListener { onClick(holder.bindingAdapterPosition) }
                  }

                  override fun getItemCount(): Int = list.size
              }
          }
          EOF

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpacesPlayer-v8.1-APK
          path: app/build/outputs/apk/debug/*.apk
