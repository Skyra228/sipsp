                      val cacheMb = (MusicEngine.simpleCache?.cacheSpace ?: 0L) / (1024L * 1024L)

                      tvStatus.text = "Кэш страниц: ${pageCache.size()} • Аудиокэш: $cacheMb МБ"

                      btnBackNav.visibility = View.GONE

