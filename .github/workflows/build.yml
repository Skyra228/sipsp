                      <TextView android:id="@+id/chipNew" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="14dp" android:paddingVertical="6dp" android:text="Артисты" android:textColor="?attr/colorOnSurface" android:textSize="12sp" android:layout_marginEnd="6dp"/>
                      <TextView android:id="@+id/chipAlbums" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="14dp" android:paddingVertical="6dp" android:text="Альбомы" android:textColor="?attr/colorOnSurface" android:textSize="12sp" android:layout_marginEnd="6dp"/>
                      <TextView android:id="@+id/chipCats" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="14dp" android:paddingVertical="6dp" android:text="Жанры" android:textColor="?attr/colorOnSurface" android:textSize="12sp" android:layout_marginEnd="6dp"/>
