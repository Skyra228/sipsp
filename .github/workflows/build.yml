              private fun collapseRepeatedLetters(input: String, maxRepeat: Int): String {
                  if (input.isEmpty()) return input
                  val sb = StringBuilder(input.length)
                  var lastChar = ' '
                  var count = 0
                  for (ch in input) {
                      if (ch == lastChar && ch.isLetter()) {
                          count++
                          if (count <= maxRepeat) sb.append(ch)
                      } else {
                          lastChar = ch
                          count = 1
                          sb.append(ch)
                      }
                  }
                  return sb.toString()
              }
          
              private fun fixKeyboardLayoutIfNeeded(raw: String): String {
                  val enToRu: Map<Char, Char> = mapOf(
                      'q' to 'й', 'w' to 'ц', 'e' to 'у', 'r' to 'к', 't' to 'е', 'y' to 'н', 'u' to 'г',
                      'i' to 'ш', 'o' to 'щ', 'p' to 'з', '[' to 'х', ']' to 'ъ', 'a' to 'ф', 's' to 'ы',
                      'd' to 'в', 'f' to 'а', 'g' to 'п', 'h' to 'р', 'j' to 'о', 'k' to 'л', 'l' to 'д',
                      ';' to 'ж', '\'' to 'э', 'z' to 'я', 'x' to 'ч', 'c' to 'с', 'v' to 'м', 'b' to 'и',
                      'n' to 'т', 'm' to 'ь', ',' to 'б', '.' to 'ю'
                  )
                  val low = raw.lowercase().trim()
                  val hasLat = low.any { it in 'a'..'z' }
                  val hasCyr = low.any { it in 'а'..'я' || it == 'ё' }
                  if (hasLat && !hasCyr) {
                      val sb = StringBuilder(low.length)
                      for (ch in low) {
                          val mapped = enToRu[ch]
                          if (mapped != null) sb.append(mapped) else sb.append(ch)
                      }
                      val mappedStr = sb.toString()
                      if (artistAliasDictionary.containsKey(mappedStr)) return mappedStr
                      val firstToken = mappedStr.substringBefore(" ")
                      if (artistAliasDictionary.containsKey(firstToken)) return mappedStr
                  }
                  return raw
              }
          
              private fun normalizeTypoQuery(raw: String): String {
                  val s = raw.lowercase().trim()
                      .replace('ё', 'е')
                      .replace(Regex("[^\\p{L}\\p{N}\\s\\-&]"), " ")
                      .replace(Regex("\\s+"), " ")
                      .trim()
                  return collapseRepeatedLetters(s, 2)
              }
          
              private fun resolveAliasFromDictionary(rawQuery: String): String {
                  val layoutFixed = fixKeyboardLayoutIfNeeded(rawQuery)
                  val norm = normalizeTypoQuery(layoutFixed)
                  artistAliasDictionary[norm]?.let { return it }
          
                  val collapsed = collapseRepeatedLetters(norm, 1)
                  for ((k, v) in artistAliasDictionary) {
                      val kCol = collapseRepeatedLetters(k, 1)
                      if (kCol == collapsed) return v
                  }
          
                  val words = norm.split(" ").filter { it.isNotEmpty() }
                  if (words.size >= 2) {
                      for (prefixLen in minOf(3, words.size - 1) downTo 1) {
                          val prefix = words.take(prefixLen).joinToString(" ")
                          val matchedArtist = artistAliasDictionary[prefix]
                          if (matchedArtist != null) {
                              val rest = words.drop(prefixLen).joinToString(" ")
                              return "$matchedArtist $rest".trim()
                          }
                      }
                  }
                  return ""
              }
          
              private fun translitMusicRuToEn(text: String): String {
                  var s = text.lowercase().trim().replace('ё', 'е')
                  val wordMap: Map<String, String> = mapOf(
                      "куни" to "kanye", "канье" to "kanye", "кани" to "kanye",
                      "вест" to "west", "уэст" to "west",
                      "тревис" to "travis", "трэвис" to "travis", "скот" to "scott", "скотт" to "scott",
                      "плейбой" to "playboi", "карти" to "carti",
                      "бойс" to "boys", "бойз" to "boyz", "герл" to "girl",
                      "блэк" to "black", "блек" to "black", "уайт" to "white", "вайт" to "white",
                      "лайф" to "life", "лав" to "love", "найт" to "night", "дей" to "day",
                      "кинг" to "king", "квин" to "queen", "принс" to "prince",
                      "лил" to "lil", "биг" to "big", "янг" to "young", "бэби" to "baby", "бейби" to "baby",
                      "тейп" to "tape", "рок" to "rock", "бит" to "beat", "стрит" to "street",
                      "драгонс" to "dragons", "манкис" to "monkeys", "пилотс" to "pilots", "парк" to "park",
                      "линкин" to "linkin", "систем" to "system", "даун" to "down"
                  )
                  val tokens = s.split(Regex("\\s+")).map { tok -> wordMap[tok] ?: tok }
                  s = tokens.joinToString(" ")
          
                  val digraphs = listOf(
                      "дж" to "j", "ч" to "ch", "ш" to "sh", "щ" to "shch", "ю" to "yu", "я" to "ya",
                      "х" to "kh", "ц" to "ts", "й" to "y", "ье" to "ye", "ья" to "ya", "ия" to "iya"
                  )
                  for ((ru, en) in digraphs) s = s.replace(ru, en)
          
                  val charMap: Map<Char, String> = mapOf(
                      'а' to "a", 'б' to "b", 'в' to "v", 'г' to "g", 'д' to "d", 'e' to "e", 'е' to "e", 'з' to "z",
                      'и' to "i", 'к' to "k", 'л' to "l", 'м' to "m", 'н' to "n", 'о' to "o", 'п' to "p",
                      'р' to "r", 'с' to "s", 'т' to "t", 'у' to "u", 'ф' to "f", 'ы' to "y", 'э' to "e",
                      'ъ' to "", 'ь' to ""
                  )
                  val sb = StringBuilder(s.length)
                  for (ch in s) {
                      val mapped = charMap[ch]
                      if (mapped != null) sb.append(mapped) else sb.append(ch)
                  }
                  return sb.toString().replace(Regex("\\s+"), " ").trim()
              }
          
              private fun translitMusicEnToRu(text: String): String {
                  var s = text.lowercase().trim()
                  val multi = listOf(
                      "shch" to "щ", "sch" to "ш", "ch" to "ч", "sh" to "ш", "zh" to "ж",
                      "yu" to "ю", "ya" to "я", "yo" to "е", "kh" to "х", "ts" to "ц", "oo" to "у", "ee" to "и"
                  )
                  for ((en, ru) in multi) s = s.replace(en, ru)
                  val map: Map<Char, String> = mapOf(
                      'a' to "а", 'b' to "б", 'v' to "в", 'g' to "г", 'd' to "д", 'e' to "е", 'z' to "з",
                      'i' to "и", 'j' to "дж", 'k' to "к", 'l' to "л", 'm' to "м", 'n' to "н", 'o' to "о",
                      'p' to "п", 'r' to "р", 's' to "с", 't' to "т", 'u' to "у", 'f' to "ф", 'h' to "х",
                      'c' to "к", 'w' to "в", 'y' to "и", 'x' to "кс", 'q' to "к"
                  )
                  val sb = StringBuilder(s.length)
                  for (ch in s) {
                      val mapped = map[ch]
                      if (mapped != null) sb.append(mapped) else sb.append(ch)
                  }
                  return sb.toString().replace(Regex("\\s+"), " ").trim()
              }
          
              private fun resolveViaItunesAndDeezer(rawQuery: String): List<String> {
                  val found = LinkedHashSet<String>()
                  try {
                      val enc = URLEncoder.encode(rawQuery, "UTF-8")
                      val url = "https://itunes.apple.com/search?term=$enc&country=ru&entity=musicArtist,song&limit=4"
                      val req = Request.Builder().url(url).header("User-Agent", MusicEngine.USER_AGENT).build()
                      val fastClient = httpClient.newBuilder()
                          .connectTimeout(1800, TimeUnit.MILLISECONDS)
                          .readTimeout(1800, TimeUnit.MILLISECONDS)
                          .build()
                      fastClient.newCall(req).execute().use { resp ->
                          if (resp.isSuccessful) {
                              val body = resp.body?.string() ?: ""
                              val results = JSONObject(body).optJSONArray("results") ?: JSONArray()
                              for (i in 0 until results.length()) {
                                  val obj = results.optJSONObject(i) ?: continue
                                  val artist = obj.optString("artistName").trim()
                                  val track = obj.optString("trackName").trim()
                                  if (artist.isNotEmpty()) found.add(artist)
                                  if (artist.isNotEmpty() && track.isNotEmpty() && rawQuery.trim().contains(" ")) {
                                      found.add("$artist $track")
                                  }
                              }
                          }
                      }
                  } catch (_: Exception) {}
          
                  if (found.isEmpty()) {
                      try {
                          val enc = URLEncoder.encode(rawQuery, "UTF-8")
                          val url = "https://api.deezer.com/search/artist?q=$enc&limit=2"
                          val req = Request.Builder().url(url).header("User-Agent", MusicEngine.USER_AGENT).build()
                          val fastClient = httpClient.newBuilder()
                              .connectTimeout(1600, TimeUnit.MILLISECONDS)
                              .readTimeout(1600, TimeUnit.MILLISECONDS)
                              .build()
                          fastClient.newCall(req).execute().use { resp ->
                              if (resp.isSuccessful) {
                                  val data = JSONObject(resp.body?.string() ?: "{}").optJSONArray("data") ?: JSONArray()
                                  for (i in 0 until data.length()) {
                                      val name = data.optJSONObject(i)?.optString("name")?.trim() ?: ""
                                      if (name.isNotEmpty()) found.add(name)
                                  }
                              }
                          }
                      } catch (_: Exception) {}
                  }
                  return found.toList()
              }
          
              private fun buildSmartCandidateQueries(rawQuery: String): List<String> {
                  val clean = rawQuery.trim()
                  if (clean.isEmpty()) return emptyList()
                  smartQueryCache[clean.lowercase()]?.let { return it }
          
                  val candidates = LinkedHashSet<String>()
          
                  val dictMatch = resolveAliasFromDictionary(clean)
                  if (dictMatch.isNotEmpty()) {
                      candidates.add(dictMatch)
                  }
          
                  val layoutFixed = fixKeyboardLayoutIfNeeded(clean)
                  if (!layoutFixed.equals(clean, ignoreCase = true)) {
                      val layoutAlias = resolveAliasFromDictionary(layoutFixed)
                      if (layoutAlias.isNotEmpty()) candidates.add(layoutAlias)
                      candidates.add(layoutFixed)
                  }
          
                  candidates.add(clean)
          
                  if (dictMatch.isEmpty()) {
                      val onlineResolved = resolveViaItunesAndDeezer(clean)
                      for (r in onlineResolved.take(2)) {
                          candidates.add(r)
                      }
                  }
          
                  val hasCyr = clean.any { it in 'а'..'я' || it in 'А'..'Я' || it == 'ё' || it == 'Ё' }
                  if (hasCyr) {
                      val enTranslit = translitMusicRuToEn(clean)
                      if (enTranslit.isNotEmpty() && !enTranslit.equals(clean, ignoreCase = true)) {
                          candidates.add(enTranslit)
                      }
                  } else {
                      val ruTranslit = translitMusicEnToRu(clean)
                      if (ruTranslit.isNotEmpty() && !ruTranslit.equals(clean, ignoreCase = true)) {
                          val ruAlias = resolveAliasFromDictionary(ruTranslit)
                          if (ruAlias.isNotEmpty()) candidates.add(ruAlias)
                          candidates.add(ruTranslit)
                      }
                  }
          
                  val finalList = candidates.take(4).toList()
                  smartQueryCache[clean.lowercase()] = finalList
                  return finalList
              }
          
              private data class QuadSearchResult(
                  val items: List<SpaceItem>,
                  val nextUrl: String?,
                  val meta: SectionMeta,
                  val resolvedHint: String
              )
          
              private suspend fun executeSmartCascadeSearchSuspend(rawQuery: String): QuadSearchResult {
                  val candidateQueries = buildSmartCandidateQueries(rawQuery)
                  if (candidateQueries.isEmpty()) {
                      return QuadSearchResult(emptyList(), null, SectionMeta(), rawQuery)
                  }
          
                  return coroutineScope {
                      val topCandidates = candidateQueries.take(3)
                      val deferredResults = topCandidates.map { q ->
                          async(Dispatchers.IO) {
                              var r = trySearchGet(q)
                              if (r.first.isEmpty()) {
                                  r = trySearchPost(q)
                              }
                              Pair(q, r)
                          }
                      }
                      val completed = deferredResults.awaitAll()
          
                      val mergedItems = ArrayList<SpaceItem>()
                      val seenIds = HashSet<String>()
                      var bestNextUrl: String? = null
                      var bestMeta = SectionMeta()
                      var bestResolvedQuery = rawQuery
          
                      for ((q, triple) in completed) {
                          val (list, nextUrl, meta) = triple
                          if (list.isNotEmpty()) {
                              if (bestNextUrl == null && nextUrl != null) bestNextUrl = nextUrl
                              if (bestMeta.tracksCount == 0 && meta.tracksCount > 0) {
                                  bestMeta = meta
                                  bestResolvedQuery = q
                              } else if (mergedItems.isEmpty()) {
                                  bestMeta = meta
                                  bestResolvedQuery = q
                              }
                              for (item in list) {
                                  if (seenIds.add(item.idKey)) {
                                      mergedItems.add(item)
                                  }
                              }
                          }
                      }
          
                      if (mergedItems.isEmpty() && candidateQueries.size > 3) {
                          val fallbackQ = candidateQueries[3]
                          val (list, nextUrl, meta) = trySearchGet(fallbackQ)
                          if (list.isNotEmpty()) {
                              mergedItems.addAll(list)
                              bestNextUrl = nextUrl
                              bestMeta = meta
                              bestResolvedQuery = fallbackQ
                          }
                      }
          
                      QuadSearchResult(mergedItems, bestNextUrl, bestMeta, bestResolvedQuery)
                  }
              }
          
