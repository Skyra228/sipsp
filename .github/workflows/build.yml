                      <TextView android:id="@+id/filterAlbums" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="12dp" android:paddingVertical="5dp" android:text="💿 Альбомы" android:textColor="?attr/colorOnSurface" android:textSize="11sp" android:layout_marginEnd="6dp"/>
                      <TextView android:id="@+id/filterTracks" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="12dp" android:paddingVertical="5dp" android:text="♪ Треки" android:textColor="?attr/colorOnSurface" android:textSize="11sp"/>
