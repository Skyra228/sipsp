          package com.example.spacesplayer

          

          import android.app.PendingIntent

          import android.content.ComponentName

          import android.content.Context

          import android.content.Intent

          import android.media.audiofx.BassBoost

          import android.media.audiofx.Equalizer

          import android.os.PowerManager

          import androidx.annotation.OptIn

          import androidx.media3.common.AudioAttributes

          import androidx.media3.common.C

          import androidx.media3.common.ForwardingPlayer

          import androidx.media3.common.Player

          import androidx.media3.common.util.UnstableApi

          import androidx.media3.database.StandaloneDatabaseProvider

          import androidx.media3.datasource.DefaultHttpDataSource

          import androidx.media3.datasource.cache.CacheDataSource

          import androidx.media3.datasource.cache.LeastRecentlyUsedCacheEvictor

          import androidx.media3.datasource.cache.SimpleCache

          import androidx.media3.exoplayer.ExoPlayer

          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory

          import androidx.media3.session.MediaController

          import androidx.media3.session.MediaSession

          import androidx.media3.session.MediaSessionService

          import androidx.media3.session.SessionToken

          import com.google.common.util.concurrent.ListenableFuture

          import kotlinx.coroutines.CoroutineScope

          import kotlinx.coroutines.Dispatchers

          import kotlinx.coroutines.SupervisorJob

          import kotlinx.coroutines.launch

          import java.io.File

          

          @OptIn(UnstableApi::class)

          object MusicEngine {

              const val USER_AGENT = "Mozilla/5.0 (Linux; Android 14; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36"

              var player: ExoPlayer? = null

              var mediaSession: MediaSession? = null

              @Volatile var simpleCache: SimpleCache? = null

              private var cacheInitStarted = false

              var httpDataSourceFactory: DefaultHttpDataSource.Factory? = null

              private var controllerFuture: ListenableFuture<MediaController>? = null

              private val engineScope = CoroutineScope(Dispatchers.IO + SupervisorJob())

          

              private var bassBoost: BassBoost? = null

              private var equalizer: Equalizer? = null

              private var wakeLock: PowerManager.WakeLock? = null

              var currentAudioPreset = 0

          

              var onNextRequested: (() -> Unit)? = null

              var onPrevRequested: (() -> Unit)? = null

          

              fun ensureInitialized(context: Context) {

                  val appCtx = context.applicationContext

          

                  // Инициализируем дисковый кэш строго в фоновом потоке, чтобы никогда не вызывать ANR на старте!

                  if (!cacheInitStarted) {

                      cacheInitStarted = true

                      engineScope.launch {

                          try {

                              val cacheDir = File(appCtx.cacheDir, "selyuk_audio_cache")

                              val evictor = LeastRecentlyUsedCacheEvictor(250L * 1024L * 1024L)

                              val dbProvider = StandaloneDatabaseProvider(appCtx)

                              simpleCache = SimpleCache(cacheDir, evictor, dbProvider)

                          } catch (_: Exception) {}

                      }

                  }

          

                  if (httpDataSourceFactory == null) {

                      httpDataSourceFactory = DefaultHttpDataSource.Factory()

                          .setUserAgent(USER_AGENT)

                          .setConnectTimeoutMs(15000)

                          .setReadTimeoutMs(15000)

                          .setAllowCrossProtocolRedirects(true)

                  }

          

                  if (player == null) {

                      val mediaFactory = DefaultMediaSourceFactory(httpDataSourceFactory as androidx.media3.datasource.DataSource.Factory)

          

                      val audioAttrs = AudioAttributes.Builder()

                          .setUsage(C.USAGE_MEDIA)

                          .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)

                          .build()

          

                      val exo = ExoPlayer.Builder(appCtx)

                          .setMediaSourceFactory(mediaFactory)

                          .setAudioAttributes(audioAttrs, true)

                          .setHandleAudioBecomingNoisy(true)

                          .setWakeMode(C.WAKE_MODE_NETWORK)

                          .build()

          

                      exo.addListener(object : Player.Listener {

                          override fun onAudioSessionIdChanged(audioSessionId: Int) {

                              applyAudioPreset(currentAudioPreset)

                          }

                          override fun onIsPlayingChanged(isPlaying: Boolean) {

                              updateWakeLock(appCtx, isPlaying)

                          }

                      })

          

                      val sessionPlayer = object : ForwardingPlayer(exo) {

                          override fun getAvailableCommands(): Player.Commands {

                              return super.getAvailableCommands().buildUpon()

                                  .add(Player.COMMAND_SEEK_TO_NEXT)

                                  .add(Player.COMMAND_SEEK_TO_PREVIOUS)

                                  .add(Player.COMMAND_SEEK_TO_NEXT_MEDIA_ITEM)

                                  .add(Player.COMMAND_SEEK_TO_PREVIOUS_MEDIA_ITEM)

                                  .build()

                          }

          

                          override fun isCommandAvailable(command: Int): Boolean {

                              if (command == Player.COMMAND_SEEK_TO_NEXT ||

                                  command == Player.COMMAND_SEEK_TO_PREVIOUS ||

                                  command == Player.COMMAND_SEEK_TO_NEXT_MEDIA_ITEM ||

                                  command == Player.COMMAND_SEEK_TO_PREVIOUS_MEDIA_ITEM

                              ) {

                                  return true

                              }

                              return super.isCommandAvailable(command)

                          }

          

                          override fun seekToNext() {

                              onNextRequested?.invoke()

                          }

          

                          override fun seekToNextMediaItem() {

                              onNextRequested?.invoke()

                          }

          

                          override fun seekToPrevious() {

                              onPrevRequested?.invoke()

                          }

          

                          override fun seekToPreviousMediaItem() {

                              onPrevRequested?.invoke()

                          }

          

                          override fun hasNextMediaItem(): Boolean = true

                          override fun hasPreviousMediaItem(): Boolean = true

                      }

          

                      val activityIntent = Intent(appCtx, MainActivity::class.java).apply {

                          flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP

                      }

                      val pendingIntent = PendingIntent.getActivity(

                          appCtx,

                          0,

                          activityIntent,

                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE

                      )

          

                      player = exo

                      mediaSession = MediaSession.Builder(appCtx, sessionPlayer)

                          .setSessionActivity(pendingIntent)

                          .build()

                  }

              }

          

              fun connectMediaController(context: Context) {

                  if (controllerFuture != null) return

                  try {

                      val appCtx = context.applicationContext

                      val token = SessionToken(appCtx, ComponentName(appCtx, PlaybackService::class.java))

                      controllerFuture = MediaController.Builder(appCtx, token).buildAsync()

                  } catch (_: Exception) {}

              }

          

              private fun updateWakeLock(context: Context, playing: Boolean) {

                  try {

                      if (playing) {

                          if (wakeLock == null) {

                              val pm = context.getSystemService(Context.POWER_SERVICE) as PowerManager

                              wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "SelyukMusic::PlaybackWakeLock").apply {

                                  setReferenceCounted(false)

                              }

                          }

                          if (wakeLock?.isHeld == false) {

                              wakeLock?.acquire(4 * 60 * 60 * 1000L)

                          }

                      } else {

                          if (wakeLock?.isHeld == true) {

                              wakeLock?.release()

                          }

                      }

                  } catch (_: Exception) {}

              }

          

              fun clearAudioCache() {

                  engineScope.launch {

                      try {

                          val cache = simpleCache ?: return@launch

                          for (key in HashSet(cache.keys)) {

                              cache.removeResource(key)

                          }

                      } catch (_: Exception) {}

                  }

              }

          

              fun applyAudioPreset(presetIndex: Int) {

                  currentAudioPreset = presetIndex

                  val sessionId = player?.audioSessionId ?: return

                  if (sessionId == C.AUDIO_SESSION_ID_UNSET || sessionId <= 0) return

                  try {

                      bassBoost?.release()

                      equalizer?.release()

                      val bb = BassBoost(0, sessionId)

                      val eq = Equalizer(0, sessionId)

                      val presetCount = eq.numberOfPresets.toInt()

                      when (presetIndex) {

                          0 -> {

                              bb.enabled = false

                              eq.enabled = false

                          }

                          1 -> {

                              bb.enabled = true

                              if (bb.strengthSupported) bb.setStrength(1000.toShort())

                              eq.enabled = true

                              if (presetCount > 0) eq.usePreset(0.toShort())

                          }

                          2 -> {

                              bb.enabled = true

                              if (bb.strengthSupported) bb.setStrength(500.toShort())

                              eq.enabled = false

                          }

                          3 -> {

                              bb.enabled = true

                              if (bb.strengthSupported) bb.setStrength(650.toShort())

                              eq.enabled = false

                          }

                          4 -> {

                              bb.enabled = false

                              eq.enabled = true

                              if (presetCount > 0) eq.usePreset(0.toShort())

                          }

                      }

                      bassBoost = bb

                      equalizer = eq

                  } catch (_: Exception) {

                  }

              }

          }

          

          @OptIn(UnstableApi::class)

          class PlaybackService : MediaSessionService() {

              override fun onCreate() {

                  super.onCreate()

                  MusicEngine.ensureInitialized(this)

              }

          

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {

                  super.onStartCommand(intent, flags, startId)

                  return START_STICKY

              }

          

              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo): MediaSession? {

                  MusicEngine.ensureInitialized(this)

                  return MusicEngine.mediaSession

              }

          

              override fun onTaskRemoved(rootIntent: Intent?) {

                  val p = MusicEngine.player

                  if (p == null || (!p.isPlaying && !p.playWhenReady)) {

                      stopSelf()

                  }

              }

          }

