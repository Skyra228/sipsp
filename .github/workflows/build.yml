              private fun showSleepTimerDialog() {
                  val options = arrayOf("Выключить", "15 минут", "30 минут", "45 минут", "60 минут")
                  val mins = intArrayOf(0, 15, 30, 45, 60)
                  AlertDialog.Builder(this)
                      .setTitle("🌙 Таймер сна")
                      .setItems(options) { _, which ->
                          sleepTimer?.cancel()
                          val m = mins[which]
                          if (m == 0) {
                              btnSleep.text = "🌙"
                              Toast.makeText(this, "Таймер отключен", Toast.LENGTH_SHORT).show()
                          } else {
                              sleepTimer = object : CountDownTimer(m * 60 * 1000L, 60000L) {
                                  override fun onTick(ms: Long) {
                                      btnSleep.text = "🌙 ${(ms / 60000L) + 1}м"
                                  }

                                  override fun onFinish() {
                                      player.pause()
                                      btnSleep.text = "🌙"
                                  }
                              }.start()
                              Toast.makeText(this, "Музыка выключится через $m мин.", Toast.LENGTH_SHORT).show()
                          }
                      }
                      .show()
              }

              // ───────── Избранное и история (прямые mp3 НЕ сохраняем: ссылки подписаны и протухают) ─────────

              private fun getSavedTracks(key: String): ArrayList<SpaceItem> {
                  val prefs = getSharedPreferences("spaces_v8", Context.MODE_PRIVATE)
                  val raw = prefs.getString(key, "[]") ?: "[]"
                  val list = ArrayList<SpaceItem>()
                  try {
                      val arr = JSONArray(raw)
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          list.add(SpaceItem(o.optString("idKey"), o.optString("title"), o.optString("subtitle"), o.optString("url"), false))
                      }
                  } catch (_: Exception) {
                  }
                  return list
              }

              private fun saveTracksList(key: String, list: List<SpaceItem>) {
                  val arr = JSONArray()
                  for (item in list.take(150)) {
                      val o = JSONObject()
                      o.put("idKey", item.idKey)
                      o.put("title", item.title)
                      o.put("subtitle", item.subtitle)
                      o.put("url", item.url)
                      arr.put(o)
                  }
                  getSharedPreferences("spaces_v8", Context.MODE_PRIVATE).edit().putString(key, arr.toString()).apply()
              }

              private fun isFavorite(item: SpaceItem): Boolean = getSavedTracks("favorites").any { it.idKey == item.idKey }

              private fun toggleFavorite(item: SpaceItem): Boolean {
                  val favs = getSavedTracks("favorites")
                  val idx = favs.indexOfFirst { it.idKey == item.idKey }
                  return if (idx >= 0) {
                      favs.removeAt(idx)
                      saveTracksList("favorites", favs)
                      false
                  } else {
                      favs.add(0, item)
                      saveTracksList("favorites", favs)
                      true
                  }
              }

              private fun pushHistory(item: SpaceItem) {
                  val hist = getSavedTracks("history")
                  hist.removeAll { it.idKey == item.idKey }
                  hist.add(0, item)
                  saveTracksList("history", hist)
              }

              private fun showSavedList(key: String, label: String, mode: TabMode) {
                  loadJob?.cancel()
                  isLoadingMore = false
                  progressBar.visibility = View.GONE
                  nextPageUrl = null
                  currentEntry = NavEntry("", mode, label)
                  updateMirrorBadge()
                  val saved = getSavedTracks(key)
                  items.clear()
                  seenKeys.clear()
                  items.addAll(saved)
                  adapter.notifyDataSetChanged()
                  tvStatus.text = if (saved.isNotEmpty()) "$label (${saved.size})" else "$label: пусто"
              }

              // ───────── Скачивание ─────────

              private fun downloadCurrentTrack() {
                  val cur = currentPlayingItem
                  if (cur == null) {
                      Toast.makeText(this, "Сначала выберите трек", Toast.LENGTH_SHORT).show()
                      return
                  }
                  if (Build.VERSION.SDK_INT <= 28 &&
                      ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED
                  ) {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.WRITE_EXTERNAL_STORAGE), 101)
                      Toast.makeText(this, "Разрешите доступ к памяти и нажмите ⬇ ещё раз", Toast.LENGTH_LONG).show()
                      return
                  }
                  uiScope.launch {
                      val mp3 = resolveStreamUrl(cur, forDownload = true)
                      if (mp3.isEmpty()) {
                          Toast.makeText(this@MainActivity, "Не удалось получить MP3", Toast.LENGTH_SHORT).show()
                          return@launch
                      }
                      try {
                          val name = "${cur.subtitle} - ${cur.title}".replace(Regex("[\\\\/:*?\"<>|]"), "_").take(90) + ".mp3"
                          val req = DownloadManager.Request(Uri.parse(mp3))
                              .setTitle(cur.title)
                              .addRequestHeader("User-Agent", MusicEngine.USER_AGENT)
                              .addRequestHeader("Referer", cur.url)
                              .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                              .setDestinationInExternalPublicDir(Environment.DIRECTORY_MUSIC, "SpacesPlayer/$name")
                          (getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager).enqueue(req)
                          Toast.makeText(this@MainActivity, "Загрузка в Music/SpacesPlayer!", Toast.LENGTH_LONG).show()
                      } catch (e: Exception) {
                          Toast.makeText(this@MainActivity, "Ошибка: ${e.message}", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

