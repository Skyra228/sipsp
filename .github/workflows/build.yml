name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Selyuk Music v22.0 Pure Liquid Glass Release
        run: |
          rm -rf app/src/main
          mkdir -p app/src/main/java/com/example/spacesplayer
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SelyukMusic"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.spacesplayer"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.spacesplayer"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 24
                  versionName = "22.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")
              implementation("androidx.palette:palette-ktx:1.0.0")
              implementation("androidx.dynamicanimation:dynamicanimation-ktx:1.0.0-alpha03")
              implementation("io.coil-kt:coil:2.6.0")
              implementation("com.facebook.shimmer:shimmer:0.5.0")
              implementation("com.airbnb.android:lottie:6.4.0")
              implementation("androidx.media3:media3-common:1.2.1")
              implementation("androidx.media3:media3-exoplayer:1.2.1")
              implementation("androidx.media3:media3-datasource:1.2.1")
              implementation("androidx.media3:media3-database:1.2.1")
              implementation("androidx.media3:media3-session:1.2.1")
              implementation("androidx.media3:media3-ui:1.2.1")
              implementation("org.json:json:20231013")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jsoup:jsoup:1.17.2")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_search.xml
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
