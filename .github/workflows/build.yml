              private fun extractCleanHost(rawInput: String): String {
                  return try {
                      val withScheme = if (rawInput.startsWith("http")) rawInput else "https://$rawInput"
                      val uri = Uri.parse(withScheme)
                      val host = uri.host ?: "world84.spcs.bio"
                      "${uri.scheme ?: "https"}://$host"
                  } catch (_: Exception) {
                      "https://world84.spcs.bio"
                  }
              }

              private fun highlightActiveChip(active: TextView?) {
                  val chips = listOf(chipPop, chipNew, chipCats, chipFav, chipHist, chipOnline)
                  for (c in chips) {
