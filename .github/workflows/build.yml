1. Исправление ошибки «Приложение не отвечает» (ANR)
В чём была причина:

При старте в MainActivity.onCreate() вызывался ContextCompat.startForegroundService(...) до того, как пользователь включил трек. В Android 8+ если сервис запущен через startForegroundService, но за 5 секунд не вызвал startForeground() (потому что музыка ещё не играет), система показывает диалог «Приложение не отвечает (Подождать / Закрыть)», хотя сам интерфейс не завис.

Дополнительно в главном UI-потоке синхронно инициализировалась база SimpleCache (SQLite), парсились JSON-списки избранного/истории из SharedPreferences и выполнялся расчёт DiffUtil.calculateDiff().

Что сделано в v15.1:

Убран ручной вызов startForegroundService на холодном старте — связка MediaController ↔ MediaSessionService сама переводит сервис в foreground-режим ровно в момент нажатия Play.

Инициализация дискового кэша SimpleCache (250 МБ) в MusicEngine перенесена в фоновый поток Dispatchers.IO.

Избранное и история переведены на быстрый in-memory кэш (memFavorites, memFavoriteKeys с проверкой isFavorite за 
O(1)), а запись в SharedPreferences и расчёт DiffUtil.calculateDiff (submitListAsync) вынесены в фоновые корутины.

2. Точные счётчики сайта и активные кнопки «ВСЕ» по каждому разделу (T=28, T=29, T=30)
При инспекции HTML-кода страницы поиска «ак 47» выяснилось, как именно сайт формирует счётчики и ссылки на полные списки:

Счётчики разделов на сайте: лежат внутри <div class="b-title__item"> в теге <span class="js-cnt cnt cnt_title"> (например: Композиции — 400, Исполнители — 186, Альбомы — 11).

Параметры полных списков («ВСЕ» / «Показать все»):

Композиции: параметр T=28 (/music-online/search/index/?Link_id=1039269&T=28&sq=..., в v15.0 ошибочно стоял T=1).

Исполнители: параметр T=29 (/music-online/search/index/?Link_id=1039269&T=29&sq=...).

Альбомы: параметр T=30 (/music-online/search/index/?Link_id=1039269&T=30&sq=...).

Внутри карточки исполнителя: подразделы /tracks/ (все композиции артиста) и /albums/ (все альбомы артиста).

Как это теперь работает в приложении:

Метод extractSectionMeta считывает реальные счётчики span.cnt_title и ссылки a.b-title_all / a.list-link-blue прямо со страницы сайта.

Верхние чипы подфильтров сразу показывают точное количество с сайта и являются активными кнопками перехода к полному разделу: Обзор (597), ♪ Композиции: ВСЕ (400), 👤 Исполнители: ВСЕ (186), 💿 Альбомы: ВСЕ (11).

В самом списке выдачи заголовки каждого из 3 блоков (КОМПОЗИЦИИ • На сайте: 400, ИСПОЛНИТЕЛИ • На сайте: 186, АЛЬБОМЫ • На сайте: 11) теперь имеют активную кнопку ВСЕ (N) › справа, а под превью каждого блока добавлена кликабельная строка Показать все композиции (400) › / Показать всех исполнителей (186) › / Показать все альбомы (11) ›.

При нажатии на любую из этих кнопок открывается полная выдача (T=28 / T=29 / T=30) с автоматической подгрузкой следующих страниц при прокрутке и кнопкой Загрузить ещё результаты › внизу списка.

Главные вкладки навигации приведены в точное соответствие с главной страницей сайта: Топ-100 композиций, Топ-100 исполнителей (/music-online/artists/), Топ-100 жанров (/music-online/genres/), Своё (Любимые, История, Плейлисты) и Ещё.

