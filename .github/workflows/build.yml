              private fun showTrackContextMenu(pos: Int) {

                  if (pos !in items.indices) return

                  val item = items[pos]

                  if (item.type == ItemType.HEADER || item.type == ItemType.SECTION_ALL || item.type == ItemType.LOAD_MORE) {

                      onItemClicked(pos)

                      return

                  }

                  if (item.type == ItemType.PLAYLIST) {

                      showPlaylistContextMenu(item)

                      return

                  }

                  if (item.isFolder) {

                      onItemClicked(pos)

                      return

                  }

                  showTrackItemDialog(item, pos)

              }

          

              private fun showTrackItemDialog(item: SpaceItem, posInList: Int = -1) {

                  val favLabel = if (isFavorite(item)) "💔 Удалить из Любимых" else "♥ Добавить в Любимые"

                  val options = arrayOf(

                      "▶ Воспроизвести",

                      favLabel,

                      "➕ Добавить в плейлист...",

                      "⬇ Скачать MP3",

                      "🔗 Скопировать ссылку"

                  )

                  AlertDialog.Builder(this)

                      .setTitle(item.title)

                      .setItems(options) { _, which ->

                          when (which) {

                              0 -> if (posInList >= 0) playTrackAt(posInList) else playSingleItem(item)

                              1 -> {

                                  val added = toggleFavorite(item)

                                  if (currentPlayingItem?.idKey == item.idKey) {

                                      btnFavTrack.text = if (added) "♥ В любимых" else "♡ В любимые"

                                  }

                                  Toast.makeText(this, if (added) "Добавлено в Любимые" else "Удалено из Любимых", Toast.LENGTH_SHORT).show()

                              }

                              2 -> showAddToPlaylistDialog(item)

                              3 -> downloadTrackItem(item)

                              4 -> {

                                  val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager

                                  cm.setPrimaryClip(ClipData.newPlainText("Track URL", item.url))

                                  Toast.makeText(this, "Ссылка скопирована в буфер обмена", Toast.LENGTH_SHORT).show()

                              }

                          }

                      }

                      .show()

              }

          

              private fun getPlaylistsObject(): JSONObject {

                  val raw = getSharedPreferences("selyuk_v15", Context.MODE_PRIVATE).getString("playlists_json", "{}") ?: "{}"

                  return try { JSONObject(raw) } catch (_: Exception) { JSONObject() }

              }

          

              private fun savePlaylistsObject(obj: JSONObject) {

                  val str = obj.toString()

                  uiScope.launch(Dispatchers.IO) {

                      getSharedPreferences("selyuk_v15", Context.MODE_PRIVATE).edit().putString("playlists_json", str).apply()

                  }

              }

          

              private fun showPlaylistsScreen() {

                  loadJob?.cancel()

                  progressBar.visibility = View.GONE

                  subFilterScroll.visibility = View.GONE

                  nextPageUrl = null

                  currentEntry = NavEntry("", TabMode.PLAYLISTS, "Мои плейлисты", BottomTab.MY)

                  updateMirrorBadge()

          

                  val obj = getPlaylistsObject()

                  val list = ArrayList<SpaceItem>()

                  val names = obj.keys().asSequence().toList().sorted()

