              private fun playSingleItem(item: SpaceItem) {
                  if (playbackQueue.none { it.idKey == item.idKey }) {
                      playbackQueue.clear()
                      playbackQueue.add(item)
                      playbackQueueIndex = 0
                  } else {
                      playbackQueueIndex = playbackQueue.indexOfFirst { it.idKey == item.idKey }
                  }
                  playFromQueueIndex(playbackQueueIndex)
              }
          
              private fun playTrackAt(index: Int) {
                  if (index !in items.indices) return
                  val item = items[index]
                  if (item.type == ItemType.HEADER) return
                  if (item.isFolder) {
                      onItemClicked(index)
                      return
                  }
          
                  hideKeyboard()
          
                  if (currentPlayingItem?.idKey == item.idKey && player.mediaItemCount > 0) {
                      if (player.isPlaying) player.pause() else player.play()
                      adapter.notifyPlayingStateChanged()
                      return
                  }
          
                  isWaveMode = (currentEntry.tabMode == TabMode.MY_WAVE)
                  if (!isWaveMode) {
                      waveSeedItem = null
                  }
                  val screenTracks = items.filter { !it.isFolder && it.type == ItemType.TRACK }
                  playbackQueue.clear()
                  playbackQueue.addAll(screenTracks)
                  playbackContextTitle = currentEntry.titleHint
                  val qIdx = playbackQueue.indexOfFirst { it.idKey == item.idKey }.coerceAtLeast(0)
                  currentIndex = index
                  playFromQueueIndex(qIdx)
              }
          
              private fun playFromQueueIndex(qIndex: Int) {
                  if (qIndex !in playbackQueue.indices) return
                  val item = playbackQueue[qIndex]
                  val isResumingSavedTrack = (pendingRestoredTrackId == item.idKey && pendingRestoredPositionMs > 0L)
                  if (!isResumingSavedTrack) {
                      pendingRestoredPositionMs = 0L
                      pendingRestoredTrackId = ""
                      lastKnownPositionMs = 0L
                      lastKnownDurationMs = 0L
                      seekBar.progress = 0
                      waveformSeekBar.progress = 0
                      tvCurrentTime.text = "0:00"
                  }
          
                  playbackQueueIndex = qIndex
                  currentPlayingItem = item
                  trackPlayStartWallMs = System.currentTimeMillis()
                  recordTrackPlayedInWave(item)
                  MusicEngine.activeTrackId = item.idKey
                  syncSelectedIndex()
                  adapter.notifyPlayingStateChanged()
          
                  // Если остаётся <= 7 треков до конца очереди — заранее подкачиваем новый разнообразный батч!
                  if (playbackQueue.size - 1 - qIndex <= 7 && !isFetchingWaveBatch) {
                      appendNextWaveBatchAsync(autoPlayFirst = false)
                  }
          
                  // Сразу берём WakeLock и WifiLock, чтобы телефон не ушёл в спячку при переключении трека с выключенным экраном!
                  MusicEngine.acquireLocksNow(this)
          
                  playJob?.cancel()
                  updatePlayerUiForItem(item)
                  saveLastPlayedStateNow(includeQueue = true)
          
                  val localFile = if (item.filePath.isNotEmpty()) File(item.filePath) else null
                  if (localFile != null && localFile.exists()) {
                      progressBar.visibility = View.GONE
                      addToHistory(item)
                      startExoPlayerLocalFile(item, localFile)
                      saveLastPlayedStateNow(includeQueue = false)
                      return
                  }
          
                  tvNowPlayingSub.text = if (isResumingSavedTrack) {
                      "Возобновление с ${formatTime(pendingRestoredPositionMs)}..."
                  } else {
                      "Получение аудиопотока..."
                  }
                  progressBar.visibility = View.VISIBLE
          
                  playJob = uiScope.launch {
                      val mp3 = resolveStreamUrl(item)
                      progressBar.visibility = View.GONE
                      if (::swipeRefresh.isInitialized) swipeRefresh.isRefreshing = false
                      if (mp3.isNotEmpty()) {
                          updatePlayerUiForItem(item)
                          addToHistory(item)
                          startExoPlayerStream(item, mp3)
                          saveLastPlayedStateNow(includeQueue = false)
                          prefetchNextQueueTracks(qIndex)
                      } else {
                          tvNowPlayingSub.text = "Не удалось получить MP3 (попробуйте другой трек)"
                          Toast.makeText(this@MainActivity, "Ссылка на MP3 недоступна", Toast.LENGTH_SHORT).show()
                      }
                  }
              }
          
              private fun startExoPlayerLocalFile(item: SpaceItem, file: File) {
                  MusicEngine.ensureForegroundServiceStarted(this)
                  val resumeMs = if (pendingRestoredTrackId == item.idKey && pendingRestoredPositionMs > 0L) {
                      pendingRestoredPositionMs
                  } else {
                      0L
                  }
                  val metaBuilder = MediaMetadata.Builder()
                      .setTitle(item.title)
                      .setArtist(item.subtitle.substringBefore("•").trim())
                  val mediaItem = MediaItem.Builder()
                      .setMediaId(item.idKey)
                      .setUri(Uri.fromFile(file))
                      .setMediaMetadata(metaBuilder.build())
                      .build()
                  if (resumeMs > 0L) {
                      player.setMediaItem(mediaItem, resumeMs)
                  } else {
                      player.setMediaItem(mediaItem)
                  }
                  player.prepare()
                  player.play()
              }
          
              private fun startExoPlayerStream(item: SpaceItem, mp3: String) {
                  MusicEngine.ensureForegroundServiceStarted(this)
                  val resumeMs = if (pendingRestoredTrackId == item.idKey && pendingRestoredPositionMs > 0L) {
                      pendingRestoredPositionMs
                  } else {
                      0L
                  }
                  val cookies = allCookies.values.joinToString("; ") { "${it.name}=${it.value}" }
                  val headers = HashMap<String, String>()
                  headers["Referer"] = item.url
                  if (cookies.isNotEmpty()) headers["Cookie"] = cookies
          
                  val upstream = DefaultHttpDataSource.Factory()
                      .setUserAgent(MusicEngine.USER_AGENT)
                      .setAllowCrossProtocolRedirects(true)
                      .setDefaultRequestProperties(headers)
          
                  val cache = MusicEngine.simpleCache
                  val dsFactory: androidx.media3.datasource.DataSource.Factory = if (cache != null) {
                      CacheDataSource.Factory()
                          .setCache(cache)
                          .setUpstreamDataSourceFactory(upstream)
                          .setFlags(CacheDataSource.FLAG_IGNORE_CACHE_ON_ERROR)
                  } else {
                      upstream
                  }
          
                  val metaBuilder = MediaMetadata.Builder()
                      .setTitle(item.title)
                      .setArtist(item.subtitle.substringBefore("•").trim())
                  if (item.coverUrl.isNotEmpty() && !item.coverUrl.startsWith("offline_cover_")) {
                      try {
                          metaBuilder.setArtworkUri(Uri.parse(item.coverUrl))
                      } catch (_: Exception) {}
                  }
          
                  val mediaItem = MediaItem.Builder()
                      .setMediaId(item.idKey)
                      .setUri(mp3)
                      .setCustomCacheKey(item.idKey)
                      .setMediaMetadata(metaBuilder.build())
                      .build()
          
                  val mediaSource = DefaultMediaSourceFactory(dsFactory).createMediaSource(mediaItem)
                  if (resumeMs > 0L) {
                      player.setMediaSource(mediaSource, resumeMs)
                  } else {
                      player.setMediaSource(mediaSource)
                  }
                  player.prepare()
                  player.play()
              }
          
              private fun playNextTrack(fromUser: Boolean) {
                  // Если пользователь скипнул трек в первые 9 секунд — понижаем частоту этого артиста в волне
                  if (fromUser && trackPlayStartWallMs > 0L && (System.currentTimeMillis() - trackPlayStartWallMs) < 9000L) {
                      val skippedArtist = normalizePrimaryArtist(currentPlayingItem)
                      if (skippedArtist.isNotEmpty()) {
                          waveSkippedArtists[skippedArtist] = (waveSkippedArtists[skippedArtist] ?: 0) + 1
                      }
                  } else if (!fromUser) {
                      val likedArtist = extractArtistName(currentPlayingItem)
                      if (likedArtist.isNotEmpty()) {
                          waveBoostedArtists.add(likedArtist)
                      }
                  }
          
                  if (playbackQueue.isEmpty()) {
                      val fallback = items.filter { !it.isFolder && it.type == ItemType.TRACK }
                      if (fallback.isEmpty()) {
                          openMyWaveScreen(seedTrack = currentPlayingItem, forceRestart = true)
                          return
                      }
                      playbackQueue.addAll(fallback)
                      playbackQueueIndex = 0
                  }
          
                  if (shuffleEnabled && !isWaveMode && playbackQueue.size > 1) {
                      val candidates = playbackQueue.indices.filter { it != playbackQueueIndex }
                      val randomIdx = candidates[Random.nextInt(candidates.size)]
                      playFromQueueIndex(randomIdx)
                      return
                  }
          
                  val nextQ = playbackQueueIndex + 1
                  if (nextQ in playbackQueue.indices) {
                      playFromQueueIndex(nextQ)
                      if (playbackQueue.size - 1 - nextQ <= 7 && !isFetchingWaveBatch) {
                          appendNextWaveBatchAsync(autoPlayFirst = false)
                      }
                  } else if (repeatState == RepeatState.ALL && !isWaveMode) {
                      playFromQueueIndex(0)
                  } else {
                      // Очередь дошла до конца — автоматически включаем бесконечное продолжение похожими треками!
                      isWaveMode = true
                      if (waveSeedItem == null) waveSeedItem = currentPlayingItem
                      tvNowPlayingSub.text = "🌊 Подбор похожих треков..."
                      appendNextWaveBatchAsync(autoPlayFirst = true)
                  }
              }
          
              private fun playPrevTrack() {
                  if (player.currentPosition > 4000L) {
                      player.seekTo(0)
                      return
                  }
                  if (playbackQueue.isEmpty()) return
                  val prevQ = playbackQueueIndex - 1
                  if (prevQ in playbackQueue.indices) {
                      playFromQueueIndex(prevQ)
                  } else {
                      playFromQueueIndex(0)
                  }
              }
          
              private fun bindCoverToViews(coverUrl: String, imageView: ImageView, placeholder: TextView, fallbackSymbol: String) {
                  placeholder.text = fallbackSymbol
                  if (coverUrl.isEmpty()) {
                      imageView.visibility = View.GONE
                      placeholder.visibility = View.VISIBLE
                      return
                  }
                  val cached = bitmapCache.get(coverUrl)
                  if (cached != null) {
                      imageView.setImageBitmap(cached)
                      imageView.visibility = View.VISIBLE
                      placeholder.visibility = View.GONE
                      if (currentPlayingItem?.coverUrl == coverUrl) {
                          updateAmbientGlowFromBitmap(cached)
                      }
                      return
                  }
                  imageView.visibility = View.GONE
                  placeholder.visibility = View.VISIBLE
                  if (coverUrl.startsWith("offline_cover_")) return
                  if (!loadingCovers.add(coverUrl)) return
          
                  uiScope.launch(Dispatchers.IO) {
                      try {
                          val req = Request.Builder().url(coverUrl).header("User-Agent", MusicEngine.USER_AGENT).build()
                          httpClient.newCall(req).execute().use { resp ->
                              if (resp.isSuccessful) {
                                  val bytes = resp.body?.bytes()
                                  if (bytes != null && bytes.isNotEmpty()) {
                                      val bmp = BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
                                      if (bmp != null) {
                                          bitmapCache.put(coverUrl, bmp)
                                          withContext(Dispatchers.Main) {
                                              if (currentPlayingItem?.coverUrl == coverUrl) {
                                                  ivMiniCover.setImageBitmap(bmp)
                                                  ivMiniCover.visibility = View.VISIBLE
                                                  tvMiniCover.visibility = View.GONE
                                                  ivFullCover.setImageBitmap(bmp)
                                                  ivFullCover.visibility = View.VISIBLE
                                                  tvFullCoverPlaceholder.visibility = View.GONE
                                                  updateAmbientGlowFromBitmap(bmp)
                                              }
                                              adapter.notifyCoverLoaded(coverUrl)
                                          }
                                      }
                                  }
                              }
                          }
                      } catch (_: Exception) {
                      } finally {
                          loadingCovers.remove(coverUrl)
                      }
                  }
              }
          
