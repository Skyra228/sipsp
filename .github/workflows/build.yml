          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/rootContainer"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0B0B10">
          
              <!-- ФОНОВОЕ СВЕЧЕНИЕ AMBIENT GLOW УХОДИТ ПРЯМО ПОД ПРОЗРАЧНЫЙ СТАТУС-БАР С ЧАСАМИ -->
              <com.example.spacesplayer.AmbientGlowView
                  android:id="@+id/mainAmbientGlow"
                  android:layout_width="match_parent"
                  android:layout_height="460dp"
                  android:layout_gravity="top"/>
          
              <LinearLayout
                  android:id="@+id/mainScreenRoot"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="vertical"
                  android:paddingTop="10dp">
          
                  <!-- СКРЫТАЯ СЛУЖЕБНАЯ ШАПКА (ИСПОЛЬЗУЕТСЯ ТОЛЬКО ДЛЯ ХРАНЕНИЯ ТЕКСТА РАЗДЕЛА В КОДЕ, ЧТОБЫ НЕ ЗАСОРЯТЬ ВЕРХ ЭКРАНА) -->
                  <LinearLayout
                      android:id="@+id/topHeaderBar"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:visibility="gone">
                      <TextView android:id="@+id/tvHeaderTitle" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                      <TextView android:id="@+id/btnOpenSearch" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                      <TextView android:id="@+id/tvMirror" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                  </LinearLayout>
          
                  <!-- ВЕРХНЯЯ СТЕКЛЯННАЯ СТРОКА ПОИСКА (ПРЯМО КАК НА ЛЕВОМ ЭКРАНЕ КОНЦЕПТА) -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center_vertical"
                      android:paddingHorizontal="18dp"
                      android:layout_marginTop="4dp"
                      android:layout_marginBottom="8dp">
          
                      <TextView
                          android:id="@+id/btnBackNav"
                          android:layout_width="46dp"
                          android:layout_height="46dp"
                          android:background="@drawable/bg_btn_back"
                          android:gravity="center"
                          android:text=""
                          android:layout_marginEnd="10dp"
                          android:elevation="6dp"
                          android:visibility="gone"/>
          
                      <LinearLayout
                          android:id="@+id/searchBarContainer"
                          android:layout_width="0dp"
                          android:layout_height="50dp"
                          android:layout_weight="1"
                          android:background="@drawable/bg_search"
                          android:gravity="center_vertical"
                          android:orientation="horizontal"
                          android:paddingStart="16dp"
                          android:paddingEnd="6dp"
                          android:elevation="6dp"
                          android:focusable="true"
                          android:focusableInTouchMode="true"
                          android:visibility="visible">
          
                          <ImageView
                              android:layout_width="20dp"
                              android:layout_height="20dp"
                              android:src="@drawable/ic_search"
                              android:layout_marginEnd="10dp"
                              android:contentDescription="Поиск"/>
          
                          <AutoCompleteTextView
                              android:id="@+id/etSearch"
                              android:layout_width="0dp"
                              android:layout_height="match_parent"
                              android:layout_weight="1"
                              android:background="@android:color/transparent"
                              android:hint="Search... / Поиск музыки"
                              android:textColor="#F5F5FA"
                              android:textColorHint="#8A8A9E"
                              android:textSize="14.5sp"
                              android:fontFamily="sans-serif"
                              android:singleLine="true"
                              android:completionThreshold="1"
                              android:imeOptions="actionSearch"
                              android:inputType="text"/>
          
                          <TextView
                              android:id="@+id/btnSearch"
                              android:layout_width="wrap_content"
                              android:layout_height="36dp"
                              android:background="@drawable/bg_search_btn"
                              android:gravity="center"
                              android:text="Найти"
                              android:textColor="#FFFFFF"
                              android:textSize="12.5sp"
                              android:fontFamily="sans-serif-bold"
                              android:paddingHorizontal="16dp"
                              android:clickable="true"
                              android:focusable="true"/>
                      </LinearLayout>
                  </LinearLayout>
          
                  <!-- СТЕКЛЯННЫЕ КАПСУЛЫ РАЗДЕЛА «МОЯ МЕДИАТЕКА» -->
                  <HorizontalScrollView
                      android:id="@+id/sectionTabsScroll"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:scrollbars="none"
                      android:paddingHorizontal="18dp"
                      android:paddingVertical="4dp"
                      android:clipToPadding="false"
                      android:visibility="gone">
          
                      <LinearLayout
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal">
          
                          <TextView android:id="@+id/chipWave" android:layout_width="wrap_content" android:layout_height="36dp" android:gravity="center" android:background="@drawable/bg_section_badge" android:paddingHorizontal="18dp" android:text="🌊 Моя волна" android:textColor="#FFE082" android:textSize="13sp" android:fontFamily="sans-serif-bold" android:layout_marginEnd="8dp" android:visibility="visible"/>
                          <TextView android:id="@+id/chipOnline" android:layout_width="wrap_content" android:layout_height="36dp" android:gravity="center" android:background="@drawable/bg_chip_active" android:paddingHorizontal="18dp" android:text="Топ-100" android:textColor="#FFFFFF" android:textSize="13sp" android:fontFamily="sans-serif-bold" android:layout_marginEnd="8dp" android:visibility="gone"/>
                          <TextView android:id="@+id/chipNew" android:layout_width="wrap_content" android:layout_height="36dp" android:gravity="center" android:background="@drawable/bg_chip" android:paddingHorizontal="18dp" android:text="Артисты" android:textColor="#B8B8C8" android:textSize="13sp" android:fontFamily="sans-serif-medium" android:layout_marginEnd="8dp" android:visibility="gone"/>
                          <TextView android:id="@+id/chipCats" android:layout_width="wrap_content" android:layout_height="36dp" android:gravity="center" android:background="@drawable/bg_chip" android:paddingHorizontal="18dp" android:text="Жанры" android:textColor="#B8B8C8" android:textSize="13sp" android:fontFamily="sans-serif-medium" android:layout_marginEnd="8dp" android:visibility="gone"/>
                          <TextView android:id="@+id/chipFav" android:layout_width="wrap_content" android:layout_height="36dp" android:gravity="center" android:background="@drawable/bg_chip_active" android:paddingHorizontal="18dp" android:text="Любимые" android:textColor="#FFFFFF" android:textSize="13sp" android:fontFamily="sans-serif-bold" android:layout_marginEnd="8dp" android:visibility="gone"/>
                          <TextView android:id="@+id/chipOffline" android:layout_width="wrap_content" android:layout_height="36dp" android:gravity="center" android:background="@drawable/bg_chip" android:paddingHorizontal="18dp" android:text="Скачанные" android:textColor="#B8B8C8" android:textSize="13sp" android:fontFamily="sans-serif-medium" android:layout_marginEnd="8dp" android:visibility="gone"/>
                          <TextView android:id="@+id/chipHist" android:layout_width="wrap_content" android:layout_height="36dp" android:gravity="center" android:background="@drawable/bg_chip" android:paddingHorizontal="18dp" android:text="Недавние" android:textColor="#B8B8C8" android:textSize="13sp" android:fontFamily="sans-serif-medium" android:layout_marginEnd="8dp" android:visibility="gone"/>
                          <TextView android:id="@+id/chipPlaylists" android:layout_width="wrap_content" android:layout_height="36dp" android:gravity="center" android:background="@drawable/bg_chip" android:paddingHorizontal="18dp" android:text="Плейлисты" android:textColor="#B8B8C8" android:textSize="13sp" android:fontFamily="sans-serif-medium" android:layout_marginEnd="8dp" android:visibility="gone"/>
                          <TextView android:id="@+id/chipNewPlaylist" android:layout_width="wrap_content" android:layout_height="36dp" android:gravity="center" android:background="@drawable/bg_section_badge" android:paddingHorizontal="16dp" android:text="+ Создать" android:textColor="#FFE082" android:textSize="13sp" android:fontFamily="sans-serif-bold" android:layout_marginEnd="8dp" android:visibility="gone"/>
                          <TextView android:id="@+id/chipOfflineSort" android:layout_width="wrap_content" android:layout_height="36dp" android:gravity="center" android:background="@drawable/bg_section_badge" android:paddingHorizontal="14dp" android:text="Сорт: Дата" android:textColor="#FFE082" android:textSize="12.5sp" android:fontFamily="sans-serif-bold" android:layout_marginEnd="8dp" android:visibility="gone"/>
                          <TextView android:id="@+id/chipOfflineDeleteAll" android:layout_width="wrap_content" android:layout_height="36dp" android:gravity="center" android:background="@drawable/bg_section_badge" android:paddingHorizontal="14dp" android:text="Удалить всё" android:textColor="#FF8A65" android:textSize="12.5sp" android:fontFamily="sans-serif-bold" android:visibility="gone"/>
                      </LinearLayout>
                  </HorizontalScrollView>
          
                  <!-- СТЕКЛЯННЫЕ КАПСУЛЫ ФИЛЬТРОВ ПОИСКА И АРТИСТА -->
                  <HorizontalScrollView
                      android:id="@+id/subFilterScroll"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:scrollbars="none"
                      android:paddingHorizontal="18dp"
                      android:paddingVertical="4dp"
                      android:clipToPadding="false"
                      android:visibility="gone">
          
                      <LinearLayout
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal">
          
                          <TextView android:id="@+id/filterAll" android:layout_width="wrap_content" android:layout_height="36dp" android:gravity="center" android:background="@drawable/bg_chip_active" android:paddingHorizontal="18dp" android:text="Все" android:textColor="#FFFFFF" android:textSize="13sp" android:fontFamily="sans-serif-bold" android:layout_marginEnd="8dp"/>
                          <TextView android:id="@+id/filterTracks" android:layout_width="wrap_content" android:layout_height="36dp" android:gravity="center" android:background="@drawable/bg_chip" android:paddingHorizontal="18dp" android:text="Треки" android:textColor="#B8B8C8" android:textSize="13sp" android:fontFamily="sans-serif-medium" android:layout_marginEnd="8dp"/>
                          <TextView android:id="@+id/filterArtists" android:layout_width="wrap_content" android:layout_height="36dp" android:gravity="center" android:background="@drawable/bg_chip" android:paddingHorizontal="18dp" android:text="Артисты" android:textColor="#B8B8C8" android:textSize="13sp" android:fontFamily="sans-serif-medium" android:layout_marginEnd="8dp"/>
                          <TextView android:id="@+id/filterAlbums" android:layout_width="wrap_content" android:layout_height="36dp" android:gravity="center" android:background="@drawable/bg_chip" android:paddingHorizontal="18dp" android:text="Альбомы" android:textColor="#B8B8C8" android:textSize="13sp" android:fontFamily="sans-serif-medium"/>
                      </LinearLayout>
                  </HorizontalScrollView>
          
                  <ProgressBar
                      android:id="@+id/progressBar"
                      style="?android:attr/progressBarStyleHorizontal"
                      android:layout_width="match_parent"
                      android:layout_height="2dp"
                      android:indeterminate="true"
                      android:indeterminateTint="#FFB74D"
                      android:visibility="gone" />
          
                  <TextView
                      android:id="@+id/tvStatus"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:paddingHorizontal="20dp"
                      android:paddingVertical="3dp"
                      android:text="Загрузка..."
                      android:textColor="#8A8A9E"
                      android:textSize="11.5sp"
                      android:fontFamily="sans-serif" />
          
                  <FrameLayout
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1">
          
                      <androidx.swiperefreshlayout.widget.SwipeRefreshLayout
                          android:id="@+id/swipeRefresh"
                          android:layout_width="match_parent"
                          android:layout_height="match_parent">
          
                          <androidx.recyclerview.widget.RecyclerView
                              android:id="@+id/rvTracks"
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:clipToPadding="false"
                              android:paddingBottom="185dp" />
                      </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>
          
                      <!-- РАЗДЕЛ «ЕЩЁ» НА ЧИСТЫХ СТЕКЛЯННЫХ КАРТОЧКАХ (TEXTVIEW БЕЗ СИРЕНЕВОЙ ЗАЛИВКИ MATERIAL3) -->
                      <ScrollView
                          android:id="@+id/moreScreenContainer"
                          android:layout_width="match_parent"
                          android:layout_height="match_parent"
                          android:paddingHorizontal="18dp"
                          android:paddingTop="8dp"
                          android:paddingBottom="195dp"
                          android:clipToPadding="false"
                          android:visibility="gone">
          
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="vertical">
          
                              <TextView
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:text="АУДИО И ЗВУК"
                                  android:textColor="#FFD180"
                                  android:textSize="11.5sp"
                                  android:fontFamily="sans-serif-bold"
                                  android:letterSpacing="0.08"
                                  android:layout_marginBottom="8dp"
                                  android:layout_marginStart="4dp"/>
          
                              <TextView
                                  android:id="@+id/btnEq"
                                  android:layout_width="match_parent"
                                  android:layout_height="54dp"
                                  android:background="@drawable/bg_card_setting"
                                  android:text="Эквалайзер и усиление баса"
                                  android:textColor="#F5F5FA"
                                  android:textSize="14.5sp"
                                  android:fontFamily="sans-serif-medium"
                                  android:gravity="start|center_vertical"
                                  android:paddingHorizontal="20dp"
                                  android:layout_marginBottom="8dp"
                                  android:clickable="true"
                                  android:focusable="true"/>
          
                              <TextView
                                  android:id="@+id/btnSleep"
                                  android:layout_width="match_parent"
                                  android:layout_height="54dp"
                                  android:background="@drawable/bg_card_setting"
                                  android:text="Таймер сна"
                                  android:textColor="#F5F5FA"
                                  android:textSize="14.5sp"
                                  android:fontFamily="sans-serif-medium"
                                  android:gravity="start|center_vertical"
                                  android:paddingHorizontal="20dp"
                                  android:layout_marginBottom="8dp"
                                  android:clickable="true"
                                  android:focusable="true"/>

                              <TextView
                                  android:id="@+id/btnBatteryOpt"
                                  android:layout_width="match_parent"
                                  android:layout_height="54dp"
                                  android:background="@drawable/bg_card_setting"
                                  android:text="Работа в фоне без спячки (Батарея)"
                                  android:textColor="#FFE082"
                                  android:textSize="14.5sp"
                                  android:fontFamily="sans-serif-medium"
                                  android:gravity="start|center_vertical"
                                  android:paddingHorizontal="20dp"
                                  android:layout_marginBottom="18dp"
                                  android:clickable="true"
                                  android:focusable="true"/>
          
                              <TextView
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:text="СЕТЬ, КЭШ И ОФОРМЛЕНИЕ"
                                  android:textColor="#FFD180"
                                  android:textSize="11.5sp"
                                  android:fontFamily="sans-serif-bold"
                                  android:letterSpacing="0.08"
                                  android:layout_marginBottom="8dp"
                                  android:layout_marginStart="4dp"/>
          
                              <TextView
                                  android:id="@+id/btnMirrorSetting"
                                  android:layout_width="match_parent"
                                  android:layout_height="54dp"
                                  android:background="@drawable/bg_card_setting"
                                  android:text="Зеркало сайта (домен)"
                                  android:textColor="#F5F5FA"
                                  android:textSize="14.5sp"
                                  android:fontFamily="sans-serif-medium"
                                  android:gravity="start|center_vertical"
                                  android:paddingHorizontal="20dp"
                                  android:layout_marginBottom="8dp"
                                  android:clickable="true"
                                  android:focusable="true"/>
          
                              <TextView
                                  android:id="@+id/btnThemeToggle"
                                  android:layout_width="match_parent"
                                  android:layout_height="54dp"
                                  android:background="@drawable/bg_card_setting"
                                  android:text="Тема оформления (Тёмная / Светлая)"
                                  android:textColor="#F5F5FA"
                                  android:textSize="14.5sp"
                                  android:fontFamily="sans-serif-medium"
                                  android:gravity="start|center_vertical"
                                  android:paddingHorizontal="20dp"
                                  android:layout_marginBottom="8dp"
                                  android:clickable="true"
                                  android:focusable="true"/>
          
                              <TextView
                                  android:id="@+id/btnClearCache"
                                  android:layout_width="match_parent"
                                  android:layout_height="54dp"
                                  android:background="@drawable/bg_card_setting"
                                  android:text="Очистить кэш страниц и аудио"
                                  android:textColor="#F5F5FA"
                                  android:textSize="14.5sp"
                                  android:fontFamily="sans-serif-medium"
                                  android:gravity="start|center_vertical"
                                  android:paddingHorizontal="20dp"
                                  android:layout_marginBottom="18dp"
                                  android:clickable="true"
                                  android:focusable="true"/>
          
                              <TextView
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:text="РЕЗЕРВНАЯ КОПИЯ И ИНФО"
                                  android:textColor="#FFD180"
                                  android:textSize="11.5sp"
                                  android:fontFamily="sans-serif-bold"
                                  android:letterSpacing="0.08"
                                  android:layout_marginBottom="8dp"
                                  android:layout_marginStart="4dp"/>
          
                              <TextView
                                  android:id="@+id/btnExportJson"
                                  android:layout_width="match_parent"
                                  android:layout_height="54dp"
                                  android:background="@drawable/bg_card_setting"
                                  android:text="Экспорт в другое место (SAF)"
                                  android:textColor="#F5F5FA"
                                  android:textSize="14.5sp"
                                  android:fontFamily="sans-serif-medium"
                                  android:gravity="start|center_vertical"
                                  android:paddingHorizontal="20dp"
                                  android:layout_marginBottom="8dp"
                                  android:clickable="true"
                                  android:focusable="true"/>
          
                              <TextView
                                  android:id="@+id/btnImportJson"
                                  android:layout_width="match_parent"
                                  android:layout_height="54dp"
                                  android:background="@drawable/bg_card_setting"
                                  android:text="Импорт из файла (SAF)"
                                  android:textColor="#F5F5FA"
                                  android:textSize="14.5sp"
                                  android:fontFamily="sans-serif-medium"
                                  android:gravity="start|center_vertical"
                                  android:paddingHorizontal="20dp"
                                  android:layout_marginBottom="8dp"
                                  android:clickable="true"
                                  android:focusable="true"/>
          
                              <TextView
                                  android:id="@+id/btnAboutApp"
