name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Fast Spaces Player (world84.spcs.bio)
        run: |
          mkdir -p app/src/main/java/com/example/spacesplayer
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable

          # 1. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SpacesPlayer"
          include(":app")
          EOF

          # 2. build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.spacesplayer"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.spacesplayer"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 3
                  versionName = "3.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("androidx.media3:media3-exoplayer:1.2.1")
              implementation("org.jsoup:jsoup:1.17.2")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF

          # 5. Фоновые шейпы Яндекс-стиля
          cat << 'EOF' > app/src/main/res/drawable/bg_search.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#1C1C1E"/>
              <corners android:radius="14dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_chip.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#242426"/>
              <corners android:radius="20dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_cover.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#2A2A2D"/>
              <corners android:radius="10dp"/>
          </shape>
          EOF

          # 6. Карточка трека (item_track.xml)
          cat << 'EOF' > app/src/main/res/layout/item_track.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:gravity="center_vertical"
              android:paddingVertical="10dp"
              android:paddingHorizontal="16dp"
              android:background="?attr/selectableItemBackground">

              <TextView
                  android:id="@+id/tvCover"
                  android:layout_width="48dp"
                  android:layout_height="48dp"
                  android:background="@drawable/bg_cover"
                  android:gravity="center"
                  android:text="♫"
                  android:textColor="#FFCC00"
                  android:textSize="20sp"
                  android:textStyle="bold" />

              <LinearLayout
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="1"
                  android:orientation="vertical"
                  android:layout_marginStart="14dp"
                  android:layout_marginEnd="8dp">

                  <TextView
                      android:id="@+id/tvTitle"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Название трека"
                      android:textColor="#FFFFFF"
                      android:textSize="15sp"
                      android:textStyle="bold"
                      android:singleLine="true"
                      android:ellipsize="end" />

                  <TextView
                      android:id="@+id/tvSubtitle"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Spaces Music"
                      android:textColor="#8E8E93"
                      android:textSize="13sp"
                      android:singleLine="true"
                      android:ellipsize="end"
                      android:layout_marginTop="2dp" />
              </LinearLayout>

              <TextView
                  android:id="@+id/tvPlayIcon"
                  android:layout_width="32dp"
                  android:layout_height="32dp"
                  android:gravity="center"
                  android:text="▶"
                  android:textColor="#FFCC00"
                  android:textSize="16sp" />
          </LinearLayout>
          EOF

          # 7. Главный экран (activity_main.xml)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#0A0A0A">

              <!-- Шапка -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:paddingHorizontal="16dp"
                  android:paddingTop="14dp"
                  android:paddingBottom="6dp">

                  <TextView
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="Я.Музыка • Spaces"
                      android:textColor="#FFFFFF"
                      android:textSize="21sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/tvMirror"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:background="@drawable/bg_chip"
                      android:paddingHorizontal="12dp"
                      android:paddingVertical="6dp"
                      android:text="⚙ world84.spcs.bio"
                      android:textColor="#FFCC00"
                      android:textSize="12sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <!-- Поиск -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:paddingHorizontal="16dp"
                  android:paddingVertical="6dp">

                  <EditText
                      android:id="@+id/etSearch"
                      android:layout_width="0dp"
                      android:layout_height="46dp"
                      android:layout_weight="1"
                      android:background="@drawable/bg_search"
                      android:hint="Искать трек, артиста, ремикс..."
                      android:textColor="#FFFFFF"
                      android:textColorHint="#787880"
                      android:paddingHorizontal="16dp"
                      android:singleLine="true"
                      android:imeOptions="actionSearch"
                      android:inputType="text" />

                  <Button
                      android:id="@+id/btnSearch"
                      android:layout_width="wrap_content"
                      android:layout_height="46dp"
                      android:layout_marginStart="8dp"
                      android:backgroundTint="#FFCC00"
                      android:text="Найти"
                      android:textColor="#000000"
                      android:textStyle="bold" />
              </LinearLayout>

              <!-- Чипсы быстрых подборок -->
              <HorizontalScrollView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:scrollbars="none"
                  android:paddingHorizontal="12dp"
                  android:paddingVertical="6dp">

                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal">

                      <TextView android:id="@+id/chipTop" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="14dp" android:paddingVertical="8dp" android:layout_marginHorizontal="4dp" android:text="🔥 Топ Spaces" android:textColor="#FFCC00" android:textSize="13sp" android:textStyle="bold" />
                      <TextView android:id="@+id/chipPhonk" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="14dp" android:paddingVertical="8dp" android:layout_marginHorizontal="4dp" android:text="⚡ Phonk" android:textColor="#FFFFFF" android:textSize="13sp" android:textStyle="bold" />
                      <TextView android:id="@+id/chipBass" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="14dp" android:paddingVertical="8dp" android:layout_marginHorizontal="4dp" android:text="🔊 Басы в тачку" android:textColor="#FFFFFF" android:textSize="13sp" android:textStyle="bold" />
                      <TextView android:id="@+id/chipRap" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="14dp" android:paddingVertical="8dp" android:layout_marginHorizontal="4dp" android:text="🎤 Русский рэп" android:textColor="#FFFFFF" android:textSize="13sp" android:textStyle="bold" />
                      <TextView android:id="@+id/chipClub" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="14dp" android:paddingVertical="8dp" android:layout_marginHorizontal="4dp" android:text="💿 Клубняк" android:textColor="#FFFFFF" android:textSize="13sp" android:textStyle="bold" />
                      <TextView android:id="@+id/chipRemix" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="14dp" android:paddingVertical="8dp" android:layout_marginHorizontal="4dp" android:text="🎧 Remix 2026" android:textColor="#FFFFFF" android:textSize="13sp" android:textStyle="bold" />
                  </LinearLayout>
              </HorizontalScrollView>

              <!-- Индикатор загрузки и статус -->
              <ProgressBar
                  android:id="@+id/progressBar"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="3dp"
                  android:indeterminate="true"
                  android:indeterminateTint="#FFCC00"
                  android:visibility="gone" />

              <TextView
                  android:id="@+id/tvStatus"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:paddingHorizontal="16dp"
                  android:paddingVertical="4dp"
                  android:text="Подключение к world84.spcs.bio..."
                  android:textColor="#8E8E93"
                  android:textSize="12sp" />

              <!-- Список треков -->
              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/rvTracks"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1" />

              <!-- Нижний плеер -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:background="#18181A"
                  android:paddingHorizontal="16dp"
                  android:paddingTop="8dp"
                  android:paddingBottom="12dp">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center_vertical">

                      <TextView
                          android:id="@+id/tvCurrentTime"
                          android:layout_width="38dp"
                          android:layout_height="wrap_content"
                          android:text="0:00"
                          android:textColor="#8E8E93"
                          android:textSize="11sp" />

                      <SeekBar
                          android:id="@+id/seekBar"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:progressTint="#FFCC00"
                          android:thumbTint="#FFCC00" />

                      <TextView
                          android:id="@+id/tvTotalTime"
                          android:layout_width="38dp"
                          android:layout_height="wrap_content"
                          android:gravity="end"
                          android:text="0:00"
                          android:textColor="#8E8E93"
                          android:textSize="11sp" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center_vertical"
                      android:layout_marginTop="2dp">

                      <TextView
                          android:layout_width="44dp"
                          android:layout_height="44dp"
                          android:background="@drawable/bg_cover"
                          android:gravity="center"
                          android:text="♫"
                          android:textColor="#FFCC00"
                          android:textSize="18sp" />

                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:orientation="vertical"
                          android:layout_marginHorizontal="12dp">

                          <TextView
                              android:id="@+id/tvNowPlayingTitle"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="Выберите трек"
                              android:textColor="#FFFFFF"
                              android:textSize="15sp"
                              android:textStyle="bold"
                              android:singleLine="true"
                              android:ellipsize="marquee" />

                          <TextView
                              android:id="@+id/tvNowPlayingSub"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="world84.spcs.bio"
                              android:textColor="#8E8E93"
                              android:textSize="12sp"
                              android:singleLine="true" />
                      </LinearLayout>

                      <Button
                          android:id="@+id/btnPrev"
                          android:layout_width="42dp"
                          android:layout_height="42dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:text="⏮"
                          android:textColor="#FFFFFF"
                          android:textSize="16sp"
                          android:padding="0dp" />

                      <Button
                          android:id="@+id/btnPlayPause"
                          android:layout_width="48dp"
                          android:layout_height="48dp"
                          android:layout_marginHorizontal="4dp"
                          android:backgroundTint="#FFCC00"
                          android:text="▶"
                          android:textColor="#000000"
                          android:textSize="18sp"
                          android:textStyle="bold"
                          android:padding="0dp" />

                      <Button
                          android:id="@+id/btnNext"
                          android:layout_width="42dp"
                          android:layout_height="42dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:text="⏭"
                          android:textColor="#FFFFFF"
                          android:textSize="16sp"
                          android:padding="0dp" />
                  </LinearLayout>
              </LinearLayout>
          </LinearLayout>
          EOF

          # 8. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_media_play"
                  android:label="Spaces Музыка"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Material3.Dark.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 9. Код MainActivity.kt (ускоренный парсер + зеркало world84.spcs.bio)
          cat << 'EOF' > app/src/main/java/com/example/spacesplayer/MainActivity.kt
          package com.example.spacesplayer

          import android.app.AlertDialog
          import android.content.Context
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputMethodManager
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.media3.common.MediaItem
          import androidx.media3.common.Player
          import androidx.media3.datasource.DefaultHttpDataSource
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import kotlinx.coroutines.*
          import okhttp3.*
          import org.jsoup.Jsoup
          import org.jsoup.nodes.Document
          import java.net.URLEncoder
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.TimeUnit

          data class SpaceTrack(
              val title: String,
              val artist: String,
              val viewUrl: String,
              var mp3Url: String = ""
          )

          class MainActivity : AppCompatActivity() {

              private lateinit var player: ExoPlayer
              private lateinit var rvTracks: RecyclerView
              private lateinit var tvStatus: TextView
              private lateinit var tvMirror: TextView
              private lateinit var etSearch: EditText
              private lateinit var progressBar: ProgressBar
              private lateinit var tvNowPlayingTitle: TextView
              private lateinit var tvNowPlayingSub: TextView
              private lateinit var btnPlayPause: Button
              private lateinit var seekBar: SeekBar
              private lateinit var tvCurrentTime: TextView
              private lateinit var tvTotalTime: TextView

              private val tracks = ArrayList<SpaceTrack>()
              private lateinit var adapter: TrackAdapter
              private var currentIndex = -1
              private var isUserSeeking = false

              private val uiScope = CoroutineScope(Dispatchers.Main + SupervisorJob())
              private var searchJob: Job? = null
              private val handler = Handler(Looper.getMainLooper())

              // Зеркало по умолчанию — world84.spcs.bio, плюс запасные .spcs.bio
              private var activeMirror = "https://world84.spcs.bio"
              private val fallbackMirrors = listOf(
                  "https://world84.spcs.bio",
                  "https://spcs.bio",
                  "https://world79.spcs.bio",
                  "https://spcs.me"
              )

              private val USER_AGENT = "Mozilla/5.0 (Linux; Android 14; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36"

              private val cookieStore = ConcurrentHashMap<String, MutableList<Cookie>>()
              private val httpClient = OkHttpClient.Builder()
                  .connectTimeout(5, TimeUnit.SECONDS)
                  .readTimeout(6, TimeUnit.SECONDS)
                  .followRedirects(true)
                  .followSslRedirects(true)
                  .connectionPool(ConnectionPool(5, 1, TimeUnit.MINUTES))
                  .cookieJar(object : CookieJar {
                      override fun saveFromResponse(url: HttpUrl, cookies: List<Cookie>) {
                          val list = cookieStore.getOrPut(url.host) { mutableListOf() }
                          list.removeAll { existing -> cookies.any { it.name == existing.name } }
                          list.addAll(cookies)
                      }
                      override fun loadForRequest(url: HttpUrl): List<Cookie> {
                          return cookieStore[url.host] ?: emptyList()
                      }
                  })
                  .build()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val prefs = getSharedPreferences("spaces_prefs", Context.MODE_PRIVATE)
                  activeMirror = prefs.getString("mirror", "https://world84.spcs.bio") ?: "https://world84.spcs.bio"

                  rvTracks = findViewById(R.id.rvTracks)
                  tvStatus = findViewById(R.id.tvStatus)
                  tvMirror = findViewById(R.id.tvMirror)
                  etSearch = findViewById(R.id.etSearch)
                  progressBar = findViewById(R.id.progressBar)
                  tvNowPlayingTitle = findViewById(R.id.tvNowPlayingTitle)
                  tvNowPlayingSub = findViewById(R.id.tvNowPlayingSub)
                  btnPlayPause = findViewById(R.id.btnPlayPause)
                  seekBar = findViewById(R.id.seekBar)
                  tvCurrentTime = findViewById(R.id.tvCurrentTime)
                  tvTotalTime = findViewById(R.id.tvTotalTime)

                  updateMirrorBadge()
                  setupExoPlayer()
                  setupRecyclerView()
                  setupControls()

                  // Сразу грузим популярную музыку со стартовой страницы музыки Spaces
                  loadTopMusic()
              }

              private fun updateMirrorBadge() {
                  tvMirror.text = "⚙ " + activeMirror.removePrefix("https://").removePrefix("http://")
              }

              private fun showChangeMirrorDialog() {
                  val input = EditText(this).apply {
                      setText(activeMirror)
                      setPadding(40, 30, 40, 30)
                  }
                  AlertDialog.Builder(this)
                      .setTitle("Рабочее зеркало Spaces")
                      .setMessage("Введите актуальную ссылку (например https://world84.spcs.bio):")
                      .setView(input)
                      .setPositiveButton("Сохранить") { _, _ ->
                          var newUrl = input.text.toString().trim().removeSuffix("/")
                          if (newUrl.isNotEmpty()) {
                              if (!newUrl.startsWith("http")) newUrl = "https://$newUrl"
                              activeMirror = newUrl
                              getSharedPreferences("spaces_prefs", Context.MODE_PRIVATE)
                                  .edit().putString("mirror", activeMirror).apply()
                              updateMirrorBadge()
                              loadTopMusic()
                          }
                      }
                      .setNegativeButton("Отмена", null)
                      .show()
              }

              private fun setupExoPlayer() {
                  val dataSourceFactory = DefaultHttpDataSource.Factory()
                      .setUserAgent(USER_AGENT)
                      .setAllowCrossProtocolRedirects(true)

                  player = ExoPlayer.Builder(this)
                      .setMediaSourceFactory(DefaultMediaSourceFactory(dataSourceFactory))
                      .build()

                  player.addListener(object : Player.Listener {
                      override fun onIsPlayingChanged(isPlaying: Boolean) {
                          btnPlayPause.text = if (isPlaying) "⏸" else "▶"
                      }

                      override fun onPlaybackStateChanged(state: Int) {
                          if (state == Player.STATE_READY) {
                              seekBar.max = (player.duration / 1000).toInt().coerceAtLeast(1)
                              tvTotalTime.text = formatTime(player.duration)
                          } else if (state == Player.STATE_ENDED) {
                              playNext()
                          }
                      }
                  })

                  handler.post(object : Runnable {
                      override fun run() {
                          if (player.isPlaying && !isUserSeeking) {
                              val pos = player.currentPosition
                              seekBar.progress = (pos / 1000).toInt()
                              tvCurrentTime.text = formatTime(pos)
                          }
                          handler.postDelayed(this, 1000)
                      }
                  })
              }

              private fun setupRecyclerView() {
                  adapter = TrackAdapter(tracks) { pos -> playTrackAt(pos) }
                  rvTracks.layoutManager = LinearLayoutManager(this)
                  rvTracks.adapter = adapter
              }

              private fun setupControls() {
                  tvMirror.setOnClickListener { showChangeMirrorDialog() }

                  findViewById<Button>(R.id.btnSearch).setOnClickListener {
                      val q = etSearch.text.toString().trim()
                      hideKeyboard()
                      if (q.isNotEmpty()) searchMusic(q) else loadTopMusic()
                  }

                  etSearch.setOnEditorActionListener { _, actionId, _ ->
                      if (actionId == EditorInfo.IME_ACTION_SEARCH) {
                          val q = etSearch.text.toString().trim()
                          hideKeyboard()
                          if (q.isNotEmpty()) searchMusic(q) else loadTopMusic()
                          true
                      } else false
                  }

                  findViewById<TextView>(R.id.chipTop).setOnClickListener { loadTopMusic() }
                  findViewById<TextView>(R.id.chipPhonk).setOnClickListener { searchMusic("Phonk") }
                  findViewById<TextView>(R.id.chipBass).setOnClickListener { searchMusic("Басы") }
                  findViewById<TextView>(R.id.chipRap).setOnClickListener { searchMusic("Рэп") }
                  findViewById<TextView>(R.id.chipClub).setOnClickListener { searchMusic("Клубняк") }
                  findViewById<TextView>(R.id.chipRemix).setOnClickListener { searchMusic("Remix") }

                  btnPlayPause.setOnClickListener {
                      if (player.isPlaying) player.pause() else player.play()
                  }

                  findViewById<Button>(R.id.btnNext).setOnClickListener { playNext() }
                  findViewById<Button>(R.id.btnPrev).setOnClickListener { playPrev() }

                  seekBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                          if (fromUser) tvCurrentTime.text = formatTime(progress * 1000L)
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) { isUserSeeking = true }
                      override fun onStopTrackingTouch(sb: SeekBar?) {
                          isUserSeeking = false
                          player.seekTo((sb?.progress ?: 0) * 1000L)
                      }
                  })
              }

              private fun hideKeyboard() {
                  val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as? InputMethodManager
                  imm?.hideSoftInputFromWindow(etSearch.windowToken, 0)
              }

              // Быстрый HTTP-запрос: сначала бьет в выбранное зеркало (world84.spcs.bio)
              private fun fetchDoc(pathOrUrl: String): Document? {
                  val candidates = listOf(activeMirror) + fallbackMirrors.filter { it != activeMirror }
                  for (base in candidates) {
                      try {
                          val fullUrl = when {
                              pathOrUrl.startsWith("http") -> pathOrUrl
                              pathOrUrl.startsWith("/") -> base + pathOrUrl
                              else -> "$base/$pathOrUrl"
                          }
                          val req = Request.Builder()
                              .url(fullUrl)
                              .header("User-Agent", USER_AGENT)
                              .header("Accept", "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8")
                              .header("Accept-Language", "ru-RU,ru;q=0.9")
                              .header("Referer", "$base/")
                              .build()

                          httpClient.newCall(req).execute().use { resp ->
                              if (resp.isSuccessful) {
                                  val html = resp.body?.string() ?: ""
                                  if (html.length > 200) {
                                      // Обновляем актуальный хост, если сайт сделал редирект (например на world85.spcs.bio)
                                      val finalHost = "${resp.request.url.scheme}://${resp.request.url.host}"
                                      if (finalHost.contains("spcs") || finalHost.contains("spaces")) {
                                          activeMirror = finalHost
                                      }
                                      return Jsoup.parse(html, activeMirror)
                                  }
                              }
                          }
                      } catch (_: Exception) {
                      }
                  }
                  return null
              }

              // Универсальный парсер страниц Spaces (вытаскивает и карточки треков, и прямые mp3)
              private fun parseTracksFromDoc(doc: Document): ArrayList<SpaceTrack> {
                  val list = ArrayList<SpaceTrack>()
                  val seenUrls = HashSet<String>()

                  // 1. Сначала ищем встроенные плееры / прямые ссылки, если они уже есть на странице
                  val allLinks = doc.select("a[href]")
                  for (a in allLinks) {
                      val rawHref = a.attr("href")
                      val absHref = a.absUrl("href").ifEmpty {
                          if (rawHref.startsWith("/")) activeMirror + rawHref else "$activeMirror/$rawHref"
                      }

                      // Проверяем, ведет ли ссылка на музыкальный файл Spaces
                      val isMusicView = absHref.contains("/music/view/") ||
                              absHref.contains("/files/view/") ||
                              (absHref.contains("spcs") && absHref.contains("/music/") && absHref.contains("/view/"))
                      val isDirectMp3 = absHref.contains(".mp3") || absHref.contains("/music/download/")

                      if (!isMusicView && !isDirectMp3) continue

                      // Чистим ключ ссылки от лишних GET-хвостов для дедупликации
                      val cleanKey = absHref.substringBefore("?").substringBefore("#")
                      if (cleanKey in seenUrls) continue

                      // Извлекаем название из самой ссылки или из родительского контейнера строки
                      var text = a.text().trim()
                      val container = a.parents().firstOrNull {
                          it.hasClass("main_item") || it.hasClass("f-item") || it.hasClass("list-link") || it.tagName() == "li" || it.tagName() == "tr"
                      }
                      if (text.length < 3 || text.lowercase() in listOf("скачать", "слушать", "играть", "подробнее", "файл")) {
                          text = container?.text()?.trim() ?: a.parent()?.text()?.trim() ?: ""
                      }

                      // Убираем служебный мусор Spaces (размер файла, длительность, кнопки)
                      text = text
                          .replace(Regex("\\b\\d+(\\.\\d+)?\\s*(Мб|Кб|MB|KB|mb|kb)\\b"), "")
                          .replace(Regex("\\b\\d{1,2}:\\d{2}\\b"), "")
                          .replace(Regex("(?i)(скачать|слушать|mp3|аудиозапись)"), "")
                          .replace(Regex("\\s+"), " ")
                          .trim()

                      if (text.length < 2) continue

                      // Пробуем сразу найти прямую ссылку на mp3 внутри того же контейнера
                      var directMp3 = if (isDirectMp3) absHref else ""
                      if (directMp3.isEmpty() && container != null) {
                          val dl = container.selectFirst("a[href*=.mp3], a[href*=download], audio[src], source[src]")
                          if (dl != null) {
                              directMp3 = dl.absUrl("href").ifEmpty { dl.absUrl("src") }
                          }
                      }

                      val parts = text.split(" - ", " – ", " — ", limit = 2)
                      val artist = if (parts.size > 1) parts[0].trim() else "Spaces Music"
                      val title = if (parts.size > 1) parts[1].trim() else text

                      seenUrls.add(cleanKey)
                      list.add(SpaceTrack(title.take(80), artist.take(60), absHref, directMp3))
                      if (list.size >= 45) break
                  }
                  return list
              }

              private fun loadTopMusic() {
                  searchJob?.cancel()
                  progressBar.visibility = View.VISIBLE
                  tvStatus.text = "Загрузка топ-треков с ${activeMirror.removePrefix("https://")}..."

                  searchJob = uiScope.launch {
                      val found = withContext(Dispatchers.IO) {
                          val urls = listOf(
                              "/music/top/",
                              "/music/",
                              "/SZ/music/"
                          )
                          for (u in urls) {
                              val doc = fetchDoc(u) ?: continue
                              val parsed = parseTracksFromDoc(doc)
                              if (parsed.isNotEmpty()) return@withContext parsed
                          }
                          emptyList()
                      }
                      progressBar.visibility = View.GONE
                      updateMirrorBadge()
                      if (found.isNotEmpty()) {
                          tracks.clear()
                          tracks.addAll(found)
                          adapter.notifyDataSetChanged()
                          tvStatus.text = "Популярные треки (${tracks.size})"
                      } else {
                          // Если раздел /music/top/ требует запрос, запускаем быстрый поиск хитов
                          searchMusic("2026")
                      }
                  }
              }

              private fun searchMusic(query: String) {
                  searchJob?.cancel()
                  progressBar.visibility = View.VISIBLE
                  tvStatus.text = "Быстрый поиск «$query»..."

                  searchJob = uiScope.launch {
                      val found = withContext(Dispatchers.IO) {
                          val enc = URLEncoder.encode(query, "UTF-8")
                          // Проверяем все актуальные поисковые роуты Spaces на world84.spcs.bio
                          val searchPaths = listOf(
                              "/music/search/?q=$enc",
                              "/mysite/find/?search=$enc&type=26",
                              "/mysite/find/?word=$enc&type=26",
                              "/search/?q=$enc&type=music",
                              "/files/search/?q=$enc&T=6"
                          )

                          for (path in searchPaths) {
                              val doc = fetchDoc(path) ?: continue
                              val parsed = parseTracksFromDoc(doc)
                              if (parsed.isNotEmpty()) return@withContext parsed
                          }
                          emptyList()
                      }

                      progressBar.visibility = View.GONE
                      updateMirrorBadge()
                      tracks.clear()
                      tracks.addAll(found)
                      adapter.notifyDataSetChanged()

                      if (tracks.isNotEmpty()) {
                          tvStatus.text = "Найдено: ${tracks.size} треков"
                      } else {
                          tvStatus.text = "По запросу «$query» треков не найдено. Нажмите ⚙ сверху, если сменилось зеркало."
                      }
                  }
              }

              private suspend fun resolveMp3Url(track: SpaceTrack): String = withContext(Dispatchers.IO) {
                  if (track.mp3Url.isNotEmpty()) return@withContext track.mp3Url
                  val doc = fetchDoc(track.viewUrl) ?: return@withContext ""

                  var found = ""
                  // 1. Проверяем тег <audio> или <source>
                  val audioEl = doc.selectFirst("audio[src], audio source[src], [data-src*=.mp3], [data-url*=.mp3]")
                  if (audioEl != null) {
                      found = audioEl.absUrl("src")
                          .ifEmpty { audioEl.absUrl("data-src") }
                          .ifEmpty { audioEl.absUrl("data-url") }
                  }

                  // 2. Ищем кнопку «Скачать» (.mp3 или /download/)
                  if (found.isEmpty()) {
                      val dl = doc.select("a[href]").firstOrNull { a ->
                          val h = a.attr("href").lowercase()
                          val t = a.text().lowercase()
                          h.contains(".mp3") || h.contains("/download/") || h.contains("download_file") ||
                                  (t.contains("скачать") && (h.contains("/music/") || h.contains("/files/")))
                      }
                      if (dl != null) {
                          found = dl.absUrl("href")
                      }
                  }

                  // 3. Резервный поиск прямой ссылки на хранилище статики Spaces (cs/d/f) в HTML-коде страницы
                  if (found.isEmpty()) {
                      val regex = Regex("""https?://[^\s"'<>]+\.mp3[^\s"'<>]*""", RegexOption.IGNORE_CASE)
                      val match = regex.find(doc.html())
                      if (match != null) {
                          found = match.value.replace("&amp;", "&")
                      }
                  }

                  track.mp3Url = found
                  found
              }

              private fun playTrackAt(index: Int) {
                  if (index !in tracks.indices) return
                  currentIndex = index
                  adapter.selectedIndex = index
                  adapter.notifyDataSetChanged()

                  val track = tracks[index]
                  tvNowPlayingTitle.text = track.title
                  tvNowPlayingSub.text = "Подключение к потоку..."
                  progressBar.visibility = View.VISIBLE

                  uiScope.launch {
                      val streamUrl = resolveMp3Url(track)
                      progressBar.visibility = View.GONE

                      if (streamUrl.isNotEmpty()) {
                          tvNowPlayingSub.text = track.artist

                          // Передаем куки зеркала в ExoPlayer, чтобы сервер не отбивал скачивание 403 ошибкой
                          val host = HttpUrl.Builder().scheme("https").host(
                              activeMirror.removePrefix("https://").removePrefix("http://").substringBefore("/")
                          ).build().host
                          val cookieHeader = cookieStore[host]?.joinToString("; ") { "${it.name}=${it.value}" } ?: ""

                          val dsFactory = DefaultHttpDataSource.Factory()
                              .setUserAgent(USER_AGENT)
                              .setAllowCrossProtocolRedirects(true)
                              .setDefaultRequestProperties(
                                  mapOf(
                                      "Referer" to track.viewUrl,
                                      "Cookie" to cookieHeader
                                  )
                              )

                          val mediaSource = DefaultMediaSourceFactory(dsFactory)
                              .createMediaSource(MediaItem.fromUri(streamUrl))

                          player.setMediaSource(mediaSource)
                          player.prepare()
                          player.play()

                          // Предзагружаем ссылку для следующего трека в фоне для мгновенного переключения
                          if (index + 1 in tracks.indices) {
                              launch(Dispatchers.IO) { resolveMp3Url(tracks[index + 1]) }
                          }
                      } else {
                          tvNowPlayingSub.text = "Ошибка: не найдена ссылка на MP3"
                      }
                  }
              }

              private fun playNext() {
                  if (tracks.isNotEmpty()) {
                      val next = if (currentIndex + 1 < tracks.size) currentIndex + 1 else 0
                      playTrackAt(next)
                  }
              }

              private fun playPrev() {
                  if (tracks.isNotEmpty()) {
                      val prev = if (currentIndex - 1 >= 0) currentIndex - 1 else tracks.size - 1
                      playTrackAt(prev)
                  }
              }

              private fun formatTime(ms: Long): String {
                  if (ms <= 0) return "0:00"
                  val totalSec = ms / 1000
                  return String.format("%d:%02d", totalSec / 60, totalSec % 60)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  handler.removeCallbacksAndMessages(null)
                  uiScope.cancel()
                  player.release()
              }

              inner class TrackAdapter(
                  private val items: List<SpaceTrack>,
                  private val onClick: (Int) -> Unit
              ) : RecyclerView.Adapter<TrackAdapter.VH>() {

                  var selectedIndex = -1

                  inner class VH(v: View) : RecyclerView.ViewHolder(v) {
                      val tvTitle: TextView = v.findViewById(R.id.tvTitle)
                      val tvSubtitle: TextView = v.findViewById(R.id.tvSubtitle)
                      val tvPlayIcon: TextView = v.findViewById(R.id.tvPlayIcon)
                  }

                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                      val v = LayoutInflater.from(parent.context).inflate(R.layout.item_track, parent, false)
                      return VH(v)
                  }

                  override fun onBindViewHolder(holder: VH, position: Int) {
                      val item = items[position]
                      holder.tvTitle.text = item.title
                      holder.tvSubtitle.text = item.artist
                      val isSelected = position == selectedIndex
                      holder.tvTitle.setTextColor(if (isSelected) 0xFFFFCC00.toInt() else 0xFFFFFFFF.toInt())
                      holder.tvPlayIcon.text = if (isSelected) "⏸" else "▶"
                      holder.itemView.setOnClickListener { onClick(position) }
                  }

                  override fun getItemCount(): Int = items.size
              }
          }
          EOF

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpacesPlayer-v3-Fast-APK
          path: app/build/outputs/apk/debug/*.apk
