              private fun showMirrorDialog() {
                  val input = EditText(this).apply {
                      setText(baseHost)
                      hint = "https://world84.spcs.bio"
                      setPadding(40, 30, 40, 30)
                  }
                  AlertDialog.Builder(this)
                      .setTitle("Зеркало Spaces")
