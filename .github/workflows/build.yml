                          <TextView android:id="@+id/chipOnline" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip_active" android:paddingHorizontal="14dp" android:paddingVertical="6dp" android:text="Топ-100 композиций" android:textColor="#FFCC00" android:textSize="12sp" android:layout_marginEnd="6dp"/>

                          <TextView android:id="@+id/chipNew" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="14dp" android:paddingVertical="6dp" android:text="Топ-100 исполнителей" android:textColor="#FFFFFF" android:textSize="12sp" android:layout_marginEnd="6dp"/>

                          <TextView android:id="@+id/chipCats" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="14dp" android:paddingVertical="6dp" android:text="Топ-100 жанров" android:textColor="#FFFFFF" android:textSize="12sp" android:layout_marginEnd="6dp"/>

                          <TextView android:id="@+id/chipFav" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="14dp" android:paddingVertical="6dp" android:text="Любимые" android:textColor="#FFFFFF" android:textSize="12sp" android:layout_marginEnd="6dp" android:visibility="gone"/>

                          <TextView android:id="@+id/chipHist" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="14dp" android:paddingVertical="6dp" android:text="История" android:textColor="#FFFFFF" android:textSize="12sp" android:layout_marginEnd="6dp" android:visibility="gone"/>

                          <TextView android:id="@+id/chipPlaylists" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="14dp" android:paddingVertical="6dp" android:text="Плейлисты" android:textColor="#FFFFFF" android:textSize="12sp" android:layout_marginEnd="6dp" android:visibility="gone"/>

                          <TextView android:id="@+id/chipNewPlaylist" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="14dp" android:paddingVertical="6dp" android:text="+ Новый плейлист" android:textColor="#8EEB93" android:textSize="12sp" android:visibility="gone"/>

