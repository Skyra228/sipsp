              private fun extractCleanHost(rawInput: String): String {
                  return try {
                      val withScheme = if (rawInput.startsWith("http")) rawInput else "https://$rawInput"
                      val uri = Uri.parse(withScheme)
                      val host = uri.host ?: "world84.spcs.bio"
                      "${uri.scheme ?: "https"}://$host"
                  } catch (_: Exception) {
                      "https://world84.spcs.bio"
                  }
              }

              private fun highlightActiveChip(active: TextView?) {
                  val chips = listOf(chipTop, chipArtists, chipGenres, chipFav, chipHist)
                  for (c in chips) {
                      if (c == active) {
                          c.setBackgroundResource(R.drawable.bg_chip_active)
                          c.setTextColor(0xFFFFCC00.toInt())
                      } else {
                          c.setBackgroundResource(R.drawable.bg_chip)
                          c.setTextColor(0xFFFFFFFF.toInt())
                      }
                  }
              }

              private fun updateMirrorBadge() {
