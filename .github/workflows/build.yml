name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Spaces Player v6 Pro
        run: |
          mkdir -p app/src/main/java/com/example/spacesplayer
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable

          # 1. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SpacesPlayer"
          include(":app")
          EOF

          # 2. build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          # 4. app/build.gradle.kts (Media3 ExoPlayer + MediaSessionService + Coroutines)
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.spacesplayer"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.spacesplayer"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 6
                  versionName = "6.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("androidx.media3:media3-exoplayer:1.2.1")
              implementation("androidx.media3:media3-session:1.2.1")
              implementation("androidx.media3:media3-ui:1.2.1")
              implementation("org.jsoup:jsoup:1.17.2")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF

          # 5. Ресурсы оформления в стиле Яндекс Музыки
          cat << 'EOF' > app/src/main/res/drawable/bg_search.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#1C1C1E"/>
              <corners android:radius="14dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_chip.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#242426"/>
              <corners android:radius="20dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_chip_active.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#3A3210"/>
              <stroke android:width="1dp" android:color="#FFCC00"/>
              <corners android:radius="20dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_cover.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#2A2A2D"/>
              <corners android:radius="10dp"/>
          </shape>
          EOF

          # 6. Карточка трека или папки (item_track.xml)
          cat << 'EOF' > app/src/main/res/layout/item_track.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:gravity="center_vertical"
              android:paddingVertical="10dp"
              android:paddingHorizontal="16dp"
              android:background="?attr/selectableItemBackground">

              <TextView
                  android:id="@+id/tvCover"
                  android:layout_width="46dp"
                  android:layout_height="46dp"
                  android:background="@drawable/bg_cover"
                  android:gravity="center"
                  android:text="♫"
                  android:textColor="#FFCC00"
                  android:textSize="19sp"
                  android:textStyle="bold" />

              <LinearLayout
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="1"
                  android:orientation="vertical"
                  android:layout_marginStart="14dp"
                  android:layout_marginEnd="8dp">

                  <TextView
                      android:id="@+id/tvTitle"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Название"
                      android:textColor="#FFFFFF"
                      android:textSize="15sp"
                      android:textStyle="bold"
                      android:singleLine="true"
                      android:ellipsize="end" />

                  <TextView
                      android:id="@+id/tvSubtitle"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Spaces"
                      android:textColor="#8E8E93"
                      android:textSize="12sp"
                      android:singleLine="true"
                      android:ellipsize="end"
                      android:layout_marginTop="2dp" />
              </LinearLayout>

              <TextView
                  android:id="@+id/tvPlayIcon"
                  android:layout_width="32dp"
                  android:layout_height="32dp"
                  android:gravity="center"
                  android:text="▶"
                  android:textColor="#FFCC00"
                  android:textSize="16sp" />
          </LinearLayout>
          EOF

          # 7. Главный экран (activity_main.xml)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#0A0A0A">

              <!-- Верхняя панель -->
              <LinearLayout
