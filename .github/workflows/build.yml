              private fun showSleepTimerDialog() {
                  val options = arrayOf("Выключить", "15 минут", "30 минут", "45 минут", "60 минут")
                  val mins = intArrayOf(0, 15, 30, 45, 60)
                  AlertDialog.Builder(this)
                      .setTitle("Таймер сна")
                      .setItems(options) { _, which ->
                          sleepTimer?.cancel()
                          val m = mins[which]
                          if (m == 0) {
                              btnSleep.text = "⏱"
                              Toast.makeText(this, "Таймер отключен", Toast.LENGTH_SHORT).show()
                          } else {
                              sleepTimer = object : CountDownTimer(m * 60 * 1000L, 60000L) {
                                  override fun onTick(ms: Long) {
                                      btnSleep.text = "⏱ ${(ms / 60000L) + 1}m"
                                  }
                                  override fun onFinish() {
                                      player.pause()
                                      btnSleep.text = "⏱"
                                  }
                              }.start()
                              Toast.makeText(this, "Музыка выключится через $m мин.", Toast.LENGTH_SHORT).show()
                          }
                      }
                      .show()
              }

