              private fun hideKeyboard() {
                  val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as? InputMethodManager
                  imm?.hideSoftInputFromWindow(etSearch.windowToken, 0)
              }

              private fun toAbsoluteUrl(hrefOrPath: String): String {
                  val clean = hrefOrPath.trim()
                  return when {
                      clean.startsWith("http://") || clean.startsWith("https://") -> clean
                      clean.startsWith("//") -> "https:$clean"
                      clean.startsWith("/") -> baseHost + clean
                      else -> "$baseHost/$clean"
                  }
              }

              private fun fetchDocument(urlOrPath: String): Document? {
                  return try {
                      val fullUrl = toAbsoluteUrl(urlOrPath)
                      val req = Request.Builder()
                          .url(fullUrl)
                          .header("User-Agent", USER_AGENT)
                          .header("Accept", "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8")
                          .header("Accept-Language", "ru-RU,ru;q=0.9")
                          .header("Referer", "$baseHost/")
                          .build()

                      httpClient.newCall(req).execute().use { resp ->
                          if (!resp.isSuccessful) return null
                          val html = resp.body?.string() ?: return null
                          val finalHost = "${resp.request.url.scheme}://${resp.request.url.host}"
                          if (finalHost.contains("spcs") || finalHost.contains("spaces")) {
                              baseHost = finalHost
                          }
                          Jsoup.parse(html, resp.request.url.toString())
                      }
                  } catch (_: Exception) {
                      null
                  }
              }

              // Считываем точные ссылки на вкладки "Категории", "Популярные" и "Новые" без ложных срабатываний
              private fun extractExactTabs(doc: Document) {
                  for (a in doc.select("a[href]")) {
                      val t = a.text().trim().lowercase()
                      val h = a.absUrl("href")
                      if (h.isEmpty() || isSystemNoiseUrl(h.lowercase())) continue
                      when (t) {
                          "категории" -> categoriesTabUrl = h
                          "популярные", "популярное" -> popularTabUrl = h
                          "новые", "новое", "новинки" -> newTabUrl = h
                      }
                  }
              }

              private fun initSpacesAndOpenPopular() {
                  loadJob?.cancel()
                  progressBar.visibility = View.VISIBLE
                  tvStatus.text = "Подключение к $baseHost..."
                  highlightActiveChip(chipPop)

                  loadJob = uiScope.launch {
                      val szDoc = withContext(Dispatchers.IO) { fetchDocument("/sz/muzyka/") }
                      if (szDoc == null) {
                          progressBar.visibility = View.GONE
                          tvStatus.text = "Нет ответа от $baseHost. Проверьте зеркало (⚙)."
                          return@launch
                      }

                      extractExactTabs(szDoc)

                      val popDoc = withContext(Dispatchers.IO) { fetchDocument(popularTabUrl) }
                      if (popDoc != null) {
                          currentState = NavState(toAbsoluteUrl(popularTabUrl), onlyFolders = false)
                          displayParsedDocument(popDoc, resetList = true, onlyFolders = false)
                      } else {
                          currentState = NavState(toAbsoluteUrl("/sz/muzyka/"), onlyFolders = true)
                          highlightActiveChip(chipCats)
                          displayParsedDocument(szDoc, resetList = true, onlyFolders = true)
                      }
                  }
              }

              private fun openSpacePage(urlOrPath: String, onlyFolders: Boolean, addToHistory: Boolean) {
                  loadJob?.cancel()
                  val fullTarget = toAbsoluteUrl(urlOrPath)
                  if (addToHistory && currentState.url.isNotEmpty() && currentState.url != fullTarget) {
                      navHistory.push(currentState)
                  }
                  currentState = NavState(fullTarget, onlyFolders)
                  updateMirrorBadge()

                  progressBar.visibility = View.VISIBLE
                  tvStatus.text = "Загрузка..."

                  loadJob = uiScope.launch {
                      val doc = withContext(Dispatchers.IO) { fetchDocument(fullTarget) }
                      if (doc == null) {
                          progressBar.visibility = View.GONE
                          tvStatus.text = "Не удалось загрузить страницу"
                          return@launch
                      }
                      extractExactTabs(doc)
                      displayParsedDocument(doc, resetList = true, onlyFolders = onlyFolders)
                  }
              }

              private fun loadNextPage() {
                  val nextUrl = nextPageUrl ?: return
                  isLoadingMore = true
                  progressBar.visibility = View.VISIBLE

                  uiScope.launch {
                      val doc = withContext(Dispatchers.IO) { fetchDocument(nextUrl) }
                      progressBar.visibility = View.GONE
                      isLoadingMore = false
                      if (doc != null) {
                          displayParsedDocument(doc, resetList = false, onlyFolders = currentState.onlyFolders)
                      }
                  }
              }

              private fun displayParsedDocument(doc: Document, resetList: Boolean, onlyFolders: Boolean) {
                  progressBar.visibility = View.GONE
                  updateMirrorBadge()

                  // Сначала находим следующую страницу ДО удаления блоков навигации
                  nextPageUrl = if (onlyFolders) null else findNextPageUrl(doc)

                  if (resetList) {
                      items.clear()
                      seenKeys.clear()
                  }

                  val parsed = parseCleanItems(doc, onlyFolders = onlyFolders, onlyTracks = false)
                  for (item in parsed) {
                      if (seenKeys.add(item.idKey)) {
                          items.add(item)
                      }
                  }

                  adapter.notifyDataSetChanged()

                  val trackCount = items.count { !it.isFolder }
                  val folderCount = items.count { it.isFolder }

                  tvStatus.text = when {
                      trackCount > 0 && nextPageUrl != null -> "Треков: $trackCount (листайте вниз для автоподгрузки)"
                      trackCount > 0 -> "Треков в списке: $trackCount"
                      folderCount > 0 -> "Жанры и категории: $folderCount — выберите раздел"
                      else -> "В этом разделе пока нет элементов"
                  }
              }

              // ГЛАВНЫЙ ФИЛЬТР v5.0: Полностью вырезает футер, сайдбар и системные кнопки ("Тема: Системная", "Назад", "Ещё", ":56")
              private fun parseCleanItems(doc: Document, onlyFolders: Boolean, onlyTracks: Boolean): List<SpaceItem> {
                  val cleanDoc = doc.clone()

                  // 1. Вырезаем из DOM шапку, подвал, левое меню, формы входа, хлебные крошки и блок пагинации
                  cleanDoc.select(
                      "footer, header, nav, form, script, style, " +
                      "#footer, #header, #sidebar, #left_nav, #right_nav, " +
                      ".footer, .header, .sidebar, .menu, .pgn, .pagination, .breadcrumbs, .Location, .tabs"
                  ).remove()

                  val tracksFound = ArrayList<SpaceItem>()
                  val foldersFound = ArrayList<SpaceItem>()
                  val localTrackKeys = HashSet<String>()
                  val localFolderKeys = HashSet<String>()

                  for (el in cleanDoc.select("a[href]")) {
                      val rawHref = el.attr("href").trim()
                      if (rawHref.isEmpty() || rawHref.startsWith("#") || rawHref.startsWith("javascript")) continue

                      val absHref = el.absUrl("href").ifEmpty { toAbsoluteUrl(rawHref) }
                      val lowHref = absHref.lowercase()

                      // Отсекаем системные URL
                      if (isSystemNoiseUrl(lowHref)) continue

                      val linkText = el.text().trim()
                      val rowContainer = el.parents().firstOrNull {
                          it.hasClass("main_item") || it.hasClass("f-item") || it.hasClass("list-link") ||
                                  it.hasClass("m-item") || it.hasClass("__adv_list_track") || it.tagName() == "li" || it.tagName() == "tr"
                      }
                      val fullRowText = rowContainer?.text()?.trim() ?: el.parent()?.text()?.trim() ?: linkText

                      // Отсекаем любые кнопки интерфейса Spaces ("Тема: Системная", "Назад", "Ещё", "Транслит" и т.д.)
                      if (isInterfaceGarbageText(linkText) || isInterfaceGarbageText(fullRowText)) continue

                      // 1. ПРОВЕРКА НА МУЗЫКАЛЬНЫЙ ТРЕК
                      val isTrackLink = lowHref.contains("/music/view/") ||
                              lowHref.contains("/files/view/") ||
                              lowHref.contains("/file/view/") ||
                              (lowHref.contains("/sz/") && (lowHref.contains("/view/") || lowHref.contains("file_id") || lowHref.contains("fid="))) ||
                              lowHref.contains(".mp3") ||
                              lowHref.contains("/music/download/")

                      if (isTrackLink && !onlyFolders) {
                          // Выбираем текст ссылки; если там только время (например "03:56"), берем текст контейнера
                          var candidateName = if (hasLetters(linkText) && !isGenericActionWord(linkText)) linkText else fullRowText
                          candidateName = cleanTrackName(candidateName)

                          // Защита от ":56" и пустых обрывков: в названии обязаны быть минимум 2 буквы!
                          if (!hasLetters(candidateName)) continue

                          val trackId = extractUniqueTrackKey(absHref)
                          if (!localTrackKeys.add(trackId)) continue

                          var directMp3 = if (lowHref.contains(".mp3") || lowHref.contains("/music/download/")) absHref else ""
                          if (directMp3.isEmpty() && rowContainer != null) {
                              val dl = rowContainer.selectFirst("a[href*=.mp3], a[href*=/download/], audio[src], source[src], [data-mp3], [data-src]")
                              if (dl != null) {
                                  directMp3 = dl.absUrl("href").ifEmpty { dl.absUrl("src") }.ifEmpty { dl.attr("data-mp3") }
                              }
                          }

                          val parts = candidateName.split(" - ", " – ", " — ", limit = 2)
                          val artist = if (parts.size > 1) parts[0].trim() else "Spaces Музыка"
                          val title = if (parts.size > 1) parts[1].trim() else candidateName

                          if (!hasLetters(title)) continue

                          tracksFound.add(
                              SpaceItem(
                                  idKey = "track_$trackId",
                                  title = title.take(85),
                                  subtitle = artist.take(60),
                                  url = absHref,
                                  isFolder = false,
                                  directMp3 = directMp3
                              )
                          )
                          continue
                      }

                      // 2. ПРОВЕРКА НА КАТЕГОРИЮ / ПАПКУ ЖАНРА (на странице /sz/muzyka/ и внутри подкатегорий)
                      if (!onlyTracks) {
                          val pathOnly = Uri.parse(absHref).path?.lowercase() ?: ""
                          // Категории Зоны обмена имеют путь /sz/<genre>/ или /music/<genre>/
                          val isSzCategoryPath = (pathOnly.startsWith("/sz/") && pathOnly != "/sz/" && pathOnly != "/sz/muzyka/") ||
                                  (pathOnly.startsWith("/music/") && pathOnly != "/music/" && !pathOnly.contains("/view/"))

                          val hasQueryNoise = lowHref.contains("p=") || lowHref.contains("page=") ||
                                  lowHref.contains("sort=") || lowHref.contains("theme=") || lowHref.contains("writed=")

                          if (isSzCategoryPath && !hasQueryNoise && hasLetters(linkText) && linkText.length in 3..55) {
                              // Отделяем название жанра от счетчика (например "Русский Поп 812 тыс")
                              val countMatch = Regex("(\\d+[\\s\\d]*(тыс|млн|файл|трек).*)?", RegexOption.IGNORE_CASE).find(fullRowText)
                              val cleanGenreTitle = linkText
                                  .replace(Regex("\\d+\\s*(тыс|млн).*$", RegexOption.IGNORE_CASE), "")
                                  .trim()

                              if (!hasLetters(cleanGenreTitle) || isInterfaceGarbageText(cleanGenreTitle)) continue

                              val folderKey = "folder_$pathOnly"
                              if (localFolderKeys.add(folderKey)) {
                                  val badge = fullRowText.replace(cleanGenreTitle, "").trim().take(30)
                                  val sub = if (badge.isNotEmpty()) "Жанр • $badge" else "Категория музыки"
                                  foldersFound.add(
                                      SpaceItem(
                                          idKey = folderKey,
                                          title = cleanGenreTitle,
                                          subtitle = sub,
                                          url = absHref,
                                          isFolder = true
                                      )
                                  )
                              }
                          }
                      }
                  }

                  return when {
                      onlyFolders -> foldersFound
                      onlyTracks -> tracksFound
                      tracksFound.isNotEmpty() -> tracksFound
                      else -> foldersFound
                  }
              }

              // Извлекает уникальный ID файла из URL Spaces, чтобы один и тот же трек не дублировался
              private fun extractUniqueTrackKey(url: String): String {
                  val viewId = Regex("""/(?:view|download|file)/[^/?#]*?(\d{4,})""").find(url)?.groupValues?.get(1)
                  if (viewId != null) return viewId
                  val paramId = Regex("""(?:file_id|fid|id)=(\d{4,})""").find(url)?.groupValues?.get(1)
                  if (paramId != null) return paramId
                  return url.substringBefore("?").substringBefore("#")
              }

              private fun hasLetters(text: String): Boolean {
                  return Regex("[a-zA-Zа-яА-ЯёЁ]{2,}").containsMatchIn(text)
              }

              private fun isSystemNoiseUrl(lowHref: String): Boolean {
                  val badTokens = listOf(
                      "/registration", "/login", "/auth", "/restore", "/anketa", "/mysite", "/diary",
                      "/forums", "/comm/", "/chat/", "/games", "/neo/", "/help", "/rules", "/settings",
                      "/ads", "/pictures/", "/video/", "/adult/", "theme=", "writed=", "translit",
                      "block_files", "/app/", "/support", "/user/", "/users/"
                  )
                  return badTokens.any { lowHref.contains(it) }
              }

              private fun isGenericActionWord(text: String): Boolean {
                  val low = text.lowercase().trim()
                  return low in listOf("скачать", "слушать", "играть", "подробнее", "файл", "mp3", "аудио")
              }

              // Жесткий стоп-лист для элементов интерфейса Spaces (чтобы "Тема: Системная", "Назад", "Ещё" никогда не попадали в список)
              private fun isInterfaceGarbageText(text: String): Boolean {
                  val low = text.lowercase().trim()
                  if (low.isEmpty()) return true

                  val exactGarbage = setOf(
                      "назад", "вперед", "вперёд", "ещё", "еще", "далее", "показать ещё",
                      "категории", "популярные", "новые", "музыка", "зона обмена", "музыка онлайн",
                      "главная", "вход", "войти", "регистрация", "поиск", "найти", "меню",
                      "разделы сайта", "настройка", "правила", "помощь", "реклама", "о сайте",
                      "полная версия", "мобильная версия", "выход", "жалоба", "поделиться"
                  )
                  if (low in exactGarbage) return true

                  val prefixOrSubstringGarbage = listOf(
                      "тема:", "тема :", "безопасный режим", "транслит", "блокировать фа",
                      "не можете войти", "мини игры", "шашки, шахматы", "ai hub",
                      "фильмы и сериалы", "знакомства", "блоги", "сообщества", "форум"
                  )
                  return prefixOrSubstringGarbage.any { low.contains(it) }
              }

              private fun cleanTrackName(raw: String): String {
                  return raw
                      .replace(Regex("\\.mp3\\b", RegexOption.IGNORE_CASE), "")
                      .replace(Regex("\\b\\d+(\\.\\d+)?\\s*(Мб|Кб|Гб|MB|KB|mb|kb)\\b"), "")
                      .replace(Regex("\\b\\d{1,2}:\\d{2}\\b"), "")
                      .replace(Regex("(?<!\\d):\\d{2}\\b"), "") // Убирает обрывки времени вроде ":56"
                      .replace(Regex("\\b\\d+\\s*kbps\\b", RegexOption.IGNORE_CASE), "")
                      .replace(Regex("(?i)\\b(скачать|слушать|онлайн|бесплатно|аудиозапись)\\b"), "")
                      .replace(Regex("^[\\s:\\-–—•\\d.]+"), "") // Убирает ведущие двоеточия и мусор в начале строки
                      .replace(Regex("\\s+"), " ")
                      .trim()
              }

              private fun findNextPageUrl(doc: Document): String? {
                  val pagLinks = doc.select("a.pg_next, a.next, .pgn a[href], .pagination a[href], a[href*=P=], a[href*=p=]")
                  for (a in pagLinks) {
                      val t = a.text().trim().lowercase()
                      if (t.contains("вперед") || t.contains("вперёд") || t.contains("след") || t == "»" || t == ">") {
                          val h = a.absUrl("href")
                          if (h.isNotEmpty() && h != currentState.url) return h
                      }
                  }
                  return null
              }

              // ПОИСК v5.0: Ищет ТОЛЬКО реальные треки (игнорирует папки и меню)
              private fun performSpacesSearch(query: String) {
                  loadJob?.cancel()
                  progressBar.visibility = View.VISIBLE
                  tvStatus.text = "Поиск треков «$query»..."

                  loadJob = uiScope.launch {
                      val foundTracks = withContext(Dispatchers.IO) {
                          val encoded = URLEncoder.encode(query, "UTF-8")
                          val candidateUrls = ArrayList<String>()

                          // 1. Считываем поисковую форму со страницы музыки (исключая формы входа/регистрации)
                          val basePage = fetchDocument("/music/") ?: fetchDocument("/sz/muzyka/")
                          if (basePage != null) {
                              val forms = basePage.select("form")
                              for (form in forms) {
                                  val act = form.attr("action").lowercase()
                                  if (act.contains("login") || act.contains("reg") || act.contains("auth")) continue
                                  val textInput = form.selectFirst("input[type=text], input[type=search], input[name*=q], input[name*=word], input[name*=search], input[name*=s]")
                                  if (textInput != null) {
                                      val actionUrl = form.absUrl("action").ifEmpty { toAbsoluteUrl(form.attr("action")) }
                                      val paramName = textInput.attr("name").ifEmpty { "q" }
                                      val hidden = form.select("input[type=hidden]").mapNotNull {
                                          val n = it.attr("name")
                                          val v = it.attr("value")
                                          if (n.isNotEmpty()) "$n=${URLEncoder.encode(v, "UTF-8")}" else null
                                      }.joinToString("&")
                                      val sep = if (actionUrl.contains("?")) "&" else "?"
                                      candidateUrls.add("$actionUrl$sep$paramName=$encoded" + if (hidden.isNotEmpty()) "&$hidden" else "")
                                  }
                              }
                          }

                          // 2. Прямые поисковые маршруты Spaces (Музыка + Зона обмена)
                          candidateUrls.addAll(
                              listOf(
                                  "/music/search/?q=$encoded",
                                  "/music/search/?word=$encoded",
                                  "/sz/search/?q=$encoded&T=6",
                                  "/sz/search/?s=$encoded",
                                  "/mysite/find/?search=$encoded&type=26",
                                  "/mysite/find/?word=$encoded&type=26",
                                  "/search/?q=$encoded&type=music",
                                  "/search/?q=$encoded"
                              )
                          )

                          for (u in candidateUrls.distinct()) {
                              val doc = fetchDocument(u) ?: continue
                              // В режиме поиска берем ТОЛЬКО треки (onlyTracks = true)
                              val tracks = parseCleanItems(doc, onlyFolders = false, onlyTracks = true)
                              if (tracks.isNotEmpty()) {
                                  currentState = NavState(toAbsoluteUrl(u), onlyFolders = false)
                                  nextPageUrl = findNextPageUrl(doc)
                                  return@withContext tracks
                              }
                          }
                          emptyList()
                      }

                      progressBar.visibility = View.GONE
                      updateMirrorBadge()
                      items.clear()
                      seenKeys.clear()
                      for (t in foundTracks) {
                          if (seenKeys.add(t.idKey)) items.add(t)
                      }
                      adapter.notifyDataSetChanged()

                      if (items.isNotEmpty()) {
                          tvStatus.text = "Найдено треков по запросу «$query»: ${items.size}"
                      } else {
                          tvStatus.text = "По запросу «$query» треков не найдено. Откройте «Жанры и категории»."
                      }
                  }
              }

              private fun onItemClicked(position: Int) {
                  if (position !in items.indices) return
                  val item = items[position]
                  if (item.isFolder) {
                      // При входе внутрь жанра показываем уже треки (или подпапки, если они там есть)
                      openSpacePage(item.url, onlyFolders = false, addToHistory = true)
                  } else {
                      playTrackAt(position)
                  }
              }

              private suspend fun resolveStreamUrl(item: SpaceItem): String {
                  if (item.directMp3.isNotEmpty()) return item.directMp3

                  val fastExtracted = withContext(Dispatchers.IO) {
                      val doc = fetchDocument(item.url) ?: return@withContext ""
                      extractMp3FromTrackDoc(doc)
                  }

                  if (fastExtracted.isNotEmpty()) {
                      item.directMp3 = fastExtracted
                      return fastExtracted
                  }

                  val webExtracted = withTimeoutOrNull(7500L) {
                      suspendCancellableCoroutine<String> { cont ->
                          webViewMp3Callback = { foundUrl ->
                              if (cont.isActive) cont.resume(foundUrl)
                          }
                          hiddenWebView.loadUrl(item.url)
                      }
                  } ?: ""

                  if (webExtracted.isNotEmpty()) {
                      item.directMp3 = webExtracted
                  }
                  return webExtracted
              }

              private fun extractMp3FromTrackDoc(doc: Document): String {
                  val audioEl = doc.selectFirst("audio[src], audio source[src], [data-mp3], [data-src*=.mp3], [data-url*=.mp3], [data-file*=.mp3]")
                  if (audioEl != null) {
                      val src = audioEl.absUrl("src")
                          .ifEmpty { audioEl.absUrl("data-mp3") }
                          .ifEmpty { audioEl.absUrl("data-src") }
                          .ifEmpty { audioEl.absUrl("data-url") }
                          .ifEmpty { audioEl.absUrl("data-file") }
                      if (src.isNotEmpty()) return src
                  }

                  // Ищем только настоящие ссылки на скачивание файла (отсекая HTML-разделы)
                  for (a in doc.select("a[href]")) {
                      val h = a.absUrl("href")
                      if (isDirectAudioFileUrl(h)) return h
                  }

                  val unescapedHtml = doc.html().replace("\\/", "/").replace("&amp;", "&")
                  val regex = Regex("""https?://[^\s"'<>]+?\.mp3(?:\?[^\s"'<>]*)?""", RegexOption.IGNORE_CASE)
                  val match = regex.find(unescapedHtml)
                  if (match != null) return match.value

                  return ""
              }

              private fun playTrackAt(index: Int) {
                  if (index !in items.indices) return
                  val item = items[index]
                  if (item.isFolder) {
                      openSpacePage(item.url, onlyFolders = false, addToHistory = true)
                      return
                  }

                  currentIndex = index
                  adapter.selectedIndex = index
                  adapter.notifyDataSetChanged()

                  tvNowPlayingTitle.text = item.title
                  tvNowPlayingSub.text = "Загрузка аудиопотока..."
                  progressBar.visibility = View.VISIBLE

                  uiScope.launch {
                      val mp3Url = resolveStreamUrl(item)
                      progressBar.visibility = View.GONE

                      if (mp3Url.isNotEmpty()) {
                          tvNowPlayingSub.text = item.subtitle

                          val cookieHeader = allCookies.values.joinToString("; ") { "${it.name}=${it.value}" }
                              .ifEmpty { CookieManager.getInstance().getCookie(mp3Url) ?: "" }

                          val dsFactory = DefaultHttpDataSource.Factory()
                              .setUserAgent(USER_AGENT)
                              .setAllowCrossProtocolRedirects(true)
                              .setDefaultRequestProperties(
                                  mapOf(
                                      "Referer" to item.url,
                                      "Cookie" to cookieHeader
                                  )
                              )

                          val mediaSource = DefaultMediaSourceFactory(dsFactory)
                              .createMediaSource(MediaItem.fromUri(mp3Url))

                          player.setMediaSource(mediaSource)
                          player.prepare()
                          player.play()

                          val nextIdx = (index + 1 until items.size).firstOrNull { !items[it].isFolder }
                          if (nextIdx != null) {
                              launch(Dispatchers.IO) { resolveStreamUrl(items[nextIdx]) }
                          }
                      } else {
                          tvNowPlayingSub.text = "Ошибка: не удалось получить поток MP3"
                      }
                  }
              }

              private fun playNextTrack() {
                  val nextIdx = (currentIndex + 1 until items.size).firstOrNull { !items[it].isFolder }
                  if (nextIdx != null) playTrackAt(nextIdx)
              }

              private fun playPrevTrack() {
                  val prevIdx = (currentIndex - 1 downTo 0).firstOrNull { !items[it].isFolder }
                  if (prevIdx != null) playTrackAt(prevIdx)
              }

              private fun formatTime(ms: Long): String {
                  if (ms <= 0) return "0:00"
                  val totalSec = ms / 1000
                  return String.format("%d:%02d", totalSec / 60, totalSec % 60)
              }

              override fun onBackPressed() {
                  if (navHistory.isNotEmpty()) {
                      val prev = navHistory.pop()
                      updateMirrorBadge()
                      openSpacePage(prev.url, onlyFolders = prev.onlyFolders, addToHistory = false)
                  } else {
                      super.onBackPressed()
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  handler.removeCallbacksAndMessages(null)
                  uiScope.cancel()
                  player.release()
              }

              inner class SpaceAdapter(
                  private val list: List<SpaceItem>,
                  private val onClick: (Int) -> Unit
              ) : RecyclerView.Adapter<SpaceAdapter.VH>() {

                  var selectedIndex = -1

                  inner class VH(v: View) : RecyclerView.ViewHolder(v) {
                      val tvCover: TextView = v.findViewById(R.id.tvCover)
                      val tvTitle: TextView = v.findViewById(R.id.tvTitle)
                      val tvSubtitle: TextView = v.findViewById(R.id.tvSubtitle)
                      val tvPlayIcon: TextView = v.findViewById(R.id.tvPlayIcon)
                  }

                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                      val v = LayoutInflater.from(parent.context).inflate(R.layout.item_track, parent, false)
                      return VH(v)
                  }

                  override fun onBindViewHolder(holder: VH, position: Int) {
                      val item = list[position]
                      holder.tvTitle.text = item.title
                      holder.tvSubtitle.text = item.subtitle

                      if (item.isFolder) {
                          holder.tvCover.text = "📁"
                          holder.tvTitle.setTextColor(0xFFFFFFFF.toInt())
                          holder.tvPlayIcon.text = "›"
                      } else {
                          holder.tvCover.text = "♫"
                          val isSelected = position == selectedIndex
                          holder.tvTitle.setTextColor(if (isSelected) 0xFFFFCC00.toInt() else 0xFFFFFFFF.toInt())
                          holder.tvPlayIcon.text = if (isSelected) "⏸" else "▶"
                      }

                      holder.itemView.setOnClickListener { onClick(position) }
                  }

                  override fun getItemCount(): Int = list.size
              }
          }
          EOF

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpacesPlayer-v5-Clean-APK
          path: app/build/outputs/apk/debug/*.apk
