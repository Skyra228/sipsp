              private fun onItemClicked(pos: Int) {

                  if (pos !in items.indices) return

                  val item = items[pos]

                  if (item.type == ItemType.HEADER) return

          

                  // Нажатие на заголовок или кнопку «Показать все (400) ›»

                  if (item.type == ItemType.SECTION_ALL) {

                      if (item.targetFilter != SubFilter.ALL) {

                          openSubFilterPage(item.targetFilter)

                      } else if (item.url.isNotEmpty()) {

                          loadSubFilterUrl(item.url, SubFilter.ALL, item.title)

                      }

                      return

                  }

          

                  // Нажатие на кнопку «Загрузить ещё результаты ›»

                  if (item.type == ItemType.LOAD_MORE) {

                      loadNextPage()

                      return

                  }

          

                  if (item.type == ItemType.PLAYLIST) {

                      openPlaylistItems(item.idKey.removePrefix("playlist_"), item.title)

                      return

                  }

          

                  if (item.isFolder) {

                      val nextMode = when (item.type) {

                          ItemType.ARTIST -> TabMode.ARTISTS

                          ItemType.ALBUM -> TabMode.FOLDER_VIEW

                          ItemType.GENRE -> TabMode.GENRES

                          else -> TabMode.FOLDER_VIEW

                      }

                      loadSection(item.url, nextMode, item.title, addToHistory = true)

                  } else {

                      playTrackAt(pos)

                  }

              }

          

              private fun extractMp3AndCoverFromDoc(doc: Document, item: SpaceItem): String {

                  val playerItem = doc.selectFirst("div.player_item[data-src], [data-src*=.mp3], [data-mp3]")

                  if (playerItem != null) {

                      val cover = playerItem.attr("data-cover").trim()

                      if (cover.isNotEmpty() && item.coverUrl.isEmpty()) item.coverUrl = toAbsoluteUrl(cover)

                      val ds = playerItem.absUrl("data-src").ifEmpty { toAbsoluteUrl(playerItem.attr("data-src")) }

                          .ifEmpty { playerItem.absUrl("data-mp3").ifEmpty { toAbsoluteUrl(playerItem.attr("data-mp3")) } }

                      if (ds.isNotEmpty() && isDirectAudioFileUrl(ds)) return ds

                  }

          

                  val dlLink = doc.selectFirst("a.__adv_download[href], a[href*=.mp3], a[href*=/music/download/], a[href*=/files/download/]")

                  if (dlLink != null) {

                      val href = dlLink.absUrl("href").ifEmpty { toAbsoluteUrl(dlLink.attr("href")) }

                      if (href.isNotEmpty() && isDirectAudioFileUrl(href)) return href

                  }

          

                  val audio = doc.selectFirst("audio[src], audio source[src]")

                  if (audio != null) {

                      val src = audio.absUrl("src").ifEmpty { toAbsoluteUrl(audio.attr("src")) }

                      if (src.isNotEmpty() && isDirectAudioFileUrl(src)) return src

                  }

          

                  val rawHtml = doc.outerHtml()

                  val directMatch = Regex("""https?://[^"'\s<>\\]+\.mp3(?:\?[^"'\s<>\\]*)?""", RegexOption.IGNORE_CASE).find(rawHtml)

                  if (directMatch != null) return directMatch.value

          

                  val escapedMatch = Regex("""https?:\\/\\/[^"'\s<>]+\.mp3(?:\?[^"'\s<>]*)?""", RegexOption.IGNORE_CASE).find(rawHtml)

                  if (escapedMatch != null) return escapedMatch.value.replace("\\/", "/")

          

                  return ""

              }

          

              private suspend fun resolveStreamUrl(item: SpaceItem): String {

                  if (item.directMp3.isNotEmpty()) return item.directMp3

          

                  val fastMp3 = withContext(Dispatchers.IO) {

                      val doc = fetchDocFast(item.url) ?: return@withContext ""

                      val direct = extractMp3AndCoverFromDoc(doc, item)

                      if (direct.isNotEmpty()) return@withContext direct

          

                      val viewLink = doc.selectFirst("a[href*=/music/view/], a[href*=/files/view/]")

                      if (viewLink != null) {

                          val viewUrl = viewLink.absUrl("href").ifEmpty { toAbsoluteUrl(viewLink.attr("href")) }

                          if (viewUrl.isNotEmpty() && viewUrl != item.url) {

                              val viewDoc = fetchDocFast(viewUrl)

                              if (viewDoc != null) {

                                  val fromView = extractMp3AndCoverFromDoc(viewDoc, item)

                                  if (fromView.isNotEmpty()) return@withContext fromView

                              }

                          }

                      }

                      ""

                  }

          

                  if (fastMp3.isNotEmpty()) {

                      item.directMp3 = fastMp3

                      return fastMp3

                  }

          

                  val web = withTimeoutOrNull(10000L) {

                      val deferred = CompletableDeferred<String>()

                      runOnUiThread {

                          webViewMp3Callback = { found -> if (!deferred.isCompleted) deferred.complete(found) }

                          hiddenWebView.loadUrl(item.url)

                      }

                      deferred.await()

                  } ?: ""

          

                  if (web.isNotEmpty()) item.directMp3 = web

                  return web

              }

          

              private fun prefetchNextTracks(fromIndex: Int) {

                  val candidates = (fromIndex + 1 until items.size)

                      .filter { !items[it].isFolder && items[it].type == ItemType.TRACK }

                      .take(2)

                  for (idx in candidates) {

                      val nextItem = items[idx]

                      if (nextItem.directMp3.isNotEmpty()) continue

                      uiScope.launch(Dispatchers.IO) {

                          try {

                              resolveStreamUrl(nextItem)

                          } catch (_: Exception) {}

                      }

                  }

              }

          

              private fun updatePlayerUiForItem(item: SpaceItem) {

                  btnFavTrack.text = if (isFavorite(item)) "♥ В любимых" else "♡ В любимые"

                  tvNowPlayingTitle.text = item.title

                  tvNowPlayingSub.text = item.subtitle

                  tvFullTitle.text = item.title

                  tvFullSubtitle.text = item.subtitle

                  bindCoverToViews(item.coverUrl, ivMiniCover, tvMiniCover, "♪")

                  bindCoverToViews(item.coverUrl, ivFullCover, tvFullCoverPlaceholder, "♪")

              }

          

              private fun playSingleItem(item: SpaceItem) {

                  currentPlayingItem = item

                  updatePlayerUiForItem(item)

                  tvNowPlayingSub.text = "Получение аудиопотока..."

                  progressBar.visibility = View.VISIBLE

          

                  playJob?.cancel()

                  playJob = uiScope.launch {

                      val mp3 = resolveStreamUrl(item)

                      progressBar.visibility = View.GONE

                      if (mp3.isNotEmpty()) {

                          updatePlayerUiForItem(item)

                          addToHistory(item)

                          saveLastPlayedStateAsync()

                          startExoPlayerStream(item, mp3)

                      } else {

                          tvNowPlayingSub.text = "Не удалось получить MP3"

                      }

                  }

              }

          

              private fun playTrackAt(index: Int) {

                  if (index !in items.indices) return

                  val item = items[index]

                  if (item.type == ItemType.HEADER) return

                  if (item.isFolder) {

                      onItemClicked(index)

                      return

                  }

          

                  if (currentPlayingItem?.idKey == item.idKey && player.mediaItemCount > 0) {

                      if (player.isPlaying) player.pause() else player.play()

                      adapter.notifyPlayingStateChanged()

                      return

                  }

          

                  playJob?.cancel()

                  currentIndex = index

                  currentPlayingItem = item

                  adapter.selectedIndex = index

                  adapter.notifyPlayingStateChanged()

          

                  updatePlayerUiForItem(item)

                  tvNowPlayingSub.text = "Получение аудиопотока..."

                  progressBar.visibility = View.VISIBLE

          

                  playJob = uiScope.launch {

                      val mp3 = resolveStreamUrl(item)

                      progressBar.visibility = View.GONE

                      if (mp3.isNotEmpty()) {

                          updatePlayerUiForItem(item)

                          addToHistory(item)

                          saveLastPlayedStateAsync()

                          startExoPlayerStream(item, mp3)

                          prefetchNextTracks(index)

                      } else {

                          tvNowPlayingSub.text = "Не удалось получить MP3 (попробуйте другой трек)"

                          Toast.makeText(this@MainActivity, "Ссылка на MP3 недоступна", Toast.LENGTH_SHORT).show()

                      }

                  }

              }

          

              private fun startExoPlayerStream(item: SpaceItem, mp3: String) {

                  val cookies = allCookies.values.joinToString("; ") { "${it.name}=${it.value}" }

                  val headers = HashMap<String, String>()

                  headers["Referer"] = item.url

                  if (cookies.isNotEmpty()) headers["Cookie"] = cookies

          

                  val upstream = DefaultHttpDataSource.Factory()

                      .setUserAgent(MusicEngine.USER_AGENT)

                      .setAllowCrossProtocolRedirects(true)

                      .setDefaultRequestProperties(headers)

          

                  val cache = MusicEngine.simpleCache

                  val dsFactory: androidx.media3.datasource.DataSource.Factory = if (cache != null) {

                      CacheDataSource.Factory()

                          .setCache(cache)

                          .setUpstreamDataSourceFactory(upstream)

                          .setFlags(CacheDataSource.FLAG_IGNORE_CACHE_ON_ERROR)

                  } else {

                      upstream

                  }

          

                  val metaBuilder = MediaMetadata.Builder()

                      .setTitle(item.title)

                      .setArtist(item.subtitle.substringBefore("•").trim())

                  if (item.coverUrl.isNotEmpty()) {

                      try {

                          metaBuilder.setArtworkUri(Uri.parse(item.coverUrl))

                      } catch (_: Exception) {}

                  }

          

                  val mediaItem = MediaItem.Builder()

                      .setMediaId(item.idKey)

                      .setUri(mp3)

                      .setCustomCacheKey(item.idKey)

                      .setMediaMetadata(metaBuilder.build())

                      .build()

          

                  player.setMediaSource(DefaultMediaSourceFactory(dsFactory).createMediaSource(mediaItem))

                  player.prepare()

                  player.play()

              }

          

              private fun playNextTrack(fromUser: Boolean) {

                  val trackIndices = items.indices.filter { !items[it].isFolder && items[it].type == ItemType.TRACK }

                  if (trackIndices.isEmpty()) return

          

                  if (shuffleEnabled && trackIndices.size > 1) {

                      val candidates = trackIndices.filter { it != currentIndex }

                      val randomIdx = candidates[Random.nextInt(candidates.size)]

                      playTrackAt(randomIdx)

                      return

                  }

          

                  val next = (currentIndex + 1 until items.size).firstOrNull { !items[it].isFolder && items[it].type == ItemType.TRACK }

                  if (next != null) {

                      playTrackAt(next)

                  } else if (fromUser || repeatState == RepeatState.ALL) {

                      playTrackAt(trackIndices.first())

                  }

              }

          

              private fun playPrevTrack() {

                  if (player.currentPosition > 4000L) {

                      player.seekTo(0)

                      return

                  }

                  val prev = (currentIndex - 1 downTo 0).firstOrNull { !items[it].isFolder && items[it].type == ItemType.TRACK }

                  if (prev != null) playTrackAt(prev)

              }

          

              private fun bindCoverToViews(coverUrl: String, imageView: ImageView, placeholder: TextView, fallbackSymbol: String) {

                  placeholder.text = fallbackSymbol

                  if (coverUrl.isEmpty()) {

                      imageView.visibility = View.GONE

                      placeholder.visibility = View.VISIBLE

                      return

                  }

                  val cached = bitmapCache.get(coverUrl)

                  if (cached != null) {

                      imageView.setImageBitmap(cached)

                      imageView.visibility = View.VISIBLE

                      placeholder.visibility = View.GONE

                      return

                  }

                  imageView.visibility = View.GONE

                  placeholder.visibility = View.VISIBLE

                  if (!loadingCovers.add(coverUrl)) return

          

                  uiScope.launch(Dispatchers.IO) {

                      try {

                          val req = Request.Builder().url(coverUrl).header("User-Agent", MusicEngine.USER_AGENT).build()

                          httpClient.newCall(req).execute().use { resp ->

                              if (resp.isSuccessful) {

                                  val bytes = resp.body?.bytes()

                                  if (bytes != null && bytes.isNotEmpty()) {

                                      val bmp = BitmapFactory.decodeByteArray(bytes, 0, bytes.size)

                                      if (bmp != null) {

                                          bitmapCache.put(coverUrl, bmp)

                                          withContext(Dispatchers.Main) {

                                              if (currentPlayingItem?.coverUrl == coverUrl) {

                                                  ivMiniCover.setImageBitmap(bmp)

                                                  ivMiniCover.visibility = View.VISIBLE

                                                  tvMiniCover.visibility = View.GONE

                                                  ivFullCover.setImageBitmap(bmp)

                                                  ivFullCover.visibility = View.VISIBLE

                                                  tvFullCoverPlaceholder.visibility = View.GONE

                                              }

                                              adapter.notifyCoverLoaded(coverUrl)

                                          }

                                      }

                                  }

                              }

                          }

                      } catch (_: Exception) {

                      } finally {

                          loadingCovers.remove(coverUrl)

                      }

                  }

              }

          

