    @SuppressLint("SetJavaScriptEnabled")
    private fun setupHiddenWebView() {
        CookieManager.getInstance().setAcceptCookie(true)
        hiddenWebView.settings.apply {
            javaScriptEnabled = true
            domStorageEnabled = true
            userAgentString = MusicEngine.USER_AGENT
            mediaPlaybackRequiresUserGesture = false
        }
        hiddenWebView.webViewClient = object : WebViewClient() {
            override fun shouldInterceptRequest(view: WebView?, request: WebResourceRequest?): WebResourceResponse? {
                val url = request?.url?.toString() ?: ""
                if (webViewMp3Callback != null && isDirectAudioFileUrl(url)) {
                    deliverWebViewMp3(url)
                }
                return super.shouldInterceptRequest(view, request)
            }
            override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean {
                val url = request?.url?.toString() ?: return false
                if (webViewMp3Callback != null && isDirectAudioFileUrl(url)) {
                    deliverWebViewMp3(url)
                    return true
                }
                return false
            }
            override fun onPageFinished(view: WebView?, url: String?) {
                super.onPageFinished(view, url)
                if (webViewMp3Callback != null) {
                    val js = "(function() {" +
                        "var p = document.querySelector('.player_item[data-src], [data-src*=\".mp3\"], [data-mp3]');" +
                        "if (p) { var ds = p.getAttribute('data-src') || p.getAttribute('data-mp3'); if (ds) return ds; }" +
                        "var dl = document.querySelector('a.__adv_download[href], a[href*=\".mp3\"]');" +
                        "if (dl && dl.href) return dl.href;" +
                        "var a = document.querySelector('audio[src], source[src]');" +
                        "if (a && a.src) return a.src;" +
                        "var links = document.querySelectorAll('a[href]');" +
                        "for (var i = 0; i < links.length; i++) {" +
                        "  var h = links[i].href || '';" +
                        "  if (h.indexOf('.mp3') !== -1 || h.indexOf('/download/') !== -1 || h.indexOf('/files/download/') !== -1) return h;" +
                        "}" +
                        "return '';" +
                        "})();"
                    view?.evaluateJavascript(js) { res ->
                        val clean = res?.trim()?.removeSurrounding("\"") ?: ""
                        if (clean.startsWith("http") && isDirectAudioFileUrl(clean)) {
                            deliverWebViewMp3(clean)
                        }
                    }
                }
            }
        }
        hiddenWebView.setDownloadListener { url, _, _, mimetype, _ ->
            if (url.isNotEmpty() && (mimetype.contains("audio") || isDirectAudioFileUrl(url))) {
                deliverWebViewMp3(url)
            }
        }
    }

    private fun isDirectAudioFileUrl(url: String): Boolean {
        val l = url.lowercase()
        if (l.contains("/registration") || l.contains("/login")) return false
        return l.contains(".mp3") || l.contains("/music/download/") || l.contains("/files/download/") ||
                l.contains("download_file") || (l.contains("spac.me/m/") && l.contains("/")) ||
                (l.contains("spcs") && l.contains("/d/"))
    }

    private fun deliverWebViewMp3(url: String) {
        runOnUiThread {
            val cb = webViewMp3Callback
            if (cb != null) {
                webViewMp3Callback = null
                hiddenWebView.stopLoading()
                cb.invoke(url)
            }
        }
    }

    private fun setupPlayerListeners() {
        player.addListener(object : Player.Listener {
            override fun onIsPlayingChanged(isPlaying: Boolean) {
                val icon = if (isPlaying) "❚❚" else "▶"
                btnPlayPause.text = icon
                btnFullPlayPause.text = icon
                adapter.notifyPlayingStateChanged()
                if (!isPlaying) {
                    saveLastPlayedState()
                }
            }
            override fun onPlaybackStateChanged(state: Int) {
                if (state == Player.STATE_READY) {
                    if (pendingRestoredPositionMs > 0L) {
                        val target = pendingRestoredPositionMs
                        pendingRestoredPositionMs = 0L
                        player.seekTo(target)
                    }
                    val dur = player.duration
                    if (dur > 0 && dur != C.TIME_UNSET) {
                        seekBar.max = (dur / 1000).toInt().coerceAtLeast(1)
                        tvTotalTime.text = formatTime(dur)
                    }
                } else if (state == Player.STATE_ENDED) {
                    if (repeatState == RepeatState.ONE && currentIndex in items.indices) {
                        player.seekTo(0)
                        player.play()
                    } else {
                        playNextTrack(fromUser = false)
                    }
                }
            }
        })
        handler.post(object : Runnable {
            override fun run() {
                if (player.isPlaying && !isUserSeeking) {
                    val pos = player.currentPosition
                    seekBar.progress = (pos / 1000).toInt()
                    tvCurrentTime.text = formatTime(pos)
                }
                handler.postDelayed(this, 1000)
            }
        })
    }

    private fun setupRecyclerView() {
        adapter = SpaceAdapter(
            onClick = { pos -> onItemClicked(pos) },
            onLongClick = { pos -> showTrackContextMenu(pos) }
        )
        lm = LinearLayoutManager(this)
        rvTracks.layoutManager = lm
        rvTracks.itemAnimator = null
        rvTracks.adapter = adapter

        rvTracks.addOnScrollListener(object : RecyclerView.OnScrollListener() {
            override fun onScrolled(recyclerView: RecyclerView, dx: Int, dy: Int) {
                if (dy > 0 && !isLoadingMore && nextPageUrl != null) {
                    val visibleCount = lm.childCount
                    val totalCount = lm.itemCount
                    val firstVisible = lm.findFirstVisibleItemPosition()
                    if (visibleCount + firstVisible >= totalCount - 8) loadNextPage()
                }
            }
        })

        // Свайпы по треку: вправо — в избранное, влево — скачать
        val swipeCallback = object : ItemTouchHelper.SimpleCallback(0, ItemTouchHelper.LEFT or ItemTouchHelper.RIGHT) {
            override fun onMove(rv: RecyclerView, vh: RecyclerView.ViewHolder, target: RecyclerView.ViewHolder): Boolean = false

            override fun getSwipeDirs(recyclerView: RecyclerView, viewHolder: RecyclerView.ViewHolder): Int {
                val pos = viewHolder.bindingAdapterPosition
                if (pos !in items.indices) return 0
                val item = items[pos]
                return if (!item.isFolder && item.type == ItemType.TRACK) super.getSwipeDirs(recyclerView, viewHolder) else 0
            }

            override fun onSwiped(viewHolder: RecyclerView.ViewHolder, direction: Int) {
                val pos = viewHolder.bindingAdapterPosition
                if (pos !in items.indices) return
                val item = items[pos]
                adapter.notifyItemChanged(pos)
                if (direction == ItemTouchHelper.RIGHT) {
                    val added = toggleFavorite(item)
                    if (currentPlayingItem?.idKey == item.idKey) {
                        btnFavTrack.text = if (added) "♥ В любимых" else "♡ В любимые"
                    }
                    Toast.makeText(this@MainActivity, if (added) "♥ Добавлено в Любимые" else "♡ Удалено из Любимых", Toast.LENGTH_SHORT).show()
                } else if (direction == ItemTouchHelper.LEFT) {
                    downloadTrackItem(item)
                }
            }

            override fun onChildDraw(
                c: Canvas,
                recyclerView: RecyclerView,
                viewHolder: RecyclerView.ViewHolder,
                dX: Float,
                dY: Float,
                actionState: Int,
                isCurrentlyActive: Boolean
            ) {
                val itemView = viewHolder.itemView
                val paint = Paint()
                if (dX > 0) {
                    paint.color = 0xFF2E5A1C.toInt()
                    c.drawRect(itemView.left.toFloat(), itemView.top.toFloat(), itemView.left + dX, itemView.bottom.toFloat(), paint)
                } else if (dX < 0) {
                    paint.color = 0xFF1C3F5A.toInt()
                    c.drawRect(itemView.right + dX, itemView.top.toFloat(), itemView.right.toFloat(), itemView.bottom.toFloat(), paint)
                }
                super.onChildDraw(c, recyclerView, viewHolder, dX, dY, actionState, isCurrentlyActive)
            }
        }
        ItemTouchHelper(swipeCallback).attachToRecyclerView(rvTracks)
    }

