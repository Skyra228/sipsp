              }

          

              private fun openPlaylistItems(playlistName: String, title: String) {

                  navHistory.push(currentEntry.copy())

                  currentEntry = NavEntry("", TabMode.PLAYLIST_DETAIL, "Плейлист: $title", BottomTab.MY)

                  updateMirrorBadge()

          

                  val obj = getPlaylistsObject()

                  val arr = obj.optJSONArray(playlistName) ?: JSONArray()

                  val tracks = parseJsonTrackArray(arr)

                  allParsedItems.clear()

                  allParsedItems.addAll(tracks)

                  items.clear()

                  items.addAll(tracks)

                  syncSelectedIndex()

                  adapter.submitListAsync(ArrayList(items))

                  tvStatus.text = "$title (${tracks.size} треков)"

              }

          

              private fun showCreatePlaylistDialog(trackToAdd: SpaceItem?) {

                  val input = EditText(this).apply {

                      hint = "Название плейлиста"

                      setPadding(40, 30, 40, 30)

                  }

                  AlertDialog.Builder(this)

                      .setTitle("Новый плейлист")

                      .setView(input)

                      .setPositiveButton("Создать") { _, _ ->

                          val name = input.text.toString().trim()

                          if (name.isNotEmpty()) {

                              val obj = getPlaylistsObject()

                              val arr = obj.optJSONArray(name) ?: JSONArray()

                              if (trackToAdd != null) {

                                  arr.put(trackToJson(trackToAdd))

                              }

                              obj.put(name, arr)

                              savePlaylistsObject(obj)

                              Toast.makeText(this, "Плейлист «$name» создан", Toast.LENGTH_SHORT).show()

                              if (currentEntry.tabMode == TabMode.PLAYLISTS) showPlaylistsScreen()

                          }

                      }

                      .setNegativeButton("Отмена", null)

                      .show()

              }

          

              private fun showAddToPlaylistDialog(track: SpaceItem) {

                  val obj = getPlaylistsObject()

                  val names = obj.keys().asSequence().toList().sorted()

                  val options = ArrayList<String>()

                  options.add("➕ Создать новый плейлист...")

                  options.addAll(names)

          

                  AlertDialog.Builder(this)

                      .setTitle("Добавить в плейлист")

                      .setItems(options.toTypedArray()) { _, which ->

                          if (which == 0) {

                              showCreatePlaylistDialog(track)

                          } else {

                              val name = options[which]

                              val arr = obj.optJSONArray(name) ?: JSONArray()

                              arr.put(trackToJson(track))

                              obj.put(name, arr)

                              savePlaylistsObject(obj)

                              Toast.makeText(this, "Добавлено в «$name»", Toast.LENGTH_SHORT).show()

                          }

                      }

                      .show()

              }

          

