              @SuppressLint("SetJavaScriptEnabled")

              private fun setupHiddenWebView() {

                  CookieManager.getInstance().setAcceptCookie(true)

                  hiddenWebView.settings.apply {

                      javaScriptEnabled = true

                      domStorageEnabled = true

                      userAgentString = MusicEngine.USER_AGENT

                      mediaPlaybackRequiresUserGesture = false

                  }

                  hiddenWebView.webViewClient = object : WebViewClient() {

                      override fun shouldInterceptRequest(view: WebView?, request: WebResourceRequest?): WebResourceResponse? {

                          val url = request?.url?.toString() ?: ""

                          if (webViewMp3Callback != null && isDirectAudioFileUrl(url)) {

                              deliverWebViewMp3(url)

                          }

                          return super.shouldInterceptRequest(view, request)

                      }

                      override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean {

                          val url = request?.url?.toString() ?: return false

                          if (webViewMp3Callback != null && isDirectAudioFileUrl(url)) {

                              deliverWebViewMp3(url)

                              return true

                          }

                          return false

                      }

                      override fun onPageFinished(view: WebView?, url: String?) {

                          super.onPageFinished(view, url)

                          if (webViewMp3Callback != null) {

                              view?.evaluateJavascript(

                                  """

                                  (function() {

                                      var a = document.querySelector('audio[src], source[src]');

                                      if (a && a.src) return a.src;

                                      var links = document.querySelectorAll('a[href]');

                                      for (var i = 0; i < links.length; i++) {

                                          var h = links[i].href || '';

                                          if (h.indexOf('.mp3') !== -1 || h.indexOf('/download/') !== -1 || h.indexOf('/files/download/') !== -1) return h;

                                      }

                                      var playBtn = document.querySelector('[data-mp3], [data-src], [data-url], .play');

                                      if (playBtn) {

                                          var d = playBtn.getAttribute('data-mp3') || playBtn.getAttribute('data-src') || playBtn.getAttribute('data-url');

                                          if (d) return d;

                                          playBtn.click();

                                      }

                                      return '';

                                  })();

                                  """.trimIndent()

                              ) { res ->

                                  val clean = res?.trim()?.removeSurrounding("\"") ?: ""

                                  if (clean.startsWith("http") && isDirectAudioFileUrl(clean)) {

                                      deliverWebViewMp3(clean)

                                  }

                              }

                          }

                      }

                  }

                  hiddenWebView.setDownloadListener { url, _, _, mimetype, _ ->

                      if (url.isNotEmpty() && (mimetype.contains("audio") || isDirectAudioFileUrl(url))) {

                          deliverWebViewMp3(url)

                      }

                  }

              }



              private fun isDirectAudioFileUrl(url: String): Boolean {

                  val l = url.lowercase()

                  if (l.contains("/registration") || l.contains("/login")) return false

                  return l.contains(".mp3") || l.contains("/music/download/") || l.contains("/files/download/") ||

                          l.contains("download_file") || (l.contains("spcs") && l.contains("/d/")) || l.contains("/f/")

              }



              private fun deliverWebViewMp3(url: String) {

                  runOnUiThread {

                      val cb = webViewMp3Callback

                      if (cb != null) {

                          webViewMp3Callback = null

                          hiddenWebView.stopLoading()

                          cb.invoke(url)

                      }

                  }

              }



              private fun setupPlayerListeners() {

                  player.addListener(object : Player.Listener {

                      override fun onIsPlayingChanged(isPlaying: Boolean) {

                          btnPlayPause.text = if (isPlaying) "❚❚" else "▶"

                      }

                      override fun onPlaybackStateChanged(state: Int) {

                          if (state == Player.STATE_READY) {

                              seekBar.max = (player.duration / 1000).toInt().coerceAtLeast(1)

                              tvTotalTime.text = formatTime(player.duration)

                          } else if (state == Player.STATE_ENDED) {

                              playNextTrack()

                          }

                      }

                  })

                  handler.post(object : Runnable {

                      override fun run() {

                          if (player.isPlaying && !isUserSeeking) {

                              val pos = player.currentPosition

                              seekBar.progress = (pos / 1000).toInt()

                              tvCurrentTime.text = formatTime(pos)

                          }

                          handler.postDelayed(this, 1000)

                      }

                  })

              }



              private fun setupRecyclerView() {

                  adapter = SpaceAdapter(items) { pos -> onItemClicked(pos) }

                  val lm = LinearLayoutManager(this)

                  rvTracks.layoutManager = lm

                  rvTracks.adapter = adapter



                  rvTracks.addOnScrollListener(object : RecyclerView.OnScrollListener() {

                      override fun onScrolled(recyclerView: RecyclerView, dx: Int, dy: Int) {

                          if (dy > 0 && !isLoadingMore && nextPageUrl != null) {

                              val visibleCount = lm.childCount

                              val totalCount = lm.itemCount

                              val firstVisible = lm.findFirstVisibleItemPosition()

                              if (visibleCount + firstVisible >= totalCount - 4) loadNextPage()

                          }

                      }

                  })

              }



