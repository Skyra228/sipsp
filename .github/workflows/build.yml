          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_media_play"
                  android:label="Spaces Музыка"
                  android:supportsRtl="true"
                  android:theme="@style/AppThemeDark"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".PlaybackService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="androidx.media3.session.MediaSessionService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/spacesplayer/PlaybackService.kt
          package com.example.spacesplayer

          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.media.audiofx.BassBoost
          import android.media.audiofx.Equalizer
          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.common.Player
          import androidx.media3.datasource.DefaultHttpDataSource
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService
          import androidx.media3.ui.PlayerNotificationManager

          object MusicEngine {
              const val USER_AGENT = "Mozilla/5.0 (Linux; Android 14; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36"
              var player: ExoPlayer? = null
              var mediaSession: MediaSession? = null
              private var bassBoost: BassBoost? = null
              private var equalizer: Equalizer? = null
              var currentAudioPreset = 0

              fun ensureInitialized(context: Context) {
                  if (player == null) {
                      val appCtx = context.applicationContext
                      val dsFactory = DefaultHttpDataSource.Factory()
                          .setUserAgent(USER_AGENT)
                          .setAllowCrossProtocolRedirects(true)
                      val audioAttrs = AudioAttributes.Builder()
                          .setUsage(C.USAGE_MEDIA)
                          .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)
                          .build()
                      val exo = ExoPlayer.Builder(appCtx)
                          .setMediaSourceFactory(DefaultMediaSourceFactory(dsFactory))
                          .setAudioAttributes(audioAttrs, true)
                          .setHandleAudioBecomingNoisy(true)
                          .build()
                      exo.addListener(object : Player.Listener {
                          override fun onAudioSessionIdChanged(audioSessionId: Int) {
                              applyAudioPreset(currentAudioPreset)
                          }
                      })
                      player = exo
                      val intent = Intent(appCtx, MainActivity::class.java)
                      val pendingIntent = PendingIntent.getActivity(appCtx, 0, intent, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                      mediaSession = MediaSession.Builder(appCtx, exo)
                          .setSessionActivity(pendingIntent)
                          .build()
                  }
              }

              fun applyAudioPreset(presetIndex: Int) {
                  currentAudioPreset = presetIndex
                  val sessionId = player?.audioSessionId ?: return
                  if (sessionId == C.AUDIO_SESSION_ID_UNSET || sessionId <= 0) return
                  try {
                      bassBoost?.release()
                      equalizer?.release()
                      val bb = BassBoost(0, sessionId)
                      val eq = Equalizer(0, sessionId)
                      val presetCount = eq.numberOfPresets.toInt()
                      when (presetIndex) {
                          0 -> {
                              bb.enabled = false
                              eq.enabled = false
                          }
                          1 -> {
                              bb.enabled = true
                              if (bb.strengthSupported) bb.setStrength(1000.toShort())
                              eq.enabled = true
                              if (presetCount > 0) eq.usePreset(0.toShort())
                          }
                          2 -> {
                              bb.enabled = true
                              if (bb.strengthSupported) bb.setStrength(500.toShort())
                              eq.enabled = false
                          }
                          3 -> {
                              bb.enabled = true
