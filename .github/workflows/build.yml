              private fun showSleepTimerDialog() {

                  val options = arrayOf("Выключить", "15 минут", "30 минут", "45 минут", "60 минут")

                  val mins = intArrayOf(0, 15, 30, 45, 60)

                  AlertDialog.Builder(this)

                      .setTitle("Таймер сна")

                      .setItems(options) { _, which ->

                          sleepTimer?.cancel()

                          val m = mins[which]

