              private fun showTrackContextMenu(pos: Int) {
                  if (pos !in items.indices) return
                  val item = items[pos]
                  if (item.idKey == "hdr_wave_control") {
                      showWaveControlDialog()
                      return
                  }
                  if (item.type == ItemType.HEADER || item.type == ItemType.SECTION_ALL || item.type == ItemType.LOAD_MORE) {
                      onItemClicked(pos)
                      return
                  }
                  if (item.type == ItemType.PLAYLIST) {
                      showPlaylistContextMenu(item)
                      return
                  }
                  if (item.type == ItemType.ARTIST) {
                      val artistOptions = arrayOf(
                          "Открыть страницу «${item.title}»",
                          "🌊 Запустить волну похожих на «${item.title}»"
                      )
                      AlertDialog.Builder(this)
                          .setTitle(item.title)
                          .setItems(artistOptions) { _, which ->
                              if (which == 0) {
                                  onItemClicked(pos)
                              } else {
                                  val seed = SpaceItem(
                                      idKey = "seed_artist_${item.title.lowercase()}",
                                      title = item.title,
                                      subtitle = item.title,
                                      url = item.url,
                                      isFolder = false,
                                      type = ItemType.TRACK,
                                      coverUrl = item.coverUrl
                                  )
                                  startTrackRadioWave(seed, closeFullPlayer = true)
                              }
                          }
                          .show()
                      return
                  }
                  if (item.isFolder) {
                      onItemClicked(pos)
                      return
                  }
                  showTrackItemDialog(item, pos)
              }
          
