              private fun appendNextWaveBatchAsync(autoPlayFirst: Boolean) {
                  if (isFetchingWaveBatch) return
                  isFetchingWaveBatch = true
                  if (currentEntry.tabMode == TabMode.MY_WAVE) {
                      progressBar.visibility = View.VISIBLE
                      renderWaveScreenToUi()
                  }
          
                  waveJob = uiScope.launch {
                      val newTracks = withContext(Dispatchers.IO) {
                          harvestWaveBatchSuspend()
                      }
                      isFetchingWaveBatch = false
                      if (currentEntry.tabMode == TabMode.MY_WAVE) {
                          progressBar.visibility = View.GONE
                      }
          
                      val existingFp = HashSet<String>()
                      for (q in playbackQueue) {
                          existingFp.add(buildTrackFingerprint(q))
                          existingFp.add(buildCoreTrackFingerprint(q))
                      }
          
                      var addedCount = 0
                      for (t in newTracks) {
                          val fp = buildTrackFingerprint(t)
                          val coreFp = buildCoreTrackFingerprint(t)
                          if (playbackQueue.none { it.idKey == t.idKey } && existingFp.add(fp) && existingFp.add(coreFp)) {
                              playbackQueue.add(t)
                              addedCount++
                          }
                      }
          
                      if (currentEntry.tabMode == TabMode.MY_WAVE) {
                          renderWaveScreenToUi()
                      }
          
                      if (autoPlayFirst && playbackQueue.isNotEmpty()) {
                          val nextToPlay = if (playbackQueueIndex < 0) 0 else (playbackQueueIndex + 1).coerceAtMost(playbackQueue.size - 1)
                          playFromQueueIndex(nextToPlay)
                      } else if (playbackQueueIndex in playbackQueue.indices) {
                          prefetchNextQueueTracks(playbackQueueIndex)
                          saveLastPlayedStateNow(includeQueue = true)
                      }
                  }
              }
          
              private fun fetchArtistTracksFromSpcs(artistName: String): List<SpaceItem> {
                  return try {
                      val canonical = resolveAliasFromDictionary(artistName).ifEmpty { artistName }
                      val normKey = cleanNoiseFromMusicString(canonical)
                      val pageNum = ((artistSearchPageCursor[normKey] ?: 0) % 3) + 1
                      artistSearchPageCursor[normKey] = pageNum
          
                      val enc = URLEncoder.encode(canonical, "UTF-8")
                      val searchUrl = if (pageNum == 1) {
                          "$baseHost/music-online/search/index/?Link_id=1039269&T=28&sq=$enc"
                      } else {
                          "$baseHost/music-online/search/index/p$pageNum/?Link_id=1039269&T=28&sq=$enc"
                      }
                      val doc = fetchDocFast(searchUrl)
                          ?: if (pageNum > 1) fetchDocFast("$baseHost/music-online/search/index/?Link_id=1039269&T=28&sq=$enc") else null
                      if (doc != null) {
                          val tracks = parseMusicOnlineDoc(doc, TabMode.SEARCH_SUBPAGE, doc.location() ?: searchUrl)
                              .filter { it.type == ItemType.TRACK && !it.isFolder }
                          for (t in tracks.take(8)) {
                              for (c in extractCollaboratorsFromItem(t)) {
                                  if (!waveDiscoveredCollaborators.contains(c)) {
                                      waveDiscoveredCollaborators.add(0, c)
                                  }
                              }
                          }
                          tracks
                      } else {
                          emptyList()
                      }
                  } catch (_: Exception) {
                      emptyList()
                  }
              }
          
              private suspend fun harvestWaveBatchSuspend(): List<SpaceItem> {
                  return coroutineScope {
                      val existingIds = HashSet<String>()
                      val existingFps = HashSet<String>()
                      for (q in playbackQueue) {
                          existingIds.add(q.idKey)
                          existingFps.add(buildTrackFingerprint(q))
                          existingFps.add(buildCoreTrackFingerprint(q))
                      }
          
                      if (wavePlayedFingerprints.size > 480) {
                          val recentKeep = wavePlayedFingerprints.toList().takeLast(120)
                          wavePlayedFingerprints.clear()
                          wavePlayedFingerprints.addAll(recentKeep)
                      }
          
                      val seed = waveSeedItem
                      val seedPrimaryArtist = if (seed != null) extractPrimaryArtistOnly(extractArtistName(seed)).ifEmpty { seed.title } else ""
                      val seedNormArtist = cleanNoiseFromMusicString(seedPrimaryArtist)
          
                      val rawCandidates = ArrayList<SpaceItem>()
          
                      if (seed != null) {
                          val similarArtists = discoverSimilarArtistsSuspend(seedPrimaryArtist, seed).toMutableList()
                          for (collab in waveDiscoveredCollaborators.take(8)) {
                              if (cleanNoiseFromMusicString(collab) != seedNormArtist && !similarArtists.contains(collab)) {
                                  similarArtists.add(0, collab)
                              }
                          }
          
                          val chosenSimilarArtists = similarArtists.shuffled().take(5)
                          val artistsToQuery = ArrayList<String>()
                          artistsToQuery.addAll(chosenSimilarArtists)
                          if (seedPrimaryArtist.isNotEmpty()) {
                              artistsToQuery.add(seedPrimaryArtist)
                          }
          
                          val seedPageDeferred = async(Dispatchers.IO) {
                              val cachedRel = recentRelatedByTrackKey[seed.idKey]
                              if (!cachedRel.isNullOrEmpty()) {
                                  cachedRel
                              } else if (seed.url.startsWith("http")) {
                                  val doc = fetchDocFast(seed.url)
                                  if (doc != null) {
                                      harvestRelatedFromTrackDoc(doc, seed)
                                      recentRelatedByTrackKey[seed.idKey] ?: emptyList()
                                  } else emptyList()
                              } else emptyList()
                          }
          
                          val artistJobs = artistsToQuery.map { artName ->
                              async(Dispatchers.IO) {
                                  fetchArtistTracksFromSpcs(artName)
                              }
                          }
          
                          val seedRelatedTracks = seedPageDeferred.await()
                          rawCandidates.addAll(seedRelatedTracks.filter { normalizePrimaryArtist(it) != seedNormArtist }.shuffled().take(8))
                          rawCandidates.addAll(seedRelatedTracks.filter { normalizePrimaryArtist(it) == seedNormArtist }.shuffled().take(3))
          
                          for (artistTrackList in artistJobs.awaitAll()) {
                              rawCandidates.addAll(artistTrackList.shuffled().take(9))
                          }
                      } else {
                          val familiarArtists = LinkedHashSet<String>()
                          for (b in waveBoostedArtists) familiarArtists.add(extractPrimaryArtistOnly(b))
                          for (f in memFavorites.shuffled().take(15)) {
                              val a = extractPrimaryArtistOnly(extractArtistName(f))
                              val na = cleanNoiseFromMusicString(a)
                              if (a.isNotEmpty() && !waveDislikedArtists.contains(na) && (waveSkippedArtists[na] ?: 0) < 2) {
                                  familiarArtists.add(a)
                              }
                          }
                          for (h in memHistory.shuffled().take(15)) {
                              val a = extractPrimaryArtistOnly(extractArtistName(h))
                              val na = cleanNoiseFromMusicString(a)
                              if (a.isNotEmpty() && !waveDislikedArtists.contains(na) && (waveSkippedArtists[na] ?: 0) < 2) {
                                  familiarArtists.add(a)
                              }
                          }
                          for (o in memOfflineTracks.shuffled().take(10)) {
                              val a = extractPrimaryArtistOnly(extractArtistName(o))
                              val na = cleanNoiseFromMusicString(a)
                              if (a.isNotEmpty() && !waveDislikedArtists.contains(na) && (waveSkippedArtists[na] ?: 0) < 2) {
                                  familiarArtists.add(a)
                              }
                          }
          
                          val discoveryArtists = LinkedHashSet<String>()
                          val anchorArtists = familiarArtists.shuffled().take(2)
                          for (anchor in anchorArtists) {
                              for (sim in discoverSimilarArtistsSuspend(anchor, null).shuffled().take(5)) {
                                  discoveryArtists.add(sim)
                              }
                          }
                          for (collab in waveDiscoveredCollaborators.shuffled().take(5)) {
                              discoveryArtists.add(collab)
                          }
          
                          val artistsToQuery = ArrayList<String>()
                          when (activeWaveMood) {
                              WaveMood.DISCOVERY -> {
                                  artistsToQuery.addAll(discoveryArtists.shuffled().take(5))
                                  artistsToQuery.addAll(familiarArtists.shuffled().take(1))
                              }
                              WaveMood.FAMILIAR -> {
                                  artistsToQuery.addAll(familiarArtists.shuffled().take(5))
                                  artistsToQuery.addAll(discoveryArtists.shuffled().take(2))
                              }
                              else -> {
                                  artistsToQuery.addAll(discoveryArtists.shuffled().take(4))
                                  artistsToQuery.addAll(familiarArtists.shuffled().take(3))
                              }
                          }
          
                          val distinctQueryArtists = artistsToQuery.distinct().take(6)
                          val artistJobs = distinctQueryArtists.map { artName ->
                              async(Dispatchers.IO) {
                                  fetchArtistTracksFromSpcs(artName)
                              }
                          }
                          for (list in artistJobs.awaitAll()) {
                              rawCandidates.addAll(list.shuffled().take(8))
                          }
          
                          if (recentRelatedPool.isNotEmpty() && activeWaveMood != WaveMood.FAMILIAR) {
                              rawCandidates.addAll(recentRelatedPool.shuffled().take(8))
                          }
          
                          if (activeWaveMood == WaveMood.FAMILIAR || activeWaveMood == WaveMood.ALL) {
                              val personalPool = ArrayList<SpaceItem>()
                              personalPool.addAll(memFavorites)
                              personalPool.addAll(memOfflineTracks)
                              val takeCount = if (activeWaveMood == WaveMood.FAMILIAR) 8 else 3
                              rawCandidates.addAll(personalPool.shuffled().take(takeCount))
                          }
          
                          if (activeWaveMood == WaveMood.ENERGETIC || rawCandidates.size < 12) {
                              val randomPage = Random.nextInt(1, 5)
                              val topUrl = if (randomPage == 1) onlineRootUrl else "/music-online/top/p$randomPage/"
                              val topDoc = fetchDocFast(topUrl) ?: fetchDocFast(onlineRootUrl)
                              if (topDoc != null) {
                                  val topTracks = parseMusicOnlineDoc(topDoc, TabMode.ONLINE, topUrl)
                                      .filter { it.type == ItemType.TRACK && !it.isFolder }
                                  rawCandidates.addAll(topTracks.shuffled().take(10))
                              }
                          }
                      }
          
                      val uniqueCandidates = ArrayList<SpaceItem>()
                      val batchSeenFps = HashSet<String>()
          
                      for (c in rawCandidates) {
                          if (c.type != ItemType.TRACK || c.isFolder) continue
                          if (existingIds.contains(c.idKey)) continue
                          if (wavePlayedKeys.contains(c.idKey)) continue
          
                          val fp = buildTrackFingerprint(c)
                          val coreFp = buildCoreTrackFingerprint(c)
                          if (existingFps.contains(fp) || existingFps.contains(coreFp)) continue
                          if (wavePlayedFingerprints.contains(fp) || wavePlayedFingerprints.contains(coreFp)) continue
                          if (waveDislikedFingerprints.contains(fp) || waveDislikedFingerprints.contains(coreFp)) continue
                          if (!batchSeenFps.add(fp) || !batchSeenFps.add(coreFp)) continue
          
                          val normArt = normalizePrimaryArtist(c)
                          if (normArt.isNotEmpty()) {
                              if (waveDislikedArtists.contains(normArt)) continue
                              if ((waveSkippedArtists[normArt] ?: 0) >= 2 && normArt != seedNormArtist) continue
                          }
          
                          if (activeWaveMood == WaveMood.DISCOVERY) {
                              if (memFavoriteKeys.contains(c.idKey)) continue
                              if (memOfflineTracks.any { it.idKey == c.idKey }) continue
                          }
          
                          uniqueCandidates.add(c)
                      }
          
                      if (uniqueCandidates.size < 12) {
                          for (c in rawCandidates.shuffled()) {
                              if (c.type != ItemType.TRACK || c.isFolder) continue
                              if (existingIds.contains(c.idKey)) continue
                              val fp = buildTrackFingerprint(c)
                              val coreFp = buildCoreTrackFingerprint(c)
                              if (existingFps.contains(fp) || existingFps.contains(coreFp)) continue
                              if (waveDislikedFingerprints.contains(fp) || waveDislikedFingerprints.contains(coreFp)) continue
                              if (batchSeenFps.add(fp) && batchSeenFps.add(coreFp)) {
                                  uniqueCandidates.add(c)
                                  if (uniqueCandidates.size >= 24) break
                              }
                          }
                      }
          
                      val byArtist = LinkedHashMap<String, MutableList<SpaceItem>>()
                      for (c in uniqueCandidates.shuffled()) {
                          val artKey = normalizePrimaryArtist(c).ifEmpty { "unknown_${c.idKey}" }
                          val list = byArtist.getOrPut(artKey) { ArrayList() }
                          list.add(c)
                      }
          
                      val targetBatchSize = 22
                      val maxSeedArtistInBatch = 3
                      val maxOtherArtistInBatch = 3
                      val artistCountInBatch = HashMap<String, Int>()
                      val recentArtistsWindow = ArrayList<String>()
          
                      for (tailItem in playbackQueue.takeLast(2)) {
                          val a = normalizePrimaryArtist(tailItem)
                          if (a.isNotEmpty()) recentArtistsWindow.add(a)
                      }
          
                      val finalBatch = ArrayList<SpaceItem>()
                      var madeProgress = true
                      while (finalBatch.size < targetBatchSize && madeProgress) {
                          madeProgress = false
                          val artistKeys = byArtist.keys.toList().shuffled().sortedBy { if (it == seedNormArtist) 1 else 0 }
                          for (artKey in artistKeys) {
                              val bucket = byArtist[artKey] ?: continue
                              if (bucket.isEmpty()) continue
          
                              val currentCount = artistCountInBatch[artKey] ?: 0
                              val maxAllowed = if (seedNormArtist.isNotEmpty() && artKey == seedNormArtist) maxSeedArtistInBatch else maxOtherArtistInBatch
                              if (currentCount >= maxAllowed) continue
          
                              if (recentArtistsWindow.takeLast(2).contains(artKey) && byArtist.count { it.value.isNotEmpty() } > 2) {
                                  continue
                              }
          
                              val picked = bucket.removeAt(0)
                              finalBatch.add(picked)
                              artistCountInBatch[artKey] = currentCount + 1
                              recentArtistsWindow.add(artKey)
                              madeProgress = true
                              if (finalBatch.size >= targetBatchSize) break
                          }
                      }
          
                      if (finalBatch.size < 18) {
                          for ((artKey, bucket) in byArtist) {
                              while (bucket.isNotEmpty() && finalBatch.size < 18) {
                                  val lastArt = finalBatch.lastOrNull()?.let { normalizePrimaryArtist(it) } ?: ""
                                  if (artKey == lastArt && byArtist.size > 1) break
                                  val currentCount = artistCountInBatch[artKey] ?: 0
                                  val maxAllowed = if (seedNormArtist.isNotEmpty() && artKey == seedNormArtist) maxSeedArtistInBatch + 1 else maxOtherArtistInBatch + 1
                                  if (currentCount >= maxAllowed) break
                                  finalBatch.add(bucket.removeAt(0))
                                  artistCountInBatch[artKey] = currentCount + 1
                              }
                          }
                      }
          
                      finalBatch
                  }
              }
          
