              // ==================== ТОЧНЫЕ СЧЁТЧИКИ И ССЫЛКИ «ВСЕ» С САЙТА (T=28, T=29, T=30) ====================

          

              private fun extractSectionMeta(doc: Document, currentUrl: String, searchQuery: String, fallbackMeta: SectionMeta): SectionMeta {

                  val meta = SectionMeta(

                      tracksCount = fallbackMeta.tracksCount,

                      tracksAllUrl = fallbackMeta.tracksAllUrl,

                      artistsCount = fallbackMeta.artistsCount,

                      artistsAllUrl = fallbackMeta.artistsAllUrl,

                      albumsCount = fallbackMeta.albumsCount,

                      albumsAllUrl = fallbackMeta.albumsAllUrl

                  )

          

                  // 1. Парсим блоки заголовков <div class="b-title__item"> (как на сайте: h6.span + span.cnt_title + a.b-title_all)

                  for (titleBlock in doc.select("div.b-title__item, div.b-title")) {

                      val h6 = titleBlock.selectFirst("h6.span, h6, .span")?.text()?.lowercase()?.trim() ?: continue

                      val cntRaw = titleBlock.selectFirst("span.cnt_title, span.js-cnt, span.cnt")?.text()?.replace(Regex("[^0-9]"), "") ?: ""

                      val cnt = cntRaw.toIntOrNull() ?: 0

                      val allLinkEl = titleBlock.selectFirst("a.b-title_all[href], a.b-title__all[href], a.b-title__sublink[href], a[href]")

                      val allUrl = if (allLinkEl != null) allLinkEl.absUrl("href").ifEmpty { toAbsoluteUrl(allLinkEl.attr("href")) } else ""

          

                      when {

                          h6.contains("композиц") || h6.contains("трек") || h6.contains("песн") -> {

                              if (cnt > 0) meta.tracksCount = cnt

                              if (allUrl.isNotEmpty()) meta.tracksAllUrl = allUrl

                          }

                          h6.contains("исполнит") || h6.contains("артист") -> {

                              if (cnt > 0) meta.artistsCount = cnt

                              if (allUrl.isNotEmpty()) meta.artistsAllUrl = allUrl

                          }

                          h6.contains("альбом") -> {

                              if (cnt > 0) meta.albumsCount = cnt

                              if (allUrl.isNotEmpty()) meta.albumsAllUrl = allUrl

                          }

                      }

                  }

          

                  // 2. Проверяем нижние кнопки «Показать все» (a.list-link-blue)

                  for (blueLink in doc.select("a.list-link-blue[href], a.b-title_all[href], a.b-title__sublink[href]")) {

                      val href = blueLink.absUrl("href").ifEmpty { toAbsoluteUrl(blueLink.attr("href")) }

                      if (href.isEmpty()) continue

                      when {

                          href.contains("T=28") || href.endsWith("/tracks") || href.endsWith("/tracks/") -> {

                              if (meta.tracksAllUrl.isEmpty()) meta.tracksAllUrl = href

                          }

                          href.contains("T=29") || href.endsWith("/similar") || href.endsWith("/similar/") -> {

                              if (meta.artistsAllUrl.isEmpty()) meta.artistsAllUrl = href

                          }

                          href.contains("T=30") || href.endsWith("/albums") || href.endsWith("/albums/") -> {

                              if (meta.albumsAllUrl.isEmpty()) meta.albumsAllUrl = href

                          }

                      }

                  }

          

                  // 3. Для поисковых страниц гарантируем точные ссылки T=28 (Композиции), T=29 (Исполнители), T=30 (Альбомы)

                  val q = searchQuery.ifEmpty {

                      try { Uri.parse(currentUrl).getQueryParameter("sq") ?: Uri.parse(currentUrl).getQueryParameter("Sq") ?: "" } catch (_: Exception) { "" }

                  }

                  if (q.isNotEmpty()) {

                      val linkId = try { Uri.parse(currentUrl).getQueryParameter("Link_id") ?: "1039269" } catch (_: Exception) { "1039269" }

                      val enc = try { URLEncoder.encode(q, "UTF-8") } catch (_: Exception) { q }

                      if (meta.tracksAllUrl.isEmpty()) {

                          meta.tracksAllUrl = "$baseHost/music-online/search/index/?Link_id=$linkId&T=28&sq=$enc"

                      }

                      if (meta.artistsAllUrl.isEmpty()) {

                          meta.artistsAllUrl = "$baseHost/music-online/search/index/?Link_id=$linkId&T=29&sq=$enc"

                      }

                      if (meta.albumsAllUrl.isEmpty()) {

                          meta.albumsAllUrl = "$baseHost/music-online/search/index/?Link_id=$linkId&T=30&sq=$enc"

                      }

                  }

          

                  // 4. Для страницы исполнителя гарантируем ссылки /tracks/ и /albums/

                  val cleanPath = try { Uri.parse(currentUrl).path?.trimEnd('/') ?: "" } catch (_: Exception) { "" }

                  if (cleanPath.contains("/artist/")) {

                      val baseArtist = currentUrl.substringBefore("?").trimEnd('/')

                          .removeSuffix("/tracks").removeSuffix("/albums").removeSuffix("/similar")

                      if (meta.tracksAllUrl.isEmpty()) meta.tracksAllUrl = "$baseArtist/tracks/"

                      if (meta.albumsAllUrl.isEmpty()) meta.albumsAllUrl = "$baseArtist/albums/"

                  }

          

                  return meta

              }

          

              private fun shouldShowSubFilters(): Boolean {

                  val path = try { Uri.parse(currentEntry.url).path ?: "" } catch (_: Exception) { "" }

                  return currentEntry.tabMode == TabMode.SEARCH ||

                          currentEntry.tabMode == TabMode.SEARCH_SUBPAGE ||

                          path.contains("/search/") ||

                          path.contains("/artist/")

              }

          

              private fun updateSubFilterVisibilityAndCounts() {

                  if (!shouldShowSubFilters()) {

                      subFilterScroll.visibility = View.GONE

                      return

                  }

          

                  val loadedTracks = allParsedItems.count { it.type == ItemType.TRACK }

                  val loadedArtists = allParsedItems.count { it.type == ItemType.ARTIST }

                  val loadedAlbums = allParsedItems.count { it.type == ItemType.ALBUM }

          

                  val tCount = if (currentSectionMeta.tracksCount > 0) currentSectionMeta.tracksCount else loadedTracks

                  val aCount = if (currentSectionMeta.artistsCount > 0) currentSectionMeta.artistsCount else loadedArtists

                  val albCount = if (currentSectionMeta.albumsCount > 0) currentSectionMeta.albumsCount else loadedAlbums

                  val total = tCount + aCount + albCount

          

                  subFilterScroll.visibility = View.VISIBLE

                  val isArtistPage = currentEntry.url.contains("/artist/") && currentEntry.searchQuery.isEmpty()

          

                  filterAll.text = if (isArtistPage) "Обзор артиста" else "Обзор ($total)"

                  filterTracks.text = "♪ Композиции: ВСЕ ($tCount)"

                  filterArtists.text = "👤 Исполнители: ВСЕ ($aCount)"

                  filterAlbums.text = "💿 Альбомы: ВСЕ ($albCount)"

          

                  filterTracks.visibility = if (tCount > 0 || currentSectionMeta.tracksAllUrl.isNotEmpty()) View.VISIBLE else View.GONE

                  filterArtists.visibility = if (!isArtistPage && (aCount > 0 || currentSectionMeta.artistsAllUrl.isNotEmpty())) View.VISIBLE else View.GONE

                  filterAlbums.visibility = if (albCount > 0 || currentSectionMeta.albumsAllUrl.isNotEmpty()) View.VISIBLE else View.GONE

              }

          

              private fun openSubFilterPage(target: SubFilter) {

                  val q = currentEntry.searchQuery

                  val meta = currentSectionMeta

          

                  when (target) {

                      SubFilter.ALL -> {

                          if (q.isNotEmpty()) {

                              performMusicOnlineSearch(q, addToHistory = false)

                          } else if (currentEntry.url.contains("/artist/")) {

                              val baseArtist = currentEntry.url.substringBefore("?").trimEnd('/')

                                  .removeSuffix("/tracks").removeSuffix("/albums").removeSuffix("/similar")

                              loadSection(baseArtist, TabMode.ARTISTS, currentEntry.titleHint.substringBefore(" •"), addToHistory = false)

                          } else {

                              highlightSubFilter(SubFilter.ALL)

                              rebuildDisplayedItems()

                          }

                      }

                      SubFilter.TRACKS -> {

                          val url = meta.tracksAllUrl

                          val cnt = if (meta.tracksCount > 0) " (${meta.tracksCount})" else ""

                          if (url.isNotEmpty()) {

                              val label = if (q.isNotEmpty()) "Композиции: $q$cnt" else "${currentEntry.titleHint.substringBefore(" •")} • Все композиции$cnt"

                              loadSubFilterUrl(url, SubFilter.TRACKS, label)

                          } else {

                              highlightSubFilter(SubFilter.TRACKS)

                              rebuildDisplayedItems()

                          }

                      }

                      SubFilter.ARTISTS -> {

                          val url = meta.artistsAllUrl

                          val cnt = if (meta.artistsCount > 0) " (${meta.artistsCount})" else ""

                          if (url.isNotEmpty()) {

                              val label = if (q.isNotEmpty()) "Исполнители: $q$cnt" else "Исполнители$cnt"

                              loadSubFilterUrl(url, SubFilter.ARTISTS, label)

                          } else {

                              highlightSubFilter(SubFilter.ARTISTS)

                              rebuildDisplayedItems()

                          }

                      }

                      SubFilter.ALBUMS -> {

                          val url = meta.albumsAllUrl

                          val cnt = if (meta.albumsCount > 0) " (${meta.albumsCount})" else ""

                          if (url.isNotEmpty()) {

                              val label = if (q.isNotEmpty()) "Альбомы: $q$cnt" else "${currentEntry.titleHint.substringBefore(" •")} • Все альбомы$cnt"

                              loadSubFilterUrl(url, SubFilter.ALBUMS, label)

                          } else {

                              highlightSubFilter(SubFilter.ALBUMS)

                              rebuildDisplayedItems()

                          }

                      }

                  }

              }

          

              private fun loadSubFilterUrl(targetUrl: String, filter: SubFilter, title: String) {

                  loadJob?.cancel()

                  val fullTarget = toAbsoluteUrl(targetUrl)

                  if (currentEntry.url.isNotEmpty() && currentEntry.url != fullTarget) {

                      saveCurrentScrollPosition()

                      navHistory.push(currentEntry.copy())

                  }

                  val parentQuery = currentEntry.searchQuery

                  val preservedMeta = currentSectionMeta.copy()

          

                  currentEntry = NavEntry(

                      url = fullTarget,

                      tabMode = TabMode.SEARCH_SUBPAGE,

                      titleHint = title,

                      bottomTab = activeBottomTab,

                      searchQuery = parentQuery,

                      subFilter = filter,

                      sectionMeta = preservedMeta

                  )

                  highlightSubFilter(filter)

                  updateMirrorBadge()

          

                  val cached = pageCache.get(fullTarget)

                  if (cached != null) {

                      progressBar.visibility = View.GONE

                      nextPageUrl = cached.nextPageUrl

                      allParsedItems.clear()

                      seenKeys.clear()

                      for (i in cached.items) {

                          if (seenKeys.add(i.idKey)) allParsedItems.add(i)

                      }

                      updateSubFilterVisibilityAndCounts()

                      rebuildDisplayedItems()

                      rvTracks.scrollToPosition(0)

                      return

                  }

          

                  val targetChip = when (filter) {

                      SubFilter.TRACKS -> filterTracks

                      SubFilter.ARTISTS -> filterArtists

                      SubFilter.ALBUMS -> filterAlbums

                      else -> filterAll

                  }

                  targetChip.text = "⏳ Загрузка..."

                  progressBar.visibility = View.VISIBLE

                  tvStatus.text = "Загрузка полного списка: $title..."

          

                  loadJob = uiScope.launch {

                      val (parsedList, resolvedNextUrl, updatedMeta) = withContext(Dispatchers.IO) {

                          val d = fetchDocFast(fullTarget)

                          if (d == null) return@withContext Triple<List<SpaceItem>?, String?, SectionMeta>(null, null, preservedMeta)

                          val finalUrl = d.location() ?: fullTarget

                          val next = findNextPageUrl(d, finalUrl)

                          val meta = extractSectionMeta(d, finalUrl, parentQuery, preservedMeta)

                          val modeForParse = when (filter) {

                              SubFilter.ARTISTS -> TabMode.ARTISTS

                              SubFilter.ALBUMS -> TabMode.SEARCH_SUBPAGE

                              else -> TabMode.SEARCH_SUBPAGE

                          }

                          val parsed = parseMusicOnlineDoc(d, modeForParse, finalUrl)

                          Triple(parsed, next, meta)

                      }

          

                      progressBar.visibility = View.GONE

                      currentSectionMeta = updatedMeta

                      updateSubFilterVisibilityAndCounts()

          

                      if (parsedList != null) {

                          nextPageUrl = resolvedNextUrl

                          pageCache.put(fullTarget, CachedPage(parsedList, resolvedNextUrl, updatedMeta))

                          allParsedItems.clear()

                          seenKeys.clear()

                          for (i in parsedList) {

                              if (seenKeys.add(i.idKey)) allParsedItems.add(i)

                          }

                          rebuildDisplayedItems()

                          rvTracks.scrollToPosition(0)

                      } else {

                          tvStatus.text = "Ошибка загрузки полного списка"

                      }

                  }

              }

          

              private fun rebuildDisplayedItems() {

                  val displayList = ArrayList<SpaceItem>()

          

                  val tracks = allParsedItems.filter { it.type == ItemType.TRACK }

                  val artists = allParsedItems.filter { it.type == ItemType.ARTIST }

                  val albums = allParsedItems.filter { it.type == ItemType.ALBUM }

                  val others = allParsedItems.filter { it.type != ItemType.ARTIST && it.type != ItemType.ALBUM && it.type != ItemType.TRACK }

          

                  val tTotal = if (currentSectionMeta.tracksCount > 0) currentSectionMeta.tracksCount else tracks.size

                  val aTotal = if (currentSectionMeta.artistsCount > 0) currentSectionMeta.artistsCount else artists.size

                  val albTotal = if (currentSectionMeta.albumsCount > 0) currentSectionMeta.albumsCount else albums.size

          

                  if (activeSubFilter == SubFilter.ALL && (currentEntry.tabMode == TabMode.SEARCH || (tracks.isNotEmpty() && (artists.isNotEmpty() || albums.isNotEmpty())))) {

                      // Строгий порядок разделов как на сайте: 1. КОМПОЗИЦИИ -> 2. ИСПОЛНИТЕЛИ -> 3. АЛЬБОМЫ

                      // С кликабельными кнопками «ВСЕ (N) ›» и «Показать все (N) ›» в каждом разделе!

                      if (tracks.isNotEmpty()) {

                          val hasMoreTracks = currentSectionMeta.tracksAllUrl.isNotEmpty()

                          displayList.add(

                              SpaceItem(

                                  idKey = "hdr_tracks_all",

                                  title = "КОМПОЗИЦИИ • На сайте: $tTotal",

                                  subtitle = if (hasMoreTracks) "Показано ${tracks.size} из $tTotal • Нажмите, чтобы открыть ВСЕ ($tTotal)" else "Найдено композиций: $tTotal",

                                  url = currentSectionMeta.tracksAllUrl,

                                  isFolder = hasMoreTracks,

                                  type = if (hasMoreTracks) ItemType.SECTION_ALL else ItemType.HEADER,

                                  badgeText = if (hasMoreTracks) "ВСЕ ($tTotal) ›" else "",

                                  targetFilter = SubFilter.TRACKS

                              )

                          )

                          displayList.addAll(tracks)

                          if (hasMoreTracks && tTotal > tracks.size) {

                              displayList.add(

                                  SpaceItem(

                                      idKey = "btn_more_tracks",

                                      title = "Показать все композиции ($tTotal) ›",

                                      subtitle = "Перейти к полному списку треков по запросу",

                                      url = currentSectionMeta.tracksAllUrl,

                                      isFolder = true,

                                      type = ItemType.SECTION_ALL,

                                      badgeText = "ВСЕ ›",

                                      targetFilter = SubFilter.TRACKS

                                  )

                              )

                          }

                      }

          

                      if (artists.isNotEmpty()) {

                          val hasMoreArtists = currentSectionMeta.artistsAllUrl.isNotEmpty()

                          displayList.add(

                              SpaceItem(

                                  idKey = "hdr_artists_all",

                                  title = "ИСПОЛНИТЕЛИ • На сайте: $aTotal",

                                  subtitle = if (hasMoreArtists) "Показано ${artists.size} из $aTotal • Нажмите, чтобы открыть ВСЕ ($aTotal)" else "Найдено исполнителей: $aTotal",

                                  url = currentSectionMeta.artistsAllUrl,

                                  isFolder = hasMoreArtists,

                                  type = if (hasMoreArtists) ItemType.SECTION_ALL else ItemType.HEADER,

                                  badgeText = if (hasMoreArtists) "ВСЕ ($aTotal) ›" else "",

                                  targetFilter = SubFilter.ARTISTS

                              )

                          )

                          displayList.addAll(artists)

                          if (hasMoreArtists && aTotal > artists.size) {

                              displayList.add(

                                  SpaceItem(

                                      idKey = "btn_more_artists",

                                      title = "Показать всех исполнителей ($aTotal) ›",

                                      subtitle = "Перейти к полному списку найденных артистов",

                                      url = currentSectionMeta.artistsAllUrl,

                                      isFolder = true,

                                      type = ItemType.SECTION_ALL,

                                      badgeText = "ВСЕ ›",

                                      targetFilter = SubFilter.ARTISTS

                                  )

                              )

                          }

                      }

          

                      if (albums.isNotEmpty()) {

                          val hasMoreAlbums = currentSectionMeta.albumsAllUrl.isNotEmpty()

                          displayList.add(

                              SpaceItem(

                                  idKey = "hdr_albums_all",

                                  title = "АЛЬБОМЫ • На сайте: $albTotal",

                                  subtitle = if (hasMoreAlbums) "Показано ${albums.size} из $albTotal • Нажмите, чтобы открыть ВСЕ ($albTotal)" else "Найдено альбомов: $albTotal",

                                  url = currentSectionMeta.albumsAllUrl,

                                  isFolder = hasMoreAlbums,

                                  type = if (hasMoreAlbums) ItemType.SECTION_ALL else ItemType.HEADER,

                                  badgeText = if (hasMoreAlbums) "ВСЕ ($albTotal) ›" else "",

                                  targetFilter = SubFilter.ALBUMS

                              )

                          )

                          displayList.addAll(albums)

                          if (hasMoreAlbums && albTotal > albums.size) {

                              displayList.add(

                                  SpaceItem(

                                      idKey = "btn_more_albums",

                                      title = "Показать все альбомы ($albTotal) ›",

                                      subtitle = "Перейти к полному списку найденных альбомов",

                                      url = currentSectionMeta.albumsAllUrl,

                                      isFolder = true,

                                      type = ItemType.SECTION_ALL,

                                      badgeText = "ВСЕ ›",

                                      targetFilter = SubFilter.ALBUMS

                                  )

                              )

                          }

                      }

          

                      displayList.addAll(others)

                  } else {

                      when (activeSubFilter) {

                          SubFilter.TRACKS -> displayList.addAll(if (tracks.isNotEmpty()) tracks else allParsedItems)

                          SubFilter.ARTISTS -> displayList.addAll(if (artists.isNotEmpty()) artists else allParsedItems)

                          SubFilter.ALBUMS -> displayList.addAll(if (albums.isNotEmpty()) albums else allParsedItems)

                          SubFilter.ALL -> displayList.addAll(allParsedItems)

                      }

                  }

          

                  // Если есть следующая страница пагинации, добавляем явную кнопку подгрузки внизу списка (помимо автоскролла)

                  val nxt = nextPageUrl

                  if (nxt != null && displayList.isNotEmpty()) {

                      displayList.add(

                          SpaceItem(

                              idKey = "btn_load_next_page_$nxt",

                              title = "Загрузить ещё результаты ›",

                              subtitle = "Подгрузить следующую страницу с сайта",

                              url = nxt,

                              isFolder = true,

                              type = ItemType.LOAD_MORE,

                              badgeText = "ЕЩЁ ›"

                          )

                      )

                  }

          

                  items.clear()

                  items.addAll(displayList)

                  syncSelectedIndex()

                  adapter.submitListAsync(ArrayList(items))

          

                  val statusParts = ArrayList<String>()

                  if (tracks.isNotEmpty() || tTotal > 0) statusParts.add("Композиции: ${tracks.size} из $tTotal")

                  if (artists.isNotEmpty() || aTotal > 0) statusParts.add("Исполнители: ${artists.size} из $aTotal")

                  if (albums.isNotEmpty() || albTotal > 0) statusParts.add("Альбомы: ${albums.size} из $albTotal")

                  if (others.isNotEmpty()) statusParts.add("Разделов: ${others.size}")

          

                  tvStatus.text = if (statusParts.isNotEmpty()) {

                      statusParts.joinToString(" • ")

                  } else {

                      "${currentEntry.titleHint} • Ничего не найдено"

                  }

              }

          

              private fun syncSelectedIndex() {

                  val cur = currentPlayingItem

                  if (cur == null) {

                      adapter.selectedIndex = -1

                      currentIndex = -1

                      return

                  }

                  val idx = items.indexOfFirst { !it.isFolder && it.idKey == cur.idKey }

                  adapter.selectedIndex = idx

                  if (idx >= 0) currentIndex = idx

              }

          

              // ==================== НАВИГАЦИЯ С КЭШЕМ И СОХРАНЕНИЕМ СКРОЛЛА ====================

          

              private fun saveCurrentScrollPosition() {

                  val firstPos = lm.findFirstVisibleItemPosition()

                  val firstView = lm.findViewByPosition(firstPos)

                  currentEntry.scrollPos = if (firstPos >= 0) firstPos else 0

                  currentEntry.scrollOffset = firstView?.top ?: 0

              }

          

              private fun loadSection(

                  urlOrPath: String,

                  mode: TabMode,

                  title: String,

                  addToHistory: Boolean,

                  restoreScrollPos: Int = 0,

                  restoreScrollOffset: Int = 0,

                  restoreSubFilter: SubFilter = SubFilter.ALL

              ) {

                  loadJob?.cancel()

                  val fullTarget = toAbsoluteUrl(urlOrPath)

                  if (addToHistory && currentEntry.url.isNotEmpty() && currentEntry.url != fullTarget) {

                      saveCurrentScrollPosition()

                      navHistory.push(currentEntry.copy())

                  }

                  currentSectionMeta = SectionMeta()

                  currentEntry = NavEntry(fullTarget, mode, title, activeBottomTab, "", restoreSubFilter, currentSectionMeta, restoreScrollPos, restoreScrollOffset)

                  highlightSubFilter(restoreSubFilter)

                  updateMirrorBadge()

          

                  val cached = pageCache.get(fullTarget)

                  if (cached != null) {

                      progressBar.visibility = View.GONE

                      nextPageUrl = cached.nextPageUrl

                      currentSectionMeta = cached.meta

                      allParsedItems.clear()

                      seenKeys.clear()

                      for (i in cached.items) {

                          if (seenKeys.add(i.idKey)) allParsedItems.add(i)

                      }

                      updateSubFilterVisibilityAndCounts()

                      rebuildDisplayedItems()

                      rvTracks.post { lm.scrollToPositionWithOffset(restoreScrollPos, restoreScrollOffset) }

                      return

                  }

          

                  progressBar.visibility = View.VISIBLE

                  tvStatus.text = "Загрузка: $title..."

          

                  loadJob = uiScope.launch {

                      val (parsedList, resolvedNextUrl, meta) = withContext(Dispatchers.IO) {

                          val d = fetchDocFast(fullTarget) ?: return@withContext Triple<List<SpaceItem>?, String?, SectionMeta>(null, null, SectionMeta())

                          val finalUrl = d.location() ?: fullTarget

                          val next = findNextPageUrl(d, finalUrl)

                          val m = extractSectionMeta(d, finalUrl, "", SectionMeta())

                          val parsed = parseMusicOnlineDoc(d, mode, finalUrl)

                          Triple(parsed, next, m)

                      }

          

                      progressBar.visibility = View.GONE

                      updateMirrorBadge()

          

                      if (parsedList != null) {

                          nextPageUrl = resolvedNextUrl

                          currentSectionMeta = meta

                          pageCache.put(fullTarget, CachedPage(parsedList, resolvedNextUrl, meta))

                          allParsedItems.clear()

                          seenKeys.clear()

                          for (i in parsedList) {

                              if (seenKeys.add(i.idKey)) allParsedItems.add(i)

                          }

                          updateSubFilterVisibilityAndCounts()

                          rebuildDisplayedItems()

                          rvTracks.post { lm.scrollToPositionWithOffset(restoreScrollPos, restoreScrollOffset) }

                      } else {

                          tvStatus.text = "Ошибка загрузки раздела (проверьте сеть или зеркало)"

                      }

                  }

              }

          

              private fun loadNextPage() {

                  val next = nextPageUrl ?: return

                  if (isLoadingMore) return

                  isLoadingMore = true

                  progressBar.visibility = View.VISIBLE

                  uiScope.launch {

                      val (doc, finalUrl) = withContext(Dispatchers.IO) {

                          val d = fetchDocFast(next)

                          Pair(d, d?.location() ?: next)

                      }

                      progressBar.visibility = View.GONE

                      isLoadingMore = false

                      if (doc != null) {

                          nextPageUrl = findNextPageUrl(doc, finalUrl)

                          val more = parseMusicOnlineDoc(doc, currentEntry.tabMode, finalUrl)

                          var added = 0

                          for (m in more) {

                              if (seenKeys.add(m.idKey)) {

                                  allParsedItems.add(m)

                                  added++

                              }

                          }

                          if (added > 0) {

                              pageCache.put(currentEntry.url, CachedPage(ArrayList(allParsedItems), nextPageUrl, currentSectionMeta))

                              updateSubFilterVisibilityAndCounts()

                              rebuildDisplayedItems()

                          }

                      } else {

                          nextPageUrl = null

                      }

                  }

              }

          

