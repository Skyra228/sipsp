              private fun loadSection(urlOrPath: String, tabMode: TabMode, titleHint: String, addToHistory: Boolean) {
                  loadJob?.cancel()
                  val fullTarget = toAbsoluteUrl(urlOrPath)
                  if (addToHistory && currentEntry.url.isNotEmpty() && currentEntry.url != fullTarget) {
                      navHistory.push(currentEntry)
                  }
                  currentEntry = NavEntry(fullTarget, tabMode, titleHint)
                  updateMirrorBadge()

                  progressBar.visibility = View.VISIBLE
                  tvStatus.text = "Загрузка: $titleHint..."

                  loadJob = uiScope.launch {
                      // 1. Для вкладки "Новые" и "Популярные" сначала синхронизируем свежие ссылки вкладок с /sz/muzyka/
                      val candidateUrls = ArrayList<String>()
                      candidateUrls.add(fullTarget)
                      when (tabMode) {
                          TabMode.POPULAR -> {
                              candidateUrls.add("$baseHost/sz/muzyka/top/")
                              candidateUrls.add("$baseHost/music/top/")
                          }
                          TabMode.NEW -> {
                              candidateUrls.add("$baseHost/sz/muzyka/new/")
                              candidateUrls.add("$baseHost/music/new/")
                              candidateUrls.add("$baseHost/sz/muzyka/?sort=date")
                              candidateUrls.add("$baseHost/sz/muzyka/?sort=new")
                          }
                          TabMode.ONLINE -> {
                              candidateUrls.add("$baseHost/music/")
                              candidateUrls.add("$baseHost/sz/muzyka/top/")
                          }
                          else -> {}
                      }

                      var parsedItems: List<SpaceItem> = emptyList()
                      var activeDoc: Document? = null

                      withContext(Dispatchers.IO) {
                          // Если открываем Новые впервые, подтянем точный URL вкладки с главной /sz/muzyka/
                          if (tabMode == TabMode.NEW || tabMode == TabMode.CATEGORIES) {
                              val rootSz = fetchDocFast("/sz/muzyka/")
                              if (rootSz != null) {
                                  syncTabUrlsFromDoc(rootSz)
                                  if (tabMode == TabMode.NEW && !candidateUrls.contains(newTabUrl)) {
                                      candidateUrls.add(0, toAbsoluteUrl(newTabUrl))
                                  }
                              }
                          }

                          for (u in candidateUrls.distinct()) {
                              val doc = fetchDocFast(u) ?: continue
                              syncTabUrlsFromDoc(doc)
                              val extracted = parseSpacesDocument(doc, tabMode)
                              if (extracted.isNotEmpty()) {
                                  parsedItems = extracted
                                  activeDoc = doc
                                  break
                              }
                          }
                      }

                      // 2. Если быстрый OkHttp не увидел элементы из-за JS, пробуем через живой DOM WebView
                      if (parsedItems.isEmpty() && tabMode != TabMode.CATEGORIES) {
                          val webDoc = fetchDocViaWebView(candidateUrls.first())
                          if (webDoc != null) {
                              syncTabUrlsFromDoc(webDoc)
                              parsedItems = parseSpacesDocument(webDoc, tabMode)
                              activeDoc = webDoc
                          }
                      }

                      // 3. Для вкладки "Жанры и категории" объединяем спарсенные папки с полным каталогом жанров Spaces
                      if (tabMode == TabMode.CATEGORIES) {
                          val combined = ArrayList<SpaceItem>()
                          val seenPaths = HashSet<String>()
                          for (f in parsedItems.filter { it.isFolder }) {
                              val p = Uri.parse(f.url).path?.lowercase() ?: f.url
                              if (seenPaths.add(p)) combined.add(f)
                          }
                          for (b in getBuiltinSpacesCategories()) {
                              val p = Uri.parse(b.url).path?.lowercase() ?: b.url
                              if (seenPaths.add(p)) combined.add(b)
                          }
                          parsedItems = combined
                      }

                      // 4. Если папка жанра на Spaces пуста, автоматически подгружаем треки этого жанра через гибридный поиск
                      if (parsedItems.isEmpty() && (tabMode == TabMode.FOLDER_VIEW || tabMode == TabMode.NEW)) {
                          val fallbackQuery = if (tabMode == TabMode.NEW) "Новинки 2026" else titleHint
                          val fallbackTracks = withContext(Dispatchers.IO) { fetchDirectMp3Search(fallbackQuery) }
                          parsedItems = fallbackTracks
                      }

                      progressBar.visibility = View.GONE
                      updateMirrorBadge()

                      nextPageUrl = if (tabMode == TabMode.CATEGORIES || activeDoc == null) null else findNextPageUrl(activeDoc!!)

                      items.clear()
                      seenKeys.clear()
                      for (it in parsedItems) {
                          if (seenKeys.add(it.idKey)) items.add(it)
                      }
                      adapter.notifyDataSetChanged()

                      val tracksCount = items.count { !it.isFolder }
                      val foldersCount = items.count { it.isFolder }
                      tvStatus.text = when {
                          tracksCount > 0 && nextPageUrl != null -> "$titleHint • Треков: $tracksCount (листайте вниз для автоподгрузки)"
                          tracksCount > 0 -> "$titleHint • Треков: $tracksCount"
                          foldersCount > 0 -> "Категории музыки Spaces: $foldersCount — выберите жанр"
                          else -> "Раздел пуст"
                      }
                  }
              }

              private fun loadNextPage() {
                  val nextUrl = nextPageUrl ?: return
                  isLoadingMore = true
                  progressBar.visibility = View.VISIBLE

                  uiScope.launch {
                      val doc = withContext(Dispatchers.IO) { fetchDocFast(nextUrl) }
                      progressBar.visibility = View.GONE
                      isLoadingMore = false
                      if (doc != null) {
                          nextPageUrl = findNextPageUrl(doc)
                          val more = parseSpacesDocument(doc, currentEntry.tabMode)
                          var added = 0
                          for (m in more) {
                              if (seenKeys.add(m.idKey)) {
                                  items.add(m)
                                  added++
                              }
                          }
                          if (added > 0) {
                              adapter.notifyDataSetChanged()
                              tvStatus.text = "${currentEntry.titleHint} • Треков: ${items.count { !it.isFolder }}"
                          }
                      }
                  }
              }

              // ================= ТОЧНЫЙ ПАРСЕР SPACES v7.0 (НЕ УДАЛЯЕТ .menu / #navi!) =================

              private fun parseSpacesDocument(doc: Document, tabMode: TabMode): List<SpaceItem> {
                  val tracksFound = ArrayList<SpaceItem>()
                  val foldersFound = ArrayList<SpaceItem>()
                  val localTrackIds = HashSet<String>()
                  val localFolderPaths = HashSet<String>()

                  for (el in doc.select("a[href]")) {
                      val rawHref = el.attr("href").trim()
                      if (rawHref.isEmpty() || rawHref.startsWith("#") || rawHref.startsWith("javascript")) continue

                      val absHref = el.absUrl("href").ifEmpty { toAbsoluteUrl(rawHref) }
                      val lowHref = absHref.lowercase()

                      if (isSystemNoiseUrl(lowHref)) continue

                      val linkText = el.text().trim()
                      val rowContainer = el.parents().firstOrNull {
                          it.hasClass("main_item") || it.hasClass("f-item") || it.hasClass("list-link") ||
                                  it.hasClass("m-item") || it.hasClass("__adv_list_track") || it.tagName() == "li" || it.tagName() == "tr"
                      }
                      val fullRowText = rowContainer?.text()?.trim() ?: el.parent()?.text()?.trim() ?: linkText

                      if (isInterfaceGarbageText(linkText)) continue

                      // 1. ОПРЕДЕЛЯЕМ ТРЕКИ (Популярные, Новые, Музыка онлайн, Внутри категории)
                      val isTrackView = lowHref.contains("/music/view/") ||
                              lowHref.contains("/files/view/") ||
                              lowHref.contains("/file/view/") ||
                              lowHref.contains("/sz/view/") ||
                              (lowHref.contains("/sz/") && (lowHref.contains("/view/") || lowHref.contains("file_id") || lowHref.contains("fid="))) ||
                              lowHref.contains(".mp3") ||
                              lowHref.contains("/music/download/") ||
                              lowHref.contains("/files/download/")

                      if (isTrackView && tabMode != TabMode.CATEGORIES) {
                          var candidateName = if (hasLetters(linkText) && !isGenericButtonWord(linkText)) linkText else fullRowText
                          candidateName = cleanTrackTitle(candidateName)

                          // Обязательно минимум 2 буквы (отсекает ":56" и таймкоды)
                          if (!hasLetters(candidateName) || isInterfaceGarbageText(candidateName)) continue

                          val trackKey = extractUniqueTrackKey(absHref)
                          if (!localTrackIds.add(trackKey)) continue

                          var directMp3 = if (isDirectAudioFileUrl(lowHref)) absHref else ""
                          if (directMp3.isEmpty() && rowContainer != null) {
                              val dl = rowContainer.selectFirst("a[href*=.mp3], a[href*=/download/], audio[src], source[src], [data-mp3], [data-src]")
                              if (dl != null) {
                                  directMp3 = dl.absUrl("href").ifEmpty { dl.absUrl("src") }.ifEmpty { dl.attr("data-mp3") }
                              }
                          }

                          val parts = candidateName.split(" - ", " – ", " — ", limit = 2)
                          val artist = if (parts.size > 1) parts[0].trim() else "Spaces Музыка"
                          val title = if (parts.size > 1) parts[1].trim() else candidateName

                          if (!hasLetters(title)) continue

                          tracksFound.add(
                              SpaceItem(
                                  idKey = "sp_track_$trackKey",
                                  title = title.take(85),
                                  subtitle = artist.take(60),
                                  url = absHref,
                                  isFolder = false,
                                  directMp3 = directMp3
                              )
                          )
                          continue
                      }

                      // 2. ОПРЕДЕЛЯЕМ ПАПКИ ЖАНРОВ И ПОДКАТЕГОРИЙ (/sz/russkij_pop/, /sz/muzyka/... и т.д.)
                      if (tabMode == TabMode.CATEGORIES || tabMode == TabMode.FOLDER_VIEW) {
                          val pathOnly = Uri.parse(absHref).path?.lowercase()?.trimEnd('/') ?: ""
                          // Отсекаем ссылки на корень /sz и саму страницу /sz/muzyka (именно они давали "Тема: Системная", "Назад", "Ещё")
                          if (pathOnly.isEmpty() || pathOnly == "/sz" || pathOnly == "/sz/muzyka" || pathOnly == "/music") continue
                          if (pathOnly.endsWith("/top") || pathOnly.endsWith("/new") || pathOnly.contains("/search")) continue

                          val isMusicOrSzFolder = pathOnly.startsWith("/sz/") || pathOnly.startsWith("/music/")
                          val hasPaginationOrSetting = lowHref.contains("p=") || lowHref.contains("page=") ||
                                  lowHref.contains("sort=") || lowHref.contains("theme=") || lowHref.contains("writed=")

                          if (isMusicOrSzFolder && !hasPaginationOrSetting && hasLetters(linkText) && linkText.length in 3..55) {
                              if (isInterfaceGarbageText(fullRowText)) continue

                              val countMatch = Regex("""(\d+[\s\d]*(?:тыс|млн))""", RegexOption.IGNORE_CASE).find(fullRowText)
                              val countBadge = countMatch?.value ?: ""

                              val cleanGenreName = linkText
                                  .replace(Regex("""\d+[\s\d]*(?:тыс|млн).*$""", RegexOption.IGNORE_CASE), "")
                                  .trim()

                              if (!hasLetters(cleanGenreName) || isInterfaceGarbageText(cleanGenreName)) continue

                              if (localFolderPaths.add(pathOnly)) {
                                  val sub = if (countBadge.isNotEmpty()) "Жанр • $countBadge треков" else "Раздел музыки Spaces"
                                  foldersFound.add(
                                      SpaceItem(
                                          idKey = "sp_folder_$pathOnly",
                                          title = cleanGenreName,
                                          subtitle = sub,
                                          url = absHref,
                                          isFolder = true
                                      )
                                  )
                              }
                          }
                      }
                  }

                  return when (tabMode) {
                      TabMode.CATEGORIES -> foldersFound
                      TabMode.FOLDER_VIEW -> if (tracksFound.isNotEmpty()) tracksFound else foldersFound
                      else -> tracksFound
                  }
              }

              // ================= ТРЁХПОТОЧНЫЙ ГИБРИДНЫЙ ПОИСК (Spaces + Жанры + Прямой MP3 индекс) =================

              private fun performHybridSearch(query: String) {
                  loadJob?.cancel()
                  progressBar.visibility = View.VISIBLE
                  tvStatus.text = "Поиск «$query»..."

                  loadJob = uiScope.launch {
                      val combinedResults = withContext(Dispatchers.IO) {
                          val results = ArrayList<SpaceItem>()
                          val encoded = URLEncoder.encode(query, "UTF-8")
                          val lowQ = query.lowercase().trim()

                          // Поток 1: Если запрос совпадает с жанром Spaces ("рок", "поп", "рэп", "шансон", "house", "dubstep")
                          val matchedGenres = getBuiltinSpacesCategories().filter {
                              val t = it.title.lowercase()
                              t.contains(lowQ) ||
                                      (lowQ == "рок" && t.contains("rock")) ||
                                      (lowQ == "поп" && t.contains("pop")) ||
                                      ((lowQ == "рэп" || lowQ == "реп") && t.contains("rap"))
                          }
                          for (g in matchedGenres.take(2)) {
                              val doc = fetchDocFast(g.url) ?: continue
                              val tracks = parseSpacesDocument(doc, TabMode.POPULAR)
                              results.addAll(tracks)
                          }

                          // Поток 2: Поисковые маршруты Spaces
                          val spacesSearchRoutes = listOf(
                              "/music/search/?q=$encoded",
                              "/music/search/?word=$encoded",
                              "/sz/search/?q=$encoded&T=6",
                              "/mysite/find/?search=$encoded&type=26"
                          )
                          for (route in spacesSearchRoutes) {
                              val doc = fetchDocFast(route) ?: continue
                              val tracks = parseSpacesDocument(doc, TabMode.SEARCH)
                              if (tracks.isNotEmpty()) {
                                  results.addAll(tracks)
                                  break
                              }
                          }

                          // Поток 3: Быстрый прямой MP3-индекс (гарантирует десятки рабочих треков с прямыми .mp3 по любому запросу)
                          val directTracks = fetchDirectMp3Search(query)
                          results.addAll(directTracks)

                          results
                      }

                      progressBar.visibility = View.GONE
                      nextPageUrl = null
                      updateMirrorBadge()

                      items.clear()
                      seenKeys.clear()
                      for (t in combinedResults) {
                          if (seenKeys.add(t.idKey)) items.add(t)
                      }
                      adapter.notifyDataSetChanged()

                      if (items.isNotEmpty()) {
                          tvStatus.text = "Найдено треков по запросу «$query»: ${items.size}"
                      } else {
                          tvStatus.text = "По запросу «$query» ничего не найдено"
                      }
                  }
              }

              // Быстрый парсер прямых MP3 потоков для мгновенного поиска любых песен и артистов
              private fun fetchDirectMp3Search(query: String): List<SpaceItem> {
                  val list = ArrayList<SpaceItem>()
                  val encoded = URLEncoder.encode(query, "UTF-8")
                  val searchMirrors = listOf(
                      "https://ruv.hotmo.org/search?q=$encoded",
                      "https://rus.hitmotop.com/search?q=$encoded"
                  )
                  for (url in searchMirrors) {
                      try {
                          val req = Request.Builder()
                              .url(url)
                              .header("User-Agent", MusicEngine.USER_AGENT)
                              .build()
                          httpClient.newCall(req).execute().use { resp ->
                              if (!resp.isSuccessful) return@use
                              val html = resp.body?.string() ?: return@use
                              val doc = Jsoup.parse(html, url)
                              for (itemEl in doc.select("li.tracks__item, .track__info, [data-musmeta]")) {
                                  val dlBtn = itemEl.selectFirst("a.track__download-btn, a[href$=.mp3]") ?: continue
                                  val mp3 = dlBtn.absUrl("href")
                                  if (mp3.isEmpty()) continue

                                  val title = itemEl.selectFirst(".track__title")?.text()?.trim() ?: continue
                                  val artist = itemEl.selectFirst(".track__desc")?.text()?.trim() ?: "Музыка"
                                  val dur = itemEl.selectFirst(".track__fulltime")?.text()?.trim() ?: ""
                                  val sub = if (dur.isNotEmpty()) "$artist • $dur" else artist

                                  list.add(
                                      SpaceItem(
                                          idKey = "direct_${mp3.substringBefore("?")}",
                                          title = title,
                                          subtitle = sub,
                                          url = mp3,
                                          isFolder = false,
                                          directMp3 = mp3
                                      )
                                  )
                                  if (list.size >= 40) break
                              }
                          }
                          if (list.isNotEmpty()) break
                      } catch (_: Exception) {}
                  }
                  return list
              }

              // ================= ФИЛЬТРЫ МУСОРА И СЛУЖЕБНЫХ СЛОВ =================

              private fun extractUniqueTrackKey(url: String): String {
                  val viewId = Regex("""/(?:view|download|file)/[^/?#]*?(\d{4,})""").find(url)?.groupValues?.get(1)
                  if (viewId != null) return viewId
                  val paramId = Regex("""(?:file_id|fid|id)=(\d{4,})""").find(url)?.groupValues?.get(1)
                  if (paramId != null) return paramId
                  return url.substringBefore("?").substringBefore("#")
              }

              private fun hasLetters(text: String): Boolean {
                  return Regex("[a-zA-Zа-яА-ЯёЁ]{2,}").containsMatchIn(text)
              }

              private fun isSystemNoiseUrl(lowHref: String): Boolean {
                  val badTokens = listOf(
                      "/registration", "/login", "/auth", "/restore", "/anketa", "/diary",
                      "/forums", "/comm/", "/chat/", "/games", "/neo/", "/help", "/rules", "/settings",
                      "/ads", "/pictures/", "/video/", "/adult/", "theme=", "writed=", "translit",
                      "block_files", "/app/", "/support", "/user/", "/users/", "/blogs", "/kino"
                  )
                  return badTokens.any { lowHref.contains(it) }
              }

              private fun isGenericButtonWord(text: String): Boolean {
                  val low = text.lowercase().trim()
                  return low in listOf("скачать", "слушать", "играть", "подробнее", "файл", "mp3", "аудио")
              }

              private fun isInterfaceGarbageText(text: String): Boolean {
                  val low = text.lowercase().trim()
                  if (low.isEmpty()) return true

                  val exactGarbage = setOf(
                      "назад", "вперед", "вперёд", "ещё", "еще", "далее", "показать ещё",
                      "категории", "популярные", "новые", "музыка", "зона обмена", "музыка онлайн",
                      "главная", "вход", "войти", "регистрация", "поиск", "найти", "меню",
                      "разделы сайта", "настройка", "правила", "помощь", "реклама", "о сайте",
                      "полная версия", "мобильная версия", "выход", "жалоба", "поделиться",
                      "ai hub", "фильмы и сериалы", "знакомства", "блоги", "сообщества", "форум", "чат", "игры", "люди"
                  )
                  if (low in exactGarbage) return true

                  val substrGarbage = listOf(
                      "тема:", "тема :", "безопасный режим", "транслит", "блокировать фа",
                      "не можете войти", "мини игры", "шашки, шахматы", "поиск по сайту"
                  )
                  return substrGarbage.any { low.contains(it) }
              }

              private fun cleanTrackTitle(raw: String): String {
                  return raw
                      .replace(Regex("\\.mp3\\b", RegexOption.IGNORE_CASE), "")
                      .replace(Regex("\\b\\d+(\\.\\d+)?\\s*(Мб|Кб|Гб|MB|KB|mb|kb)\\b"), "")
                      .replace(Regex("\\b\\d{1,2}:\\d{2}\\b"), "")
                      .replace(Regex("(?<!\\d):\\d{2}\\b"), "")
                      .replace(Regex("\\b\\d+\\s*kbps\\b", RegexOption.IGNORE_CASE), "")
                      .replace(Regex("(?i)\\b(скачать|слушать|онлайн|бесплатно|аудиозапись)\\b"), "")
                      .replace(Regex("^[\\s:\\-–—•\\d.]+"), "")
                      .replace(Regex("\\s+"), " ")
                      .trim()
              }

              private fun findNextPageUrl(doc: Document): String? {
                  val pagLinks = doc.select("a.pg_next, a.next, .pgn a[href], .pagination a[href], a[href*=P=], a[href*=p=]")
                  for (a in pagLinks) {
                      val t = a.text().trim().lowercase()
                      if (t.contains("вперед") || t.contains("вперёд") || t.contains("след") || t == "»" || t == ">") {
                          val h = a.absUrl("href")
                          if (h.isNotEmpty() && h != currentEntry.url) return h
                      }
                  }
                  return null
              }

              // ================= ВОСПРОИЗВЕДЕНИЕ И ИЗВЛЕЧЕНИЕ MP3 ПОТОКА =================

              private fun onItemClicked(position: Int) {
                  if (position !in items.indices) return
                  val item = items[position]
                  if (item.isFolder) {
                      highlightActiveChip(null)
                      loadSection(item.url, TabMode.FOLDER_VIEW, item.title, addToHistory = true)
                  } else {
                      playTrackAt(position)
                  }
              }

              private suspend fun resolveStreamUrl(item: SpaceItem): String {
                  if (item.directMp3.isNotEmpty()) return item.directMp3

                  val fastExtracted = withContext(Dispatchers.IO) {
                      val doc = fetchDocFast(item.url) ?: return@withContext ""
                      extractMp3FromTrackDoc(doc)
                  }

                  if (fastExtracted.isNotEmpty()) {
                      item.directMp3 = fastExtracted
                      return fastExtracted
                  }

                  val webExtracted = withTimeoutOrNull(7500L) {
                      suspendCancellableCoroutine<String> { cont ->
                          runOnUiThread {
                              webViewMp3Callback = { foundUrl ->
                                  if (cont.isActive) cont.resume(foundUrl)
                              }
                              hiddenWebView.loadUrl(item.url)
                          }
                      }
                  } ?: ""

                  if (webExtracted.isNotEmpty()) {
                      item.directMp3 = webExtracted
                  }
                  return webExtracted
              }

              private fun extractMp3FromTrackDoc(doc: Document): String {
                  val audioEl = doc.selectFirst("audio[src], audio source[src], [data-mp3], [data-src*=.mp3], [data-url*=.mp3], [data-file*=.mp3]")
                  if (audioEl != null) {
                      val src = audioEl.absUrl("src")
                          .ifEmpty { audioEl.absUrl("data-mp3") }
                          .ifEmpty { audioEl.absUrl("data-src") }
                          .ifEmpty { audioEl.absUrl("data-url") }
                          .ifEmpty { audioEl.absUrl("data-file") }
                      if (src.isNotEmpty()) return src
                  }

                  for (a in doc.select("a[href]")) {
                      val h = a.absUrl("href")
                      val lowH = h.lowercase()
                      val lowT = a.text().lowercase()
                      if (isDirectAudioFileUrl(lowH) || (lowT.contains("скачать") && (lowH.contains("/download/") || lowH.contains(".mp3")))) {
                          return h
                      }
                  }

                  val unescapedHtml = doc.html().replace("\\/", "/").replace("&amp;", "&")
                  val regex = Regex("""https?://[^\s"'<>]+?\.mp3(?:\?[^\s"'<>]*)?""", RegexOption.IGNORE_CASE)
                  val match = regex.find(unescapedHtml)
                  if (match != null) return match.value

                  return ""
              }

              private fun playTrackAt(index: Int) {
                  if (index !in items.indices) return
                  val item = items[index]
                  if (item.isFolder) {
                      loadSection(item.url, TabMode.FOLDER_VIEW, item.title, addToHistory = true)
                      return
                  }

                  currentIndex = index
                  currentPlayingItem = item
                  adapter.selectedIndex = index
                  adapter.notifyDataSetChanged()

                  btnFavTrack.text = if (isFavorite(item)) "❤️" else "♡"
                  tvNowPlayingTitle.text = item.title
                  tvNowPlayingSub.text = "Загрузка аудиопотока..."
                  progressBar.visibility = View.VISIBLE

                  uiScope.launch {
                      val mp3Url = resolveStreamUrl(item)
                      progressBar.visibility = View.GONE

                      if (mp3Url.isNotEmpty()) {
                          tvNowPlayingSub.text = item.subtitle
                          addToHistory(item)

                          val cookieHeader = allCookies.values.joinToString("; ") { "${it.name}=${it.value}" }
                              .ifEmpty { CookieManager.getInstance().getCookie(mp3Url) ?: "" }

                          val dsFactory = DefaultHttpDataSource.Factory()
                              .setUserAgent(MusicEngine.USER_AGENT)
                              .setAllowCrossProtocolRedirects(true)
                              .setDefaultRequestProperties(
                                  mapOf(
                                      "Referer" to item.url,
                                      "Cookie" to cookieHeader
                                  )
                              )

                          val metadata = MediaMetadata.Builder()
                              .setTitle(item.title)
                              .setArtist(item.subtitle)
                              .build()

                          val mediaItem = MediaItem.Builder()
                              .setUri(mp3Url)
                              .setMediaMetadata(metadata)
                              .build()

                          val mediaSource = DefaultMediaSourceFactory(dsFactory)
                              .createMediaSource(mediaItem)

                          player.setMediaSource(mediaSource)
                          player.prepare()
                          player.play()

                          // Фоновая предзагрузка следующего трека
                          val nextIdx = (index + 1 until items.size).firstOrNull { !items[it].isFolder }
                          if (nextIdx != null) {
                              launch(Dispatchers.IO) { resolveStreamUrl(items[nextIdx]) }
                          }
                      } else {
                          tvNowPlayingSub.text = "Не удалось получить прямой поток MP3"
                      }
                  }
              }

              private fun playNextTrack() {
                  val nextIdx = (currentIndex + 1 until items.size).firstOrNull { !items[it].isFolder }
                  if (nextIdx != null) playTrackAt(nextIdx)
              }

              private fun playPrevTrack() {
                  val prevIdx = (currentIndex - 1 downTo 0).firstOrNull { !items[it].isFolder }
                  if (prevIdx != null) playTrackAt(prevIdx)
              }

              private fun formatTime(ms: Long): String {
                  if (ms <= 0) return "0:00"
                  val totalSec = ms / 1000
                  return String.format("%d:%02d", totalSec / 60, totalSec % 60)
              }

              override fun onBackPressed() {
                  if (navHistory.isNotEmpty()) {
                      val prev = navHistory.pop()
                      updateMirrorBadge()
                      loadSection(prev.url, prev.tabMode, prev.titleHint, addToHistory = false)
                  } else {
                      super.onBackPressed()
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  sleepTimer?.cancel()
                  handler.removeCallbacksAndMessages(null)
                  uiScope.cancel()
              }

              inner class SpaceAdapter(
                  private val list: List<SpaceItem>,
                  private val onClick: (Int) -> Unit
              ) : RecyclerView.Adapter<SpaceAdapter.VH>() {

                  var selectedIndex = -1

                  inner class VH(v: View) : RecyclerView.ViewHolder(v) {
                      val tvCover: TextView = v.findViewById(R.id.tvCover)
                      val tvTitle: TextView = v.findViewById(R.id.tvTitle)
                      val tvSubtitle: TextView = v.findViewById(R.id.tvSubtitle)
                      val tvPlayIcon: TextView = v.findViewById(R.id.tvPlayIcon)
                  }

                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                      val v = LayoutInflater.from(parent.context).inflate(R.layout.item_track, parent, false)
                      return VH(v)
                  }

                  override fun onBindViewHolder(holder: VH, position: Int) {
                      val item = list[position]
                      holder.tvTitle.text = item.title
                      holder.tvSubtitle.text = item.subtitle

                      if (item.isFolder) {
                          holder.tvCover.text = "📁"
                          holder.tvTitle.setTextColor(0xFFFFFFFF.toInt())
                          holder.tvPlayIcon.text = "›"
                      } else {
                          holder.tvCover.text = "♫"
                          val isSelected = position == selectedIndex
                          holder.tvTitle.setTextColor(if (isSelected) 0xFFFFCC00.toInt() else 0xFFFFFFFF.toInt())
                          holder.tvPlayIcon.text = if (isSelected) "⏸" else "▶"
                      }

                      holder.itemView.setOnClickListener { onClick(position) }
                  }

                  override fun getItemCount(): Int = list.size
              }
          }
