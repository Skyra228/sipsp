                          <TextView android:id="@+id/filterArtists" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="12dp" android:paddingVertical="6dp" android:text="👤 Исполнители: ВСЕ" android:textColor="#FFFFFF" android:textSize="12sp" android:textStyle="bold" android:layout_marginEnd="6dp"/>

                          <TextView android:id="@+id/filterAlbums" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="12dp" android:paddingVertical="6dp" android:text="💿 Альбомы: ВСЕ" android:textColor="#FFFFFF" android:textSize="12sp" android:textStyle="bold"/>

