                view.setTextColor(0xFFFFCC00.toInt())
            } else {
                view.setBackgroundResource(R.drawable.bg_chip)
                view.setTextColor(0xFFFFFFFF.toInt())
            }
        }
    }

    private fun highlightBottomNav(tab: BottomTab) {
