          gradle-version: '8.5'



      - name: Generate Selyuk Music v15.1

        run: |

          rm -rf app/src/main

          mkdir -p app/src/main/java/com/example/spacesplayer

          mkdir -p app/src/main/res/layout

          mkdir -p app/src/main/res/drawable



          cat << 'EOF' > settings.gradle.kts

          pluginManagement {

              repositories {

                  google()

                  mavenCentral()

                  gradlePluginPortal()

              }

          }

          dependencyResolutionManagement {

              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {

                  google()

                  mavenCentral()

              }

          }

          rootProject.name = "SelyukMusic"

          include(":app")

          EOF



          cat << 'EOF' > build.gradle.kts

          plugins {

              id("com.android.application") version "8.2.2" apply false

              id("org.jetbrains.kotlin.android") version "1.9.22" apply false

          }

          EOF



          cat << 'EOF' > gradle.properties

          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

          android.useAndroidX=true

          kotlin.code.style=official

          EOF



          cat << 'EOF' > app/build.gradle.kts

          plugins {

              id("com.android.application")

              id("org.jetbrains.kotlin.android")

          }

          android {

              namespace = "com.example.spacesplayer"

              compileSdk = 34

              defaultConfig {

                  applicationId = "com.example.spacesplayer"

                  minSdk = 24

                  targetSdk = 34

                  versionCode = 16

                  versionName = "15.1"

              }

              compileOptions {

                  sourceCompatibility = JavaVersion.VERSION_17

                  targetCompatibility = JavaVersion.VERSION_17

              }

              kotlinOptions {

                  jvmTarget = "17"

              }

          }

          dependencies {

              implementation("androidx.core:core-ktx:1.12.0")

              implementation("androidx.appcompat:appcompat:1.6.1")

              implementation("com.google.android.material:material:1.11.0")

              implementation("androidx.recyclerview:recyclerview:1.3.2")

              implementation("androidx.media3:media3-common:1.2.1")

              implementation("androidx.media3:media3-exoplayer:1.2.1")

              implementation("androidx.media3:media3-datasource:1.2.1")

              implementation("androidx.media3:media3-database:1.2.1")

              implementation("androidx.media3:media3-session:1.2.1")

              implementation("androidx.media3:media3-ui:1.2.1")

              implementation("org.json:json:20231013")

              implementation("com.squareup.okhttp3:okhttp:4.12.0")

              implementation("org.jsoup:jsoup:1.17.2")

              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")

          }

          EOF



