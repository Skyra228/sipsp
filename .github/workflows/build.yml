              private fun loadSavedListsIntoMemory() {
                  val prefs = getSharedPreferences("selyuk_v15", Context.MODE_PRIVATE)
                  val favRaw = prefs.getString("favorites", "[]") ?: "[]"
                  val histRaw = prefs.getString("history", "[]") ?: "[]"
                  try {
                      val favs = parseJsonTrackArray(JSONArray(favRaw))
                      memFavorites.clear()
                      memFavorites.addAll(favs)
                      memFavoriteKeys.clear()
                      for (f in favs) memFavoriteKeys.add(f.idKey)
                  } catch (_: Exception) {}
                  try {
                      val hists = parseJsonTrackArray(JSONArray(histRaw))
                      memHistory.clear()
                      memHistory.addAll(hists)
                  } catch (_: Exception) {}
              }
          
              private fun persistListAsync(key: String, snapshot: List<SpaceItem>) {
                  uiScope.launch(Dispatchers.IO) {
                      val arr = JSONArray()
                      for (item in snapshot.take(250)) {
                          arr.put(trackToJson(item))
                      }
                      getSharedPreferences("selyuk_v15", Context.MODE_PRIVATE)
                          .edit().putString(key, arr.toString()).apply()
                  }
              }
          
              private fun isFavorite(item: SpaceItem): Boolean = memFavoriteKeys.contains(item.idKey)
          
              private fun toggleFavorite(item: SpaceItem): Boolean {
                  return if (memFavoriteKeys.remove(item.idKey)) {
                      memFavorites.removeAll { it.idKey == item.idKey }
                      persistListAsync("favorites", ArrayList(memFavorites))
                      false
                  } else {
                      memFavoriteKeys.add(item.idKey)
                      memFavorites.add(0, item)
                      persistListAsync("favorites", ArrayList(memFavorites))
                      true
                  }
              }
          
              private fun addToHistory(item: SpaceItem) {
                  memHistory.removeAll { it.idKey == item.idKey }
                  memHistory.add(0, item)
                  persistListAsync("history", ArrayList(memHistory))
              }
          
