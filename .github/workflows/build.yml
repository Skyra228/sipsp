name: Build APK



on:

  push:

  workflow_dispatch:



jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Set up JDK 17

        uses: actions/setup-java@v4

        with:

          distribution: 'temurin'

          java-version: '17'



      - name: Setup Gradle 8.5

        uses: gradle/actions/setup-gradle@v3

        with:

          gradle-version: '8.5'



      - name: Generate Selyuk Music v15.1

        run: |

          rm -rf app/src/main

          mkdir -p app/src/main/java/com/example/spacesplayer

          mkdir -p app/src/main/res/layout

          mkdir -p app/src/main/res/drawable



          cat << 'EOF' > settings.gradle.kts

          pluginManagement {

              repositories {

                  google()

                  mavenCentral()

                  gradlePluginPortal()

              }

          }

          dependencyResolutionManagement {

              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {

                  google()

                  mavenCentral()

              }

          }

          rootProject.name = "SelyukMusic"

          include(":app")

          EOF



          cat << 'EOF' > build.gradle.kts

          plugins {

              id("com.android.application") version "8.2.2" apply false

              id("org.jetbrains.kotlin.android") version "1.9.22" apply false

          }

          EOF



          cat << 'EOF' > gradle.properties

          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

          android.useAndroidX=true

          kotlin.code.style=official

          EOF



          cat << 'EOF' > app/build.gradle.kts

          plugins {

              id("com.android.application")

              id("org.jetbrains.kotlin.android")

          }

          android {

              namespace = "com.example.spacesplayer"

              compileSdk = 34

              defaultConfig {

                  applicationId = "com.example.spacesplayer"

                  minSdk = 24

                  targetSdk = 34

                  versionCode = 16

                  versionName = "15.1"

              }

              compileOptions {

                  sourceCompatibility = JavaVersion.VERSION_17

                  targetCompatibility = JavaVersion.VERSION_17

              }

              kotlinOptions {

                  jvmTarget = "17"

              }

          }

          dependencies {

              implementation("androidx.core:core-ktx:1.12.0")

              implementation("androidx.appcompat:appcompat:1.6.1")

              implementation("com.google.android.material:material:1.11.0")

              implementation("androidx.recyclerview:recyclerview:1.3.2")

              implementation("androidx.media3:media3-common:1.2.1")

              implementation("androidx.media3:media3-exoplayer:1.2.1")

              implementation("androidx.media3:media3-datasource:1.2.1")

              implementation("androidx.media3:media3-database:1.2.1")

              implementation("androidx.media3:media3-session:1.2.1")

              implementation("androidx.media3:media3-ui:1.2.1")

              implementation("org.json:json:20231013")

              implementation("com.squareup.okhttp3:okhttp:4.12.0")

              implementation("org.jsoup:jsoup:1.17.2")

              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")

          }

          EOF



          cat << 'EOF' > app/src/main/res/drawable/bg_search.xml

          <?xml version="1.0" encoding="utf-8"?>

          <shape xmlns:android="http://schemas.android.com/apk/res/android">

              <solid android:color="#1C1C1E"/>

              <corners android:radius="14dp"/>

          </shape>

          EOF



          cat << 'EOF' > app/src/main/res/drawable/bg_chip.xml

          <?xml version="1.0" encoding="utf-8"?>

          <shape xmlns:android="http://schemas.android.com/apk/res/android">

              <solid android:color="#242426"/>

              <corners android:radius="20dp"/>

          </shape>

          EOF



          cat << 'EOF' > app/src/main/res/drawable/bg_chip_active.xml

          <?xml version="1.0" encoding="utf-8"?>

          <shape xmlns:android="http://schemas.android.com/apk/res/android">

              <solid android:color="#3A3210"/>

              <stroke android:width="1dp" android:color="#FFCC00"/>

              <corners android:radius="20dp"/>

          </shape>

          EOF



          cat << 'EOF' > app/src/main/res/drawable/bg_cover.xml

          <?xml version="1.0" encoding="utf-8"?>

          <shape xmlns:android="http://schemas.android.com/apk/res/android">

              <solid android:color="#2A2A2D"/>

              <corners android:radius="10dp"/>

          </shape>

          EOF



          cat << 'EOF' > app/src/main/res/layout/item_track.xml

          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"

              android:layout_width="match_parent"

              android:layout_height="wrap_content"

              android:orientation="horizontal"

              android:gravity="center_vertical"

              android:paddingVertical="9dp"

              android:paddingHorizontal="14dp"

              android:background="?attr/selectableItemBackground">

          

              <FrameLayout

                  android:id="@+id/coverFrame"

                  android:layout_width="48dp"

                  android:layout_height="48dp"

                  android:background="@drawable/bg_cover">

          

                  <TextView

                      android:id="@+id/tvCover"

                      android:layout_width="match_parent"

                      android:layout_height="match_parent"

                      android:gravity="center"

                      android:text="♪"

                      android:textColor="#FFCC00"

                      android:textSize="19sp"

                      android:textStyle="bold"/>

          

                  <ImageView

                      android:id="@+id/ivCover"

                      android:layout_width="match_parent"

                      android:layout_height="match_parent"

                      android:scaleType="centerCrop"

                      android:visibility="gone"/>

              </FrameLayout>

          

              <LinearLayout

                  android:layout_width="0dp"

                  android:layout_height="wrap_content"

                  android:layout_weight="1"

                  android:orientation="vertical"

                  android:layout_marginStart="12dp"

                  android:layout_marginEnd="8dp">

          

                  <TextView

                      android:id="@+id/tvTitle"

                      android:layout_width="match_parent"

                      android:layout_height="wrap_content"

                      android:text="Название"

                      android:textColor="#FFFFFF"

                      android:textSize="15sp"

                      android:textStyle="bold"

                      android:singleLine="true"

                      android:ellipsize="end"/>

          

                  <TextView

                      android:id="@+id/tvSubtitle"

                      android:layout_width="match_parent"

                      android:layout_height="wrap_content"

                      android:text="Селюк мьюзик"

                      android:textColor="#8EEB93"

                      android:textSize="12sp"

                      android:singleLine="true"

                      android:ellipsize="end"

                      android:layout_marginTop="2dp"/>

              </LinearLayout>

          

              <TextView

                  android:id="@+id/tvPlayIcon"

                  android:layout_width="wrap_content"

                  android:minWidth="34dp"

                  android:layout_height="34dp"

                  android:paddingHorizontal="6dp"

                  android:gravity="center"

                  android:text="▶"

                  android:textColor="#FFCC00"

                  android:textSize="14sp"

                  android:textStyle="bold"/>

          </LinearLayout>

          EOF



          cat << 'EOF' > app/src/main/res/layout/activity_main.xml

          <?xml version="1.0" encoding="utf-8"?>

          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"

              android:id="@+id/rootContainer"

              android:layout_width="match_parent"

              android:layout_height="match_parent"

              android:background="#0A0A0A">

          

              <LinearLayout

                  android:id="@+id/mainScreenRoot"

                  android:layout_width="match_parent"

                  android:layout_height="match_parent"

                  android:orientation="vertical">

          

                  <!-- ВЕРХНЯЯ ШАПКА -->

                  <LinearLayout

                      android:id="@+id/topHeaderBar"

                      android:layout_width="match_parent"

                      android:layout_height="wrap_content"

                      android:orientation="horizontal"

                      android:gravity="center_vertical"

                      android:paddingHorizontal="14dp"

                      android:paddingTop="10dp"

                      android:paddingBottom="4dp">

          

                      <TextView

                          android:id="@+id/btnBackNav"

                          android:layout_width="36dp"

                          android:layout_height="36dp"

                          android:background="@drawable/bg_chip"

                          android:gravity="center"

                          android:text="←"

                          android:textColor="#FFFFFF"

                          android:textSize="17sp"

                          android:textStyle="bold"

                          android:layout_marginEnd="8dp"

                          android:visibility="gone"/>

          

                      <TextView

                          android:id="@+id/tvHeaderTitle"

                          android:layout_width="0dp"

                          android:layout_height="wrap_content"

                          android:layout_weight="1"

                          android:text="Селюк мьюзик"

                          android:textColor="#FFFFFF"

                          android:textSize="18sp"

                          android:textStyle="bold"

                          android:singleLine="true"

                          android:ellipsize="end"/>

          

                      <TextView

                          android:id="@+id/btnOpenSearch"

                          android:layout_width="36dp"

                          android:layout_height="36dp"

                          android:background="@drawable/bg_chip"

                          android:gravity="center"

                          android:text="🔍"

                          android:textColor="#FFCC00"

                          android:textSize="14sp"

                          android:layout_marginEnd="6dp"/>

          

                      <TextView

                          android:id="@+id/tvMirror"

                          android:layout_width="wrap_content"

                          android:layout_height="36dp"

                          android:background="@drawable/bg_chip"

                          android:gravity="center"

                          android:paddingHorizontal="10dp"

                          android:text="◉ world84"

                          android:textColor="#FFCC00"

                          android:textSize="11sp"

                          android:textStyle="bold"/>

                  </LinearLayout>

          

                  <!-- СТРОКА ПОИСКА НАД РАЗДЕЛАМИ (КАК НА САЙТЕ) -->

                  <LinearLayout

                      android:id="@+id/searchBarContainer"

                      android:layout_width="match_parent"

                      android:layout_height="wrap_content"

                      android:orientation="horizontal"

                      android:paddingHorizontal="14dp"

                      android:paddingVertical="5dp"

                      android:visibility="visible">

          

                      <AutoCompleteTextView

                          android:id="@+id/etSearch"

                          android:layout_width="0dp"

                          android:layout_height="42dp"

                          android:layout_weight="1"

                          android:background="@drawable/bg_search"

                          android:hint="Поиск композиций, исполнителей, альбомов..."

                          android:textColor="#FFFFFF"

                          android:textColorHint="#787880"

                          android:paddingHorizontal="14dp"

                          android:singleLine="true"

                          android:completionThreshold="1"

                          android:imeOptions="actionSearch"

                          android:inputType="text"/>

          

                      <Button

                          android:id="@+id/btnSearch"

                          android:layout_width="wrap_content"

                          android:layout_height="42dp"

                          android:layout_marginStart="8dp"

                          android:backgroundTint="#FFCC00"

                          android:text="Найти"

                          android:textColor="#000000"

                          android:textStyle="bold"/>

                  </LinearLayout>

          

                  <!-- ПЕРЕКЛЮЧАТЕЛЬ ПОДВКЛАДОК ТЕКУЩЕГО РАЗДЕЛА -->

                  <HorizontalScrollView

                      android:id="@+id/sectionTabsScroll"

                      android:layout_width="match_parent"

                      android:layout_height="wrap_content"

                      android:scrollbars="none"

                      android:paddingHorizontal="12dp"

                      android:paddingVertical="4dp">

          

                      <LinearLayout

                          android:layout_width="wrap_content"

                          android:layout_height="wrap_content"

                          android:orientation="horizontal">

          

                          <TextView android:id="@+id/chipOnline" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip_active" android:paddingHorizontal="14dp" android:paddingVertical="6dp" android:text="Топ-100 композиций" android:textColor="#FFCC00" android:textSize="12sp" android:layout_marginEnd="6dp"/>

                          <TextView android:id="@+id/chipNew" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="14dp" android:paddingVertical="6dp" android:text="Топ-100 исполнителей" android:textColor="#FFFFFF" android:textSize="12sp" android:layout_marginEnd="6dp"/>

                          <TextView android:id="@+id/chipCats" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="14dp" android:paddingVertical="6dp" android:text="Топ-100 жанров" android:textColor="#FFFFFF" android:textSize="12sp" android:layout_marginEnd="6dp"/>

                          <TextView android:id="@+id/chipFav" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="14dp" android:paddingVertical="6dp" android:text="Любимые" android:textColor="#FFFFFF" android:textSize="12sp" android:layout_marginEnd="6dp" android:visibility="gone"/>

                          <TextView android:id="@+id/chipHist" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="14dp" android:paddingVertical="6dp" android:text="История" android:textColor="#FFFFFF" android:textSize="12sp" android:layout_marginEnd="6dp" android:visibility="gone"/>

                          <TextView android:id="@+id/chipPlaylists" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="14dp" android:paddingVertical="6dp" android:text="Плейлисты" android:textColor="#FFFFFF" android:textSize="12sp" android:layout_marginEnd="6dp" android:visibility="gone"/>

                          <TextView android:id="@+id/chipNewPlaylist" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="14dp" android:paddingVertical="6dp" android:text="+ Новый плейлист" android:textColor="#8EEB93" android:textSize="12sp" android:visibility="gone"/>

                      </LinearLayout>

                  </HorizontalScrollView>

          

                  <!-- КНОПКИ РАЗДЕЛОВ ПОИСКА / АРТИСТА («ВСЕ» С ТОЧНЫМИ СЧЁТЧИКАМИ САЙТА: T=28, T=29, T=30) -->

                  <HorizontalScrollView

                      android:id="@+id/subFilterScroll"

                      android:layout_width="match_parent"

                      android:layout_height="wrap_content"

                      android:scrollbars="none"

                      android:paddingHorizontal="12dp"

                      android:paddingBottom="4dp"

                      android:visibility="gone">

          

                      <LinearLayout

                          android:layout_width="wrap_content"

                          android:layout_height="wrap_content"

                          android:orientation="horizontal">

          

                          <TextView android:id="@+id/filterAll" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip_active" android:paddingHorizontal="12dp" android:paddingVertical="6dp" android:text="Обзор поиска" android:textColor="#FFCC00" android:textSize="12sp" android:textStyle="bold" android:layout_marginEnd="6dp"/>

                          <TextView android:id="@+id/filterTracks" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="12dp" android:paddingVertical="6dp" android:text="♪ Композиции: ВСЕ" android:textColor="#FFFFFF" android:textSize="12sp" android:textStyle="bold" android:layout_marginEnd="6dp"/>

                          <TextView android:id="@+id/filterArtists" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="12dp" android:paddingVertical="6dp" android:text="👤 Исполнители: ВСЕ" android:textColor="#FFFFFF" android:textSize="12sp" android:textStyle="bold" android:layout_marginEnd="6dp"/>

                          <TextView android:id="@+id/filterAlbums" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/bg_chip" android:paddingHorizontal="12dp" android:paddingVertical="6dp" android:text="💿 Альбомы: ВСЕ" android:textColor="#FFFFFF" android:textSize="12sp" android:textStyle="bold"/>

                      </LinearLayout>

                  </HorizontalScrollView>

          

                  <ProgressBar

                      android:id="@+id/progressBar"

                      style="?android:attr/progressBarStyleHorizontal"

                      android:layout_width="match_parent"

                      android:layout_height="3dp"

                      android:indeterminate="true"

                      android:indeterminateTint="#FFCC00"

                      android:visibility="gone" />

          

                  <TextView

                      android:id="@+id/tvStatus"

                      android:layout_width="match_parent"

                      android:layout_height="wrap_content"

                      android:paddingHorizontal="16dp"

                      android:paddingVertical="4dp"

                      android:text="Загрузка..."

                      android:textColor="#8E8E93"

                      android:textSize="11sp" />

          

                  <FrameLayout

                      android:layout_width="match_parent"

                      android:layout_height="0dp"

                      android:layout_weight="1">

          

                      <androidx.recyclerview.widget.RecyclerView

                          android:id="@+id/rvTracks"

                          android:layout_width="match_parent"

                          android:layout_height="match_parent" />

          

                      <!-- ЭКРАН «ЕЩЁ» -->

                      <ScrollView

                          android:id="@+id/moreScreenContainer"

                          android:layout_width="match_parent"

                          android:layout_height="match_parent"

                          android:padding="16dp"

                          android:visibility="gone">

          

                          <LinearLayout

                              android:layout_width="match_parent"

                              android:layout_height="wrap_content"

                              android:orientation="vertical">

          

                              <TextView

                                  android:layout_width="match_parent"

                                  android:layout_height="wrap_content"

                                  android:text="Звук и воспроизведение"

                                  android:textColor="#FFCC00"

                                  android:textSize="13sp"

                                  android:textStyle="bold"

                                  android:layout_marginBottom="8dp"/>

          

                              <Button

                                  android:id="@+id/btnEq"

                                  android:layout_width="match_parent"

                                  android:layout_height="48dp"

                                  android:backgroundTint="#1E1E22"

                                  android:text="🎛 Эквалайзер и усиление баса"

                                  android:textColor="#FFFFFF"

                                  android:gravity="start|center_vertical"

                                  android:layout_marginBottom="8dp"/>

          

                              <Button

                                  android:id="@+id/btnSleep"

                                  android:layout_width="match_parent"

                                  android:layout_height="48dp"

                                  android:backgroundTint="#1E1E22"

                                  android:text="⏱ Таймер сна"

                                  android:textColor="#FFFFFF"

                                  android:gravity="start|center_vertical"

                                  android:layout_marginBottom="16dp"/>

          

                              <TextView

                                  android:layout_width="match_parent"

                                  android:layout_height="wrap_content"

                                  android:text="Сеть, кэш и оформление"

                                  android:textColor="#FFCC00"

                                  android:textSize="13sp"

                                  android:textStyle="bold"

                                  android:layout_marginBottom="8dp"/>

          

                              <Button

                                  android:id="@+id/btnMirrorSetting"

                                  android:layout_width="match_parent"

                                  android:layout_height="48dp"

                                  android:backgroundTint="#1E1E22"

                                  android:text="🌐 Изменить зеркало сайта"

                                  android:textColor="#FFFFFF"

                                  android:gravity="start|center_vertical"

                                  android:layout_marginBottom="8dp"/>

          

                              <Button

                                  android:id="@+id/btnThemeToggle"

                                  android:layout_width="match_parent"

                                  android:layout_height="48dp"

                                  android:backgroundTint="#1E1E22"

                                  android:text="🌗 Переключить тему (Тёмная / Светлая)"

                                  android:textColor="#FFFFFF"

                                  android:gravity="start|center_vertical"

                                  android:layout_marginBottom="8dp"/>

          

                              <Button

                                  android:id="@+id/btnClearCache"

                                  android:layout_width="match_parent"

                                  android:layout_height="48dp"

                                  android:backgroundTint="#1E1E22"

                                  android:text="🧹 Очистить кэш страниц и аудио"

                                  android:textColor="#FFFFFF"

                                  android:gravity="start|center_vertical"

                                  android:layout_marginBottom="16dp"/>

          

                              <TextView

                                  android:layout_width="match_parent"

                                  android:layout_height="wrap_content"

                                  android:text="Резервное копирование и инфо"

                                  android:textColor="#FFCC00"

                                  android:textSize="13sp"

                                  android:textStyle="bold"

                                  android:layout_marginBottom="8dp"/>

          

                              <Button

                                  android:id="@+id/btnExportJson"

                                  android:layout_width="match_parent"

                                  android:layout_height="48dp"

                                  android:backgroundTint="#1E1E22"

                                  android:text="📤 Экспорт медиатеки в JSON"

                                  android:textColor="#FFFFFF"

                                  android:gravity="start|center_vertical"

                                  android:layout_marginBottom="8dp"/>

          

                              <Button

                                  android:id="@+id/btnImportJson"

                                  android:layout_width="match_parent"

                                  android:layout_height="48dp"

                                  android:backgroundTint="#1E1E22"

                                  android:text="📥 Импорт медиатеки из JSON"

                                  android:textColor="#FFFFFF"

                                  android:gravity="start|center_vertical"

                                  android:layout_marginBottom="8dp"/>

          

                              <Button

                                  android:id="@+id/btnAboutApp"

                                  android:layout_width="match_parent"

                                  android:layout_height="48dp"

                                  android:backgroundTint="#1E1E22"

                                  android:text="ℹ️ О приложении «Селюк мьюзик»"

                                  android:textColor="#FFFFFF"

                                  android:gravity="start|center_vertical"/>

                          </LinearLayout>

                      </ScrollView>

                  </FrameLayout>

          

                  <WebView

                      android:id="@+id/hiddenWebView"

                      android:layout_width="1dp"

                      android:layout_height="1dp"

                      android:visibility="invisible" />

          

                  <!-- МИНИ-ПЛЕЕР -->

                  <LinearLayout

                      android:id="@+id/miniPlayerBar"

                      android:layout_width="match_parent"

                      android:layout_height="62dp"

                      android:orientation="horizontal"

                      android:gravity="center_vertical"

                      android:background="#18181C"

                      android:paddingHorizontal="12dp">

          

                      <FrameLayout

                          android:layout_width="44dp"

                          android:layout_height="44dp"

                          android:background="@drawable/bg_cover">

          

                          <TextView

                              android:id="@+id/tvMiniCover"

                              android:layout_width="match_parent"

                              android:layout_height="match_parent"

                              android:gravity="center"

                              android:text="♪"

                              android:textColor="#FFCC00"

                              android:textSize="18sp"

                              android:textStyle="bold"/>

          

                          <ImageView

                              android:id="@+id/ivMiniCover"

                              android:layout_width="match_parent"

                              android:layout_height="match_parent"

                              android:scaleType="centerCrop"

                              android:visibility="gone"/>

                      </FrameLayout>

          

                      <LinearLayout

                          android:layout_width="0dp"

                          android:layout_height="wrap_content"

                          android:layout_weight="1"

                          android:orientation="vertical"

                          android:layout_marginHorizontal="10dp">

          

                          <TextView

                              android:id="@+id/tvNowPlayingTitle"

                              android:layout_width="match_parent"

                              android:layout_height="wrap_content"

                              android:text="Выберите трек"

                              android:textColor="#FFFFFF"

                              android:textSize="14sp"

                              android:textStyle="bold"

                              android:singleLine="true"

                              android:ellipsize="end"/>

          

                          <TextView

                              android:id="@+id/tvNowPlayingSub"

                              android:layout_width="match_parent"

                              android:layout_height="wrap_content"

                              android:text="Селюк мьюзик v15.1"

                              android:textColor="#8E8E93"

                              android:textSize="11sp"

                              android:singleLine="true"

                              android:ellipsize="end"/>

                      </LinearLayout>

          

                      <Button

                          android:id="@+id/btnMiniPrev"

                          android:layout_width="36dp"

                          android:layout_height="36dp"

                          android:background="?attr/selectableItemBackgroundBorderless"

                          android:text="⏮"

                          android:textColor="#FFFFFF"

                          android:textSize="14sp"

                          android:padding="0dp"/>

          

                      <Button

                          android:id="@+id/btnPlayPause"

                          android:layout_width="42dp"

                          android:layout_height="42dp"

                          android:layout_marginHorizontal="2dp"

                          android:backgroundTint="#FFCC00"

                          android:text="▶"

                          android:textColor="#000000"

                          android:textStyle="bold"

                          android:textSize="16sp"

                          android:padding="0dp"/>

          

                      <Button

                          android:id="@+id/btnMiniNext"

                          android:layout_width="36dp"

                          android:layout_height="36dp"

                          android:background="?attr/selectableItemBackgroundBorderless"

                          android:text="⏭"

                          android:textColor="#FFFFFF"

                          android:textSize="14sp"

                          android:padding="0dp"/>

                  </LinearLayout>

          

                  <!-- НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ (СТРОГО ПО РАЗДЕЛАМ САЙТА + СВОЁ + ЕЩЁ) -->

                  <LinearLayout

                      android:id="@+id/bottomNavBar"

                      android:layout_width="match_parent"

                      android:layout_height="56dp"

                      android:orientation="horizontal"

                      android:background="#121214"

                      android:gravity="center">

          

                      <TextView

