Почему версия v13.2 находила по одному треку и не видела артистов с альбомами
При проверке реальной HTML-разметки Spaces Music Online обнаружились 5 расхождений между селекторами в коде и вёрсткой сайта:

Пропуск ссылок /music-online/e/track/... в поиске: на сайте ссылки на треки в выдаче имеют класс a.arrow_link и путь /music-online/e/track/<артист>/<песня>/. В v13.2 проверялись только подстроки /music/ и /music-online/track/ (без сегмента /e/), из-за чего отсеивалось более 90% найденных песен.

Схлопывание разных треков в один (extractId): регулярное выражение /(?:view|download|file|track)/[^/?#]*?(\d{4,}) могло вытаскивать одинаковый ID из первой части URL или параметра Link_id=1187356, после чего seen.add("track_$id") считал остальные треки дубликатами.

Неверный селектор карточек артистов и альбомов: в v13.2 артисты и альбомы искались строго внутри div.pre_content_wrap, тогда как на сайте они лежат внутри <div class="list f-c_fll"> в тегах <a class="list-link"> с названием внутри <b class="t-strong_item">.

Потеря имени исполнителя и длительности: вызов container.selectFirst("div.oh") возвращал самую внешнюю обёртку <div class="stnd_padd oh relative"> с пустым ownText(), а реальное имя артиста находится во внутреннем div.oh (родителе ссылки trackLink.parent()) и в <meta itemprop="description">.

Долгое получение .mp3: на странице трека прямая ссылка [https://htz-ms04.spac.me/m/.../*.mp3](https://htz-ms04.spac.me/m/.../*.mp3) лежит в атрибуте data-src блока div.player_item и в кнопке a.__adv_download, но код не проверял div.player_item[data-src] и не переходил со страниц /music-online/e/track/... на /music/view/....

Что исправлено и добавлено в v14.0
Блоки «Исполнители», «Альбомы» и «Треки» как на сайте: при поиске (и при заходе в карточку артиста) под основными вкладками появляется панель фильтрации (Все, 👤 Исполнители, 💿 Альбомы, ♪ Треки) со счётчиками найденных элементов и разделителями секций в списке.

Автоподгрузка альбомов и всех песен артиста: если в поиске найден исполнитель или ты открываешь карточку 👤 Исполнитель, приложение автоматически подгружает его раздел альбомов (/albums/) и полный каталог его песен (/tracks/) с автоматической пагинацией (p2, p3...) при прокрутке списка вниз.

Точный парсинг метаданных трека: у каждого трека теперь корректно извлекаются имя артиста и длительность из <meta itemprop="duration" content="PT0H4M1S"> (например, Виктор Цой/группа Кино • 4:01).

Мгновенный запуск .mp3 и предзагрузка следующего трека: функция extractMp3FromDoc сразу забирает поток 320 Кбит/с из div.player_item[data-src], a.__adv_download или сырого HTML (с автоматическим переходом на /music/view/... при необходимости), а во время звучания текущей песни заранее находит .mp3 для следующего трека в списке (prefetchNextTrackMp3).

Полноценное управление плеером: добавлена кнопка повтора одного трека (🔁 / 🔂) на нижней панели, переключение Play/Pause при повторном нажатии на играющий трек в списке, возврат к началу песни по кнопке ⏮ и отдельная вкладка Альбомы в верхнем меню.

Замени содержимое файла .github/workflows/build.yml в репозитории Skyra228/sipsp на готовый файл build.yml выше — после коммита GitHub Actions автоматически соберёт новый артефакт SpacesPlayer-v14.0-APK.

у меня удалилась папка workflows я добавил наш с тобой файл но ничего не пошло как пофиксить?

На скриншоте видно, что файл build.yml загрузился прямо в корень репозитория Skyra228/sipsp, а GitHub Actions запускает сборку только тогда, когда файл лежит строго внутри папки .github/workflows/.

Переместить уже загруженный файл в нужную папку можно прямо в браузере за пару кликов:

Открой файл: нажми на build.yml в списке файлов репозитория Skyra228/sipsp.

Перейди к редактированию: нажми на иконку карандаша (Редактировать этот файл / Edit this file) в правом верхнем углу над кодом.

Допиши путь к папке в имени файла: в верхнем поле названия файла (рядом с sipsp /) поставь курсор перед build.yml и введи .github/workflows/, чтобы в итоге получилось .github/workflows/build.yml (при вводе косой черты / GitHub сам автоматически создаст папки .github и workflows).

Сохрани изменения: нажми зелёную кнопку Зафиксировать изменения... (Commit changes...) справа вверху и подтверди сохранение во всплывающем окне.

Сразу после сохранения зайди во вкладку Действия (Actions) — сборка Build APK запустится автоматически.

# ПРОМПТ: Доработка Android-приложения «Spaces Музыка» до стабильной версии v15



## РОЛЬ



Ты — опытный Android-разработчик, специализирующийся на Media3, парсинге HTML и оптимизации под слабые устройства. Твоя задача — довести существующее приложение до состояния стабильного, быстрого и удобного продукта. Ты сам выбираешь технические решения, селекторы, архитектурные паттерны и библиотеки. Не нужно спрашивать «куда именно вставить строку» — ты видишь код и находишь место сам.



## КОНТЕКСТ



У меня есть Android-приложение «Spaces Музыка» на Kotlin + Media3 ExoPlayer + Jsoup + OkHttp + GitHub Actions. Оно парсит музыкальный каталог с сайта `world84.spcs.bio/music-online/` и воспроизводит треки. Текущая версия — v14.0. Весь код в одном файле `.github/workflows/build.yml`, который генерирует структуру проекта и собирает APK.



**Что уже работает:**

- Парсинг главной страницы, поиска, артистов, альбомов, жанров, поджанров

- Воспроизведение MP3, эквалайзер, таймер сна, скачивание файлов

- Поиск с автоматической подгрузкой дискографии найденного артиста

- Подфильтры «Все / Исполнители / Альбомы / Треки» (визуально есть)



**Что не работает или работает плохо:**

- Уведомление в шторке не появляется → сервис убивается системой в фоне

- Музыка останавливается при блокировке экрана

- Всё на одном экране: 7 чипов, 4 подфильтра, поиск, список и плеер — перегружено

- Подфильтры «Исполнители / Альбомы / Треки» выглядят неактивными: показывают только то, что уже подгружено с текущей страницы, а не полный список с сайта. На сайте контента больше, но он лежит на отдельных подстраницах.

- Нет кэша → «Назад» думает 2 секунды, повторный заход в тот же жанр — новый запрос

- Нет обложек, нет shuffle, нет плейлистов



## ФОРМАТ РАБОТЫ



- Давай **только точечные патчи**: что меняется, зачем, какой результат ожидается. Не переписывай весь `build.yml` без явной просьбы.

- Ты сам определяешь: какой файл, какой метод, какие селекторы, какие библиотеки. Мне не нужны номера строк — мне нужен результат.

- Каждый патч — самодостаточный: после применения и пересборки APK приложение должно работать без дополнительных правок.

- Если видишь, что задача требует архитектурного решения (например, вынести парсер в отдельный класс) — опиши это как часть патча, но не раздувай до переписывания всего проекта.



## ЗАДАЧИ (по приоритету)



### Задача 1 — Стабильность в фоне (КРИТИЧНО)



Приложение должно:

- Показывать уведомление в шторке с обложкой, названием трека, кнопками play/pause/next/prev

- Продолжать воспроизведение при блокировке экрана и сворачивании

- Не останавливаться при свайпе из недавних задач, если музыка играет

- Работать с кнопками на Bluetooth-наушниках (play/pause/next/prev)

- Корректно вести себя на Android 13+ (разрешение на уведомления) и Android 8+ (foreground service)



Реши сам: какие разрешения в манифесте, какой способ запуска сервиса, как настроить MediaSession, как удержать WakeLock, как обработать `onTaskRemoved`. Главное — чтобы музыка не отваливалась.



### Задача 2 — Подфильтры должны работать (КРИТИЧНО)



Сейчас на экране поиска и на страницах жанра/артиста подфильтры «Все / Исполнители / Альбомы / Треки» показывают только то, что уже спарсено с первой страницы. А на сайте под каждый тип контента есть отдельная подстраница: только треки, только артисты, только альбомы, с полным списком и пагинацией.



Нужно:

- При нажатии на подфильтр подгружать **полный список** с соответствующей подстраницы сайта (лента треков / список артистов / список альбомов)

- Показывать индикатор загрузки на нажатой кнопке, чтобы она не выглядела мёртвой

- Скрывать подфильтры на экранах, где они не имеют смысла (главная, список артистов, список альбомов, любимые, история)

- Кэшировать уже загруженные полные списки, чтобы повторное нажатие не делало новый запрос



Реши сам: как определять тип страницы, как формировать URL подстраницы, как мёржить новые данные с уже существующими, как избежать дублей.



### Задача 3 — Разнести всё по отдельным экранам



Сейчас всё на одном экране: 7 чипов сверху, 4 подфильтра, поиск, список и плеер. Хочу, чтобы навигация была по отдельным экранам с нижней панелью вкладок:



- Главная — Онлайн и Популярные

- Музыка — Жанры и Альбомы

- Артисты — список всех артистов

- Своё — Любимые, История, Плейлисты

- Ещё — эквалайзер, таймер сна, зеркало, экспорт/импорт, о приложении



Плюс:

- Мини-плеер внизу (обложка + название + кнопки play/pause/next/prev), тап разворачивает полноэкранный плеер

- Полноэкранный «Сейчас играет»: большая обложка, seekbar, все кнопки управления, кнопки избранного/скачивания/плейлиста

- Отдельный экран поиска: строка поиска в шапке, результаты на весь экран с подфильтрами

- Сохранение позиции скролла при возврате «Назад»

- Splash Screen и поддержка тёмной/светлой темы

- **Сменить название приложения на «Селюк мьюзик»** — везде: в манифесте (`android:label`), в заголовке главного экрана, в уведомлении, в настройках «О приложении». Никаких упоминаний «Spaces Музыка» в интерфейсе.



Реши сам: через BottomNavigationView или другой паттерн, как разбивать на фрагменты, как передавать данные между ними.



### Задача 4 — Производительность и кэш



Хочу, чтобы приложение отвечало моментально:

- «Назад» и повторный заход в раздел — из кэша, без сетевого запроса

- Перемотка трека — без повторной загрузки фрагментов

- Прослушанные треки играют офлайн

- Список не мигает при изменениях (избранное, статус воспроизведения)

- Листание вниз — без задержек на подгрузку следующей страницы



Реши сам: использовать LruCache, дисковый кэш, CacheDataSource, ListAdapter + DiffUtil, prefetch страниц, параллельные запросы. Главное — приложение должно ощущаться быстрым.



### Задача 5 — Функционал плеера



Добавить:

- Обложки треков в списке и на экране блокировки

- Shuffle (перемешивание текущего списка)

- Repeat All (три режима: выкл / повтор списка / повтор одного)

- Свайпы по треку: вправо — в избранное, влево — скачать

- Долгое нажатие — контекстное меню (играть, в избранное, скачать, добавить в плейлист, скопировать ссылку)

- Плейлисты: создание, добавление треков, отдельная вкладка

- Сохранение последнего трека и позиции при старте (без автозапуска)

- Автодополнение в поиске (подсказки из истории и текущего списка)

- Экспорт и импорт избранного/истории в JSON



Реши сам: как хранить данные (SharedPreferences, DataStore, Room), как загружать обложки без внешних библиотек, как реализовать свайпы.



