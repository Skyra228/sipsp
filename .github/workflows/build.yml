name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Spaces Player v8.1
        run: |
          rm -rf app/src/main
          mkdir -p app/src/main/java/com/example/spacesplayer
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable

          # 1. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SpacesPlayer"
          include(":app")
          EOF

          # 2. build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.spacesplayer"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.spacesplayer"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 81
                  versionName = "8.1-SpacesMusic"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("androidx.media3:media3-exoplayer:1.2.1")
              implementation("androidx.media3:media3-session:1.2.1")
              implementation("androidx.media3:media3-ui:1.2.1")
              implementation("org.jsoup:jsoup:1.17.2")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF

          # 5. Шейпы дизайна
          cat << 'EOF' > app/src/main/res/drawable/bg_search.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#1C1C1E"/>
              <corners android:radius="14dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_chip.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#242426"/>
              <corners android:radius="20dp"/>
          </shape>
