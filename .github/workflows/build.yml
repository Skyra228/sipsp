                  AppCompatDelegate.setDefaultNightMode(
                      if (isLightTheme) AppCompatDelegate.MODE_NIGHT_NO else AppCompatDelegate.MODE_NIGHT_YES
                  )
          
                  super.onCreate(savedInstanceState)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  window.statusBarColor = android.graphics.Color.TRANSPARENT
                  window.navigationBarColor = android.graphics.Color.TRANSPARENT
                  WindowCompat.getInsetsController(window, window.decorView).apply {
                      isAppearanceLightStatusBars = isLightTheme
                      isAppearanceLightNavigationBars = isLightTheme
                  }
                  setContentView(R.layout.activity_main)
          
                  val fullPlayerContentView = findViewById<View>(R.id.fullPlayerContent)
                  val density = resources.displayMetrics.density
                  ViewCompat.setOnApplyWindowInsetsListener(findViewById(R.id.rootContainer)) { _, insets ->
                      val sysBars = insets.getInsets(WindowInsetsCompat.Type.systemBars())
                      mainScreenRoot.setPadding(0, sysBars.top + (8 * density).toInt(), 0, 0)
                      fullPlayerContentView.setPadding(0, sysBars.top + (14 * density).toInt(), 0, sysBars.bottom + (16 * density).toInt())
                      val navLp = findViewById<View>(R.id.bottomNavBar).layoutParams as ViewGroup.MarginLayoutParams
                      navLp.bottomMargin = sysBars.bottom + (8 * density).toInt()
                      findViewById<View>(R.id.bottomNavBar).layoutParams = navLp
                      val miniLp = miniPlayerBar.layoutParams as ViewGroup.MarginLayoutParams
                      miniLp.bottomMargin = sysBars.bottom + (76 * density).toInt()
                      miniPlayerBar.layoutParams = miniLp
                      insets
                  }
          
                  requestNotificationPermissionIfNeeded()
                  MusicEngine.ensureInitialized(this)
                  MusicEngine.onNextRequested = { runOnUiThread { playNextTrack(fromUser = true) } }
                  MusicEngine.onPrevRequested = { runOnUiThread { playPrevTrack() } }
                  MusicEngine.onSaveStateRequested = { runOnUiThread { saveLastPlayedStateNow(includeQueue = false) } }
          
                  MusicEngine.connectMediaController(this)
          
                  baseHost = extractCleanHost(prefs.getString("host", "https://world84.spcs.bio") ?: "https://world84.spcs.bio")
                  shuffleEnabled = prefs.getBoolean("shuffle", false)
                  repeatState = RepeatState.values().getOrElse(prefs.getInt("repeat_mode", 0)) { RepeatState.OFF }
          
                  bindViews()
                  applyThemeColors()
                  updateRepeatAndShuffleButtons()
                  updateMirrorBadge()
                  updateBatteryOptButtonLabel()
                  setupHiddenWebView()
                  setupPlayerListeners()
                  setupRecyclerView()
                  setupControls()
          
                  // Мгновенно восстанавливаем последний игравший трек, позицию и очередь на старте!
                  loadSavedListsIntoMemory()
                  restoreLastPlayedState()
          
                  hideKeyboard()
                  setupOfflineObserverAndReceiver()
          
                  // Сканируем офлайн-файлы и проверяем авто-бэкап в фоне
                  uiScope.launch(Dispatchers.IO) {
                      scanOfflineFilesInternal()
                      withContext(Dispatchers.Main) {
                          setupSearchAutocomplete()
                          scheduleFirstLaunchBackupCheck()
                      }
