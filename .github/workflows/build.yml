              private fun isNoiseText(text: String): Boolean {
                  val low = text.lowercase().trim()
                  if (low.isEmpty() || low.length < 2) return true
                  val noise = setOf(
                      "назад", "вперёд", "вперед", "все", "все >", "показать все", "показать все >",
                      "ещё", "еще", "меню", "вход", "войти", "регистрация", "поиск", "найти",
                      "главная", "категории", "популярные", "новые", "новинки",
                      "онлайн", "артисты", "исполнители", "жанры", "альбомы",
                      "композиции", "треки", "песни", "музыка", "музыка онлайн",
                      "показать ещё", "показать еще", "поделиться", "жалоба",
                      "о сайте", "контакты", "зо", "зона обмена", "первый раз на spaces?",
                      "тема", "версия", "mobile", "lite", "touch", "pc",
                      "отключить рекламу", "реклама", "список пуст.",
                      "по алфавиту", "выбранные жанры:", "доступные жанры:",
                      "топ-100", "топ-100 композиций", "топ-100 исполнителей", "топ-100 жанров",
                      "похожие", "биография", "информация"
                  )
                  if (low in noise) return true
                  if (low.startsWith("танки") || low.startsWith("битва") || low.startsWith("мафия") ||
                      low.startsWith("лорикс") || low.startsWith("мстители") || low.startsWith("зоопарк") ||
                      low.startsWith("доценты") || low.startsWith("небоскреб") || low.startsWith("разрушители")) return true
                  return false
              }
          
              private fun formatIsoDuration(iso: String): String {
                  if (iso.isEmpty()) return ""
                  val h = Regex("""(\d+)H""").find(iso)?.groupValues?.get(1)?.toIntOrNull() ?: 0
                  val m = Regex("""(\d+)M""").find(iso)?.groupValues?.get(1)?.toIntOrNull() ?: 0
                  val s = Regex("""(\d+)S""").find(iso)?.groupValues?.get(1)?.toIntOrNull() ?: 0
                  val totalMinutes = h * 60 + m
                  if (totalMinutes == 0 && s == 0) return ""
                  return String.format("%d:%02d", totalMinutes, s)
              }
          
              private fun extractCanonicalKey(url: String, prefix: String): String {
                  return try {
                      val cleanUrl = url.substringBefore("?").substringBefore("#").trimEnd('/')
                      val path = Uri.parse(cleanUrl).path?.trimEnd('/') ?: cleanUrl
                      val normalized = path.replace(Regex("""/music-online/e/"""), "/music-online/")
                      "${prefix}_${normalized.lowercase()}"
                  } catch (_: Exception) {
                      "${prefix}_${url.substringBefore("?").trimEnd('/').lowercase()}"
                  }
              }
          
              private fun parseTrackContainer(container: Element, seen: HashSet<String>): SpaceItem? {
                  val trackLink = container.selectFirst("a.arrow_link[href]")
                      ?: container.selectFirst("a[href*=/track/]")
                      ?: container.selectFirst("a[href*=/music/view/]")
                      ?: container.selectFirst("div.oh a[href]")
                      ?: return null
          
                  val trackUrl = trackLink.absUrl("href").ifEmpty { toAbsoluteUrl(trackLink.attr("href")) }
                  if (trackUrl.isEmpty()) return null
                  if (trackUrl.contains("/artist/") || trackUrl.contains("/album/") || trackUrl.contains("/by_tag/")) return null
          
                  var title = trackLink.selectFirst("span")?.text()?.trim() ?: trackLink.text().trim()
                  val metaDesc = container.selectFirst("meta[itemprop=description]")?.attr("content")?.trim() ?: ""
          
                  var artist = ""
                  val linkParent = trackLink.parent()
                  if (linkParent != null) {
                      artist = linkParent.ownText().trim().trimEnd(':', '-', '—').trim()
                  }
                  if (artist.isEmpty()) {
                      for (oh in container.select("div.oh")) {
                          val own = oh.ownText().trim().trimEnd(':', '-', '—').trim()
                          if (own.isNotEmpty()) {
                              artist = own
                              break
                          }
                      }
                  }
                  if (artist.isEmpty() && metaDesc.contains(" - ")) {
                      artist = metaDesc.substringBefore(" - ").trim()
                      if (title.isEmpty()) title = metaDesc.substringAfter(" - ").trim()
                  }
                  if (artist.isEmpty()) artist = container.attr("data-artist").trim()
                  if (title.isEmpty()) title = container.attr("data-title").trim()
                  if (title.isEmpty() || isNoiseText(title)) return null
                  if (artist.isEmpty()) artist = "Селюк мьюзик"
          
                  val isoDur = container.selectFirst("meta[itemprop=duration]")?.attr("content") ?: ""
                  var duration = formatIsoDuration(isoDur)
                  if (duration.isEmpty()) duration = container.attr("data-duration").trim()
                  if (duration.isEmpty()) {
                      val rightGrey = container.selectFirst("span.grey.right")?.text()?.trim() ?: ""
                      if (rightGrey.matches(Regex("""\d+:\d{2}"""))) duration = rightGrey
                  }
          
                  val subtitle = if (duration.isNotEmpty()) "$artist • $duration" else artist
          
                  var mp3 = ""
                  var cover = container.attr("data-cover").trim()
                  val playerEl = container.selectFirst("[data-src], [data-mp3]")
                  if (playerEl != null) {
                      val rawSrc = playerEl.absUrl("data-src").ifEmpty { playerEl.attr("data-src") }
                          .ifEmpty { playerEl.absUrl("data-mp3").ifEmpty { playerEl.attr("data-mp3") } }
                      if (rawSrc.isNotEmpty()) mp3 = toAbsoluteUrl(rawSrc)
                      if (cover.isEmpty()) cover = playerEl.attr("data-cover").trim()
                  }
                  if (cover.isEmpty()) {
                      val img = container.selectFirst("img[src]")
                      if (img != null) cover = img.absUrl("src").ifEmpty { toAbsoluteUrl(img.attr("src")) }
                  }
                  if (mp3.isEmpty()) {
                      val mp3Link = container.selectFirst("a.__adv_download[href], a[href*=.mp3], a[href*=/files/download/], a[href*=/music/download/]")
                      if (mp3Link != null) mp3 = mp3Link.absUrl("href").ifEmpty { toAbsoluteUrl(mp3Link.attr("href")) }
                  }
          
                  val idKey = extractCanonicalKey(trackUrl, "track")
                  if (!seen.add(idKey)) return null
          
                  return SpaceItem(
                      idKey = idKey,
                      title = title,
                      subtitle = subtitle,
                      url = trackUrl,
                      isFolder = false,
                      directMp3 = mp3,
                      type = ItemType.TRACK,
                      coverUrl = cover
                  )
              }
          
              private fun parseMusicOnlineDoc(doc: Document, mode: TabMode, currentUrl: String): List<SpaceItem> {
                  val tracksList = ArrayList<SpaceItem>()
                  val artistsList = ArrayList<SpaceItem>()
                  val albumsList = ArrayList<SpaceItem>()
                  val genresList = ArrayList<SpaceItem>()
                  val seen = HashSet<String>()
          
                  val currentPath = try {
                      Uri.parse(currentUrl).path?.trimEnd('/') ?: ""
                  } catch (_: Exception) { "" }
                  val isGenresListPage = currentPath == "/music-online/genres" || Regex(""".*/music-online/genres/p\d+""").matches(currentPath)
          
                  // 1. Композиции (Треки)
                  if (!isGenresListPage) {
                      val pageCover = doc.selectFirst("div.content img[src], div.for_avatar img[src]")?.absUrl("src") ?: ""
                      for (container in doc.select("div.__adv_list_track")) {
                          val item = parseTrackContainer(container, seen)
                          if (item != null) {
                              if (item.coverUrl.isEmpty() && pageCover.isNotEmpty()) item.coverUrl = pageCover
                              tracksList.add(item)
                          }
                      }
                      if (tracksList.isEmpty()) {
                          for (pItem in doc.select("div.player_item[data-src]")) {
                              val rawSrc = pItem.absUrl("data-src").ifEmpty { toAbsoluteUrl(pItem.attr("data-src")) }
                              if (rawSrc.isEmpty()) continue
                              val tTitle = pItem.attr("data-title").trim().ifEmpty { "Трек" }
                              val tArtist = pItem.attr("data-artist").trim().ifEmpty { "Селюк мьюзик" }
                              val tDur = pItem.attr("data-duration").trim()
                              val tCover = pItem.attr("data-cover").trim()
                              val sub = if (tDur.isNotEmpty()) "$tArtist • $tDur" else tArtist
                              val idKey = "track_direct_${pItem.attr("data-nid").ifEmpty { rawSrc.hashCode().toString() }}"
                              if (seen.add(idKey)) {
                                  tracksList.add(SpaceItem(idKey, tTitle, sub, currentUrl, false, directMp3 = rawSrc, type = ItemType.TRACK, coverUrl = tCover))
                              }
                          }
                      }
                  }
          
                  // 2. Исполнители
                  if (!isGenresListPage) {
                      val artistElements = doc.select("a.list-link[href*=/artist/], a[href*=/music-online/artist/], a[href*=/music-online/e/artist/]")
                      for (a in artistElements) {
                          if (a.hasClass("tabs__link") || a.hasClass("pgn__link") || a.hasClass("b-title_all") || a.hasClass("b-title__all") || a.hasClass("b-title__sublink") || a.hasClass("list-link-blue")) continue
                          val url = a.absUrl("href").ifEmpty { toAbsoluteUrl(a.attr("href")) }
                          if (url.isEmpty()) continue
                          val targetPath = try { Uri.parse(url).path?.trimEnd('/') ?: "" } catch (_: Exception) { "" }
                          if (targetPath.isEmpty() || targetPath == currentPath) continue
                          if (targetPath.endsWith("/tracks") || targetPath.endsWith("/albums") || targetPath.endsWith("/similar") || Regex(""".*/p\d+$""").matches(targetPath)) continue
          
                          val nameEl = a.selectFirst("b.t-strong_item") ?: a.selectFirst("b")
                          val name = (nameEl?.text() ?: a.ownText()).trim()
                          if (name.isEmpty() || isNoiseText(name)) continue
          
                          val genres = a.selectFirst("div.grey, span.grey")?.text()?.trim() ?: ""
                          val sub = if (genres.isNotEmpty()) "Исполнитель • $genres" else "Исполнитель"
                          val img = a.selectFirst("img[src]")
                          val cover = if (img != null) img.absUrl("src").ifEmpty { toAbsoluteUrl(img.attr("src")) } else ""
          
                          val idKey = extractCanonicalKey(url, "artist")
                          if (seen.add(idKey)) {
                              artistsList.add(SpaceItem(idKey, name, sub, url, true, type = ItemType.ARTIST, coverUrl = cover))
                          }
                      }
                  }
          
                  // 3. Альбомы
                  if (!isGenresListPage) {
                      val albumElements = doc.select("a.list-link[href*=/album/], a[href*=/music-online/album/], a[href*=/music-online/e/album/]")
                      for (a in albumElements) {
                          if (a.hasClass("tabs__link") || a.hasClass("pgn__link") || a.hasClass("b-title_all") || a.hasClass("b-title__all") || a.hasClass("b-title__sublink") || a.hasClass("list-link-blue")) continue
                          val url = a.absUrl("href").ifEmpty { toAbsoluteUrl(a.attr("href")) }
                          if (url.isEmpty()) continue
                          val targetPath = try { Uri.parse(url).path?.trimEnd('/') ?: "" } catch (_: Exception) { "" }
                          if (targetPath.isEmpty() || targetPath == currentPath) continue
                          if (Regex(""".*/p\d+$""").matches(targetPath)) continue
          
                          val b = a.selectFirst("b.t-strong_item") ?: a.selectFirst("b")
                          val ohDiv = a.selectFirst("div.oh")
                          val fullText = (ohDiv?.text() ?: a.text()).trim()
                          val albumTitle = (b?.text() ?: fullText.substringAfter(":")).trim()
                          if (albumTitle.isEmpty() || isNoiseText(albumTitle)) continue
          
                          var artistPrefix = ""
                          if (ohDiv != null) {
                              artistPrefix = ohDiv.ownText().trim().trimEnd(':', '-', '—').trim()
                          }
                          if (artistPrefix.isEmpty() && fullText.contains(":")) {
                              artistPrefix = fullText.substringBefore(":").trim()
                          }
                          val subtitle = if (artistPrefix.isNotEmpty() && !artistPrefix.equals(albumTitle, ignoreCase = true)) {
                              "Альбом • $artistPrefix"
                          } else {
                              "Альбом"
                          }
                          val img = a.selectFirst("img[src]")
                          val cover = if (img != null) img.absUrl("src").ifEmpty { toAbsoluteUrl(img.attr("src")) } else ""
          
                          val idKey = extractCanonicalKey(url, "album")
                          if (seen.add(idKey)) {
                              albumsList.add(SpaceItem(idKey, albumTitle, subtitle, url, true, type = ItemType.ALBUM, coverUrl = cover))
                          }
                      }
                  }
          
                  // 4. Жанры
                  if (isGenresListPage || mode == TabMode.GENRES) {
                      for (a in doc.select("a[href*=/music-online/search/by_tag/], a[href*=/music-online/genres/]")) {
                          if (a.hasClass("pgn__link")) continue
                          val url = a.absUrl("href").ifEmpty { toAbsoluteUrl(a.attr("href")) }
                          val targetPath = try { Uri.parse(url).path?.trimEnd('/') ?: "" } catch (_: Exception) { "" }
                          if (targetPath == "/music-online/genres" || Regex(""".*/p\d+$""").matches(targetPath)) continue
                          val text = a.selectFirst("span")?.text()?.trim() ?: a.selectFirst("b")?.text()?.trim() ?: a.text().trim()
                          if (text.isEmpty() || isNoiseText(text)) continue
                          val idKey = extractCanonicalKey(url, "genre")
                          if (seen.add(idKey)) {
                              genresList.add(SpaceItem(idKey, text, "Жанр музыки", url, true, type = ItemType.GENRE))
                          }
                      }
                  }
          
                  val result = ArrayList<SpaceItem>()
                  result.addAll(tracksList)
                  result.addAll(artistsList)
                  result.addAll(albumsList)
                  result.addAll(genresList)
                  return result
              }
          
              private fun performMusicOnlineSearch(query: String, addToHistory: Boolean, restoreSubFilter: SubFilter = SubFilter.ALL) {
                  loadJob?.cancel()
                  val cleanInput = query.trim()
                  val enc = try { URLEncoder.encode(cleanInput, "UTF-8") } catch (_: Exception) { cleanInput }
                  val searchUrl = "$baseHost/music-online/search/index/?Link_id=1039269&T=0&sq=$enc&CK=1"
          
                  if (addToHistory && currentEntry.url.isNotEmpty() && currentEntry.url != searchUrl) {
                      saveCurrentScrollPosition()
                      navHistory.push(currentEntry.copy())
                  }
                  rvTracks.visibility = View.VISIBLE
                  moreScreenContainer.visibility = View.GONE
                  sectionTabsScroll.visibility = View.GONE
                  currentSectionMeta = SectionMeta()
                  currentEntry = NavEntry(searchUrl, TabMode.SEARCH, "Поиск: $cleanInput", activeBottomTab, cleanInput, restoreSubFilter, currentSectionMeta)
                  highlightSubFilter(restoreSubFilter)
                  updateMirrorBadge()
          
                  val cached = pageCache.get(searchUrl)
                  if (cached != null) {
                      progressBar.visibility = View.GONE
                      if (::swipeRefresh.isInitialized) swipeRefresh.isRefreshing = false
                      nextPageUrl = cached.nextPageUrl
                      currentSectionMeta = cached.meta
                      allParsedItems.clear()
                      seenKeys.clear()
                      for (t in cached.items) {
                          if (seenKeys.add(t.idKey)) allParsedItems.add(t)
                      }
                      updateSubFilterVisibilityAndCounts()
                      rebuildDisplayedItems()
                      return
                  }
          
                  progressBar.visibility = View.VISIBLE
                  tvStatus.text = "Умный поиск «$cleanInput» (исправление опечаток и перевода)..."
          
                  loadJob = uiScope.launch {
                      val (found, nextUrl, meta, resolvedHint) = withContext(Dispatchers.IO) {
                          executeSmartCascadeSearchSuspend(cleanInput)
                      }
          
                      progressBar.visibility = View.GONE
                      if (::swipeRefresh.isInitialized) swipeRefresh.isRefreshing = false
                      nextPageUrl = nextUrl
                      currentSectionMeta = meta
                      if (resolvedHint.isNotEmpty() && !resolvedHint.equals(cleanInput, ignoreCase = true)) {
                          currentEntry = currentEntry.copy(
                              titleHint = "Поиск: $cleanInput → $resolvedHint",
                              searchQuery = resolvedHint
                          )
                      }
                      pageCache.put(searchUrl, CachedPage(found, nextUrl, meta))
                      updateMirrorBadge()
          
                      allParsedItems.clear()
                      seenKeys.clear()
                      for (t in found) {
                          if (seenKeys.add(t.idKey)) allParsedItems.add(t)
                      }
                      updateSubFilterVisibilityAndCounts()
                      rebuildDisplayedItems()
                      if (resolvedHint.isNotEmpty() && !resolvedHint.equals(cleanInput, ignoreCase = true)) {
                          tvStatus.text = "По запросу «$cleanInput» найдено для «$resolvedHint» (${allParsedItems.count { it.type == ItemType.TRACK }} треков)"
                      }
                      rvTracks.scrollToPosition(0)
                  }
              }
          
              private fun trySearchGet(query: String): Triple<List<SpaceItem>, String?, SectionMeta> {
                  return try {
                      val enc = URLEncoder.encode(query, "UTF-8")
                      val url = "$baseHost/music-online/search/index/?Link_id=1039269&T=0&sq=$enc&CK=1"
                      val doc = fetchDocFast(url) ?: return Triple(emptyList(), null, SectionMeta())
                      val finalUrl = doc.location() ?: url
                      val meta = extractSectionMeta(doc, finalUrl, query, SectionMeta())
                      val parsed = parseMusicOnlineDoc(doc, TabMode.SEARCH, finalUrl)
                      val next = findNextPageUrl(doc, finalUrl)
                      Triple(parsed, next, meta)
                  } catch (_: Exception) { Triple(emptyList(), null, SectionMeta()) }
              }
          
              private fun trySearchPost(query: String): Triple<List<SpaceItem>, String?, SectionMeta> {
                  return try {
                      val url = "$baseHost/music-online/search/index/"
                      val body = FormBody.Builder()
                          .add("sq", query)
                          .add("T", "0")
                          .add("CK", "1")
                          .build()
                      val req = Request.Builder().url(url).post(body)
                          .header("User-Agent", MusicEngine.USER_AGENT)
                          .header("Accept", "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8")
                          .header("Accept-Language", "ru-RU,ru;q=0.9")
                          .header("Referer", "$baseHost/music-online/?Link_id=1187356")
                          .header("Origin", baseHost)
                          .build()
                      httpClient.newCall(req).execute().use { resp ->
                          if (!resp.isSuccessful) return Triple(emptyList(), null, SectionMeta())
                          val html = resp.body?.string() ?: return Triple(emptyList(), null, SectionMeta())
                          val finalUrl = resp.request.url.toString()
                          val doc = Jsoup.parse(html, finalUrl)
                          val meta = extractSectionMeta(doc, finalUrl, query, SectionMeta())
                          val parsed = parseMusicOnlineDoc(doc, TabMode.SEARCH, finalUrl)
                          val next = findNextPageUrl(doc, finalUrl)
                          Triple(parsed, next, meta)
                      }
                  } catch (_: Exception) { Triple(emptyList(), null, SectionMeta()) }
              }
          
              private fun findNextPageUrl(doc: Document, currentUrl: String): String? {
                  // 1. Кнопки «Вперёд», «Далее», «>»
                  for (a in doc.select("div.pgar a, div.pgn a, div.pgn__wrap a, a.pgn__button, a.pgn__link_next")) {
                      if (a.hasClass("pgn__link_disabled") || a.hasClass("disabled") || a.hasClass("clicked")) continue
                      val t = a.text().lowercase().trim()
                      if (t.contains("вперёд") || t.contains("вперед") || t == ">" || t.contains("далее") || a.hasClass("pgn__link_next")) {
                          val h = a.absUrl("href").ifEmpty { toAbsoluteUrl(a.attr("href")) }
                          if (h.isNotEmpty() && h != currentUrl) return h
                      }
                  }
          
                  // 2. Поиск следующей цифровой страницы (например, активна 1 -> ищем ссылку на 2)
                  val pgnContainer = doc.selectFirst("div.pgn, div.pgar, div.pgn__wrap")
                  if (pgnContainer != null) {
                      val activeText = pgnContainer.selectFirst(".clicked, .pgn__link_active, b")?.text()?.trim() ?: "1"
                      val curPage = activeText.toIntOrNull() ?: 1
                      val nextPageStr = (curPage + 1).toString()
                      for (a in pgnContainer.select("a[href]")) {
                          if (a.text().trim() == nextPageStr) {
                              val h = a.absUrl("href").ifEmpty { toAbsoluteUrl(a.attr("href")) }
                              if (h.isNotEmpty() && h != currentUrl) return h
                          }
                      }
                  }
          
                  return null
              }
          
              // ==================== КЛИКИ ПО ЭЛЕМЕНТАМ И КНОПКАМ «ВСЕ» ====================
          
              private fun onItemClicked(pos: Int) {
                  if (pos !in items.indices) return
                  val item = items[pos]
                  if (item.type == ItemType.HEADER) return
          
                  if (item.idKey == "hdr_artist_wave_launch") {
                      val firstArtistTrack = allParsedItems.firstOrNull { it.type == ItemType.TRACK && !it.isFolder }
                      val rawArtistTitle = currentEntry.titleHint.substringBefore(" •").replace("Исполнитель:", "").trim()
                      val seed = firstArtistTrack ?: SpaceItem(
                          idKey = "seed_artist_${rawArtistTitle.lowercase()}",
                          title = rawArtistTitle,
                          subtitle = rawArtistTitle,
                          url = currentEntry.url,
                          isFolder = false,
                          type = ItemType.TRACK
                      )
                      startTrackRadioWave(seed, closeFullPlayer = false)
                      return
                  }
          
                  if (item.idKey == "hdr_wave_control") {
                      if (waveSeedItem != null) {
                          waveSeedItem = null
                          Toast.makeText(this, "Переключено на общую «Мою волну»", Toast.LENGTH_SHORT).show()
                          openMyWaveScreen(seedTrack = null, forceRestart = true)
                      } else {
                          openMyWaveScreen(seedTrack = null, forceRestart = true)
                      }
                      return
                  }
          
                  // Нажатие на заголовок или кнопку «Показать все (400) ›»
                  if (item.type == ItemType.SECTION_ALL) {
                      if (item.targetFilter != SubFilter.ALL) {
                          openSubFilterPage(item.targetFilter)
                      } else if (item.url.isNotEmpty()) {
                          loadSubFilterUrl(item.url, SubFilter.ALL, item.title)
                      }
                      return
                  }
          
                  // Нажатие на кнопку «Загрузить ещё результаты ›»
                  if (item.type == ItemType.LOAD_MORE) {
                      if (currentEntry.tabMode == TabMode.MY_WAVE || item.idKey == "btn_load_more_wave") {
                          appendNextWaveBatchAsync(autoPlayFirst = false)
                      } else {
                          loadNextPage()
                      }
                      return
                  }
          
                  if (item.type == ItemType.PLAYLIST) {
                      openPlaylistItems(item.idKey.removePrefix("playlist_"), item.title)
                      return
                  }
          
                  if (item.isFolder) {
                      val nextMode = when (item.type) {
                          ItemType.ARTIST -> TabMode.ARTISTS
                          ItemType.ALBUM -> TabMode.FOLDER_VIEW
                          ItemType.GENRE -> TabMode.GENRES
                          else -> TabMode.FOLDER_VIEW
                      }
                      loadSection(item.url, nextMode, item.title, addToHistory = true)
                  } else {
                      playTrackAt(pos)
                  }
              }
          
              private fun extractMp3AndCoverFromDoc(doc: Document, item: SpaceItem): String {
                  harvestRelatedFromTrackDoc(doc, item)
                  val playerItem = doc.selectFirst("div.player_item[data-src], [data-src*=.mp3], [data-mp3]")
                  if (playerItem != null) {
                      val cover = playerItem.attr("data-cover").trim()
                      if (cover.isNotEmpty() && item.coverUrl.isEmpty()) item.coverUrl = toAbsoluteUrl(cover)
                      val ds = playerItem.absUrl("data-src").ifEmpty { toAbsoluteUrl(playerItem.attr("data-src")) }
                          .ifEmpty { playerItem.absUrl("data-mp3").ifEmpty { toAbsoluteUrl(playerItem.attr("data-mp3")) } }
                      if (ds.isNotEmpty() && isDirectAudioFileUrl(ds)) return ds
                  }
          
                  val dlLink = doc.selectFirst("a.__adv_download[href], a[href*=.mp3], a[href*=/music/download/], a[href*=/files/download/]")
                  if (dlLink != null) {
                      val href = dlLink.absUrl("href").ifEmpty { toAbsoluteUrl(dlLink.attr("href")) }
                      if (href.isNotEmpty() && isDirectAudioFileUrl(href)) return href
                  }
          
                  val audio = doc.selectFirst("audio[src], audio source[src]")
                  if (audio != null) {
                      val src = audio.absUrl("src").ifEmpty { toAbsoluteUrl(audio.attr("src")) }
                      if (src.isNotEmpty() && isDirectAudioFileUrl(src)) return src
                  }
          
                  val rawHtml = doc.outerHtml()
                  val directMatch = Regex("""https?://[^"'\s<>\\]+\.mp3(?:\?[^"'\s<>\\]*)?""", RegexOption.IGNORE_CASE).find(rawHtml)
                  if (directMatch != null) return directMatch.value
          
                  val escapedMatch = Regex("""https?:\\/\\/[^"'\s<>]+\.mp3(?:\?[^"'\s<>]*)?""", RegexOption.IGNORE_CASE).find(rawHtml)
                  if (escapedMatch != null) return escapedMatch.value.replace("\\/", "/")
          
                  return ""
              }
          
              private suspend fun resolveStreamUrl(item: SpaceItem): String {
                  if (item.filePath.isNotEmpty() && File(item.filePath).exists()) {
                      return item.filePath
                  }
                  val now = System.currentTimeMillis()
                  // Используем сохранённую прямую ссылку только если она была получена недавно в текущей сессии (< 20 мин),
                  // чтобы после сна или перезапуска приложения не пытаться играть протухшую временную ссылку!
                  if (item.directMp3.isNotEmpty() && item.mp3ResolvedAt > 0L && (now - item.mp3ResolvedAt) < 20 * 60 * 1000L) {
                      return item.directMp3
                  }
          
                  val fastMp3 = withContext(Dispatchers.IO) {
                      val doc = fetchDocFast(item.url) ?: return@withContext ""
                      val direct = extractMp3AndCoverFromDoc(doc, item)
                      if (direct.isNotEmpty()) return@withContext direct
          
                      val viewLink = doc.selectFirst("a[href*=/music/view/], a[href*=/files/view/]")
                      if (viewLink != null) {
                          val viewUrl = viewLink.absUrl("href").ifEmpty { toAbsoluteUrl(viewLink.attr("href")) }
                          if (viewUrl.isNotEmpty() && viewUrl != item.url) {
                              val viewDoc = fetchDocFast(viewUrl)
                              if (viewDoc != null) {
                                  val fromView = extractMp3AndCoverFromDoc(viewDoc, item)
                                  if (fromView.isNotEmpty()) return@withContext fromView
                              }
                          }
                      }
                      ""
                  }
          
                  if (fastMp3.isNotEmpty()) {
                      item.directMp3 = fastMp3
                      item.mp3ResolvedAt = System.currentTimeMillis()
                      return fastMp3
                  }
          
                  val web = withTimeoutOrNull(10000L) {
                      val deferred = CompletableDeferred<String>()
                      runOnUiThread {
                          webViewMp3Callback = { found -> if (!deferred.isCompleted) deferred.complete(found) }
                          hiddenWebView.loadUrl(item.url)
                      }
                      deferred.await()
                  } ?: ""
          
                  if (web.isNotEmpty()) {
                      item.directMp3 = web
                      item.mp3ResolvedAt = System.currentTimeMillis()
                  }
                  return web
              }
          
              private fun prefetchNextQueueTracks(fromQueueIndex: Int) {
                  val candidates = (fromQueueIndex + 1 until playbackQueue.size).take(3)
                  for (qIdx in candidates) {
                      val nextItem = playbackQueue.getOrNull(qIdx) ?: continue
                      val freshEnough = nextItem.directMp3.isNotEmpty() && (System.currentTimeMillis() - nextItem.mp3ResolvedAt) < 20 * 60 * 1000L
                      if (nextItem.filePath.isNotEmpty() || freshEnough) continue
                      uiScope.launch(Dispatchers.IO) {
                          try {
                              resolveStreamUrl(nextItem)
                          } catch (_: Exception) {}
                      }
                  }
              }
          
