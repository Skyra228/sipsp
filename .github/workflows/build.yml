                          android:textColor="#8E8E93"
                          android:textSize="11sp" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center_vertical"
                      android:layout_marginTop="2dp">

                      <Button
                          android:id="@+id/btnFavTrack"
                          android:layout_width="38dp"
                          android:layout_height="38dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:text="♡"
                          android:textColor="#FFCC00"
                          android:textSize="18sp"
                          android:padding="0dp" />

                      <Button
                          android:id="@+id/btnDownloadTrack"
                          android:layout_width="38dp"
                          android:layout_height="38dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:text="⬇"
                          android:textColor="#FFFFFF"
                          android:textSize="16sp"
                          android:padding="0dp" />

                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:orientation="vertical"
                          android:layout_marginHorizontal="8dp">

                          <TextView
                              android:id="@+id/tvNowPlayingTitle"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="Выберите трек"
                              android:textColor="#FFFFFF"
                              android:textSize="14sp"
                              android:textStyle="bold"
                              android:singleLine="true" />

                          <TextView
                              android:id="@+id/tvNowPlayingSub"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="Spaces Музыка • v7 ULTRA"
                              android:textColor="#8E8E93"
                              android:textSize="11sp"
                              android:singleLine="true" />
                      </LinearLayout>

                      <Button
                          android:id="@+id/btnPrev"
                          android:layout_width="38dp"
                          android:layout_height="38dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:text="⏮"
                          android:textColor="#FFFFFF"
                          android:textSize="15sp"
                          android:padding="0dp" />

                      <Button
                          android:id="@+id/btnPlayPause"
                          android:layout_width="46dp"
                          android:layout_height="46dp"
                          android:layout_marginHorizontal="2dp"
                          android:backgroundTint="#FFCC00"
                          android:text="▶"
                          android:textColor="#000000"
                          android:textStyle="bold"
                          android:textSize="17sp"
                          android:padding="0dp" />

                      <Button
                          android:id="@+id/btnNext"
                          android:layout_width="38dp"
                          android:layout_height="38dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:text="⏭"
                          android:textColor="#FFFFFF"
                          android:textSize="15sp"
                          android:padding="0dp" />
                  </LinearLayout>
              </LinearLayout>
          </LinearLayout>
          EOF

          # 8. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_media_play"
                  android:label="Spaces Музыка"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Material3.Dark.NoActionBar"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".PlaybackService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="androidx.media3.session.MediaSessionService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          # 9. PlaybackService.kt (Фоновый сервис + Аппаратный Эквалайзер и BassBoost)
          cat << 'EOF' > app/src/main/java/com/example/spacesplayer/PlaybackService.kt
          package com.example.spacesplayer

          import android.content.Context
          import android.content.Intent
          import android.media.audiofx.BassBoost
          import android.media.audiofx.Equalizer
          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.common.Player
          import androidx.media3.datasource.DefaultHttpDataSource
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService

          object MusicEngine {
              const val USER_AGENT = "Mozilla/5.0 (Linux; Android 14; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36"
              var player: ExoPlayer? = null
              var mediaSession: MediaSession? = null
              private var bassBoost: BassBoost? = null
              private var equalizer: Equalizer? = null
              var currentAudioPreset = 0

              fun ensureInitialized(context: Context) {
                  if (player == null) {
                      val appCtx = context.applicationContext
                      val dsFactory = DefaultHttpDataSource.Factory()
                          .setUserAgent(USER_AGENT)
                          .setAllowCrossProtocolRedirects(true)

                      val audioAttrs = AudioAttributes.Builder()
                          .setUsage(C.USAGE_MEDIA)
                          .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)
                          .build()

                      val exo = ExoPlayer.Builder(appCtx)
                          .setMediaSourceFactory(DefaultMediaSourceFactory(dsFactory))
                          .setAudioAttributes(audioAttrs, true)
                          .setHandleAudioBecomingNoisy(true)
                          .build()

                      exo.addListener(object : Player.Listener {
                          override fun onAudioSessionIdChanged(audioSessionId: Int) {
                              applyAudioPreset(currentAudioPreset)
                          }
                      })

                      player = exo
                      mediaSession = MediaSession.Builder(appCtx, exo).build()
                  }
              }

              fun applyAudioPreset(presetIndex: Int) {
                  currentAudioPreset = presetIndex
                  val sessionId = player?.audioSessionId ?: return
                  if (sessionId == C.AUDIO_SESSION_ID_UNSET || sessionId <= 0) return

                  try {
                      bassBoost?.release()
                      equalizer?.release()

                      val bb = BassBoost(0, sessionId)
                      val eq = Equalizer(0, sessionId)

                      when (presetIndex) {
                          0 -> { // Обычный
                              bb.enabled = false
                              eq.enabled = false
                          }
                          1 -> { // Басы в тачку (Макс. BassBoost)
                              bb.enabled = true
                              if (bb.strengthSupported) bb.setStrength(1000.toShort())
                              eq.enabled = true
                              if (eq.numberOfPresets > 0) eq.usePreset(0)
                          }
                          2 -> { // Рок
                              bb.enabled = true
                              if (bb.strengthSupported) bb.setStrength(500.toShort())
                              eq.enabled = true
                              val p = (0 until eq.numberOfPresets).firstOrNull {
                                  eq.getPresetName(it.toShort()).lowercase().contains("rock")
                              } ?: 0
                              if (eq.numberOfPresets > 0) eq.usePreset(p.toShort())
                          }
                          3 -> { // Поп / Клуб
                              bb.enabled = true
                              if (bb.strengthSupported) bb.setStrength(650.toShort())
                              eq.enabled = true
                              val p = (0 until eq.numberOfPresets).firstOrNull {
                                  val n = eq.getPresetName(it.toShort()).lowercase()
                                  n.contains("pop") || n.contains("dance")
                              } ?: 0
                              if (eq.numberOfPresets > 0) eq.usePreset(p.toShort())
                          }
                          4 -> { // Чистый вокал
                              bb.enabled = false
                              eq.enabled = true
                              val p = (0 until eq.numberOfPresets).firstOrNull {
                                  val n = eq.getPresetName(it.toShort()).lowercase()
                                  n.contains("vocal") || n.contains("flat") || n.contains("jazz")
                              } ?: 0
                              if (eq.numberOfPresets > 0) eq.usePreset(p.toShort())
                          }
                      }
                      bassBoost = bb
                      equalizer = eq
                  } catch (_: Exception) {
                  }
              }
          }

          class PlaybackService : MediaSessionService() {
              override fun onCreate() {
                  super.onCreate()
                  MusicEngine.ensureInitialized(this)
              }

              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo): MediaSession? {
                  MusicEngine.ensureInitialized(this)
                  return MusicEngine.mediaSession
              }

              override fun onTaskRemoved(rootIntent: Intent?) {
                  val p = MusicEngine.player
                  if (p == null || !p.playWhenReady) {
                      stopSelf()
                  }
              }
          }
          EOF

          # 10. MainActivity.kt (v7.0 ULTRA: Spaces + WebView DOM Bridge + Гибридный поиск + Избранное + Скачивание + Таймер)
          cat << 'EOF' > app/src/main/java/com/example/spacesplayer/MainActivity.kt
          package com.example.spacesplayer

          import android.annotation.SuppressLint
          import android.app.AlertDialog
          import android.app.DownloadManager
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.os.CountDownTimer
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputMethodManager
          import android.webkit.*
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MediaMetadata
          import androidx.media3.common.Player
          import androidx.media3.datasource.DefaultHttpDataSource
          import androidx.media3.exoplayer.ExoPlayer
