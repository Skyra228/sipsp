              private fun getPlaylistsObject(): JSONObject {
                  val raw = getSharedPreferences("selyuk_v15", Context.MODE_PRIVATE).getString("playlists_json", "{}") ?: "{}"
                  return try { JSONObject(raw) } catch (_: Exception) { JSONObject() }
              }
          
              private fun savePlaylistsObject(obj: JSONObject) {
                  val str = obj.toString()
                  uiScope.launch(Dispatchers.IO) {
                      getSharedPreferences("selyuk_v15", Context.MODE_PRIVATE).edit().putString("playlists_json", str).apply()
                      scheduleAutoBackup()
                  }
              }
          
              private fun showPlaylistsScreen() {
                  loadJob?.cancel()
                  progressBar.visibility = View.GONE
                  if (::swipeRefresh.isInitialized) swipeRefresh.isRefreshing = false
                  subFilterScroll.visibility = View.GONE
                  nextPageUrl = null
                  sectionTabsScroll.visibility = View.VISIBLE
                  currentEntry = NavEntry("", TabMode.PLAYLISTS, "Мои плейлисты", BottomTab.MY)
                  updateMirrorBadge()
          
                  val obj = getPlaylistsObject()
                  val list = ArrayList<SpaceItem>()
                  val names = obj.keys().asSequence().toList().sorted()
                  for (name in names) {
                      val arr = obj.optJSONArray(name) ?: JSONArray()
                      list.add(
                          SpaceItem(
                              idKey = "playlist_$name",
                              title = name,
                              subtitle = "Плейлист • Треков: ${arr.length()} (удерживайте для удаления)",
                              url = "",
                              isFolder = true,
                              type = ItemType.PLAYLIST
                          )
                      )
                  }
                  allParsedItems.clear()
                  allParsedItems.addAll(list)
                  items.clear()
                  items.addAll(list)
                  adapter.submitListAsync(ArrayList(items))
                  tvStatus.text = if (list.isNotEmpty()) "Плейлистов: ${list.size}" else "Нет плейлистов — нажмите «+ Новый плейлист»"
              }
          
              private fun openPlaylistItems(playlistName: String, title: String) {
                  navHistory.push(currentEntry.copy())
                  currentEntry = NavEntry("", TabMode.PLAYLIST_DETAIL, "Плейлист: $title", BottomTab.MY)
                  updateMirrorBadge()
          
                  val obj = getPlaylistsObject()
                  val arr = obj.optJSONArray(playlistName) ?: JSONArray()
                  val tracks = parseJsonTrackArray(arr)
                  allParsedItems.clear()
                  allParsedItems.addAll(tracks)
                  items.clear()
                  items.addAll(tracks)
                  syncSelectedIndex()
                  adapter.submitListAsync(ArrayList(items))
                  tvStatus.text = "$title (${tracks.size} треков)"
              }
          
              private fun showCreatePlaylistDialog(trackToAdd: SpaceItem?) {
                  val input = EditText(this).apply {
                      hint = "Название плейлиста"
                      setPadding(40, 30, 40, 30)
                  }
                  AlertDialog.Builder(this)
                      .setTitle("Новый плейлист")
                      .setView(input)
                      .setPositiveButton("Создать") { _, _ ->
                          val name = input.text.toString().trim()
                          if (name.isNotEmpty()) {
                              val obj = getPlaylistsObject()
                              val arr = obj.optJSONArray(name) ?: JSONArray()
                              if (trackToAdd != null) {
                                  arr.put(trackToJson(trackToAdd))
                              }
                              obj.put(name, arr)
                              savePlaylistsObject(obj)
                              Toast.makeText(this, "Плейлист «$name» создан", Toast.LENGTH_SHORT).show()
                              if (currentEntry.tabMode == TabMode.PLAYLISTS) showPlaylistsScreen()
                          }
                      }
                      .setNegativeButton("Отмена", null)
                      .show()
              }
          
              private fun showAddToPlaylistDialog(track: SpaceItem) {
                  val obj = getPlaylistsObject()
                  val names = obj.keys().asSequence().toList().sorted()
                  val options = ArrayList<String>()
                  options.add("+ Создать новый плейлист...")
                  options.addAll(names)
          
                  AlertDialog.Builder(this)
                      .setTitle("Добавить в плейлист")
                      .setItems(options.toTypedArray()) { _, which ->
                          if (which == 0) {
                              showCreatePlaylistDialog(track)
                          } else {
                              val name = options[which]
                              val arr = obj.optJSONArray(name) ?: JSONArray()
                              arr.put(trackToJson(track))
                              obj.put(name, arr)
                              savePlaylistsObject(obj)
                              Toast.makeText(this, "Добавлено в «$name»", Toast.LENGTH_SHORT).show()
                          }
                      }
                      .show()
              }
          
              private fun showPlaylistContextMenu(playlistItem: SpaceItem) {
                  val name = playlistItem.idKey.removePrefix("playlist_")
                  val options = arrayOf("Открыть плейлист", "Удалить плейлист «$name»")
                  AlertDialog.Builder(this)
                      .setTitle(name)
                      .setItems(options) { _, which ->
                          if (which == 0) {
                              openPlaylistItems(name, name)
                          } else {
                              val obj = getPlaylistsObject()
                              obj.remove(name)
                              savePlaylistsObject(obj)
                              showPlaylistsScreen()
                          }
                      }
                      .show()
              }
          
              private fun saveLastPlayedStateAsync() {
                  saveLastPlayedStateNow(includeQueue = false)
              }
          
              private fun saveLastPlayedStateNow(includeQueue: Boolean) {
                  val cur = currentPlayingItem ?: return
                  val livePos = if (player.mediaItemCount > 0) player.currentPosition else 0L
                  val pos = when {
                      livePos > 0L -> livePos
                      pendingRestoredTrackId == cur.idKey && pendingRestoredPositionMs > 0L -> pendingRestoredPositionMs
                      lastKnownPositionMs > 0L -> lastKnownPositionMs
                      else -> 0L
                  }
                  val liveDur = if (player.mediaItemCount > 0 && player.duration > 0L && player.duration != C.TIME_UNSET) player.duration else 0L
                  val dur = if (liveDur > 0L) liveDur else lastKnownDurationMs
          
                  lastKnownPositionMs = pos
                  if (dur > 0L) lastKnownDurationMs = dur
          
                  try {
                      val edit = getSharedPreferences("selyuk_v15", Context.MODE_PRIVATE).edit()
                          .putString("last_track", trackToJson(cur).toString())
                          .putLong("last_position_ms", pos)
                          .putLong("last_duration_ms", dur)
          
                      if (includeQueue && playbackQueue.isNotEmpty()) {
                          val qArr = JSONArray()
                          val startIdx = (playbackQueueIndex - 25).coerceAtLeast(0)
                          val endIdx = (playbackQueueIndex + 55).coerceAtMost(playbackQueue.size)
                          for (i in startIdx until endIdx) {
                              qArr.put(trackToJson(playbackQueue[i]))
                          }
                          val savedIdx = (playbackQueueIndex - startIdx).coerceAtLeast(0)
                          edit.putString("last_queue_json", qArr.toString())
                              .putInt("last_queue_index", savedIdx)
                              .putString("last_queue_title", playbackContextTitle)
                      }
                      edit.apply()
                  } catch (_: Exception) {}
              }
          
              private fun restoreLastPlayedState() {
                  val prefs = getSharedPreferences("selyuk_v15", Context.MODE_PRIVATE)
                  val raw = prefs.getString("last_track", "") ?: ""
                  if (raw.isEmpty()) return
                  try {
                      val o = JSONObject(raw)
                      val savedFilePath = o.optString("filePath")
                      val isServiceAlreadyPlayingThis = (player.mediaItemCount > 0 && MusicEngine.activeTrackId == o.optString("idKey"))
                      // Для онлайн-треков после перезапуска очищаем временную directMp3, чтобы получить свежую рабочую ссылку при нажатии Play
                      val restoredMp3 = if (savedFilePath.isNotEmpty() || isServiceAlreadyPlayingThis) o.optString("directMp3") else ""
          
                      val restored = SpaceItem(
                          idKey = o.optString("idKey"),
                          title = o.optString("title"),
                          subtitle = o.optString("subtitle"),
                          url = o.optString("url"),
                          isFolder = false,
                          directMp3 = restoredMp3,
                          type = ItemType.TRACK,
                          coverUrl = o.optString("coverUrl"),
                          filePath = savedFilePath,
                          fileSize = o.optLong("fileSize", 0L),
                          downloadedAt = o.optLong("downloadedAt", 0L)
                      )
                      if (restored.title.isNotEmpty()) {
                          currentPlayingItem = restored
                          val savedPos = if (isServiceAlreadyPlayingThis) {
                              player.currentPosition.coerceAtLeast(0L)
                          } else {
                              prefs.getLong("last_position_ms", 0L).coerceAtLeast(0L)
                          }
                          val savedDur = if (isServiceAlreadyPlayingThis && player.duration > 0L && player.duration != C.TIME_UNSET) {
                              player.duration
                          } else {
                              prefs.getLong("last_duration_ms", 0L).coerceAtLeast(0L)
                          }
          
                          pendingRestoredTrackId = if (isServiceAlreadyPlayingThis) "" else restored.idKey
                          pendingRestoredPositionMs = if (isServiceAlreadyPlayingThis) 0L else savedPos
                          lastKnownPositionMs = savedPos
                          lastKnownDurationMs = savedDur
          
                          // Восстанавливаем сохранённую очередь воспроизведения
                          val rawQueue = prefs.getString("last_queue_json", "") ?: ""
                          if (rawQueue.isNotEmpty()) {
                              val parsedQueue = parseJsonTrackArray(JSONArray(rawQueue))
                              for (qItem in parsedQueue) {
                                  if (qItem.filePath.isEmpty()) qItem.directMp3 = ""
                              }
                              if (parsedQueue.isNotEmpty()) {
                                  playbackQueue.clear()
                                  playbackQueue.addAll(parsedQueue)
                                  val savedIdx = prefs.getInt("last_queue_index", 0)
                                  val foundIdx = playbackQueue.indexOfFirst { it.idKey == restored.idKey }
                                  playbackQueueIndex = if (foundIdx >= 0) foundIdx else savedIdx.coerceIn(0, playbackQueue.size - 1)
                                  playbackContextTitle = prefs.getString("last_queue_title", "Топ-100 композиций") ?: "Топ-100 композиций"
                              }
                          }
                          if (playbackQueue.isEmpty()) {
                              playbackQueue.add(restored)
                              playbackQueueIndex = 0
                          }
          
                          updatePlayerUiForItem(restored)
                          tvCurrentTime.text = formatTime(savedPos)
                          if (savedDur > 0L) {
                              val maxSec = (savedDur / 1000L).toInt().coerceAtLeast(1)
                              val curSec = (savedPos / 1000L).toInt().coerceIn(0, maxSec)
                              seekBar.max = maxSec
                              seekBar.progress = curSec
                              waveformSeekBar.maxProgress = maxSec
                              waveformSeekBar.progress = curSec
                              tvTotalTime.text = "-" + formatTime((savedDur - savedPos).coerceAtLeast(0L))
                          } else if (savedPos > 0L) {
                              val approxMax = ((savedPos / 1000L).toInt() + 120).coerceAtLeast(180)
                              val curSec = (savedPos / 1000L).toInt()
                              seekBar.max = approxMax
                              seekBar.progress = curSec
                              waveformSeekBar.maxProgress = approxMax
                              waveformSeekBar.progress = curSec
                          }
          
                          if (!player.isPlaying && savedPos > 0L) {
                              tvNowPlayingSub.text = "${restored.subtitle} • Остановлено на ${formatTime(savedPos)}"
                          }
                          val drawableRes = if (player.isPlaying) R.drawable.bg_btn_pause_glow else R.drawable.bg_btn_play_glow
                          btnPlayPause.setBackgroundResource(drawableRes)
                          btnFullPlayPause.setBackgroundResource(drawableRes)
                          waveformSeekBar.isPlayingWave = player.isPlaying
                          syncSelectedIndex()
                      }
                  } catch (_: Exception) {}
              }
          
              private fun saveSearchQueryToHistory(query: String) {
                  uiScope.launch(Dispatchers.IO) {
                      val prefs = getSharedPreferences("selyuk_v15", Context.MODE_PRIVATE)
                      val raw = prefs.getString("search_queries", "[]") ?: "[]"
                      val list = ArrayList<String>()
                      try {
                          val arr = JSONArray(raw)
                          for (i in 0 until arr.length()) {
                              val s = arr.optString(i)
                              if (s.isNotEmpty() && !s.equals(query, ignoreCase = true)) list.add(s)
                          }
                      } catch (_: Exception) {}
                      list.add(0, query)
                      val out = JSONArray()
                      for (s in list.take(40)) out.put(s)
                      prefs.edit().putString("search_queries", out.toString()).apply()
                      withContext(Dispatchers.Main) {
                          setupSearchAutocomplete()
                      }
                  }
              }
          
              private fun setupSearchAutocomplete() {
                  uiScope.launch(Dispatchers.IO) {
                      val prefs = getSharedPreferences("selyuk_v15", Context.MODE_PRIVATE)
                      val raw = prefs.getString("search_queries", "[]") ?: "[]"
                      val suggestions = LinkedHashSet<String>()
                      try {
                          val arr = JSONArray(raw)
                          for (i in 0 until arr.length()) {
                              val s = arr.optString(i)
                              if (s.isNotEmpty()) suggestions.add(s)
                          }
                      } catch (_: Exception) {}
                      withContext(Dispatchers.Main) {
                          val autoAdapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_dropdown_item_1line, suggestions.toList())
                          etSearch.setAdapter(autoAdapter)
                      }
                  }
              }
          
