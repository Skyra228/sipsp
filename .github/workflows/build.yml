    private fun trackToJson(item: SpaceItem): JSONObject {
        val o = JSONObject()
        o.put("idKey", item.idKey)
        o.put("title", item.title)
        o.put("subtitle", item.subtitle)
        o.put("url", item.url)
        o.put("directMp3", item.directMp3)
        o.put("coverUrl", item.coverUrl)
        return o
    }

    private fun parseJsonTrackArray(arr: JSONArray): ArrayList<SpaceItem> {
        val list = ArrayList<SpaceItem>()
        for (i in 0 until arr.length()) {
            val o = arr.optJSONObject(i) ?: continue
            list.add(
                SpaceItem(
                    idKey = o.optString("idKey"),
                    title = o.optString("title"),
                    subtitle = o.optString("subtitle"),
                    url = o.optString("url"),
                    isFolder = false,
                    directMp3 = o.optString("directMp3"),
                    type = ItemType.TRACK,
                    coverUrl = o.optString("coverUrl")
                )
            )
        }
        return list
    }

    private fun getSavedTracks(key: String): ArrayList<SpaceItem> {
        val prefs = getSharedPreferences("selyuk_v15", Context.MODE_PRIVATE)
        val raw = prefs.getString(key, "[]") ?: "[]"
        return try { parseJsonTrackArray(JSONArray(raw)) } catch (_: Exception) { ArrayList() }
    }

    private fun saveTracksList(key: String, list: List<SpaceItem>) {
        val arr = JSONArray()
        for (item in list.take(250)) {
            arr.put(trackToJson(item))
        }
        getSharedPreferences("selyuk_v15", Context.MODE_PRIVATE)
            .edit().putString(key, arr.toString()).apply()
    }

    private fun isFavorite(item: SpaceItem): Boolean =
        getSavedTracks("favorites").any { it.idKey == item.idKey || (it.title == item.title && it.subtitle == item.subtitle) }

    private fun toggleFavorite(item: SpaceItem): Boolean {
        val favs = getSavedTracks("favorites")
        val idx = favs.indexOfFirst { it.idKey == item.idKey || (it.title == item.title && it.subtitle == item.subtitle) }
        return if (idx >= 0) {
            favs.removeAt(idx); saveTracksList("favorites", favs); false
        } else {
            favs.add(0, item); saveTracksList("favorites", favs); true
        }
    }

    private fun addToHistory(item: SpaceItem) {
        val hist = getSavedTracks("history")
        hist.removeAll { it.idKey == item.idKey || (it.title == item.title && it.subtitle == item.subtitle) }
        hist.add(0, item)
        saveTracksList("history", hist)
    }

    private fun showSavedList(key: String, label: String) {
        loadJob?.cancel()
        progressBar.visibility = View.GONE
        subFilterScroll.visibility = View.GONE
        nextPageUrl = null
        currentEntry = NavEntry("", if (key == "favorites") TabMode.FAVORITES else TabMode.HISTORY, label, BottomTab.MY)
        updateMirrorBadge()
        val saved = getSavedTracks(key)
        allParsedItems.clear()
        allParsedItems.addAll(saved)
        items.clear(); seenKeys.clear()
        items.addAll(saved)
        syncSelectedIndex()
        adapter.submitList(ArrayList(items))
        tvStatus.text = if (saved.isNotEmpty()) "$label (${saved.size} треков)" else "$label: пока пусто"
    }

    private fun downloadTrackItem(targetItem: SpaceItem) {
        uiScope.launch {
            Toast.makeText(this@MainActivity, "Подготовка загрузки «${targetItem.title}»...", Toast.LENGTH_SHORT).show()
            val mp3 = resolveStreamUrl(targetItem)
            if (mp3.isEmpty()) {
                Toast.makeText(this@MainActivity, "Не удалось получить прямую ссылку MP3", Toast.LENGTH_SHORT).show()
                return@launch
            }
            try {
                val cleanSub = targetItem.subtitle.substringBefore("•").trim().ifEmpty { "SelyukMusic" }
                val name = "$cleanSub - ${targetItem.title}".replace(Regex("[\\\\/:*?\"<>|]"), "_").take(90) + ".mp3"
                val req = DownloadManager.Request(Uri.parse(mp3))
                    .setTitle(targetItem.title)
                    .setDescription(cleanSub)
                    .addRequestHeader("User-Agent", MusicEngine.USER_AGENT)
                    .addRequestHeader("Referer", targetItem.url)
                    .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                    .setDestinationInExternalPublicDir(Environment.DIRECTORY_MUSIC, "SelyukMusic/$name")
                (getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager).enqueue(req)
                Toast.makeText(this@MainActivity, "⬇ Скачивание в Music/SelyukMusic/$name", Toast.LENGTH_LONG).show()
            } catch (e: Exception) {
                Toast.makeText(this@MainActivity, "Ошибка: ${e.message}", Toast.LENGTH_SHORT).show()
            }
        }
    }

    private fun showMirrorDialog() {
        val input = EditText(this).apply { setText(baseHost); setPadding(40, 30, 40, 30) }
        AlertDialog.Builder(this)
            .setTitle("Зеркало сайта")
            .setView(input)
            .setPositiveButton("Сохранить") { _, _ ->
                val raw = input.text.toString().trim()
                if (raw.isNotEmpty()) {
                    baseHost = extractCleanHost(raw)
                    getSharedPreferences("selyuk_v15", Context.MODE_PRIVATE).edit().putString("host", baseHost).apply()
                    pageCache.evictAll()
                    subFilterCache.evictAll()
                    navHistory.clear(); updateMirrorBadge()
                    switchBottomTab(BottomTab.HOME)
                }
            }
            .setNegativeButton("Отмена", null).show()
    }

    private fun hideKeyboard() {
        (getSystemService(Context.INPUT_METHOD_SERVICE) as? InputMethodManager)?.hideSoftInputFromWindow(etSearch.windowToken, 0)
    }

    private fun toAbsoluteUrl(path: String): String {
        val clean = path.trim()
        if (clean.isEmpty()) return ""
        return when {
            clean.startsWith("http://") || clean.startsWith("https://") -> clean
            clean.startsWith("//") -> "https:$clean"
            clean.startsWith("/") -> baseHost + clean
            else -> "$baseHost/$clean"
        }
    }

    private fun fetchDocFast(urlOrPath: String): Document? {
        return try {
            val full = toAbsoluteUrl(urlOrPath)
            if (full.isEmpty()) return null
            val req = Request.Builder().url(full)
                .header("User-Agent", MusicEngine.USER_AGENT)
                .header("Accept", "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8")
                .header("Accept-Language", "ru-RU,ru;q=0.9")
                .header("Referer", "$baseHost/music-online/?Link_id=1187356")
                .build()
            httpClient.newCall(req).execute().use { resp ->
                if (!resp.isSuccessful) return null
                val html = resp.body?.string() ?: return null
                val actualUrl = resp.request.url.toString()
                val host = resp.request.url.host
                if (host.isNotEmpty() && (host.contains("spcs") || host.contains("spaces"))) {
                    baseHost = "${resp.request.url.scheme}://$host"
                }
                Jsoup.parse(html, actualUrl)
            }
        } catch (_: Exception) { null }
    }

    private fun formatTime(ms: Long): String {
        if (ms <= 0) return "0:00"
        return String.format("%d:%02d", (ms / 1000) / 60, (ms / 1000) % 60)
    }

    private fun navigateBack() {
        if (fullPlayerOverlay.visibility == View.VISIBLE) {
            fullPlayerOverlay.visibility = View.GONE
            return
        }
        if (navHistory.isNotEmpty()) {
            val prev = navHistory.pop()
            updateMirrorBadge()
            if (prev.tabMode == TabMode.PLAYLISTS) {
                showPlaylistsScreen()
            } else if (prev.tabMode == TabMode.SEARCH && prev.searchQuery.isNotEmpty()) {
                etSearch.setText(prev.searchQuery)
                performMusicOnlineSearch(prev.searchQuery, addToHistory = false, restoreSubFilter = prev.subFilter)
            } else {
                loadSection(
                    prev.url,
                    prev.tabMode,
                    prev.titleHint,
                    addToHistory = false,
                    restoreScrollPos = prev.scrollPos,
                    restoreScrollOffset = prev.scrollOffset,
                    restoreSubFilter = prev.subFilter
                )
            }
        }
    }

    @Deprecated("Deprecated in Java")
    override fun onBackPressed() {
        if (fullPlayerOverlay.visibility == View.VISIBLE) {
            fullPlayerOverlay.visibility = View.GONE
        } else if (navHistory.isNotEmpty()) {
            navigateBack()
        } else if (activeBottomTab != BottomTab.HOME) {
            switchBottomTab(BottomTab.HOME)
        } else {
            @Suppress("DEPRECATION")
            super.onBackPressed()
        }
    }

    override fun onStop() {
        super.onStop()
        saveLastPlayedState()
    }

    override fun onDestroy() {
        super.onDestroy()
        saveLastPlayedState()
        sleepTimer?.cancel()
        handler.removeCallbacksAndMessages(null)
        uiScope.cancel()
    }

    // ==================== АДАПТЕР С DIFFUTIL И ПОДДЕРЖКОЙ ОБЛОЖЕК ====================

    inner class SpaceAdapter(
        private val onClick: (Int) -> Unit,
        private val onLongClick: (Int) -> Unit
    ) : RecyclerView.Adapter<SpaceAdapter.VH>() {
        private val currentList = ArrayList<SpaceItem>()
        var selectedIndex = -1

        fun submitList(newList: List<SpaceItem>) {
            val diff = DiffUtil.calculateDiff(object : DiffUtil.Callback() {
                override fun getOldListSize(): Int = currentList.size
                override fun getNewListSize(): Int = newList.size
                override fun areItemsTheSame(oldPos: Int, newPos: Int): Boolean =
                    currentList[oldPos].idKey == newList[newPos].idKey
                override fun areContentsTheSame(oldPos: Int, newPos: Int): Boolean =
                    currentList[oldPos] == newList[newPos]
            })
            currentList.clear()
            currentList.addAll(newList)
            diff.dispatchUpdatesTo(this)
        }

        fun notifyPlayingStateChanged() {
            notifyItemRangeChanged(0, currentList.size, "PLAY_STATE")
        }

        fun notifyCoverLoaded(coverUrl: String) {
            for (i in currentList.indices) {
                if (currentList[i].coverUrl == coverUrl) {
                    notifyItemChanged(i, "COVER")
                }
            }
        }

        inner class VH(v: View) : RecyclerView.ViewHolder(v) {
            val coverFrame: View = v.findViewById(R.id.coverFrame)
            val tvCover: TextView = v.findViewById(R.id.tvCover)
            val ivCover: ImageView = v.findViewById(R.id.ivCover)
            val tvTitle: TextView = v.findViewById(R.id.tvTitle)
            val tvSubtitle: TextView = v.findViewById(R.id.tvSubtitle)
            val tvPlayIcon: TextView = v.findViewById(R.id.tvPlayIcon)
        }

        override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
            val v = LayoutInflater.from(parent.context).inflate(R.layout.item_track, parent, false)
            return VH(v)
        }

        override fun onBindViewHolder(holder: VH, position: Int) {
            val item = currentList[position]
            holder.tvTitle.text = item.title
            holder.tvSubtitle.text = item.subtitle

            if (item.type == ItemType.HEADER) {
                holder.coverFrame.visibility = View.GONE
                holder.tvPlayIcon.visibility = View.GONE
                holder.tvTitle.setTextColor(0xFFFFCC00.toInt())
                holder.tvTitle.textSize = 12f
                holder.tvSubtitle.setTextColor(0xFF8E8E93.toInt())
                holder.tvSubtitle.textSize = 11f
                holder.itemView.isClickable = false
                holder.itemView.setOnClickListener(null)
                holder.itemView.setOnLongClickListener(null)
                return
            }

            holder.coverFrame.visibility = View.VISIBLE
            holder.tvPlayIcon.visibility = View.VISIBLE
            holder.tvTitle.textSize = 15f
            holder.tvSubtitle.textSize = 12f
            holder.itemView.isClickable = true

            val titleDefaultColor = if (isLightTheme) 0xFF141416.toInt() else 0xFFFFFFFF.toInt()

            if (item.isFolder) {
                val iconSym = when (item.type) {
                    ItemType.ARTIST -> "👤"
                    ItemType.ALBUM -> "💿"
                    ItemType.GENRE -> "🏷"
                    ItemType.PLAYLIST -> "🎶"
                    else -> "📁"
                }
                bindRowCover(item.coverUrl, holder.ivCover, holder.tvCover, iconSym)
                holder.tvTitle.setTextColor(titleDefaultColor)
                holder.tvSubtitle.setTextColor(
                    when (item.type) {
                        ItemType.ARTIST -> 0xFFFFD54F.toInt()
                        ItemType.ALBUM -> 0xFF81D4FA.toInt()
                        else -> 0xFF8EEB93.toInt()
                    }
                )
                holder.tvPlayIcon.text = "›"
            } else {
                val sel = position == selectedIndex || (currentPlayingItem?.idKey == item.idKey)
                val sym = if (sel && player.isPlaying) "🔊" else "♪"
                bindRowCover(item.coverUrl, holder.ivCover, holder.tvCover, sym)
                holder.tvTitle.setTextColor(if (sel) 0xFFFFCC00.toInt() else titleDefaultColor)
                holder.tvSubtitle.setTextColor(0xFF8EEB93.toInt())
                holder.tvPlayIcon.text = if (sel && player.isPlaying) "❚❚" else "▶"
            }

            holder.itemView.setOnClickListener {
                val pos = holder.bindingAdapterPosition
                if (pos != RecyclerView.NO_POSITION) onClick(pos)
            }
            holder.itemView.setOnLongClickListener {
                val pos = holder.bindingAdapterPosition
                if (pos != RecyclerView.NO_POSITION) onLongClick(pos)
                true
            }
        }

        private fun bindRowCover(coverUrl: String, iv: ImageView, tv: TextView, symbol: String) {
            tv.text = symbol
            if (coverUrl.isEmpty()) {
                iv.visibility = View.GONE
                tv.visibility = View.VISIBLE
                return
            }
            val bmp = bitmapCache.get(coverUrl)
            if (bmp != null) {
                iv.setImageBitmap(bmp)
                iv.visibility = View.VISIBLE
                tv.visibility = View.GONE
            } else {
                iv.visibility = View.GONE
                tv.visibility = View.VISIBLE
                bindCoverToViews(coverUrl, iv, tv, symbol)
            }
        }

        override fun getItemCount(): Int = currentList.size
    }
}
