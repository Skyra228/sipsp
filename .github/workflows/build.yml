    // ==================== ПОДФИЛЬТРЫ С ПОДГРУЗКОЙ ПОЛНЫХ ПОДСТРАНИЦ (ЗАДАЧА 2) ====================

    private fun shouldShowSubFilters(): Boolean {
        val path = try { Uri.parse(currentEntry.url).path ?: "" } catch (_: Exception) { "" }
        return currentEntry.tabMode == TabMode.SEARCH ||
                path.contains("/artist/") ||
                path.contains("/by_tag/")
    }

    private fun updateSubFilterVisibilityAndCounts() {
        if (!shouldShowSubFilters()) {
            subFilterScroll.visibility = View.GONE
            return
        }
        val artistCount = allParsedItems.count { it.type == ItemType.ARTIST }
        val albumCount = allParsedItems.count { it.type == ItemType.ALBUM }
        val trackCount = allParsedItems.count { it.type == ItemType.TRACK }
        val totalCount = artistCount + albumCount + trackCount

        subFilterScroll.visibility = View.VISIBLE
        filterAll.text = "Все ($totalCount)"
        filterArtists.text = "👤 Исполнители ($artistCount)"
        filterAlbums.text = "💿 Альбомы ($albumCount)"
        filterTracks.text = "♪ Треки ($trackCount)"

        val path = try { Uri.parse(currentEntry.url).path ?: "" } catch (_: Exception) { "" }
        filterArtists.visibility = if (path.contains("/artist/") && !currentEntry.tabMode.equals(TabMode.SEARCH)) View.GONE else View.VISIBLE
        filterAlbums.visibility = View.VISIBLE
        filterTracks.visibility = View.VISIBLE
    }

    private fun buildSubFilterUrl(entry: NavEntry, filter: SubFilter): String? {
        if (filter == SubFilter.ALL) return null
        if (entry.tabMode == TabMode.SEARCH && entry.searchQuery.isNotEmpty()) {
            val enc = try { URLEncoder.encode(entry.searchQuery, "UTF-8") } catch (_: Exception) { entry.searchQuery }
            val tParam = when (filter) {
                SubFilter.TRACKS -> "1"
                SubFilter.ARTISTS -> "2"
                SubFilter.ALBUMS -> "3"
                else -> "0"
            }
            return "$baseHost/music-online/search/index/?sq=$enc&T=$tParam&CK=1"
        }

        val cleanBase = entry.url.substringBefore("?").trimEnd('/')
            .removeSuffix("/tracks").removeSuffix("/albums").removeSuffix("/similar")
        if (cleanBase.contains("/artist/")) {
            return when (filter) {
                SubFilter.TRACKS -> "$cleanBase/tracks/"
                SubFilter.ALBUMS -> "$cleanBase/albums/"
                SubFilter.ARTISTS -> "$cleanBase/similar/"
                else -> null
            }
        }
        return null
    }

    private fun onSubFilterClicked(filter: SubFilter) {
        highlightSubFilter(filter)
        currentEntry = currentEntry.copy(subFilter = filter)

        if (filter == SubFilter.ALL) {
            rebuildDisplayedItems()
            return
        }

        val subUrl = buildSubFilterUrl(currentEntry, filter)
        if (subUrl == null) {
            rebuildDisplayedItems()
            return
        }

        val cacheKey = "sub_${currentEntry.url}_${filter.name}"
        val cached = subFilterCache.get(cacheKey)
        if (cached != null) {
            mergeSubpageItems(cached.items, cached.nextPageUrl)
            rebuildDisplayedItems()
            return
        }

        val targetChip = when (filter) {
            SubFilter.ARTISTS -> filterArtists
            SubFilter.ALBUMS -> filterAlbums
            SubFilter.TRACKS -> filterTracks
            else -> filterAll
        }
        val baseLabel = when (filter) {
            SubFilter.ARTISTS -> "⏳ Исполнители..."
            SubFilter.ALBUMS -> "⏳ Альбомы..."
            SubFilter.TRACKS -> "⏳ Треки..."
            else -> "⏳ Все..."
        }
        targetChip.text = baseLabel
        progressBar.visibility = View.VISIBLE
        rebuildDisplayedItems()

        subFilterJob?.cancel()
        subFilterJob = uiScope.launch {
            val (subItems, subNext) = withContext(Dispatchers.IO) {
                val doc = fetchDocFast(subUrl)
                if (doc != null) {
                    val fUrl = doc.location() ?: subUrl
                    val modeForParse = when (filter) {
                        SubFilter.ARTISTS -> TabMode.ARTISTS
                        SubFilter.ALBUMS -> TabMode.ALBUMS
                        else -> TabMode.SEARCH
                    }
                    val parsed = parseMusicOnlineDoc(doc, modeForParse, fUrl)
                    val nxt = findNextPageUrl(doc, fUrl)
                    Pair(parsed, nxt)
                } else {
                    Pair(emptyList(), null)
                }
            }
            progressBar.visibility = View.GONE
            if (subItems.isNotEmpty()) {
                subFilterCache.put(cacheKey, CachedPage(subItems, subNext))
                mergeSubpageItems(subItems, subNext)
            }
            updateSubFilterVisibilityAndCounts()
            rebuildDisplayedItems()
            rvTracks.scrollToPosition(0)
        }
    }

    private fun mergeSubpageItems(newItems: List<SpaceItem>, subNextUrl: String?) {
        for (item in newItems) {
            if (seenKeys.add(item.idKey)) {
                allParsedItems.add(item)
            }
        }
        if (subNextUrl != null) {
            nextPageUrl = subNextUrl
        }
    }

    private fun rebuildDisplayedItems() {
        val displayList = ArrayList<SpaceItem>()

        val artists = allParsedItems.filter { it.type == ItemType.ARTIST }
        val albums = allParsedItems.filter { it.type == ItemType.ALBUM }
        val tracks = allParsedItems.filter { it.type == ItemType.TRACK }
        val others = allParsedItems.filter { it.type != ItemType.ARTIST && it.type != ItemType.ALBUM && it.type != ItemType.TRACK }

        val hasMultipleSections = (if (artists.isNotEmpty()) 1 else 0) +
                (if (albums.isNotEmpty()) 1 else 0) +
                (if (tracks.isNotEmpty()) 1 else 0) > 1

        when (activeSubFilter) {
            SubFilter.ALL -> {
                if (currentEntry.tabMode == TabMode.SEARCH || hasMultipleSections) {
                    if (artists.isNotEmpty()) {
                        displayList.add(SpaceItem("hdr_artists", "ИСПОЛНИТЕЛИ (${artists.size})", "Нажмите на артиста для просмотра альбомов и треков", "", true, type = ItemType.HEADER))
                        displayList.addAll(artists)
                    }
                    if (albums.isNotEmpty()) {
                        displayList.add(SpaceItem("hdr_albums", "АЛЬБОМЫ (${albums.size})", "Нажмите на альбом для открытия списка песен", "", true, type = ItemType.HEADER))
                        displayList.addAll(albums)
                    }
                    if (tracks.isNotEmpty()) {
                        if (artists.isNotEmpty() || albums.isNotEmpty()) {
                            displayList.add(SpaceItem("hdr_tracks", "ТРЕКИ (${tracks.size})", "Тап — играть, свайп вправо — в любимые, влево — скачать", "", true, type = ItemType.HEADER))
                        }
                        displayList.addAll(tracks)
                    }
                    displayList.addAll(others)
                } else {
                    displayList.addAll(allParsedItems)
                }
            }
            SubFilter.ARTISTS -> displayList.addAll(artists)
            SubFilter.ALBUMS -> displayList.addAll(albums)
            SubFilter.TRACKS -> displayList.addAll(tracks)
        }

        items.clear()
        items.addAll(displayList)
        syncSelectedIndex()
        adapter.submitList(ArrayList(items))
        setupSearchAutocomplete()

        val statusParts = ArrayList<String>()
        if (tracks.isNotEmpty()) statusParts.add("Треков: ${tracks.size}")
        if (artists.isNotEmpty()) statusParts.add("Артистов: ${artists.size}")
        if (albums.isNotEmpty()) statusParts.add("Альбомов: ${albums.size}")
        if (others.isNotEmpty()) statusParts.add("Разделов: ${others.size}")

        tvStatus.text = if (statusParts.isNotEmpty()) {
            "${currentEntry.titleHint} • " + statusParts.joinToString(" | ")
        } else {
            "${currentEntry.titleHint} • Список пуст"
        }
    }

    private fun syncSelectedIndex() {
        val cur = currentPlayingItem
        if (cur == null) {
            adapter.selectedIndex = -1
            currentIndex = -1
            return
        }
        val idx = items.indexOfFirst { !it.isFolder && it.idKey == cur.idKey }
        adapter.selectedIndex = idx
        if (idx >= 0) currentIndex = idx
    }

    // ==================== НАВИГАЦИЯ С КЭШЕМ И СОХРАНЕНИЕМ СКРОЛЛА (ЗАДАЧА 3 И 4) ====================

    private fun saveCurrentScrollPosition() {
        val firstPos = lm.findFirstVisibleItemPosition()
        val firstView = lm.findViewByPosition(firstPos)
        currentEntry.scrollPos = if (firstPos >= 0) firstPos else 0
        currentEntry.scrollOffset = firstView?.top ?: 0
    }

    private fun enrichArtistPage(baseArtistUrl: String, initialItems: List<SpaceItem>, initialNext: String?): Pair<List<SpaceItem>, String?> {
        val cleanBase = baseArtistUrl.substringBefore("?").trimEnd('/')
            .removeSuffix("/tracks").removeSuffix("/albums").removeSuffix("/similar")
        val combined = ArrayList<SpaceItem>()
        val seen = HashSet<String>()
        var bestNextUrl = initialNext

        val albumsDoc = fetchDocFast("$cleanBase/albums/")
        if (albumsDoc != null) {
            val albUrl = albumsDoc.location() ?: "$cleanBase/albums/"
            val albItems = parseMusicOnlineDoc(albumsDoc, TabMode.ALBUMS, albUrl).filter { it.type == ItemType.ALBUM }
            for (a in albItems) {
                if (seen.add(a.idKey)) combined.add(a)
            }
            subFilterCache.put("sub_${baseArtistUrl}_${SubFilter.ALBUMS.name}", CachedPage(albItems, findNextPageUrl(albumsDoc, albUrl)))
        }

        for (i in initialItems.filter { it.type == ItemType.ALBUM }) {
            if (seen.add(i.idKey)) combined.add(i)
        }

        val tracksDoc = fetchDocFast("$cleanBase/tracks/")
        if (tracksDoc != null) {
            val tUrl = tracksDoc.location() ?: "$cleanBase/tracks/"
            val trkItems = parseMusicOnlineDoc(tracksDoc, TabMode.ONLINE, tUrl).filter { it.type == ItemType.TRACK }
            for (t in trkItems) {
                if (seen.add(t.idKey)) combined.add(t)
            }
            val tracksNext = findNextPageUrl(tracksDoc, tUrl)
            if (tracksNext != null) bestNextUrl = tracksNext
            subFilterCache.put("sub_${baseArtistUrl}_${SubFilter.TRACKS.name}", CachedPage(trkItems, tracksNext))
        }

        for (i in initialItems) {
            if (seen.add(i.idKey)) combined.add(i)
        }

        return Pair(combined, bestNextUrl)
    }

    private fun loadSection(
        urlOrPath: String,
        mode: TabMode,
        title: String,
        addToHistory: Boolean,
        restoreScrollPos: Int = 0,
        restoreScrollOffset: Int = 0,
        restoreSubFilter: SubFilter = SubFilter.ALL
    ) {
        loadJob?.cancel()
        subFilterJob?.cancel()
        val fullTarget = toAbsoluteUrl(urlOrPath)
        if (addToHistory && currentEntry.url.isNotEmpty() && currentEntry.url != fullTarget) {
            saveCurrentScrollPosition()
            navHistory.push(currentEntry.copy())
        }
        currentEntry = NavEntry(fullTarget, mode, title, activeBottomTab, "", restoreSubFilter, restoreScrollPos, restoreScrollOffset)
        highlightSubFilter(restoreSubFilter)
        updateMirrorBadge()

        // Мгновенный возврат из LruCache без сетевого запроса
        val cached = pageCache.get(fullTarget)
        if (cached != null) {
            progressBar.visibility = View.GONE
            nextPageUrl = cached.nextPageUrl
            allParsedItems.clear()
            seenKeys.clear()
            for (i in cached.items) {
                if (seenKeys.add(i.idKey)) allParsedItems.add(i)
            }
            updateSubFilterVisibilityAndCounts()
            rebuildDisplayedItems()
            rvTracks.post { lm.scrollToPositionWithOffset(restoreScrollPos, restoreScrollOffset) }
            return
        }

        progressBar.visibility = View.VISIBLE
        tvStatus.text = "Загрузка: $title..."

        loadJob = uiScope.launch {
            val (parsedList, resolvedNextUrl) = withContext(Dispatchers.IO) {
                var d = fetchDocFast(fullTarget)
                if (d == null && mode == TabMode.POPULAR) {
                    d = fetchDocFast(onlineRootUrl)
                }
                if (d == null) return@withContext Pair<List<SpaceItem>?, String?>(null, null)

                val finalUrl = d.location() ?: fullTarget
                var next = findNextPageUrl(d, finalUrl)
                var parsed = parseMusicOnlineDoc(d, mode, finalUrl)

                val path = try { Uri.parse(finalUrl).path ?: "" } catch (_: Exception) { "" }
                val isSingleArtistRoot = path.contains("/artist/") && !Regex(""".*/p\d+/?$""").matches(path)
                if (isSingleArtistRoot) {
                    val enriched = enrichArtistPage(finalUrl, parsed, next)
                    parsed = enriched.first
                    next = enriched.second
                }
                Pair(parsed, next)
            }

            progressBar.visibility = View.GONE
            updateMirrorBadge()

            if (parsedList != null) {
                nextPageUrl = resolvedNextUrl
                pageCache.put(fullTarget, CachedPage(parsedList, resolvedNextUrl))
                allParsedItems.clear()
                seenKeys.clear()
                for (i in parsedList) {
                    if (seenKeys.add(i.idKey)) allParsedItems.add(i)
                }
                updateSubFilterVisibilityAndCounts()
                rebuildDisplayedItems()
                rvTracks.post { lm.scrollToPositionWithOffset(restoreScrollPos, restoreScrollOffset) }
            } else {
                tvStatus.text = "Ошибка загрузки раздела (проверьте сеть или зеркало)"
            }
        }
    }

    private fun loadNextPage() {
        val next = nextPageUrl ?: return
        isLoadingMore = true
        progressBar.visibility = View.VISIBLE
        uiScope.launch {
            val (doc, finalUrl) = withContext(Dispatchers.IO) {
                val d = fetchDocFast(next)
                Pair(d, d?.location() ?: next)
            }
            progressBar.visibility = View.GONE
            isLoadingMore = false
            if (doc != null) {
                nextPageUrl = findNextPageUrl(doc, finalUrl)
                val more = parseMusicOnlineDoc(doc, currentEntry.tabMode, finalUrl)
                var added = 0
                for (m in more) {
                    if (seenKeys.add(m.idKey)) {
                        allParsedItems.add(m)
                        added++
                    }
                }
                if (added > 0) {
                    pageCache.put(currentEntry.url, CachedPage(ArrayList(allParsedItems), nextPageUrl))
                    updateSubFilterVisibilityAndCounts()
                    rebuildDisplayedItems()
                }
            } else {
                nextPageUrl = null
            }
        }
    }

    // ==================== ПАРСИНГ КАТАЛОГА И ОБЛОЖЕК ====================

    private fun isNoiseText(text: String): Boolean {
        val low = text.lowercase().trim()
        if (low.isEmpty() || low.length < 2) return true
        val noise = setOf(
            "назад", "вперёд", "вперед", "все", "все >", "показать все", "показать все >",
            "ещё", "еще", "меню", "вход", "войти", "регистрация", "поиск", "найти",
            "главная", "категории", "популярные", "новые", "новинки",
            "онлайн", "артисты", "исполнители", "жанры", "альбомы",
            "композиции", "треки", "песни", "музыка", "музыка онлайн",
            "показать ещё", "показать еще", "поделиться", "жалоба",
            "о сайте", "контакты", "зо", "зона обмена", "первый раз на spaces?",
            "тема", "версия", "mobile", "lite", "touch", "pc",
            "отключить рекламу", "реклама", "список пуст.",
            "по алфавиту", "выбранные жанры:", "доступные жанры:",
            "топ-100", "топ-100 композиций", "топ-100 исполнителей", "топ-100 жанров",
            "похожие", "биография", "информация"
        )
        if (low in noise) return true
        if (low.startsWith("танки") || low.startsWith("битва") || low.startsWith("мафия") ||
            low.startsWith("лорикс") || low.startsWith("мстители") || low.startsWith("зоопарк") ||
            low.startsWith("доценты") || low.startsWith("небоскреб") || low.startsWith("разрушители")) return true
        return false
    }

    private fun formatIsoDuration(iso: String): String {
        if (iso.isEmpty()) return ""
        val h = Regex("""(\d+)H""").find(iso)?.groupValues?.get(1)?.toIntOrNull() ?: 0
        val m = Regex("""(\d+)M""").find(iso)?.groupValues?.get(1)?.toIntOrNull() ?: 0
        val s = Regex("""(\d+)S""").find(iso)?.groupValues?.get(1)?.toIntOrNull() ?: 0
        val totalMinutes = h * 60 + m
        if (totalMinutes == 0 && s == 0) return ""
        return String.format("%d:%02d", totalMinutes, s)
    }

    private fun extractCanonicalKey(url: String, prefix: String): String {
        return try {
            val cleanUrl = url.substringBefore("?").substringBefore("#").trimEnd('/')
            val path = Uri.parse(cleanUrl).path?.trimEnd('/') ?: cleanUrl
            val normalized = path.replace(Regex("""/music-online/e/"""), "/music-online/")
            "${prefix}_${normalized.lowercase()}"
        } catch (_: Exception) {
            "${prefix}_${url.substringBefore("?").trimEnd('/').lowercase()}"
        }
    }

    private fun parseTrackContainer(container: Element, seen: HashSet<String>): SpaceItem? {
        val trackLink = container.selectFirst("a.arrow_link[href]")
            ?: container.selectFirst("a[href*=/track/]")
            ?: container.selectFirst("a[href*=/music/view/]")
            ?: container.selectFirst("div.oh a[href]")
            ?: return null

        val trackUrl = trackLink.absUrl("href").ifEmpty { toAbsoluteUrl(trackLink.attr("href")) }
        if (trackUrl.isEmpty()) return null
        if (trackUrl.contains("/artist/") || trackUrl.contains("/album/") || trackUrl.contains("/by_tag/")) return null

        var title = trackLink.selectFirst("span")?.text()?.trim() ?: trackLink.text().trim()
        val metaDesc = container.selectFirst("meta[itemprop=description]")?.attr("content")?.trim() ?: ""

        var artist = ""
        val linkParent = trackLink.parent()
        if (linkParent != null) {
            artist = linkParent.ownText().trim().trimEnd(':', '-', '—').trim()
        }
        if (artist.isEmpty()) {
            for (oh in container.select("div.oh")) {
                val own = oh.ownText().trim().trimEnd(':', '-', '—').trim()
                if (own.isNotEmpty()) {
                    artist = own
                    break
                }
            }
        }
        if (artist.isEmpty() && metaDesc.contains(" - ")) {
            artist = metaDesc.substringBefore(" - ").trim()
            if (title.isEmpty()) title = metaDesc.substringAfter(" - ").trim()
        }
        if (artist.isEmpty()) artist = container.attr("data-artist").trim()
        if (title.isEmpty()) title = container.attr("data-title").trim()
        if (title.isEmpty() || isNoiseText(title)) return null
        if (artist.isEmpty()) artist = "Селюк мьюзик"

        val isoDur = container.selectFirst("meta[itemprop=duration]")?.attr("content") ?: ""
        var duration = formatIsoDuration(isoDur)
        if (duration.isEmpty()) duration = container.attr("data-duration").trim()
        if (duration.isEmpty()) {
            val rightGrey = container.selectFirst("span.grey.right")?.text()?.trim() ?: ""
            if (rightGrey.matches(Regex("""\d+:\d{2}"""))) duration = rightGrey
        }

        val subtitle = if (duration.isNotEmpty()) "$artist • $duration" else artist

        var mp3 = ""
        var cover = container.attr("data-cover").trim()
        val playerEl = container.selectFirst("[data-src], [data-mp3]")
        if (playerEl != null) {
            val rawSrc = playerEl.absUrl("data-src").ifEmpty { playerEl.attr("data-src") }
                .ifEmpty { playerEl.absUrl("data-mp3").ifEmpty { playerEl.attr("data-mp3") } }
            if (rawSrc.isNotEmpty()) mp3 = toAbsoluteUrl(rawSrc)
            if (cover.isEmpty()) cover = playerEl.attr("data-cover").trim()
        }
        if (cover.isEmpty()) {
            val img = container.selectFirst("img[src]")
            if (img != null) cover = img.absUrl("src").ifEmpty { toAbsoluteUrl(img.attr("src")) }
        }
        if (mp3.isEmpty()) {
            val mp3Link = container.selectFirst("a.__adv_download[href], a[href*=.mp3], a[href*=/files/download/], a[href*=/music/download/]")
            if (mp3Link != null) mp3 = mp3Link.absUrl("href").ifEmpty { toAbsoluteUrl(mp3Link.attr("href")) }
        }

        val idKey = extractCanonicalKey(trackUrl, "track")
        if (!seen.add(idKey)) return null

        return SpaceItem(
            idKey = idKey,
            title = title,
            subtitle = subtitle,
            url = trackUrl,
            isFolder = false,
            directMp3 = mp3,
            type = ItemType.TRACK,
            coverUrl = cover
        )
    }

    private fun parseMusicOnlineDoc(doc: Document, mode: TabMode, currentUrl: String): List<SpaceItem> {
        val artistsList = ArrayList<SpaceItem>()
        val albumsList = ArrayList<SpaceItem>()
        val tracksList = ArrayList<SpaceItem>()
        val genresList = ArrayList<SpaceItem>()
        val seen = HashSet<String>()

        val currentPath = try {
            Uri.parse(currentUrl).path?.trimEnd('/') ?: ""
        } catch (_: Exception) { "" }
        val isGenresListPage = currentPath == "/music-online/genres" || Regex(""".*/music-online/genres/p\d+""").matches(currentPath)

        // 1. Исполнители
        if (!isGenresListPage && mode != TabMode.ALBUMS) {
            val artistElements = doc.select("a.list-link[href*=/artist/], a[href*=/music-online/artist/], a[href*=/music-online/e/artist/]")
            for (a in artistElements) {
                if (a.hasClass("tabs__link") || a.hasClass("pgn__link") || a.hasClass("b-title__all") || a.hasClass("list-link-blue")) continue
                val url = a.absUrl("href").ifEmpty { toAbsoluteUrl(a.attr("href")) }
                if (url.isEmpty()) continue
                val targetPath = try { Uri.parse(url).path?.trimEnd('/') ?: "" } catch (_: Exception) { "" }
                if (targetPath.isEmpty() || targetPath == currentPath) continue
                if (targetPath.endsWith("/tracks") || targetPath.endsWith("/albums") || targetPath.endsWith("/similar") || Regex(""".*/p\d+$""").matches(targetPath)) continue

                val nameEl = a.selectFirst("b.t-strong_item") ?: a.selectFirst("b")
                val name = (nameEl?.text() ?: a.ownText()).trim()
                if (name.isEmpty() || isNoiseText(name)) continue

                val genres = a.selectFirst("div.grey, span.grey")?.text()?.trim() ?: ""
                val sub = if (genres.isNotEmpty()) "Исполнитель • $genres" else "Исполнитель"
                val img = a.selectFirst("img[src]")
                val cover = if (img != null) img.absUrl("src").ifEmpty { toAbsoluteUrl(img.attr("src")) } else ""

                val idKey = extractCanonicalKey(url, "artist")
                if (seen.add(idKey)) {
                    artistsList.add(SpaceItem(idKey, name, sub, url, true, type = ItemType.ARTIST, coverUrl = cover))
                }
            }
        }

        // 2. Альбомы
        if (!isGenresListPage) {
            val albumElements = doc.select("a.list-link[href*=/album/], a[href*=/music-online/album/], a[href*=/music-online/e/album/]")
            for (a in albumElements) {
                if (a.hasClass("tabs__link") || a.hasClass("pgn__link") || a.hasClass("b-title__all") || a.hasClass("list-link-blue")) continue
                val url = a.absUrl("href").ifEmpty { toAbsoluteUrl(a.attr("href")) }
                if (url.isEmpty()) continue
                val targetPath = try { Uri.parse(url).path?.trimEnd('/') ?: "" } catch (_: Exception) { "" }
                if (targetPath.isEmpty() || targetPath == currentPath) continue
                if (Regex(""".*/p\d+$""").matches(targetPath)) continue

                val b = a.selectFirst("b.t-strong_item") ?: a.selectFirst("b")
                val ohDiv = a.selectFirst("div.oh")
                val fullText = (ohDiv?.text() ?: a.text()).trim()
                val albumTitle = (b?.text() ?: fullText.substringAfter(":")).trim()
                if (albumTitle.isEmpty() || isNoiseText(albumTitle)) continue

                var artistPrefix = ""
                if (ohDiv != null) {
                    artistPrefix = ohDiv.ownText().trim().trimEnd(':', '-', '—').trim()
                }
                if (artistPrefix.isEmpty() && fullText.contains(":")) {
                    artistPrefix = fullText.substringBefore(":").trim()
                }
                val subtitle = if (artistPrefix.isNotEmpty() && !artistPrefix.equals(albumTitle, ignoreCase = true)) {
                    "Альбом • $artistPrefix"
                } else {
                    "Альбом"
                }
                val img = a.selectFirst("img[src]")
                val cover = if (img != null) img.absUrl("src").ifEmpty { toAbsoluteUrl(img.attr("src")) } else ""

                val idKey = extractCanonicalKey(url, "album")
                if (seen.add(idKey)) {
                    albumsList.add(SpaceItem(idKey, albumTitle, subtitle, url, true, type = ItemType.ALBUM, coverUrl = cover))
                }
            }
        }

        // 3. Треки
        if (!isGenresListPage) {
            val pageCover = doc.selectFirst("div.content img[src], div.for_avatar img[src]")?.absUrl("src") ?: ""
            for (container in doc.select("div.__adv_list_track")) {
                val item = parseTrackContainer(container, seen)
                if (item != null) {
                    if (item.coverUrl.isEmpty() && pageCover.isNotEmpty()) item.coverUrl = pageCover
                    tracksList.add(item)
                }
            }
            if (tracksList.isEmpty()) {
                for (pItem in doc.select("div.player_item[data-src]")) {
                    val rawSrc = pItem.absUrl("data-src").ifEmpty { toAbsoluteUrl(pItem.attr("data-src")) }
                    if (rawSrc.isEmpty()) continue
                    val tTitle = pItem.attr("data-title").trim().ifEmpty { "Трек" }
                    val tArtist = pItem.attr("data-artist").trim().ifEmpty { "Селюк мьюзик" }
                    val tDur = pItem.attr("data-duration").trim()
                    val tCover = pItem.attr("data-cover").trim()
                    val sub = if (tDur.isNotEmpty()) "$tArtist • $tDur" else tArtist
                    val idKey = "track_direct_${pItem.attr("data-nid").ifEmpty { rawSrc.hashCode().toString() }}"
                    if (seen.add(idKey)) {
                        tracksList.add(SpaceItem(idKey, tTitle, sub, currentUrl, false, directMp3 = rawSrc, type = ItemType.TRACK, coverUrl = tCover))
                    }
                }
            }
        }

        // 4. Жанры
        if (isGenresListPage || mode == TabMode.GENRES) {
            for (a in doc.select("a[href*=/music-online/search/by_tag/], a[href*=/music-online/genres/]")) {
                if (a.hasClass("pgn__link")) continue
                val url = a.absUrl("href").ifEmpty { toAbsoluteUrl(a.attr("href")) }
                val targetPath = try { Uri.parse(url).path?.trimEnd('/') ?: "" } catch (_: Exception) { "" }
                if (targetPath == "/music-online/genres" || Regex(""".*/p\d+$""").matches(targetPath)) continue
                val text = a.selectFirst("span")?.text()?.trim() ?: a.selectFirst("b")?.text()?.trim() ?: a.text().trim()
                if (text.isEmpty() || isNoiseText(text)) continue
                val idKey = extractCanonicalKey(url, "genre")
                if (seen.add(idKey)) {
                    genresList.add(SpaceItem(idKey, text, "Жанр музыки", url, true, type = ItemType.GENRE))
                }
            }
        }

        val result = ArrayList<SpaceItem>()
        result.addAll(artistsList)
        result.addAll(albumsList)
        result.addAll(tracksList)
        result.addAll(genresList)
        return result
    }

    private fun performMusicOnlineSearch(query: String, addToHistory: Boolean, restoreSubFilter: SubFilter = SubFilter.ALL) {
        loadJob?.cancel()
        subFilterJob?.cancel()
        val enc = try { URLEncoder.encode(query, "UTF-8") } catch (_: Exception) { query }
        val searchUrl = "$baseHost/music-online/search/index/?sq=$enc&T=0&CK=1"

        if (addToHistory && currentEntry.url.isNotEmpty() && currentEntry.url != searchUrl) {
            saveCurrentScrollPosition()
            navHistory.push(currentEntry.copy())
        }
        rvTracks.visibility = View.VISIBLE
        moreScreenContainer.visibility = View.GONE
        currentEntry = NavEntry(searchUrl, TabMode.SEARCH, "Поиск: $query", activeBottomTab, query, restoreSubFilter)
        highlightSubFilter(restoreSubFilter)
        updateMirrorBadge()

        val cached = pageCache.get(searchUrl)
        if (cached != null) {
            progressBar.visibility = View.GONE
            nextPageUrl = cached.nextPageUrl
            allParsedItems.clear()
            seenKeys.clear()
            for (t in cached.items) {
                if (seenKeys.add(t.idKey)) allParsedItems.add(t)
            }
            updateSubFilterVisibilityAndCounts()
            rebuildDisplayedItems()
            return
        }

        progressBar.visibility = View.VISIBLE
        tvStatus.text = "Поиск «$query»..."

        loadJob = uiScope.launch {
            val (found, nextUrl) = withContext(Dispatchers.IO) {
                var res = trySearchGet(query)
                if (res.first.isEmpty()) {
                    res = trySearchPost(query)
                }
                val baseList = res.first
                var bestNext = res.second

                val topArtist = baseList.firstOrNull { it.type == ItemType.ARTIST }
                if (topArtist != null) {
                    val enriched = enrichArtistPage(topArtist.url, baseList, bestNext)
                    val combined = ArrayList<SpaceItem>()
                    val seen = HashSet<String>()
                    for (item in baseList.filter { it.type == ItemType.ARTIST }) {
                        if (seen.add(item.idKey)) combined.add(item)
                    }
                    for (item in enriched.first) {
                        if (seen.add(item.idKey)) combined.add(item)
                    }
                    if (bestNext == null) bestNext = enriched.second
                    Pair(combined, bestNext)
                } else {
                    Pair(baseList, bestNext)
                }
            }

            progressBar.visibility = View.GONE
            nextPageUrl = nextUrl
            pageCache.put(searchUrl, CachedPage(found, nextUrl))
            updateMirrorBadge()

            allParsedItems.clear()
            seenKeys.clear()
            for (t in found) {
                if (seenKeys.add(t.idKey)) allParsedItems.add(t)
            }
            updateSubFilterVisibilityAndCounts()
            rebuildDisplayedItems()
            rvTracks.scrollToPosition(0)
        }
    }

    private fun trySearchGet(query: String): Pair<List<SpaceItem>, String?> {
        return try {
            val enc = URLEncoder.encode(query, "UTF-8")
            val url = "$baseHost/music-online/search/index/?sq=$enc&T=0&CK=1"
            val doc = fetchDocFast(url) ?: return Pair(emptyList(), null)
            val finalUrl = doc.location() ?: url
            val parsed = parseMusicOnlineDoc(doc, TabMode.SEARCH, finalUrl)
            val next = findNextPageUrl(doc, finalUrl)
            Pair(parsed, next)
        } catch (_: Exception) { Pair(emptyList(), null) }
    }

    private fun trySearchPost(query: String): Pair<List<SpaceItem>, String?> {
        return try {
            val url = "$baseHost/music-online/search/index/"
            val body = FormBody.Builder()
                .add("sq", query)
                .add("T", "0")
                .add("CK", "1")
                .build()
            val req = Request.Builder().url(url).post(body)
                .header("User-Agent", MusicEngine.USER_AGENT)
                .header("Accept", "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8")
                .header("Accept-Language", "ru-RU,ru;q=0.9")
                .header("Referer", "$baseHost/music-online/?Link_id=1187356")
                .header("Origin", baseHost)
                .build()
            httpClient.newCall(req).execute().use { resp ->
                if (!resp.isSuccessful) return Pair(emptyList(), null)
                val html = resp.body?.string() ?: return Pair(emptyList(), null)
                val finalUrl = resp.request.url.toString()
                val doc = Jsoup.parse(html, finalUrl)
                val parsed = parseMusicOnlineDoc(doc, TabMode.SEARCH, finalUrl)
                val next = findNextPageUrl(doc, finalUrl)
                Pair(parsed, next)
            }
        } catch (_: Exception) { Pair(emptyList(), null) }
    }

    private fun findNextPageUrl(doc: Document, currentUrl: String): String? {
        for (a in doc.select("div.pgar a, div.pgn a, a.pgn__button, a.pgn__link_next")) {
            if (a.hasClass("pgn__link_disabled") || a.hasClass("disabled")) continue
            val t = a.text().lowercase().trim()
            if (t.contains("вперёд") || t.contains("вперед") || t == ">" || t.contains("далее") || a.hasClass("pgn__link_next")) {
                val h = a.absUrl("href").ifEmpty { toAbsoluteUrl(a.attr("href")) }
                if (h.isNotEmpty() && h != currentUrl) return h
            }
        }
        return null
    }

    // ==================== ВОСПРОИЗВЕДЕНИЕ, ОБЛОЖКИ И ПРЕДЗАГРУЗКА (ЗАДАЧА 1, 4, 5) ====================

    private fun onItemClicked(pos: Int) {
        if (pos !in items.indices) return
        val item = items[pos]
        if (item.type == ItemType.HEADER) return

        if (item.type == ItemType.PLAYLIST) {
            openPlaylistItems(item.idKey.removePrefix("playlist_"), item.title)
            return
        }

        if (item.isFolder) {
            val nextMode = when (item.type) {
                ItemType.ARTIST -> TabMode.ARTISTS
                ItemType.ALBUM -> TabMode.ALBUMS
                ItemType.GENRE -> TabMode.GENRES
                else -> TabMode.FOLDER_VIEW
            }
            loadSection(item.url, nextMode, item.title, addToHistory = true)
        } else {
            playTrackAt(pos)
        }
    }

    private fun extractMp3AndCoverFromDoc(doc: Document, item: SpaceItem): String {
        val playerItem = doc.selectFirst("div.player_item[data-src], [data-src*=.mp3], [data-mp3]")
        if (playerItem != null) {
            val cover = playerItem.attr("data-cover").trim()
            if (cover.isNotEmpty() && item.coverUrl.isEmpty()) item.coverUrl = toAbsoluteUrl(cover)
            val ds = playerItem.absUrl("data-src").ifEmpty { toAbsoluteUrl(playerItem.attr("data-src")) }
                .ifEmpty { playerItem.absUrl("data-mp3").ifEmpty { toAbsoluteUrl(playerItem.attr("data-mp3")) } }
            if (ds.isNotEmpty() && isDirectAudioFileUrl(ds)) return ds
        }

        val dlLink = doc.selectFirst("a.__adv_download[href], a[href*=.mp3], a[href*=/music/download/], a[href*=/files/download/]")
        if (dlLink != null) {
            val href = dlLink.absUrl("href").ifEmpty { toAbsoluteUrl(dlLink.attr("href")) }
            if (href.isNotEmpty() && isDirectAudioFileUrl(href)) return href
        }

        val audio = doc.selectFirst("audio[src], audio source[src]")
        if (audio != null) {
            val src = audio.absUrl("src").ifEmpty { toAbsoluteUrl(audio.attr("src")) }
            if (src.isNotEmpty() && isDirectAudioFileUrl(src)) return src
        }

        val rawHtml = doc.outerHtml()
        val directMatch = Regex("""https?://[^"'\s<>\\]+\.mp3(?:\?[^"'\s<>\\]*)?""", RegexOption.IGNORE_CASE).find(rawHtml)
        if (directMatch != null) return directMatch.value

        val escapedMatch = Regex("""https?:\\/\\/[^"'\s<>]+\.mp3(?:\?[^"'\s<>]*)?""", RegexOption.IGNORE_CASE).find(rawHtml)
        if (escapedMatch != null) return escapedMatch.value.replace("\\/", "/")

        return ""
    }

    private suspend fun resolveStreamUrl(item: SpaceItem): String {
        if (item.directMp3.isNotEmpty()) return item.directMp3

        val fastMp3 = withContext(Dispatchers.IO) {
            val doc = fetchDocFast(item.url) ?: return@withContext ""
            val direct = extractMp3AndCoverFromDoc(doc, item)
            if (direct.isNotEmpty()) return@withContext direct

            val viewLink = doc.selectFirst("a[href*=/music/view/], a[href*=/files/view/]")
            if (viewLink != null) {
                val viewUrl = viewLink.absUrl("href").ifEmpty { toAbsoluteUrl(viewLink.attr("href")) }
                if (viewUrl.isNotEmpty() && viewUrl != item.url) {
                    val viewDoc = fetchDocFast(viewUrl)
                    if (viewDoc != null) {
                        val fromView = extractMp3AndCoverFromDoc(viewDoc, item)
                        if (fromView.isNotEmpty()) return@withContext fromView
                    }
                }
            }
            ""
        }

        if (fastMp3.isNotEmpty()) {
            item.directMp3 = fastMp3
            return fastMp3
        }

        val web = withTimeoutOrNull(10000L) {
            val deferred = CompletableDeferred<String>()
            runOnUiThread {
                webViewMp3Callback = { found -> if (!deferred.isCompleted) deferred.complete(found) }
                hiddenWebView.loadUrl(item.url)
            }
            deferred.await()
        } ?: ""

        if (web.isNotEmpty()) item.directMp3 = web
        return web
    }

    private fun prefetchNextTracks(fromIndex: Int) {
        val candidates = (fromIndex + 1 until items.size)
            .filter { !items[it].isFolder && items[it].type == ItemType.TRACK }
            .take(2)
        for (idx in candidates) {
            val nextItem = items[idx]
            if (nextItem.directMp3.isNotEmpty()) continue
            uiScope.launch(Dispatchers.IO) {
                try {
                    resolveStreamUrl(nextItem)
                } catch (_: Exception) {}
            }
        }
    }

    private fun updatePlayerUiForItem(item: SpaceItem) {
        btnFavTrack.text = if (isFavorite(item)) "♥ В любимых" else "♡ В любимые"
        tvNowPlayingTitle.text = item.title
        tvNowPlayingSub.text = item.subtitle
        tvFullTitle.text = item.title
        tvFullSubtitle.text = item.subtitle
        bindCoverToViews(item.coverUrl, ivMiniCover, tvMiniCover, "♪")
        bindCoverToViews(item.coverUrl, ivFullCover, tvFullCoverPlaceholder, "♪")
    }

    private fun playSingleItem(item: SpaceItem) {
        currentPlayingItem = item
        updatePlayerUiForItem(item)
        tvNowPlayingSub.text = "Получение аудиопотока..."
        progressBar.visibility = View.VISIBLE

        playJob?.cancel()
        playJob = uiScope.launch {
            val mp3 = resolveStreamUrl(item)
            progressBar.visibility = View.GONE
            if (mp3.isNotEmpty()) {
                updatePlayerUiForItem(item)
                addToHistory(item)
                saveLastPlayedState()
                startExoPlayerStream(item, mp3)
            } else {
                tvNowPlayingSub.text = "Не удалось получить MP3"
            }
        }
    }

    private fun playTrackAt(index: Int) {
        if (index !in items.indices) return
        val item = items[index]
        if (item.type == ItemType.HEADER) return
        if (item.isFolder) {
            onItemClicked(index)
            return
        }

        if (currentPlayingItem?.idKey == item.idKey && player.mediaItemCount > 0) {
            if (player.isPlaying) player.pause() else player.play()
            adapter.notifyPlayingStateChanged()
            return
        }

        playJob?.cancel()
        currentIndex = index
        currentPlayingItem = item
        adapter.selectedIndex = index
        adapter.notifyPlayingStateChanged()

        updatePlayerUiForItem(item)
        tvNowPlayingSub.text = "Получение аудиопотока..."
        progressBar.visibility = View.VISIBLE

        playJob = uiScope.launch {
            val mp3 = resolveStreamUrl(item)
            progressBar.visibility = View.GONE
            if (mp3.isNotEmpty()) {
                updatePlayerUiForItem(item)
                addToHistory(item)
                saveLastPlayedState()
                startExoPlayerStream(item, mp3)
                prefetchNextTracks(index)
            } else {
                tvNowPlayingSub.text = "Не удалось получить MP3 (попробуйте другой трек)"
                Toast.makeText(this@MainActivity, "Ссылка на MP3 недоступна", Toast.LENGTH_SHORT).show()
            }
        }
    }

    private fun startExoPlayerStream(item: SpaceItem, mp3: String) {
        val cookies = allCookies.values.joinToString("; ") { "${it.name}=${it.value}" }
        val headers = HashMap<String, String>()
        headers["Referer"] = item.url
        if (cookies.isNotEmpty()) headers["Cookie"] = cookies

        val upstream = DefaultHttpDataSource.Factory()
            .setUserAgent(MusicEngine.USER_AGENT)
            .setAllowCrossProtocolRedirects(true)
            .setDefaultRequestProperties(headers)

        val dsFactory: androidx.media3.datasource.DataSource.Factory = if (MusicEngine.simpleCache != null) {
            CacheDataSource.Factory()
                .setCache(MusicEngine.simpleCache!!)
                .setUpstreamDataSourceFactory(upstream)
                .setFlags(CacheDataSource.FLAG_IGNORE_CACHE_ON_ERROR)
        } else {
            upstream
        }

        val metaBuilder = MediaMetadata.Builder()
            .setTitle(item.title)
            .setArtist(item.subtitle.substringBefore("•").trim())
        if (item.coverUrl.isNotEmpty()) {
            try {
                metaBuilder.setArtworkUri(Uri.parse(item.coverUrl))
            } catch (_: Exception) {}
        }

        val mediaItem = MediaItem.Builder()
            .setMediaId(item.idKey)
            .setUri(mp3)
            .setCustomCacheKey(item.idKey)
            .setMediaMetadata(metaBuilder.build())
            .build()

        player.setMediaSource(DefaultMediaSourceFactory(dsFactory).createMediaSource(mediaItem))
        player.prepare()
        player.play()
    }

    private fun playNextTrack(fromUser: Boolean) {
        val trackIndices = items.indices.filter { !items[it].isFolder && items[it].type == ItemType.TRACK }
        if (trackIndices.isEmpty()) return

        if (shuffleEnabled && trackIndices.size > 1) {
            val candidates = trackIndices.filter { it != currentIndex }
            val randomIdx = candidates[Random.nextInt(candidates.size)]
            playTrackAt(randomIdx)
            return
        }

        val next = (currentIndex + 1 until items.size).firstOrNull { !items[it].isFolder && items[it].type == ItemType.TRACK }
        if (next != null) {
            playTrackAt(next)
        } else if (fromUser || repeatState == RepeatState.ALL) {
            playTrackAt(trackIndices.first())
        }
    }

    private fun playPrevTrack() {
        if (player.currentPosition > 4000L) {
            player.seekTo(0)
            return
        }
        val prev = (currentIndex - 1 downTo 0).firstOrNull { !items[it].isFolder && items[it].type == ItemType.TRACK }
        if (prev != null) playTrackAt(prev)
    }

    private fun bindCoverToViews(coverUrl: String, imageView: ImageView, placeholder: TextView, fallbackSymbol: String) {
        placeholder.text = fallbackSymbol
        if (coverUrl.isEmpty()) {
            imageView.visibility = View.GONE
            placeholder.visibility = View.VISIBLE
            return
        }
        val cached = bitmapCache.get(coverUrl)
        if (cached != null) {
            imageView.setImageBitmap(cached)
            imageView.visibility = View.VISIBLE
            placeholder.visibility = View.GONE
            return
        }
        imageView.visibility = View.GONE
        placeholder.visibility = View.VISIBLE
        if (!loadingCovers.add(coverUrl)) return

        uiScope.launch(Dispatchers.IO) {
            try {
                val req = Request.Builder().url(coverUrl).header("User-Agent", MusicEngine.USER_AGENT).build()
                httpClient.newCall(req).execute().use { resp ->
                    if (resp.isSuccessful) {
                        val bytes = resp.body?.bytes()
                        if (bytes != null && bytes.isNotEmpty()) {
                            val bmp = BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
                            if (bmp != null) {
                                bitmapCache.put(coverUrl, bmp)
                                withContext(Dispatchers.Main) {
                                    if (currentPlayingItem?.coverUrl == coverUrl) {
                                        ivMiniCover.setImageBitmap(bmp)
                                        ivMiniCover.visibility = View.VISIBLE
                                        tvMiniCover.visibility = View.GONE
                                        ivFullCover.setImageBitmap(bmp)
                                        ivFullCover.visibility = View.VISIBLE
                                        tvFullCoverPlaceholder.visibility = View.GONE
                                    }
                                    adapter.notifyCoverLoaded(coverUrl)
                                }
                            }
                        }
                    }
                }
            } catch (_: Exception) {
            } finally {
                loadingCovers.remove(coverUrl)
            }
        }
    }

