              private fun dislikeTrackInWave(item: SpaceItem) {
                  val fp = buildTrackFingerprint(item)
                  val coreFp = buildCoreTrackFingerprint(item)
                  waveDislikedFingerprints.add(fp)
                  waveDislikedFingerprints.add(coreFp)
                  wavePlayedKeys.add(item.idKey)
                  val normArt = normalizePrimaryArtist(item)
                  if (normArt.isNotEmpty()) {
                      val skips = (waveSkippedArtists[normArt] ?: 0) + 2
                      waveSkippedArtists[normArt] = skips
                      if (skips >= 3) {
                          waveDislikedArtists.add(normArt)
                      }
                  }
                  persistWaveMemoryAsync()
          
                  val wasCurrent = (currentPlayingItem?.idKey == item.idKey)
                  playbackQueue.removeAll {
                      it.idKey == item.idKey || buildTrackFingerprint(it) == fp || buildCoreTrackFingerprint(it) == coreFp
                  }
                  if (currentEntry.tabMode == TabMode.MY_WAVE) {
                      renderWaveScreenToUi()
                  }
                  Toast.makeText(this, "🚫 Трек «${item.title}» больше не появится в Моей волне", Toast.LENGTH_SHORT).show()
                  if (wasCurrent) {
                      playNextTrack(fromUser = false)
                  }
              }
          
              private fun enqueueTrackNext(item: SpaceItem) {
                  if (playbackQueue.isEmpty()) {
                      playSingleItem(item)
                      return
                  }
                  val insertIdx = (playbackQueueIndex + 1).coerceIn(0, playbackQueue.size)
                  playbackQueue.add(insertIdx, item)
                  if (currentEntry.tabMode == TabMode.MY_WAVE) {
                      renderWaveScreenToUi()
                  }
                  saveLastPlayedStateNow(includeQueue = true)
                  Toast.makeText(this, "⏭ Будет играть следующим: «${item.title}»", Toast.LENGTH_SHORT).show()
              }
          
              private fun showTrackItemDialog(item: SpaceItem, posInList: Int = -1) {
                  val isLocalOffline = item.filePath.isNotEmpty() && File(item.filePath).exists()
                  val favLabel = if (isFavorite(item)) "♡ Удалить из Любимых" else "♥ Добавить в Любимые"
                  val options = if (isLocalOffline) {
                      arrayOf(
                          "▶ Воспроизвести офлайн",
                          "🌊 Запустить волну похожих по треку",
                          "⏭ Включить следующим",
                          "🚫 Не предлагать в Моей волне",
                          "Поделиться файлом MP3",
                          favLabel,
                          "+ Добавить в плейлист...",
                          "Удалить скачанный файл"
                      )
                  } else {
                      arrayOf(
                          "▶ Воспроизвести",
                          "🌊 Запустить волну похожих по треку",
                          "⏭ Включить следующим",
                          "🚫 Не предлагать в Моей волне",
                          favLabel,
                          "+ Добавить в плейлист...",
                          "↓ Скачать MP3 в Офлайн",
                          "Скопировать ссылку"
                      )
                  }
                  AlertDialog.Builder(this)
                      .setTitle(item.title)
                      .setItems(options) { _, which ->
                          if (isLocalOffline) {
                              when (which) {
                                  0 -> if (posInList >= 0) playTrackAt(posInList) else playSingleItem(item)
                                  1 -> startTrackRadioWave(item, closeFullPlayer = true)
                                  2 -> enqueueTrackNext(item)
                                  3 -> dislikeTrackInWave(item)
                                  4 -> shareOfflineTrackFile(item)
                                  5 -> {
                                      val added = toggleFavorite(item)
                                      if (currentPlayingItem?.idKey == item.idKey) {
                                          btnFavTrack.text = if (added) "♥ В любимых" else "♡ В любимые"
                                      }
                                      Toast.makeText(this, if (added) "Добавлено в Любимые" else "Удалено из Любимых", Toast.LENGTH_SHORT).show()
                                  }
                                  6 -> showAddToPlaylistDialog(item)
                                  7 -> confirmDeleteSingleOfflineTrack(item)
                              }
                          } else {
                              when (which) {
                                  0 -> if (posInList >= 0) playTrackAt(posInList) else playSingleItem(item)
                                  1 -> startTrackRadioWave(item, closeFullPlayer = true)
                                  2 -> enqueueTrackNext(item)
                                  3 -> dislikeTrackInWave(item)
                                  4 -> {
                                      val added = toggleFavorite(item)
                                      if (currentPlayingItem?.idKey == item.idKey) {
                                          btnFavTrack.text = if (added) "♥ В любимых" else "♡ В любимые"
                                      }
                                      Toast.makeText(this, if (added) "Добавлено в Любимые" else "Удалено из Любимых", Toast.LENGTH_SHORT).show()
                                  }
                                  5 -> showAddToPlaylistDialog(item)
                                  6 -> downloadTrackItem(item)
                                  7 -> {
                                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
