              private fun getPrimaryOfflineDir(): File {
                  val musicRoot = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MUSIC)
                  val dir = File(musicRoot, "SpacesPlayer")
                  if (!dir.exists()) {
                      try { dir.mkdirs() } catch (_: Exception) {}
                  }
                  return dir
              }
          
              private fun getLegacyOfflineDir(): File {
                  val musicRoot = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MUSIC)
                  return File(musicRoot, "SelyukMusic")
              }
          
              private fun setupOfflineObserverAndReceiver() {
                  try {
                      val filter = IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE)
                      if (Build.VERSION.SDK_INT >= 33) {
                          registerReceiver(downloadCompleteReceiver, filter, Context.RECEIVER_EXPORTED)
                      } else {
                          registerReceiver(downloadCompleteReceiver, filter)
                      }
                  } catch (_: Exception) {}
          
                  try {
                      val dir = getPrimaryOfflineDir()
                      @Suppress("DEPRECATION")
                      offlineFileObserver = object : FileObserver(dir.absolutePath, CREATE or DELETE or MOVED_TO or CLOSE_WRITE) {
                          override fun onEvent(event: Int, path: String?) {
                              if (path != null && path.lowercase().endsWith(".mp3")) {
                                  refreshOfflineTracksAsync(updateUiIfVisible = true, triggerBackup = true)
                              }
                          }
                      }.apply { startWatching() }
                  } catch (_: Exception) {}
              }
          
              private fun refreshOfflineTracksAsync(updateUiIfVisible: Boolean, triggerBackup: Boolean) {
                  uiScope.launch(Dispatchers.IO) {
                      scanOfflineFilesInternal()
                      withContext(Dispatchers.Main) {
                          if (updateUiIfVisible && currentEntry.tabMode == TabMode.OFFLINE) {
                              showOfflineScreen(rescan = false)
                          }
                          if (triggerBackup) {
                              scheduleAutoBackup()
                          }
                      }
                  }
              }
          
              private fun scanOfflineFilesInternal() {
                  val dirs = listOf(getPrimaryOfflineDir(), getLegacyOfflineDir())
                  val mp3Files = ArrayList<File>()
                  val seenPaths = HashSet<String>()
                  for (d in dirs) {
                      if (d.exists() && d.isDirectory) {
                          d.listFiles()?.forEach { f ->
                              if (f.isFile && f.length() > 0 && f.name.lowercase().endsWith(".mp3")) {
                                  if (seenPaths.add(f.absolutePath)) mp3Files.add(f)
                              }
                          }
                      }
                  }
          
                  val scanned = ArrayList<SpaceItem>()
                  for (file in mp3Files) {
                      val savedMeta = memOfflineMetaByPath[file.absolutePath] ?: memOfflineMetaByPath[file.name]
                      var title = savedMeta?.title ?: ""
                      var artist = savedMeta?.subtitle?.substringBefore("•")?.trim() ?: ""
                      var durStr = ""
                      var coverKey = savedMeta?.coverUrl ?: ""
          
                      val mmr = MediaMetadataRetriever()
                      try {
                          mmr.setDataSource(file.absolutePath)
                          val id3Title = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_TITLE)?.trim() ?: ""
                          val id3Artist = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_ARTIST)?.trim() ?: ""
                          val id3DurMs = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION)?.toLongOrNull() ?: 0L
                          if (title.isEmpty() && id3Title.isNotEmpty()) title = id3Title
                          if (artist.isEmpty() && id3Artist.isNotEmpty()) artist = id3Artist
                          if (id3DurMs > 0L) durStr = formatTime(id3DurMs)
                          if (coverKey.isEmpty()) {
                              val artBytes = mmr.embeddedPicture
                              if (artBytes != null && artBytes.isNotEmpty()) {
                                  val bmp = BitmapFactory.decodeByteArray(artBytes, 0, artBytes.size)
                                  if (bmp != null) {
                                      coverKey = "offline_cover_${file.absolutePath}"
                                      bitmapCache.put(coverKey, bmp)
                                  }
                              }
                          }
                      } catch (_: Exception) {
                      } finally {
                          try { mmr.release() } catch (_: Exception) {}
                      }
          
                      val baseName = file.nameWithoutExtension
                      if (title.isEmpty()) {
                          if (baseName.contains(" - ")) {
                              if (artist.isEmpty()) artist = baseName.substringBefore(" - ").trim()
                              title = baseName.substringAfter(" - ").trim()
                          } else {
                              title = baseName
                          }
                      }
                      if (artist.isEmpty()) artist = "Офлайн трек"
          
                      val sizeMb = String.format(Locale.US, "%.1f МБ", file.length().toDouble() / (1024.0 * 1024.0))
                      val parts = ArrayList<String>()
                      parts.add(artist)
                      if (durStr.isNotEmpty()) parts.add(durStr)
                      parts.add(sizeMb)
                      val subtitle = parts.joinToString(" • ")
          
                      val dlTime = if ((savedMeta?.downloadedAt ?: 0L) > 0L) savedMeta!!.downloadedAt else file.lastModified()
                      val idKey = savedMeta?.idKey?.ifEmpty { "offline_${file.absolutePath.hashCode()}" } ?: "offline_${file.absolutePath.hashCode()}"
          
                      val offlineItem = SpaceItem(
                          idKey = idKey,
                          title = title,
                          subtitle = subtitle,
                          url = savedMeta?.url ?: file.absolutePath,
                          isFolder = false,
                          directMp3 = file.absolutePath,
                          type = ItemType.TRACK,
                          coverUrl = coverKey,
                          filePath = file.absolutePath,
                          fileSize = file.length(),
                          downloadedAt = dlTime
                      )
                      scanned.add(offlineItem)
                      memOfflineMetaByPath[file.absolutePath] = offlineItem
                      memOfflineMetaByPath[file.name] = offlineItem
                  }
          
                  memOfflineTracks.clear()
                  memOfflineTracks.addAll(scanned)
                  persistListAsync("offline_tracks_json", ArrayList(memOfflineTracks))
              }
          
              private fun showOfflineScreen(rescan: Boolean) {
                  loadJob?.cancel()
                  progressBar.visibility = View.GONE
                  if (::swipeRefresh.isInitialized) swipeRefresh.isRefreshing = false
                  subFilterScroll.visibility = View.GONE
                  nextPageUrl = null
                  sectionTabsScroll.visibility = View.VISIBLE
                  chipNewPlaylist.visibility = View.GONE
                  chipOfflineSort.visibility = View.VISIBLE
                  chipOfflineDeleteAll.visibility = View.VISIBLE
                  currentEntry = NavEntry("", TabMode.OFFLINE, "Скачанные треки (Офлайн)", BottomTab.MY)
                  updateMirrorBadge()
          
                  if (rescan) {
                      uiScope.launch(Dispatchers.IO) {
                          scanOfflineFilesInternal()
                          withContext(Dispatchers.Main) {
                              renderOfflineListToUi()
                          }
                      }
                  } else {
                      renderOfflineListToUi()
                  }
              }
          
              private fun renderOfflineListToUi() {
                  val rawList = ArrayList(memOfflineTracks)
                  val filtered = if (offlineSearchFilter.isNotEmpty()) {
                      val q = offlineSearchFilter.lowercase()
                      rawList.filter { it.title.lowercase().contains(q) || it.subtitle.lowercase().contains(q) }
                  } else {
                      rawList
                  }
          
                  val sorted = when (offlineSortMode) {
                      OfflineSort.DATE -> filtered.sortedByDescending { it.downloadedAt }
                      OfflineSort.TITLE -> filtered.sortedBy { it.title.lowercase() }
                      OfflineSort.ARTIST -> filtered.sortedBy { it.subtitle.lowercase() }
                  }
          
                  val totalBytes = rawList.sumOf { it.fileSize }
                  val totalMb = String.format(Locale.US, "%.1f МБ", totalBytes.toDouble() / (1024.0 * 1024.0))
          
                  allParsedItems.clear()
                  items.clear()
                  seenKeys.clear()
          
                  if (sorted.isEmpty()) {
                      val emptyItem = SpaceItem(
                          idKey = "hdr_offline_empty",
                          title = if (offlineSearchFilter.isNotEmpty()) "По запросу «$offlineSearchFilter» ничего не найдено" else "Пока ничего не скачано",
                          subtitle = "Нажмите ↓ на любом треке, чтобы он появился здесь и играл без интернета",
                          url = "",
                          isFolder = false,
                          type = ItemType.HEADER
                      )
                      allParsedItems.add(emptyItem)
                      items.add(emptyItem)
                      tvStatus.text = "Скачано: 0 треков • 0.0 МБ"
                  } else {
                      allParsedItems.addAll(sorted)
                      items.addAll(sorted)
                      tvStatus.text = "Скачано: ${rawList.size} треков • $totalMb"
                  }
          
                  syncSelectedIndex()
                  adapter.submitListAsync(ArrayList(items))
              }
          
              private fun shareOfflineTrackFile(item: SpaceItem) {
                  val file = File(item.filePath)
                  if (!file.exists()) {
                      Toast.makeText(this, "Файл не найден на устройстве", Toast.LENGTH_SHORT).show()
                      return
                  }
                  try {
                      val builder = StrictMode.VmPolicy.Builder()
                      StrictMode.setVmPolicy(builder.build())
                      val shareIntent = Intent(Intent.ACTION_SEND).apply {
                          type = "application/octet-stream"
                          putExtra(Intent.EXTRA_STREAM, Uri.fromFile(file))
                          putExtra(Intent.EXTRA_TITLE, item.title)
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      }
                      startActivity(Intent.createChooser(shareIntent, "Поделиться треком «${item.title}»"))
                  } catch (e: Exception) {
                      Toast.makeText(this, "Не удалось поделиться: ${e.message}", Toast.LENGTH_SHORT).show()
                  }
              }
          
              private fun confirmDeleteSingleOfflineTrack(item: SpaceItem) {
                  AlertDialog.Builder(this)
                      .setTitle("Удалить файл?")
                      .setMessage("Трек «${item.title}» будет удалён из памяти устройства.")
                      .setPositiveButton("Удалить") { _, _ ->
                          try {
                              val f = File(item.filePath)
                              if (f.exists()) f.delete()
                          } catch (_: Exception) {}
                          memOfflineTracks.removeAll { it.filePath == item.filePath || it.idKey == item.idKey }
                          memOfflineMetaByPath.remove(item.filePath)
                          persistListAsync("offline_tracks_json", ArrayList(memOfflineTracks))
                          if (currentEntry.tabMode == TabMode.OFFLINE) {
                              renderOfflineListToUi()
                          }
                          Toast.makeText(this, "Файл удалён", Toast.LENGTH_SHORT).show()
                      }
                      .setNegativeButton("Отмена", null)
                      .show()
              }
          
              private fun confirmDeleteAllOfflineTracks() {
                  if (memOfflineTracks.isEmpty()) {
                      Toast.makeText(this, "Список скачанных треков уже пуст", Toast.LENGTH_SHORT).show()
                      return
                  }
                  AlertDialog.Builder(this)
                      .setTitle("Удалить все скачанные треки?")
                      .setMessage("Будет удалено файлов: ${memOfflineTracks.size}. Это действие нельзя отменить.")
                      .setPositiveButton("Удалить всё") { _, _ ->
                          uiScope.launch(Dispatchers.IO) {
                              for (t in ArrayList(memOfflineTracks)) {
                                  try {
                                      val f = File(t.filePath)
                                      if (f.exists()) f.delete()
                                  } catch (_: Exception) {}
                              }
                              memOfflineTracks.clear()
                              memOfflineMetaByPath.clear()
                              persistListAsync("offline_tracks_json", emptyList())
                              withContext(Dispatchers.Main) {
                                  if (currentEntry.tabMode == TabMode.OFFLINE) {
                                      renderOfflineListToUi()
                                  }
                                  Toast.makeText(this@MainActivity, "Все скачанные треки удалены", Toast.LENGTH_SHORT).show()
                              }
                          }
                      }
                      .setNegativeButton("Отмена", null)
                      .show()
              }
          
              // ==================== ПРОБЛЕМА 4: АВТО-БЭКАП (DOWNLOADS/СЕЛЮК МЬЮЗИК/SELYUK_MUSIC_BACKUP.JSON) + SAF ====================
          
              private fun buildBackupJsonObject(): JSONObject {
                  val root = JSONObject()
                  root.put("schemaVersion", 1)
                  root.put("appVersion", "22.0")
                  val now = Date()
                  val isoFmt = SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss'Z'", Locale.US)
                  val readFmt = SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault())
                  root.put("savedAt", isoFmt.format(now))
                  root.put("savedAtReadable", readFmt.format(now))
          
                  val favArr = JSONArray()
                  for (f in memFavorites) favArr.put(trackToJson(f))
                  root.put("favorites", favArr)
          
                  root.put("playlists", getPlaylistsObject())
          
                  val settingsObj = JSONObject()
                  settingsObj.put("host", baseHost)
                  settingsObj.put("theme", if (isLightTheme) "light" else "dark")
                  settingsObj.put("lightTheme", isLightTheme)
                  settingsObj.put("audioPreset", MusicEngine.currentAudioPreset)
                  settingsObj.put("repeatMode", repeatState.ordinal)
                  settingsObj.put("shuffleMode", shuffleEnabled)
                  settingsObj.put("lastTrackId", currentPlayingItem?.idKey ?: "")
                  settingsObj.put("lastPosition", if (player.mediaItemCount > 0) player.currentPosition.coerceAtLeast(0L) else pendingRestoredPositionMs)
                  val cur = currentPlayingItem
                  if (cur != null) {
                      settingsObj.put("lastTrack", trackToJson(cur))
                  }
                  root.put("settings", settingsObj)
          
                  val offArr = JSONArray()
                  for (o in memOfflineTracks) {
                      offArr.put(trackToJson(o))
                  }
                  root.put("offlineTracks", offArr)
                  return root
              }
          
              private fun scheduleAutoBackup() {
                  hasPendingBackup = true
                  handler.removeCallbacks(autoBackupRunnable)
                  handler.postDelayed(autoBackupRunnable, 4000L)
              }
          
              private fun performAutoBackupAsync() {
                  hasPendingBackup = false
                  handler.removeCallbacks(autoBackupRunnable)
                  uiScope.launch(Dispatchers.IO) {
                      try {
                          val jsonStr = buildBackupJsonObject().toString(2)
                          writeBackupToPublicDownloads(jsonStr)
                      } catch (_: Exception) {}
                  }
              }
          
              private fun writeBackupToPublicDownloads(jsonStr: String): Boolean {
                  val fileName = "selyuk_music_backup.json"
                  val subFolder = "Селюк мьюзик"
                  var wroteMediaStore = false
          
                  if (Build.VERSION.SDK_INT >= 29) {
                      try {
                          val resolver = contentResolver
                          val collection = MediaStore.Downloads.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY)
                          val selection = "${MediaStore.MediaColumns.DISPLAY_NAME} = ?"
                          val selArgs = arrayOf(fileName)
                          resolver.query(collection, arrayOf(MediaStore.MediaColumns._ID), selection, selArgs, null)?.use { cursor ->
                              while (cursor.moveToNext()) {
                                  val id = cursor.getLong(0)
                                  val existingUri = ContentUris.withAppendedId(collection, id)
                                  try { resolver.delete(existingUri, null, null) } catch (_: Exception) {}
                              }
                          }
                          val values = ContentValues().apply {
                              put(MediaStore.MediaColumns.DISPLAY_NAME, fileName)
                              put(MediaStore.MediaColumns.MIME_TYPE, "application/json")
                              put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/" + subFolder)
                          }
                          val itemUri = resolver.insert(collection, values)
                          if (itemUri != null) {
                              resolver.openOutputStream(itemUri, "wt")?.use { out ->
                                  out.write(jsonStr.toByteArray(Charsets.UTF_8))
                                  out.flush()
                              }
                              wroteMediaStore = true
                          }
                      } catch (_: Exception) {}
                  }
          
                  try {
                      val dlRoot = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                      val folder = File(dlRoot, subFolder)
                      if (!folder.exists()) folder.mkdirs()
                      val f = File(folder, fileName)
                      f.writeText(jsonStr, Charsets.UTF_8)
                      return true
                  } catch (_: Exception) {}
          
                  return wroteMediaStore
              }
          
              private fun findExistingBackupJsonInDownloads(): String? {
                  val fileName = "selyuk_music_backup.json"
                  val subFolder = "Селюк мьюзик"
          
                  if (Build.VERSION.SDK_INT >= 29) {
                      try {
                          val resolver = contentResolver
                          val collection = MediaStore.Downloads.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY)
                          val selection = "${MediaStore.MediaColumns.DISPLAY_NAME} LIKE ?"
                          val selArgs = arrayOf("selyuk_music_backup%")
                          val sortOrder = "${MediaStore.MediaColumns.DATE_MODIFIED} DESC"
                          resolver.query(collection, arrayOf(MediaStore.MediaColumns._ID), selection, selArgs, sortOrder)?.use { cursor ->
                              if (cursor.moveToFirst()) {
                                  val id = cursor.getLong(0)
                                  val uri = ContentUris.withAppendedId(collection, id)
                                  resolver.openInputStream(uri)?.use { inp ->
                                      val txt = inp.bufferedReader(Charsets.UTF_8).readText()
                                      if (txt.isNotBlank()) return txt
                                  }
                              }
                          }
                      } catch (_: Exception) {}
                  }
          
                  try {
                      val dlRoot = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                      val candidates = listOf(
                          File(File(dlRoot, subFolder), fileName),
                          File(dlRoot, fileName),
                          File(dlRoot, "SelyukMusic_backup.json")
                      )
                      for (c in candidates) {
                          if (c.exists() && c.length() > 0) {
                              return c.readText(Charsets.UTF_8)
                          }
                      }
                  } catch (_: Exception) {}
          
                  return null
              }
          
              private fun scheduleFirstLaunchBackupCheck() {
                  val prefs = getSharedPreferences("selyuk_v15", Context.MODE_PRIVATE)
                  val alreadyChecked = prefs.getBoolean("first_launch_checked", false)
                  val declined = prefs.getBoolean("backup_prompt_declined", false)
                  if (alreadyChecked || declined) return
          
                  prefs.edit().putBoolean("first_launch_checked", true).apply()
                  if (memFavorites.isNotEmpty() || getPlaylistsObject().length() > 0) return
          
                  handler.postDelayed({
                      if (isFinishing || isDestroyed) return@postDelayed
                      uiScope.launch(Dispatchers.IO) {
                          val rawJson = findExistingBackupJsonInDownloads() ?: return@launch
                          try {
                              val root = JSONObject(rawJson)
                              val schema = root.optInt("schemaVersion", 1)
                              if (schema > 1 || !root.has("favorites") || !root.has("settings")) return@launch
                              val favCount = root.optJSONArray("favorites")?.length() ?: 0
                              val plCount = root.optJSONObject("playlists")?.length() ?: 0
                              val offCount = root.optJSONArray("offlineTracks")?.length() ?: 0
                              if (favCount == 0 && plCount == 0 && offCount == 0) return@launch
                              val dateStr = root.optString("savedAtReadable").ifEmpty {
                                  root.optString("savedAt", "неизвестно")
                              }
                              withContext(Dispatchers.Main) {
                                  if (!isFinishing && !isDestroyed) {
                                      AlertDialog.Builder(this@MainActivity)
                                          .setTitle("Найден бэкап")
                                          .setMessage(
                                              "Дата: $dateStr\n" +
                                              "Треков в избранном: $favCount\n" +
                                              "Плейлистов: $plCount\n" +
                                              "Скачанных треков: $offCount\n\n" +
                                              "Восстановить?"
                                          )
                                          .setPositiveButton("Восстановить") { _, _ ->
                                              applyBackupJson(rawJson, fromManualImport = false)
                                          }
                                          .setNegativeButton("Пропустить") { _, _ ->
                                              prefs.edit().putBoolean("backup_prompt_declined", true).apply()
                                          }
                                          .setCancelable(false)
                                          .show()
                                  }
                              }
                          } catch (_: Exception) {}
                      }
                  }, 1500L)
              }
          
              private fun applyBackupJson(rawJson: String, fromManualImport: Boolean) {
                  uiScope.launch(Dispatchers.IO) {
                      try {
                          val root = JSONObject(rawJson)
                          val schema = root.optInt("schemaVersion", 1)
                          if (schema > 1 || !root.has("favorites") || (root.optJSONArray("favorites") == null)) {
                              throw IllegalArgumentException("Неверная структура файла бэкапа")
                          }
                          val settingsObj = root.optJSONObject("settings")
                          if (root.has("schemaVersion") && settingsObj == null) {
                              throw IllegalArgumentException("Отсутствует блок settings")
                          }
          
                          val prefs = getSharedPreferences("selyuk_v15", Context.MODE_PRIVATE)
                          val edit = prefs.edit()
          
                          val favArr = root.getJSONArray("favorites")
                          edit.putString("favorites", favArr.toString())
          
                          val plObj = root.optJSONObject("playlists") ?: JSONObject()
                          edit.putString("playlists_json", plObj.toString())
          
                          edit.putString("history", "[]")
          
                          if (settingsObj != null) {
                              val restoredHost = extractCleanHost(settingsObj.optString("host", baseHost))
                              baseHost = restoredHost
                              edit.putString("host", restoredHost)
          
                              isLightTheme = settingsObj.optBoolean("lightTheme", settingsObj.optString("theme") == "light")
                              edit.putBoolean("light_theme", isLightTheme)
          
                              val preset = settingsObj.optInt("audioPreset", 0).coerceIn(0, 4)
                              MusicEngine.applyAudioPreset(preset)
                              edit.putInt("audio_preset", preset)
          
                              val repOrdinal = settingsObj.optInt("repeatMode", 0).coerceIn(0, 2)
                              repeatState = RepeatState.values()[repOrdinal]
                              edit.putInt("repeat_mode", repOrdinal)
          
                              shuffleEnabled = settingsObj.optBoolean("shuffleMode", false)
                              edit.putBoolean("shuffle", shuffleEnabled)
          
                              val lastTrackObj = settingsObj.optJSONObject("lastTrack")
                              if (lastTrackObj != null) {
                                  edit.putString("last_track", lastTrackObj.toString())
                              }
                              val lastPos = settingsObj.optLong("lastPosition", 0L)
                              edit.putLong("last_position_ms", lastPos)
                          }
          
                          val offArr = root.optJSONArray("offlineTracks") ?: JSONArray()
                          val validOffArr = JSONArray()
                          var restoredOffCount = 0
                          var missingOffCount = 0
                          for (i in 0 until offArr.length()) {
                              val o = offArr.optJSONObject(i) ?: continue
                              val path = o.optString("filePath")
                              if (path.isNotEmpty() && File(path).exists()) {
                                  validOffArr.put(o)
                                  restoredOffCount++
                              } else {
                                  missingOffCount++
                              }
                          }
                          edit.putString("offline_tracks_json", validOffArr.toString())
                          edit.commit()
          
                          loadSavedListsIntoMemory()
                          scanOfflineFilesInternal()
          
                          withContext(Dispatchers.Main) {
                              applyThemeColors()
                              updateRepeatAndShuffleButtons()
                              updateMirrorBadge()
                              restoreLastPlayedState()
                              if (activeBottomTab == BottomTab.MY) {
                                  switchBottomTab(BottomTab.MY)
                              }
                              val msg = if (missingOffCount > 0) {
                                  "Бэкап восстановлен! Скачанных: $restoredOffCount ($missingOffCount файла не найдены)"
                              } else {
                                  "Бэкап успешно восстановлен!"
                              }
                              Toast.makeText(this@MainActivity, msg, Toast.LENGTH_LONG).show()
                          }
                      } catch (e: Exception) {
                          withContext(Dispatchers.Main) {
                              if (fromManualImport) {
                                  AlertDialog.Builder(this@MainActivity)
                                      .setTitle("Файл повреждён")
                                      .setMessage("Не удалось прочитать резервную копию (${e.message}). Выберите корректный JSON-файл.")
                                      .setPositiveButton("Выбрать другой") { _, _ -> launchSafImportPicker() }
                                      .setNegativeButton("Пропустить", null)
                                      .show()
                              } else {
                                  Toast.makeText(this@MainActivity, "Файл бэкапа повреждён", Toast.LENGTH_SHORT).show()
                              }
                          }
                      }
                  }
              }
          
