              private fun trackToJson(item: SpaceItem): JSONObject {
                  val o = JSONObject()
                  o.put("idKey", item.idKey)
                  o.put("title", item.title)
                  o.put("subtitle", item.subtitle)
                  o.put("url", item.url)
                  o.put("directMp3", item.directMp3)
                  o.put("coverUrl", if (item.coverUrl.startsWith("offline_cover_")) "" else item.coverUrl)
                  if (item.filePath.isNotEmpty()) o.put("filePath", item.filePath)
                  if (item.fileSize > 0L) o.put("fileSize", item.fileSize)
                  if (item.downloadedAt > 0L) o.put("downloadedAt", item.downloadedAt)
                  return o
              }
          
              private fun parseJsonTrackArray(arr: JSONArray): ArrayList<SpaceItem> {
                  val list = ArrayList<SpaceItem>()
                  for (i in 0 until arr.length()) {
                      val o = arr.optJSONObject(i) ?: continue
                      list.add(
                          SpaceItem(
                              idKey = o.optString("idKey"),
                              title = o.optString("title"),
                              subtitle = o.optString("subtitle"),
                              url = o.optString("url"),
                              isFolder = false,
                              directMp3 = o.optString("directMp3"),
                              type = ItemType.TRACK,
                              coverUrl = o.optString("coverUrl"),
                              filePath = o.optString("filePath"),
                              fileSize = o.optLong("fileSize", 0L),
                              downloadedAt = o.optLong("downloadedAt", 0L)
                          )
                      )
                  }
                  return list
              }
          
              private fun downloadTrackItem(targetItem: SpaceItem) {
                  uiScope.launch {
                      Toast.makeText(this@MainActivity, "Подготовка загрузки «${targetItem.title}»...", Toast.LENGTH_SHORT).show()
                      val mp3 = resolveStreamUrl(targetItem)
                      if (mp3.isEmpty()) {
                          Toast.makeText(this@MainActivity, "Не удалось получить прямую ссылку MP3", Toast.LENGTH_SHORT).show()
                          return@launch
                      }
                      try {
                          val cleanSub = targetItem.subtitle.substringBefore("•").trim().ifEmpty { "SpacesPlayer" }
                          val safeChars = Regex("[\\\\/:*?\"<>|]")
                          val name = "$cleanSub - ${targetItem.title}".replace(safeChars, "_").take(90) + ".mp3"
                          val destDir = getPrimaryOfflineDir()
                          val destFile = File(destDir, name)
                          val now = System.currentTimeMillis()
                          val preMeta = targetItem.copy(
                              filePath = destFile.absolutePath,
                              downloadedAt = now
                          )
                          memOfflineMetaByPath[destFile.absolutePath] = preMeta
                          memOfflineMetaByPath[name] = preMeta
          
                          val req = DownloadManager.Request(Uri.parse(mp3))
                              .setTitle(targetItem.title)
                              .setDescription(cleanSub)
                              .addRequestHeader("User-Agent", MusicEngine.USER_AGENT)
                              .addRequestHeader("Referer", targetItem.url)
                              .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                              .setDestinationInExternalPublicDir(Environment.DIRECTORY_MUSIC, "SpacesPlayer/$name")
                          (getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager).enqueue(req)
                          Toast.makeText(this@MainActivity, "↓ Скачивание в Music/SpacesPlayer/$name", Toast.LENGTH_LONG).show()
                          scheduleAutoBackup()
                      } catch (e: Exception) {
                          Toast.makeText(this@MainActivity, "Ошибка: ${e.message}", Toast.LENGTH_SHORT).show()
                      }
                  }
              }
          
