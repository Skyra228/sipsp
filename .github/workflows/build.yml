              private fun toAbsoluteUrl(path: String): String {

                  val clean = path.trim()

                  return when {

                      clean.startsWith("http://") || clean.startsWith("https://") -> clean

                      clean.startsWith("//") -> "https:$clean"

                      clean.startsWith("/") -> baseHost + clean

                      else -> "$baseHost/$clean"

                  }

              }



              private fun fetchDocFast(urlOrPath: String): Document? {

                  return try {

                      val full = toAbsoluteUrl(urlOrPath)

                      val req = Request.Builder().url(full)

                          .header("User-Agent", MusicEngine.USER_AGENT)

                          .header("Accept", "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8")

                          .header("Accept-Language", "ru-RU,ru;q=0.9")

                          .header("Referer", "$baseHost/music-online/")

                          .build()

                      httpClient.newCall(req).execute().use { resp ->

                          if (!resp.isSuccessful) return null

                          val html = resp.body?.string() ?: return null

                          Jsoup.parse(html, resp.request.url.toString())

                      }

                  } catch (_: Exception) { null }

              }



              private fun loadSection(urlOrPath: String, mode: TabMode, title: String, addToHistory: Boolean) {

                  loadJob?.cancel()

                  val fullTarget = toAbsoluteUrl(urlOrPath)

                  if (addToHistory && currentEntry.url.isNotEmpty() && currentEntry.url != fullTarget) {

                      navHistory.push(currentEntry)

                  }

                  currentEntry = NavEntry(fullTarget, mode, title)

                  updateMirrorBadge()



                  progressBar.visibility = View.VISIBLE

                  tvStatus.text = "Загрузка: $title..."



                  loadJob = uiScope.launch {

                      val (doc, finalUrl) = withContext(Dispatchers.IO) {

                          val d = fetchDocFast(fullTarget)

                          Pair(d, d?.location() ?: fullTarget)

                      }

                      progressBar.visibility = View.GONE

                      updateMirrorBadge()



                      if (doc != null) {

                          nextPageUrl = findNextPageUrl(doc)

                          val parsed = parseMusicOnlineDoc(doc, mode, finalUrl)

                          items.clear(); seenKeys.clear()

                          for (i in parsed) {

                              if (seenKeys.add(i.idKey)) items.add(i)

                          }

                          adapter.notifyDataSetChanged()

                          val tracks = items.count { !it.isFolder }

                          val folders = items.count { it.isFolder }

                          val path = try { Uri.parse(finalUrl).path ?: "" } catch (_: Exception) { "" }

                          val divs = doc.select("div.__adv_list_track").size

                          val arts = doc.select("div.pre_content_wrap a[href*=/music-online/artist/]").size

                          val albs = doc.select("div.pre_content_wrap a[href*=/music-online/album/]").size

                          val gens = doc.select("a[href*=/music-online/search/by_tag/]").size



                          tvStatus.text = when {

                              tracks > 0 || folders > 0 -> "$title • T=$tracks F=$folders | divs=$divs arts=$arts albs=$albs gens=$gens"

                              else -> "$title • ПУСТО | divs=$divs arts=$arts albs=$albs gens=$gens | HTML=${doc.outerHtml().length} | path=$path"

                          }

                      } else {

                          tvStatus.text = "Ошибка загрузки раздела (HTTP)"

                      }

                  }

              }



              private fun loadNextPage() {

                  val next = nextPageUrl ?: return

                  isLoadingMore = true

                  progressBar.visibility = View.VISIBLE

                  uiScope.launch {

                      val (doc, finalUrl) = withContext(Dispatchers.IO) {

                          val d = fetchDocFast(next)

                          Pair(d, d?.location() ?: next)

                      }

                      progressBar.visibility = View.GONE

                      isLoadingMore = false

                      if (doc != null) {

                          nextPageUrl = findNextPageUrl(doc)

                          val more = parseMusicOnlineDoc(doc, currentEntry.tabMode, finalUrl)

                          var added = 0

                          for (m in more) {

                              if (seenKeys.add(m.idKey)) { items.add(m); added++ }

                          }

                          if (added > 0) adapter.notifyDataSetChanged()

                      }

                  }

              }



              private fun isNoiseText(text: String): Boolean {

                  val low = text.lowercase().trim()

                  if (low.isEmpty() || low.length < 2) return true

                  val noise = setOf(

                      "назад", "вперёд", "вперед", "все", "показать все", "ещё", "еще",

                      "меню", "вход", "войти", "регистрация", "поиск", "найти",

                      "главная", "категории", "популярные", "новые", "новинки",

                      "онлайн", "артисты", "исполнители", "жанры", "альбомы",

                      "композиции", "треки", "песни", "музыка", "музыка онлайн",

                      "показать ещё", "показать еще", "поделиться", "жалоба",

                      "о сайте", "контакты", "зо", "зона обмена", "первый раз на spaces?",

                      "тема", "версия", "mobile", "lite", "touch", "pc",

                      "отключить рекламу", "реклама", "список пуст.",

                      "по алфавиту", "выбранные жанры:", "доступные жанры:",

                      "топ-100", "топ-100 композиций", "топ-100 исполнителей", "топ-100 жанров"

                  )

                  if (low in noise) return true

                  if (low.startsWith("танки") || low.startsWith("битва") || low.startsWith("мафия") || low.startsWith("лорикс") || low.startsWith("мстители") || low.startsWith("зоопарк") || low.startsWith("доценты") || low.startsWith("небоскреб") || low.startsWith("разрушители")) return true

                  return false

              }



              private fun parseMusicOnlineDoc(doc: Document, mode: TabMode, currentUrl: String): List<SpaceItem> {

                  val result = ArrayList<SpaceItem>()

                  val seen = HashSet<String>()



                  val path = try {

                      Uri.parse(currentUrl).path ?: ""

                  } catch (_: Exception) { "" }.trimEnd('/')

                  val isGenresListPage = path == "/music-online/genres" || Regex(""".*/music-online/genres/p\d+""").matches(path)



                  // 1. Треки — на любой странице, кроме списка жанров

                  if (!isGenresListPage) {

                      for (container in doc.select("div.__adv_list_track")) {

                          val trackLink = container.selectFirst("div.oh a[href*=/music/]")

                              ?: container.selectFirst("a[href*=/music/view/]")

                              ?: container.selectFirst("a[href*=/music-online/track/]")

                              ?: continue

                          val trackUrl = trackLink.absUrl("href")

                          val title = trackLink.text().trim()

                          if (title.isEmpty() || isNoiseText(title)) continue



                          var mp3 = ""

                          val mp3Link = container.selectFirst("a[href*=.mp3], a[href*=/files/download/], a[href*=/music/download/]")

                          if (mp3Link != null) mp3 = mp3Link.absUrl("href")



                          var artist = ""

                          val ohDiv = container.selectFirst("div.oh")

                          if (ohDiv != null) {

                              artist = ohDiv.ownText().trim().trimEnd(':').trim()

                          }

                          if (artist.isEmpty()) artist = "Музыка онлайн"



                          val id = extractId(trackUrl)

                          if (!seen.add("track_$id")) continue



                          result.add(

                              SpaceItem(

                                  idKey = "track_$id",

                                  title = title,

                                  subtitle = artist,

                                  url = trackUrl,

                                  isFolder = false,

                                  directMp3 = mp3,

                                  type = ItemType.TRACK

                              )

                          )

                      }

                  }



                  // 2. Артисты — на любой странице

                  for (a in doc.select("div.pre_content_wrap a[href*=/music-online/artist/]")) {

                      val url = a.absUrl("href")

                      val b = a.selectFirst("b")

                      val text = b?.text()?.trim() ?: a.text().trim()

                      if (text.isEmpty() || isNoiseText(text)) continue

                      val id = extractId(url)

                      if (seen.add("artist_$id")) {

                          result.add(SpaceItem("artist_$id", text, "Исполнитель", url, true, type = ItemType.ARTIST))

                      }

                  }



                  // 3. Альбомы — на любой странице

                  for (a in doc.select("div.pre_content_wrap a[href*=/music-online/album/]")) {

                      val url = a.absUrl("href")

                      val b = a.selectFirst("b")

                      val fullText = a.text().trim()

                      val albumTitle = b?.text()?.trim() ?: fullText

                      if (albumTitle.isEmpty() || isNoiseText(albumTitle)) continue

                      val artistPrefix = if (fullText.contains(":")) fullText.substringBefore(":").trim() else ""

                      val subtitle = if (artistPrefix.isNotEmpty()) artistPrefix else "Альбом"

                      val id = extractId(url)

                      if (seen.add("album_$id")) {

                          result.add(SpaceItem("album_$id", albumTitle, subtitle, url, true, type = ItemType.ALBUM))

                      }

                  }



                  // 4. Жанры — только на странице /music-online/genres/

                  if (isGenresListPage) {

                      for (a in doc.select("a[href*=/music-online/search/by_tag/]")) {

                          val url = a.absUrl("href")

                          val text = a.selectFirst("span")?.text()?.trim() ?: a.text().trim()

                          if (text.isEmpty() || isNoiseText(text)) continue

                          val id = extractId(url)

                          if (seen.add("genre_$id")) {

                              result.add(SpaceItem("genre_$id", text, "Жанр", url, true, type = ItemType.GENRE))

                          }

                      }

                  }



                  return result

              }



              private fun performMusicOnlineSearch(query: String) {

                  loadJob?.cancel()

                  progressBar.visibility = View.VISIBLE

                  tvStatus.text = "Поиск «$query»..."



                  loadJob = uiScope.launch {

                      val (found, diag) = withContext(Dispatchers.IO) {

                          val postResult = trySearchPost(query)

                          if (postResult.first.isNotEmpty()) {

                              Pair(postResult.first, "POST")

                          } else {

                              val getResult = trySearchGet(query)

                              Pair(getResult.first, getResult.second)

                          }

                      }



                      progressBar.visibility = View.GONE

                      updateMirrorBadge()

                      items.clear()

                      seenKeys.clear()

                      for (t in found) {

                          if (seenKeys.add(t.idKey)) items.add(t)

                      }

                      adapter.notifyDataSetChanged()

                      val tracks = items.count { !it.isFolder }

                      val folders = items.count { it.isFolder }

                      tvStatus.text = when {

                          tracks > 0 || folders > 0 -> "Найдено: T=$tracks F=$folders ($diag)"

                          else -> "Пусто ($diag)"

                      }

                  }

              }



              private fun trySearchPost(query: String): Pair<List<SpaceItem>, String> {

                  return try {

                      val url = "$baseHost/music-online/search/index/"

                      val body = FormBody.Builder()

                          .add("sq", query)

                          .add("T", "0")

                          .add("CK", "1")

                          .build()

                      val req = Request.Builder().url(url).post(body)

                          .header("User-Agent", MusicEngine.USER_AGENT)

                          .header("Accept", "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8")

                          .header("Accept-Language", "ru-RU,ru;q=0.9")

                          .header("Referer", "$baseHost/music-online/")

                          .header("Origin", baseHost)

                          .build()

                      httpClient.newCall(req).execute().use { resp ->

                          if (!resp.isSuccessful) return Pair(emptyList(), "POST-fail")

                          val html = resp.body?.string() ?: return Pair(emptyList(), "POST-empty")

                          val doc = Jsoup.parse(html, resp.request.url.toString())

                          val items = parseMusicOnlineDoc(doc, TabMode.SEARCH, doc.location() ?: resp.request.url.toString())

                          Pair(items, "POST html=${html.length}")

                      }

                  } catch (_: Exception) { Pair(emptyList(), "POST-exc") }

              }



              private fun trySearchGet(query: String): Pair<List<SpaceItem>, String> {

                  return try {

                      val enc = URLEncoder.encode(query, "UTF-8")

                      val url = "$baseHost/music-online/search/index/?sq=$enc&T=0&CK=1"

                      val req = Request.Builder().url(url)

                          .header("User-Agent", MusicEngine.USER_AGENT)

                          .header("Accept", "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8")

                          .header("Accept-Language", "ru-RU,ru;q=0.9")

                          .header("Referer", "$baseHost/music-online/")

                          .build()

                      httpClient.newCall(req).execute().use { resp ->

                          if (!resp.isSuccessful) return Pair(emptyList(), "GET-fail")

                          val html = resp.body?.string() ?: return Pair(emptyList(), "GET-empty")

                          val doc = Jsoup.parse(html, resp.request.url.toString())

                          val items = parseMusicOnlineDoc(doc, TabMode.SEARCH, doc.location() ?: resp.request.url.toString())

                          val divs = doc.select("div.__adv_list_track").size

                          val arts = doc.select("div.pre_content_wrap a[href*=/music-online/artist/]").size

                          val albs = doc.select("div.pre_content_wrap a[href*=/music-online/album/]").size

                          Pair(items, "GET html=${html.length} divs=$divs arts=$arts albs=$albs")

                      }

                  } catch (_: Exception) { Pair(emptyList(), "GET-exc") }

              }



              private fun extractId(url: String): String {

                  val m = Regex("""/(?:view|download|file|track)/[^/?#]*?(\d{4,})""").find(url)?.groupValues?.get(1)

                  if (m != null) return m

                  val mTrack = Regex("""/music-online/track/[^/]+/([a-z0-9-]+-\d+)""").find(url)?.groupValues?.get(1)

                  if (mTrack != null) return mTrack

                  val mTag = Regex("""/music-online/search/by_tag/([a-z0-9-]+-\d+)""").find(url)?.groupValues?.get(1)

                  if (mTag != null) return mTag

                  val m2 = Regex("""/music-online/album/[^/]+/([a-z0-9-]+-\d+)""").find(url)?.groupValues?.get(1)

                  if (m2 != null) return m2

                  val m3 = Regex("""/music-online/artist/([a-z0-9-]+-\d+)""").find(url)?.groupValues?.get(1)

                  if (m3 != null) return m3

                  val p = Regex("""(?:(?:file_id|fid|id|link_id)=(\d{4,}))""").find(url)?.groupValues?.get(1)

                  if (p != null) return p

                  return url.substringBefore("?").substringBefore("#")

              }



              private fun findNextPageUrl(doc: Document): String? {

                  for (a in doc.select("div.pgar a")) {

                      val t = a.text().lowercase()

                      if (t.contains("вперёд") || t.contains("вперед") || t == ">") {

                          val h = a.absUrl("href")

                          if (h.isNotEmpty()) return h

                      }

                  }

                  val desktopNext = doc.selectFirst("a.pgn__link_next:not(.pgn__link_disabled)")

                  return desktopNext?.absUrl("href")?.takeIf { it.isNotEmpty() }

              }



              private fun onItemClicked(pos: Int) {

                  if (pos !in items.indices) return

                  val item = items[pos]



                  if (item.isFolder) {

                      val nextMode = when (item.type) {

                          ItemType.ARTIST -> TabMode.ARTISTS

                          ItemType.ALBUM -> TabMode.FOLDER_VIEW

                          ItemType.GENRE -> TabMode.FOLDER_VIEW

                          else -> TabMode.FOLDER_VIEW

                      }

                      loadSection(item.url, nextMode, item.title, addToHistory = true)

                  } else {

                      playTrackAt(pos)

                  }

              }



              private suspend fun resolveStreamUrl(item: SpaceItem): String {

                  if (item.directMp3.isNotEmpty()) return item.directMp3



                  val doc = withContext(Dispatchers.IO) { fetchDocFast(item.url) }

                  if (doc != null) {

                      val mp3Link = doc.selectFirst("a[href*=.mp3], a[href*=/files/download/], a[href*=/music/download/]")

                      if (mp3Link != null) {

                          val src = mp3Link.absUrl("href")

                          if (src.isNotEmpty() && isDirectAudioFileUrl(src)) { item.directMp3 = src; return src }

                      }

                      val audio = doc.selectFirst("audio[src], audio source[src], [data-src*=.mp3]")

                      if (audio != null) {

                          val src = audio.absUrl("src").ifEmpty { audio.attr("data-src") }

                          if (src.isNotEmpty()) { item.directMp3 = src; return src }

                      }

                  }



                  val web = withTimeoutOrNull(12000L) {

                      val deferred = CompletableDeferred<String>()

                      runOnUiThread {

                          webViewMp3Callback = { found -> if (!deferred.isCompleted) deferred.complete(found) }

                          hiddenWebView.loadUrl(item.url)

                      }

                      deferred.await()

                  } ?: ""



                  if (web.isNotEmpty()) item.directMp3 = web

                  return web

              }



              private fun playTrackAt(index: Int) {

                  if (index !in items.indices) return

                  val item = items[index]

                  if (item.isFolder) { loadSection(item.url, TabMode.FOLDER_VIEW, item.title, addToHistory = true); return }



                  currentIndex = index

                  currentPlayingItem = item

                  adapter.selectedIndex = index

                  adapter.notifyDataSetChanged()



                  btnFavTrack.text = if (isFavorite(item)) "♥" else "♡"

                  tvNowPlayingTitle.text = item.title

                  tvNowPlayingSub.text = "Загрузка аудиопотока..."

                  progressBar.visibility = View.VISIBLE



                  uiScope.launch {

                      val mp3 = resolveStreamUrl(item)

                      progressBar.visibility = View.GONE

                      if (mp3.isNotEmpty()) {

                          tvNowPlayingSub.text = item.subtitle

                          addToHistory(item)

                          val cookies = allCookies.values.joinToString("; ") { "${it.name}=${it.value}" }

                          val ds = DefaultHttpDataSource.Factory().setUserAgent(MusicEngine.USER_AGENT).setAllowCrossProtocolRedirects(true)

                              .setDefaultRequestProperties(mapOf("Referer" to item.url, "Cookie" to cookies))

                          val meta = MediaMetadata.Builder().setTitle(item.title).setArtist(item.subtitle).build()

                          val mediaItem = MediaItem.Builder().setUri(mp3).setMediaMetadata(meta).build()

                          player.setMediaSource(DefaultMediaSourceFactory(ds).createMediaSource(mediaItem))

                          player.prepare()

                          player.play()

                      } else {

                          tvNowPlayingSub.text = "Ошибка получения MP3"

                      }

                  }

              }



              private fun playNextTrack() {

                  val next = (currentIndex + 1 until items.size).firstOrNull { !items[it].isFolder }

                  if (next != null) playTrackAt(next)

              }



              private fun playPrevTrack() {

                  val prev = (currentIndex - 1 downTo 0).firstOrNull { !items[it].isFolder }

                  if (prev != null) playTrackAt(prev)

              }



              private fun formatTime(ms: Long): String {

                  if (ms <= 0) return "0:00"

                  return String.format("%d:%02d", (ms / 1000) / 60, (ms / 1000) % 60)

              }



              @Deprecated("Deprecated in Java")

              override fun onBackPressed() {

                  if (navHistory.isNotEmpty()) {

                      val p = navHistory.pop()

                      updateMirrorBadge()

                      loadSection(p.url, p.tabMode, p.titleHint, addToHistory = false)

                  } else {

                      @Suppress("DEPRECATION")

                      super.onBackPressed()

                  }

              }



              override fun onDestroy() {

                  super.onDestroy()

                  sleepTimer?.cancel()

                  handler.removeCallbacksAndMessages(null)

                  uiScope.cancel()

              }



              inner class SpaceAdapter(

                  private val list: List<SpaceItem>,

                  private val onClick: (Int) -> Unit

              ) : RecyclerView.Adapter<SpaceAdapter.VH>() {

                  var selectedIndex = -1



                  inner class VH(v: View) : RecyclerView.ViewHolder(v) {

                      val tvCover: TextView = v.findViewById(R.id.tvCover)

                      val tvTitle: TextView = v.findViewById(R.id.tvTitle)

                      val tvSubtitle: TextView = v.findViewById(R.id.tvSubtitle)

                      val tvPlayIcon: TextView = v.findViewById(R.id.tvPlayIcon)

                  }



                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {

                      val v = LayoutInflater.from(parent.context).inflate(R.layout.item_track, parent, false)

                      return VH(v)

                  }



                  override fun onBindViewHolder(holder: VH, position: Int) {

                      val item = list[position]

                      holder.tvTitle.text = item.title

                      holder.tvSubtitle.text = item.subtitle

                      if (item.isFolder) {

                          holder.tvCover.text = when (item.type) {

                              ItemType.ARTIST -> "👤"

                              ItemType.ALBUM -> "💿"

                              ItemType.GENRE -> "🏷"

                              else -> "📁"

                          }

                          holder.tvTitle.setTextColor(0xFFFFFFFF.toInt())

                          holder.tvPlayIcon.text = "›"

                      } else {

                          holder.tvCover.text = "♪"

                          val sel = position == selectedIndex

                          holder.tvTitle.setTextColor(if (sel) 0xFFFFCC00.toInt() else 0xFFFFFFFF.toInt())

                          holder.tvPlayIcon.text = if (sel) "❚❚" else "▶"

                      }

                      holder.itemView.setOnClickListener { onClick(position) }

                  }



                  override fun getItemCount(): Int = list.size

              }

          }

