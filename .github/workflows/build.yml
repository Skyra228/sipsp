    private fun saveLastPlayedState() {
        val cur = currentPlayingItem ?: return
        val prefs = getSharedPreferences("selyuk_v15", Context.MODE_PRIVATE)
        val pos = if (player.mediaItemCount > 0) player.currentPosition.coerceAtLeast(0L) else 0L
        prefs.edit()
            .putString("last_track", trackToJson(cur).toString())
            .putLong("last_position_ms", pos)
            .apply()
    }

    private fun restoreLastPlayedState() {
        val prefs = getSharedPreferences("selyuk_v15", Context.MODE_PRIVATE)
        val raw = prefs.getString("last_track", "") ?: ""
        if (raw.isEmpty()) return
        try {
            val o = JSONObject(raw)
            val restored = SpaceItem(
                idKey = o.optString("idKey"),
                title = o.optString("title"),
                subtitle = o.optString("subtitle"),
                url = o.optString("url"),
                isFolder = false,
                directMp3 = o.optString("directMp3"),
                type = ItemType.TRACK,
                coverUrl = o.optString("coverUrl")
            )
            if (restored.title.isNotEmpty()) {
                currentPlayingItem = restored
                pendingRestoredPositionMs = prefs.getLong("last_position_ms", 0L)
                updatePlayerUiForItem(restored)
                tvCurrentTime.text = formatTime(pendingRestoredPositionMs)
            }
        } catch (_: Exception) {}
    }

    private fun saveSearchQueryToHistory(query: String) {
        val prefs = getSharedPreferences("selyuk_v15", Context.MODE_PRIVATE)
        val raw = prefs.getString("search_queries", "[]") ?: "[]"
        val list = ArrayList<String>()
        try {
            val arr = JSONArray(raw)
            for (i in 0 until arr.length()) {
                val s = arr.optString(i)
                if (s.isNotEmpty() && !s.equals(query, ignoreCase = true)) list.add(s)
            }
        } catch (_: Exception) {}
        list.add(0, query)
        val out = JSONArray()
        for (s in list.take(40)) out.put(s)
        prefs.edit().putString("search_queries", out.toString()).apply()
        setupSearchAutocomplete()
    }

    private fun setupSearchAutocomplete() {
        val prefs = getSharedPreferences("selyuk_v15", Context.MODE_PRIVATE)
        val raw = prefs.getString("search_queries", "[]") ?: "[]"
        val suggestions = LinkedHashSet<String>()
        try {
            val arr = JSONArray(raw)
            for (i in 0 until arr.length()) {
                val s = arr.optString(i)
                if (s.isNotEmpty()) suggestions.add(s)
            }
        } catch (_: Exception) {}
        for (it in allParsedItems.take(50)) {
            if (it.type != ItemType.HEADER && it.title.isNotEmpty()) {
                suggestions.add(it.title)
            }
        }
        val autoAdapter = ArrayAdapter(this, android.R.layout.simple_dropdown_item_1line, suggestions.toList())
        etSearch.setAdapter(autoAdapter)
    }

    private fun exportLibraryToJson() {
        try {
            val root = JSONObject()
            root.put("app", "Селюк мьюзик v15.0")
            root.put("favorites", JSONArray(getSharedPreferences("selyuk_v15", Context.MODE_PRIVATE).getString("favorites", "[]") ?: "[]"))
            root.put("history", JSONArray(getSharedPreferences("selyuk_v15", Context.MODE_PRIVATE).getString("history", "[]") ?: "[]"))
            root.put("playlists", getPlaylistsObject())
            val jsonStr = root.toString(2)

            val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
            cm.setPrimaryClip(ClipData.newPlainText("SelyukMusicBackup", jsonStr))

            var fileMsg = "Скопировано в буфер обмена"
            try {
                val dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                if (!dir.exists()) dir.mkdirs()
                val file = File(dir, "SelyukMusic_backup.json")
                file.writeText(jsonStr)
                fileMsg = "Сохранено в Download/SelyukMusic_backup.json и скопировано в буфер обмена"
            } catch (_: Exception) {}

            Toast.makeText(this, fileMsg, Toast.LENGTH_LONG).show()
        } catch (e: Exception) {
            Toast.makeText(this, "Ошибка экспорта: ${e.message}", Toast.LENGTH_SHORT).show()
        }
    }

