              private fun loadSavedListsIntoMemory() {
                  loadWaveMemoryFromPrefs()
                  val prefs = getSharedPreferences("selyuk_v15", Context.MODE_PRIVATE)
                  val favRaw = prefs.getString("favorites", "[]") ?: "[]"
                  val histRaw = prefs.getString("history", "[]") ?: "[]"
                  val offRaw = prefs.getString("offline_tracks_json", "[]") ?: "[]"
                  val savedPreset = prefs.getInt("audio_preset", 0)
                  MusicEngine.currentAudioPreset = savedPreset
                  try {
                      val favs = parseJsonTrackArray(JSONArray(favRaw))
                      memFavorites.clear()
                      memFavorites.addAll(favs)
                      memFavoriteKeys.clear()
                      for (f in favs) memFavoriteKeys.add(f.idKey)
                  } catch (_: Exception) {}
                  try {
                      val hists = parseJsonTrackArray(JSONArray(histRaw))
                      memHistory.clear()
                      memHistory.addAll(hists)
                  } catch (_: Exception) {}
                  try {
                      val offs = parseJsonTrackArray(JSONArray(offRaw))
                      memOfflineMetaByPath.clear()
                      for (o in offs) {
                          if (o.filePath.isNotEmpty()) {
                              memOfflineMetaByPath[o.filePath] = o
                              memOfflineMetaByPath[File(o.filePath).name] = o
                          }
                      }
                  } catch (_: Exception) {}
              }
          
              private fun persistListAsync(key: String, snapshot: List<SpaceItem>) {
                  uiScope.launch(Dispatchers.IO) {
                      val arr = JSONArray()
                      for (item in snapshot.take(250)) {
                          arr.put(trackToJson(item))
                      }
                      getSharedPreferences("selyuk_v15", Context.MODE_PRIVATE)
                          .edit().putString(key, arr.toString()).apply()
                      if (key == "favorites" || key == "offline_tracks_json") {
                          withContext(Dispatchers.Main) { scheduleAutoBackup() }
                      }
                  }
              }
          
              private fun isFavorite(item: SpaceItem): Boolean = memFavoriteKeys.contains(item.idKey)
          
              private fun toggleFavorite(item: SpaceItem): Boolean {
                  return if (memFavoriteKeys.remove(item.idKey)) {
                      memFavorites.removeAll { it.idKey == item.idKey }
                      persistListAsync("favorites", ArrayList(memFavorites))
                      false
                  } else {
                      memFavoriteKeys.add(item.idKey)
                      memFavorites.add(0, item)
                      val artist = extractArtistName(item)
                      if (artist.isNotEmpty()) {
                          waveBoostedArtists.add(artist)
                          waveSkippedArtists.remove(artist)
                      }
                      // Если включена Моя волна — сразу подмешиваем похожие треки со страницы лайкнутого трека!
                      val related = recentRelatedByTrackKey[item.idKey]
                      if (isWaveMode && !related.isNullOrEmpty()) {
                          var inserted = 0
                          for (r in related) {
                              if (!wavePlayedKeys.contains(r.idKey) && !wavePlayedFingerprints.contains(buildTrackFingerprint(r)) && playbackQueue.none { it.idKey == r.idKey }) {
                                  val pos = (playbackQueueIndex + 2 + inserted).coerceAtMost(playbackQueue.size)
                                  playbackQueue.add(pos, r)
                                  inserted++
                                  if (inserted >= 2) break
                              }
                          }
                          if (currentEntry.tabMode == TabMode.MY_WAVE && inserted > 0) {
                              renderWaveScreenToUi()
                          }
                      }
                      persistListAsync("favorites", ArrayList(memFavorites))
                      true
                  }
              }
          
              private fun addToHistory(item: SpaceItem) {
                  memHistory.removeAll { it.idKey == item.idKey }
                  memHistory.add(0, item)
                  persistListAsync("history", ArrayList(memHistory))
              }
          
