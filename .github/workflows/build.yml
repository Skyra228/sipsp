    private fun switchBottomTab(tab: BottomTab) {
        highlightBottomNav(tab)
        navHistory.clear()
        searchBarContainer.visibility = if (tab == BottomTab.SEARCH) View.VISIBLE else View.GONE

        if (tab == BottomTab.MORE) {
            rvTracks.visibility = View.GONE
            moreScreenContainer.visibility = View.VISIBLE
            sectionTabsScroll.visibility = View.GONE
            subFilterScroll.visibility = View.GONE
            tvHeaderTitle.text = "Селюк мьюзик • Ещё"
            val cacheMb = (MusicEngine.simpleCache?.cacheSpace ?: 0L) / (1024L * 1024L)
            tvStatus.text = "Кэш страниц: ${pageCache.size()} • Аудиокэш: $cacheMb МБ"
            btnBackNav.visibility = View.GONE
            return
        }

        rvTracks.visibility = View.VISIBLE
        moreScreenContainer.visibility = View.GONE
        sectionTabsScroll.visibility = if (tab == BottomTab.SEARCH) View.GONE else View.VISIBLE

        val allChips = listOf(chipOnline, chipPop, chipCats, chipAlbums, chipNew, chipFav, chipHist, chipPlaylists, chipNewPlaylist)
        for (c in allChips) c.visibility = View.GONE

        when (tab) {
            BottomTab.HOME -> {
                chipOnline.visibility = View.VISIBLE
                chipPop.visibility = View.VISIBLE
                highlightActiveChip(chipOnline)
                loadSection(onlineRootUrl, TabMode.ONLINE, "Селюк мьюзик • Онлайн", addToHistory = false)
            }
            BottomTab.MUSIC -> {
                chipCats.visibility = View.VISIBLE
                chipAlbums.visibility = View.VISIBLE
                highlightActiveChip(chipCats)
                loadSection(genresTabUrl, TabMode.GENRES, "Жанры музыки", addToHistory = false)
            }
            BottomTab.ARTISTS -> {
                chipNew.visibility = View.VISIBLE
