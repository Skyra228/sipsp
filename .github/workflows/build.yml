                          </LinearLayout>
                      </ScrollView>
                  </FrameLayout>
          
                  <WebView
                      android:id="@+id/hiddenWebView"
                      android:layout_width="1dp"
                      android:layout_height="1dp"
                      android:visibility="invisible" />
              </LinearLayout>
          
              <!-- ПАРЯЩАЯ СТЕКЛЯННАЯ КАПСУЛА МИНИ-ПЛЕЕРА (НА ЧИСТЫХ TEXTVIEW С ВЕКТОРНЫМИ ИКОНКАМИ БЕЗ ФИОЛЕТОВОЙ ЗАЛИВКИ) -->
              <LinearLayout
                  android:id="@+id/miniPlayerBar"
                  android:layout_width="match_parent"
