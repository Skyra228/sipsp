              private fun hideKeyboard() {
                  (getSystemService(Context.INPUT_METHOD_SERVICE) as? InputMethodManager)?.hideSoftInputFromWindow(etSearch.windowToken, 0)
              }

              private fun toAbsoluteUrl(path: String): String {
                  val clean = path.trim()
                  return when {
                      clean.startsWith("http://") || clean.startsWith("https://") -> clean
                      clean.startsWith("//") -> "https:$clean"
                      clean.startsWith("/") -> baseHost + clean
                      else -> "$baseHost/$clean"
                  }
              }

              private fun fetchDocFast(urlOrPath: String): Document? {
                  return try {
                      val full = toAbsoluteUrl(urlOrPath)
                      val req = Request.Builder().url(full).header("User-Agent", MusicEngine.USER_AGENT)
                          .header("Referer", "$baseHost/")
                          .build()
                      httpClient.newCall(req).execute().use { resp ->
                          if (!resp.isSuccessful) return null
                          val html = resp.body?.string() ?: return null
                          val finalHost = "${resp.request.url.scheme}://${resp.request.url.host}"
                          if (finalHost.contains("spcs") || finalHost.contains("spaces")) baseHost = finalHost
                          Jsoup.parse(html, resp.request.url.toString())
                      }
                  } catch (_: Exception) { null }
              }

              private fun loadSection(urlOrPath: String, mode: TabMode, title: String, addToHistory: Boolean) {
                  loadJob?.cancel()
                  val fullTarget = toAbsoluteUrl(urlOrPath)
                  if (addToHistory && currentEntry.url.isNotEmpty() && currentEntry.url != fullTarget) {
                      navHistory.push(currentEntry)
                  }
                  currentEntry = NavEntry(fullTarget, mode, title)
                  updateMirrorBadge()

                  progressBar.visibility = View.VISIBLE
                  tvStatus.text = "Загрузка: $title..."

                  loadJob = uiScope.launch {
                      val doc = withContext(Dispatchers.IO) { fetchDocFast(fullTarget) }
                      progressBar.visibility = View.GONE
                      updateMirrorBadge()

                      if (doc != null) {
                          nextPageUrl = findNextPageUrl(doc)
                          val parsed = parseMusicOnlineDoc(doc, mode)
                          items.clear(); seenKeys.clear()
                          for (i in parsed) {
                              if (seenKeys.add(i.idKey)) items.add(i)
                          }
                          adapter.notifyDataSetChanged()
                          val tracks = items.count { !it.isFolder }
                          val folders = items.count { it.isFolder }
                          tvStatus.text = when {
                              tracks > 0 -> "$title • Треков: $tracks"
                              folders > 0 -> "$title • Разделов: $folders"
                              else -> "$title • Пусто"
                          }
                      } else {
                          tvStatus.text = "Ошибка загрузки раздела"
                      }
                  }
              }

              private fun loadNextPage() {
                  val next = nextPageUrl ?: return
                  isLoadingMore = true
                  progressBar.visibility = View.VISIBLE
                  uiScope.launch {
                      val doc = withContext(Dispatchers.IO) { fetchDocFast(next) }
                      progressBar.visibility = View.GONE
                      isLoadingMore = false
                      if (doc != null) {
                          nextPageUrl = findNextPageUrl(doc)
                          val more = parseMusicOnlineDoc(doc, currentEntry.tabMode)
                          var added = 0
                          for (m in more) {
                              if (seenKeys.add(m.idKey)) { items.add(m); added++ }
                          }
                          if (added > 0) adapter.notifyDataSetChanged()
                      }
                  }
              }

              // УНИВЕРСАЛЬНЫЙ ПАРСЕР v10.0 (Треки, Альбомы, Исполнители)
              private fun parseMusicOnlineDoc(doc: Document, mode: TabMode): List<SpaceItem> {
                  val result = ArrayList<SpaceItem>()
                  val seen = HashSet<String>()

                  // 1. ИЩЕМ ТРЕКИ (в блоках __adv_list_track, где уже есть ссылка на MP3)
                  for (container in doc.select("div.__adv_list_track")) {
                      val player = container.selectFirst("div.player_item")
                      val mp3 = player?.attr("data-src")?.trim() ?: ""
                      val artist = player?.attr("data-artist")?.trim() ?: ""
                      val title = player?.attr("data-title")?.trim() ?: ""
                      val nid = player?.attr("data-nid")?.trim() ?: ""
                      
                      if (title.isEmpty() || mp3.isEmpty()) continue

                      val link = container.selectFirst("a.arrow_link")
                      val trackUrl = link?.absUrl("href") ?: ""
                      val id = nid.ifEmpty { extractId(trackUrl) }
                      if (!seen.add(id)) continue

                      result.add(
                          SpaceItem(
                              idKey = "track_$id",
                              title = title,
                              subtitle = artist.ifEmpty { "Музыка онлайн" },
                              url = trackUrl,
                              isFolder = false,
                              directMp3 = mp3,
                              type = ItemType.TRACK
                          )
                      )
                  }

                  // 2. ИЩЕМ АЛЬБОМЫ И ИСПОЛНИТЕЛЕЙ (если это страница поиска или категорий)
                  if (mode == TabMode.SEARCH || mode == TabMode.ARTISTS || mode == TabMode.GENRES || result.isEmpty()) {
                      // Исполнители
                      for (a in doc.select("a[href*=/music-online/artist/]")) {
                          val url = a.absUrl("href")
                          val text = a.text().trim()
                          if (text.isEmpty()) continue
                          val id = extractId(url)
                          if (seen.add("artist_$id")) {
                              result.add(SpaceItem("artist_$id", text, "Исполнитель", url, true, type = ItemType.ARTIST))
                          }
                      }
                      // Альбомы
                      for (a in doc.select("a[href*=/music-online/album/]")) {
                          val url = a.absUrl("href")
                          val text = a.text().trim()
                          if (text.isEmpty()) continue
                          val id = extractId(url)
                          if (seen.add("album_$id")) {
                              result.add(SpaceItem("album_$id", text, "Альбом", url, true, type = ItemType.ALBUM))
                          }
                      }
                  }

                  return result
              }

              private fun performMusicOnlineSearch(query: String) {
                  loadJob?.cancel()
                  progressBar.visibility = View.VISIBLE
                  tvStatus.text = "Поиск «$query»..."

                  loadJob = uiScope.launch {
                      val found = withContext(Dispatchers.IO) {
                          val enc = URLEncoder.encode(query, "UTF-8")
                          // Без T=28, чтобы получить сразу Треки, Исполнителей и Альбомы
                          val url = "$baseHost/music-online/search/index/?sq=$enc"
                          
                          val req = Request.Builder()
                              .url(url)
                              .header("User-Agent", MusicEngine.USER_AGENT)
                              .header("Referer", "$baseHost/music-online/")
                              .build()

                          try {
                              httpClient.newCall(req).execute().use { resp ->
                                  if (!resp.isSuccessful) return@withContext emptyList<SpaceItem>()
                                  val html = resp.body?.string() ?: return@withContext emptyList<SpaceItem>()
                                  val doc = Jsoup.parse(html, resp.request.url.toString())
                                  parseMusicOnlineDoc(doc, TabMode.SEARCH)
                              }
                          } catch (_: Exception) {
                              emptyList<SpaceItem>()
                          }
                      }
                      
                      progressBar.visibility = View.GONE
                      updateMirrorBadge()
                      items.clear()
                      seenKeys.clear()
                      for (t in found) {
                          if (seenKeys.add(t.idKey)) items.add(t)
                      }
                      adapter.notifyDataSetChanged()
                      tvStatus.text = if (items.isNotEmpty()) "Найдено: ${items.size}" else "Ничего не найдено"
                  }
              }

              private fun extractId(url: String): String {
                  val m = Regex("""/(?:view|download|file|track)/[^/?#]*?(\d{4,})""").find(url)?.groupValues?.get(1)
                  if (m != null) return m
                  val p = Regex("""(?:(?:file_id|fid|id|link_id)=(\d{4,}))""").find(url)?.groupValues?.get(1)
                  if (p != null) return p
                  return url.substringBefore("?").substringBefore("#")
              }

              private fun hasLetters(s: String) = Regex("[a-zA-Zа-яА-ЯёЁ]{2,}").containsMatchIn(s)

              private fun findNextPageUrl(doc: Document): String? {
                  val nextLink = doc.selectFirst("a.pgn__link_next:not(.pgn__link_disabled)")
                  return nextLink?.absUrl("href")?.takeIf { it.isNotEmpty() }
              }

              private fun onItemClicked(pos: Int) {
                  if (pos !in items.indices) return
                  val item = items[pos]
                  
                  if (item.isFolder) {
                      val nextMode = when (item.type) {
                          ItemType.ARTIST -> TabMode.ARTISTS
                          ItemType.ALBUM -> TabMode.FOLDER_VIEW
                          else -> TabMode.FOLDER_VIEW
                      }
                      loadSection(item.url, nextMode, item.title, addToHistory = true)
                  } else {
                      playTrackAt(pos)
                  }
              }

              private suspend fun resolveStreamUrl(item: SpaceItem): String {
                  if (item.directMp3.isNotEmpty()) return item.directMp3
                  val fast = withContext(Dispatchers.IO) {
                      val doc = fetchDocFast(item.url) ?: return@withContext ""
                      val audio = doc.selectFirst("audio[src], audio source[src], [data-mp3], [data-src*=.mp3]")
                      if (audio != null) {
                          audio.absUrl("src").ifEmpty { audio.absUrl("data-mp3") }
                      } else {
                          for (a in doc.select("a[href]")) {
                              val h = a.absUrl("href")
                              if (isDirectAudioFileUrl(h)) return@withContext h
                          }
                          ""
                      }
                  }
                  if (fast.isNotEmpty()) { item.directMp3 = fast; return fast }

                  val web = withTimeoutOrNull(7000L) {
                      suspendCancellableCoroutine<String> { cont ->
                          runOnUiThread {
                              webViewMp3Callback = { found -> if (cont.isActive) cont.resume(found) }
                              hiddenWebView.loadUrl(item.url)
                          }
                      }
                  } ?: ""
                  if (web.isNotEmpty()) item.directMp3 = web
                  return web
              }

              private fun playTrackAt(index: Int) {
                  if (index !in items.indices) return
                  val item = items[index]
                  if (item.isFolder) { loadSection(item.url, TabMode.FOLDER_VIEW, item.title, addToHistory = true); return }

                  currentIndex = index
                  currentPlayingItem = item
                  adapter.selectedIndex = index
                  adapter.notifyDataSetChanged()

                  btnFavTrack.text = if (isFavorite(item)) "♥" else "♡"
                  tvNowPlayingTitle.text = item.title
                  tvNowPlayingSub.text = "Загрузка аудиопотока..."
                  progressBar.visibility = View.VISIBLE

                  uiScope.launch {
                      val mp3 = resolveStreamUrl(item)
                      progressBar.visibility = View.GONE
                      if (mp3.isNotEmpty()) {
                          tvNowPlayingSub.text = item.subtitle
                          addToHistory(item)
                          val cookies = allCookies.values.joinToString("; ") { "${it.name}=${it.value}" }
                          val ds = DefaultHttpDataSource.Factory().setUserAgent(MusicEngine.USER_AGENT).setAllowCrossProtocolRedirects(true)
                              .setDefaultRequestProperties(mapOf("Referer" to item.url, "Cookie" to cookies))
                          val meta = MediaMetadata.Builder().setTitle(item.title).setArtist(item.subtitle).build()
                          val mediaItem = MediaItem.Builder().setUri(mp3).setMediaMetadata(meta).build()
                          player.setMediaSource(DefaultMediaSourceFactory(ds).createMediaSource(mediaItem))
                          player.prepare()
                          player.play()
                      } else {
                          tvNowPlayingSub.text = "Ошибка получения MP3"
                      }
                  }
              }

              private fun playNextTrack() {
                  val next = (currentIndex + 1 until items.size).firstOrNull { !items[it].isFolder }
                  if (next != null) playTrackAt(next)
              }

              private fun playPrevTrack() {
                  val prev = (currentIndex - 1 downTo 0).firstOrNull { !items[it].isFolder }
                  if (prev != null) playTrackAt(prev)
              }

              private fun formatTime(ms: Long): String {
                  if (ms <= 0) return "0:00"
                  return String.format("%d:%02d", (ms / 1000) / 60, (ms / 1000) % 60)
              }

              override fun onBackPressed() {
                  if (navHistory.isNotEmpty()) {
                      val p = navHistory.pop()
                      updateMirrorBadge()
                      loadSection(p.url, p.tabMode, p.titleHint, addToHistory = false)
                  } else super.onBackPressed()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  sleepTimer?.cancel()
                  handler.removeCallbacksAndMessages(null)
                  uiScope.cancel()
              }

              inner class SpaceAdapter(
                  private val list: List<SpaceItem>,
                  private val onClick: (Int) -> Unit
              ) : RecyclerView.Adapter<SpaceAdapter.VH>() {
                  var selectedIndex = -1
                  inner class VH(v: View) : RecyclerView.ViewHolder(v) {
                      val tvCover: TextView = v.findViewById(R.id.tvCover)
                      val tvTitle: TextView = v.findViewById(R.id.tvTitle)
                      val tvSubtitle: TextView = v.findViewById(R.id.tvSubtitle)
                      val tvPlayIcon: TextView = v.findViewById(R.id.tvPlayIcon)
                  }

                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                      val v = LayoutInflater.from(parent.context).inflate(R.layout.item_track, parent, false)
                      return VH(v)
                  }

                  override fun onBindViewHolder(holder: VH, position: Int) {
                      val item = list[position]
                      holder.tvTitle.text = item.title
                      holder.tvSubtitle.text = item.subtitle
                      if (item.isFolder) {
                          holder.tvCover.text = when(item.type) {
                              ItemType.ARTIST -> "👤"
                              ItemType.ALBUM -> "💿"
                              else -> "📁"
                          }
                          holder.tvTitle.setTextColor(0xFFFFFFFF.toInt())
                          holder.tvPlayIcon.text = "›"
                      } else {
                          holder.tvCover.text = "♪"
                          val sel = position == selectedIndex
                          holder.tvTitle.setTextColor(if (sel) 0xFFFFCC00.toInt() else 0xFFFFFFFF.toInt())
                          holder.tvPlayIcon.text = if (sel) "❚❚" else "▶"
                      }
                      holder.itemView.setOnClickListener { onClick(position) }
                  }

                  override fun getItemCount(): Int = list.size
              }
          }
