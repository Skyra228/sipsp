              private fun getSavedTracks(key: String): ArrayList<SpaceItem> {
                  val prefs = getSharedPreferences("spaces_v10", Context.MODE_PRIVATE)
                  val raw = prefs.getString(key, "[]") ?: "[]"
                  val list = ArrayList<SpaceItem>()
                  try {
                      val arr = JSONArray(raw)
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          list.add(
                              SpaceItem(
                                  idKey = o.optString("idKey"),
                                  title = o.optString("title"),
                                  subtitle = o.optString("subtitle"),
                                  url = o.optString("url"),
                                  isFolder = false,
                                  directMp3 = o.optString("directMp3"),
                                  type = ItemType.TRACK
                              )
                          )
                      }
                  } catch (_: Exception) {}
                  return list
              }

              private fun saveTracksList(key: String, list: List<SpaceItem>) {
                  val arr = JSONArray()
                  for (item in list.take(150)) {
                      val o = JSONObject()
                      o.put("idKey", item.idKey)
                      o.put("title", item.title)
                      o.put("subtitle", item.subtitle)
                      o.put("url", item.url)
                      o.put("directMp3", item.directMp3)
                      arr.put(o)
                  }
                  getSharedPreferences("spaces_v10", Context.MODE_PRIVATE)
                      .edit().putString(key, arr.toString()).apply()
              }

              private fun isFavorite(item: SpaceItem): Boolean =
                  getSavedTracks("favorites").any { it.idKey == item.idKey || it.title == item.title }

              private fun toggleFavorite(item: SpaceItem): Boolean {
                  val favs = getSavedTracks("favorites")
                  val idx = favs.indexOfFirst { it.idKey == item.idKey || it.title == item.title }
                  return if (idx >= 0) {
                      favs.removeAt(idx); saveTracksList("favorites", favs); false
                  } else {
                      favs.add(0, item); saveTracksList("favorites", favs); true
                  }
              }

              private fun addToHistory(item: SpaceItem) {
                  val hist = getSavedTracks("history")
                  hist.removeAll { it.idKey == item.idKey || it.title == item.title }
                  hist.add(0, item)
                  saveTracksList("history", hist)
              }

              private fun showSavedList(key: String, label: String) {
                  loadJob?.cancel()
                  progressBar.visibility = View.GONE
                  nextPageUrl = null
                  updateMirrorBadge()
                  val saved = getSavedTracks(key)
                  items.clear(); seenKeys.clear()
                  items.addAll(saved)
                  adapter.notifyDataSetChanged()
                  tvStatus.text = if (saved.isNotEmpty()) "$label (${saved.size})" else "$label: пусто"
              }

              private fun downloadCurrentTrack() {
                  val cur = currentPlayingItem
                  if (cur == null) {
                      Toast.makeText(this, "Сначала выберите трек", Toast.LENGTH_SHORT).show()
                      return
                  }
                  uiScope.launch {
                      val mp3 = resolveStreamUrl(cur)
                      if (mp3.isEmpty()) {
                          Toast.makeText(this@MainActivity, "Не удалось получить MP3", Toast.LENGTH_SHORT).show()
                          return@launch
                      }
                      try {
                          val name = "${cur.subtitle} - ${cur.title}".replace(Regex("[\\\\/:*?\"<>|]"), "_").take(90) + ".mp3"
                          val req = DownloadManager.Request(Uri.parse(mp3))
                              .setTitle(cur.title)
                              .addRequestHeader("User-Agent", MusicEngine.USER_AGENT)
                              .addRequestHeader("Referer", cur.url)
                              .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                              .setDestinationInExternalPublicDir(Environment.DIRECTORY_MUSIC, "SpacesPlayer/$name")
                          (getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager).enqueue(req)
                          Toast.makeText(this@MainActivity, "Загрузка в Music/SpacesPlayer!", Toast.LENGTH_LONG).show()
                      } catch (e: Exception) {
                          Toast.makeText(this@MainActivity, "Ошибка: ${e.message}", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

