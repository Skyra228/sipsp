                  </LinearLayout>
              </LinearLayout>
          </LinearLayout>
          EOF

          # 8. AndroidManifest.xml (с поддержкой фоновой службы MediaSessionService)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_media_play"
                  android:label="Spaces Музыка"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Material3.Dark.NoActionBar"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".PlaybackService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="androidx.media3.session.MediaSessionService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          # 9. Фоновый медиа-сервис PlaybackService.kt (шторка уведомлений + экран блокировки)
          cat << 'EOF' > app/src/main/java/com/example/spacesplayer/PlaybackService.kt
          package com.example.spacesplayer

          import android.content.Context
          import android.content.Intent
          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.datasource.DefaultHttpDataSource
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService

          object MusicEngine {
              const val USER_AGENT = "Mozilla/5.0 (Linux; Android 14; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36"
              var player: ExoPlayer? = null
              var mediaSession: MediaSession? = null
              var onNextCallback: (() -> Unit)? = null
              var onPrevCallback: (() -> Unit)? = null

              fun ensureInitialized(context: Context) {
                  if (player == null) {
                      val appCtx = context.applicationContext
                      val dsFactory = DefaultHttpDataSource.Factory()
                          .setUserAgent(USER_AGENT)
                          .setAllowCrossProtocolRedirects(true)

                      val audioAttrs = AudioAttributes.Builder()
                          .setUsage(C.USAGE_MEDIA)
                          .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)
                          .build()

                      val exo = ExoPlayer.Builder(appCtx)
                          .setMediaSourceFactory(DefaultMediaSourceFactory(dsFactory))
                          .setAudioAttributes(audioAttrs, true)
                          .setHandleAudioBecomingNoisy(true)
                          .build()

                      player = exo
                      mediaSession = MediaSession.Builder(appCtx, exo).build()
                  }
              }
          }

          class PlaybackService : MediaSessionService() {
              override fun onCreate() {
                  super.onCreate()
                  MusicEngine.ensureInitialized(this)
              }

              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo): MediaSession? {
                  MusicEngine.ensureInitialized(this)
                  return MusicEngine.mediaSession
              }

              override fun onTaskRemoved(rootIntent: Intent?) {
                  val p = MusicEngine.player
                  if (p == null || !p.playWhenReady) {
                      stopSelf()
                  }
              }
          }
          EOF

          # 10. Главный модуль MainActivity.kt (v6.0)
          cat << 'EOF' > app/src/main/java/com/example/spacesplayer/MainActivity.kt
          package com.example.spacesplayer

          import android.annotation.SuppressLint
          import android.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputMethodManager
          import android.webkit.*
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MediaMetadata
          import androidx.media3.common.PlaybackException
          import androidx.media3.common.Player
          import androidx.media3.datasource.DefaultHttpDataSource
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import kotlinx.coroutines.*
          import okhttp3.*
          import org.jsoup.Jsoup
          import org.jsoup.nodes.Document
          import java.net.URLEncoder
          import java.util.Stack
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.TimeUnit
          import kotlin.coroutines.resume

          data class SpaceItem(
              val idKey: String,
              val title: String,
              val subtitle: String,
              val url: String,
              val isFolder: Boolean,
              var directMp3: String = ""
          )

          data class NavState(
              val url: String,
              val mode: PageMode
          )

          enum class PageMode {
              TRACKS, FOLDERS, AUTO
          }

          class MainActivity : AppCompatActivity() {

              private val player: ExoPlayer
                  get() {
                      MusicEngine.ensureInitialized(this)
                      return MusicEngine.player!!
                  }

              private lateinit var rvTracks: RecyclerView
              private lateinit var tvStatus: TextView
              private lateinit var tvMirror: TextView
              private lateinit var btnBackNav: TextView
              private lateinit var etSearch: EditText
              private lateinit var progressBar: ProgressBar
              private lateinit var tvNowPlayingTitle: TextView
              private lateinit var tvNowPlayingSub: TextView
              private lateinit var btnPlayPause: Button
              private lateinit var seekBar: SeekBar
              private lateinit var tvCurrentTime: TextView
              private lateinit var tvTotalTime: TextView
              private lateinit var hiddenWebView: WebView

              private lateinit var chipPop: TextView
              private lateinit var chipNew: TextView
              private lateinit var chipCats: TextView
              private lateinit var chipOnline: TextView

              private val items = ArrayList<SpaceItem>()
              private val seenKeys = HashSet<String>()
              private val cachedGenres = ArrayList<SpaceItem>()

              private lateinit var adapter: SpaceAdapter
              private var currentIndex = -1
              private var isUserSeeking = false

              private var nextPageUrl: String? = null
              private var isLoadingMore = false
              private val navHistory = Stack<NavState>()
              private var currentState = NavState("", PageMode.TRACKS)

              private var categoriesTabUrl = "/sz/muzyka/"
              private var popularTabUrl = "/sz/muzyka/top/"
              private var newTabUrl = "/sz/muzyka/new/"

              private val uiScope = CoroutineScope(Dispatchers.Main + SupervisorJob())
              private var loadJob: Job? = null
              private val handler = Handler(Looper.getMainLooper())

              private var baseHost = "https://world84.spcs.bio"
              private var webViewMp3Callback: ((String) -> Unit)? = null

              private val allCookies = ConcurrentHashMap<String, Cookie>()
              private val httpClient = OkHttpClient.Builder()
                  .connectTimeout(8, TimeUnit.SECONDS)
                  .readTimeout(8, TimeUnit.SECONDS)
                  .followRedirects(true)
                  .followSslRedirects(true)
                  .cookieJar(object : CookieJar {
                      override fun saveFromResponse(url: HttpUrl, cookies: List<Cookie>) {
                          val cm = CookieManager.getInstance()
                          for (c in cookies) {
                              allCookies[c.name] = c
                              cm.setCookie("${url.scheme}://${url.host}", c.toString())
                          }
                      }
                      override fun loadForRequest(url: HttpUrl): List<Cookie> {
                          return allCookies.values.toList()
                      }
                  })
                  .build()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  MusicEngine.ensureInitialized(this)
                  try {
                      startService(Intent(this, PlaybackService::class.java))
                  } catch (_: Exception) {}

                  val prefs = getSharedPreferences("spaces_v6", Context.MODE_PRIVATE)
                  baseHost = extractCleanHost(prefs.getString("host", "https://world84.spcs.bio") ?: "https://world84.spcs.bio")

                  rvTracks = findViewById(R.id.rvTracks)
                  tvStatus = findViewById(R.id.tvStatus)
                  tvMirror = findViewById(R.id.tvMirror)
                  btnBackNav = findViewById(R.id.btnBackNav)
                  etSearch = findViewById(R.id.etSearch)
                  progressBar = findViewById(R.id.progressBar)
                  tvNowPlayingTitle = findViewById(R.id.tvNowPlayingTitle)
                  tvNowPlayingSub = findViewById(R.id.tvNowPlayingSub)
                  btnPlayPause = findViewById(R.id.btnPlayPause)
                  seekBar = findViewById(R.id.seekBar)
                  tvCurrentTime = findViewById(R.id.tvCurrentTime)
                  tvTotalTime = findViewById(R.id.tvTotalTime)
                  hiddenWebView = findViewById(R.id.hiddenWebView)

                  chipPop = findViewById(R.id.chipPop)
                  chipNew = findViewById(R.id.chipNew)
                  chipCats = findViewById(R.id.chipCats)
                  chipOnline = findViewById(R.id.chipOnline)

                  updateMirrorBadge()
                  setupHiddenWebView()
                  setupPlayerListeners()
                  setupRecyclerView()
                  setupControls()

                  bootstrapAndLoadPopular()
              }

              private fun extractCleanHost(rawInput: String): String {
                  return try {
                      val withScheme = if (rawInput.startsWith("http")) rawInput else "https://$rawInput"
                      val uri = Uri.parse(withScheme)
                      val host = uri.host ?: "world84.spcs.bio"
                      "${uri.scheme ?: "https"}://$host"
                  } catch (_: Exception) {
                      "https://world84.spcs.bio"
                  }
              }

              private fun highlightActiveChip(active: TextView?) {
                  val chips = listOf(chipPop, chipNew, chipCats, chipOnline)
                  for (c in chips) {
                      if (c == active) {
                          c.setBackgroundResource(R.drawable.bg_chip_active)
                          c.setTextColor(0xFFFFCC00.toInt())
                      } else {
                          c.setBackgroundResource(R.drawable.bg_chip)
                          c.setTextColor(0xFFFFFFFF.toInt())
                      }
                  }
              }

              private fun updateMirrorBadge() {
                  tvMirror.text = "⚙ " + baseHost.removePrefix("https://").removePrefix("http://")
                  btnBackNav.visibility = if (navHistory.isNotEmpty()) View.VISIBLE else View.GONE
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun setupHiddenWebView() {
                  CookieManager.getInstance().setAcceptCookie(true)
                  hiddenWebView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      userAgentString = MusicEngine.USER_AGENT
                      mediaPlaybackRequiresUserGesture = false
                  }
                  hiddenWebView.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(view: WebView?, request: WebResourceRequest?): WebResourceResponse? {
                          val url = request?.url?.toString() ?: ""
                          if (isLikelyAudioBinaryUrl(url)) {
                              deliverWebViewMp3(url)
                          }
                          return super.shouldInterceptRequest(view, request)
                      }

                      override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean {
                          val url = request?.url?.toString() ?: return false
                          if (isLikelyAudioBinaryUrl(url)) {
                              deliverWebViewMp3(url)
                              return true
                          }
                          return false
                      }

                      override fun onPageFinished(view: WebView?, url: String?) {
                          super.onPageFinished(view, url)
                          view?.evaluateJavascript(
                              """
                              (function() {
                                  var a = document.querySelector('audio[src], source[src]');
                                  if (a && a.src) return a.src;
                                  var links = document.querySelectorAll('a[href]');
                                  for (var i = 0; i < links.length; i++) {
                                      var h = links[i].href || '';
                                      if (h.indexOf('.mp3') !== -1 || h.indexOf('/download/') !== -1 || h.indexOf('download_file') !== -1) {
                                          return h;
                                      }
                                  }
                                  var playBtn = document.querySelector('[data-mp3], [data-src], [data-url], .player_play, .play_btn, .js-play');
                                  if (playBtn) {
                                      var d = playBtn.getAttribute('data-mp3') || playBtn.getAttribute('data-src') || playBtn.getAttribute('data-url');
                                      if (d) return d;
                                      playBtn.click();
                                  }
                                  return '';
                              })();
                              """.trimIndent()
                          ) { res ->
                              val clean = res?.trim()?.removeSurrounding("\"") ?: ""
                              if (clean.startsWith("http") && isLikelyAudioBinaryUrl(clean)) {
                                  deliverWebViewMp3(clean)
                              }
                          }
                      }
                  }
                  hiddenWebView.setDownloadListener { url, _, _, mimetype, _ ->
                      if (url.isNotEmpty() && (mimetype.contains("audio") || isLikelyAudioBinaryUrl(url))) {
                          deliverWebViewMp3(url)
                      }
                  }
              }

              private fun isLikelyAudioBinaryUrl(url: String): Boolean {
                  val l = url.lowercase()
                  if (l.contains("/registration") || l.contains("/login") || l.contains("/sz/muzyka/?")) return false
                  return l.contains(".mp3") || l.contains("/music/download/") || l.contains("/files/download/") ||
                          l.contains("download_file") || (l.contains("spcs") && (l.contains("/d/") || l.contains("/f/")) && !l.endsWith("/"))
              }

              private fun deliverWebViewMp3(url: String) {
                  runOnUiThread {
                      val cb = webViewMp3Callback
                      if (cb != null) {
                          webViewMp3Callback = null
                          hiddenWebView.stopLoading()
                          cb.invoke(url)
                      }
                  }
              }

              private fun setupPlayerListeners() {
                  MusicEngine.onNextCallback = { playNextTrack() }
                  MusicEngine.onPrevCallback = { playPrevTrack() }

                  player.addListener(object : Player.Listener {
                      override fun onIsPlayingChanged(isPlaying: Boolean) {
                          btnPlayPause.text = if (isPlaying) "⏸" else "▶"
                      }

                      override fun onPlaybackStateChanged(state: Int) {
                          if (state == Player.STATE_READY) {
                              seekBar.max = (player.duration / 1000).toInt().coerceAtLeast(1)
                              tvTotalTime.text = formatTime(player.duration)
                          } else if (state == Player.STATE_ENDED) {
                              playNextTrack()
                          }
                      }

                      override fun onPlayerError(error: PlaybackException) {
                          tvNowPlayingSub.text = "Переподключение аудиопотока..."
                      }
                  })

                  handler.post(object : Runnable {
                      override fun run() {
                          if (player.isPlaying && !isUserSeeking) {
                              val pos = player.currentPosition
                              seekBar.progress = (pos / 1000).toInt()
                              tvCurrentTime.text = formatTime(pos)
                          }
                          handler.postDelayed(this, 1000)
                      }
                  })
              }

              private fun setupRecyclerView() {
                  adapter = SpaceAdapter(items) { pos -> onItemClicked(pos) }
                  val lm = LinearLayoutManager(this)
                  rvTracks.layoutManager = lm
                  rvTracks.adapter = adapter

                  rvTracks.addOnScrollListener(object : RecyclerView.OnScrollListener() {
                      override fun onScrolled(recyclerView: RecyclerView, dx: Int, dy: Int) {
                          if (dy > 0 && !isLoadingMore && nextPageUrl != null) {
                              val visibleCount = lm.childCount
                              val totalCount = lm.itemCount
                              val firstVisible = lm.findFirstVisibleItemPosition()
                              if (visibleCount + firstVisible >= totalCount - 4) {
                                  loadNextPage()
                              }
                          }
                      }
                  })
              }

              private fun setupControls() {
                  tvMirror.setOnClickListener { showMirrorDialog() }

                  btnBackNav.setOnClickListener {
                      if (navHistory.isNotEmpty()) {
                          val prev = navHistory.pop()
                          updateMirrorBadge()
                          openSpacePage(prev.url, mode = prev.mode, addToHistory = false)
                      }
                  }

                  findViewById<Button>(R.id.btnSearch).setOnClickListener {
                      val q = etSearch.text.toString().trim()
                      hideKeyboard()
                      if (q.isNotEmpty()) {
                          highlightActiveChip(null)
                          performSpacesSearch(q)
                      }
                  }

                  etSearch.setOnEditorActionListener { _, actionId, _ ->
                      if (actionId == EditorInfo.IME_ACTION_SEARCH) {
                          val q = etSearch.text.toString().trim()
                          hideKeyboard()
                          if (q.isNotEmpty()) {
                              highlightActiveChip(null)
                              performSpacesSearch(q)
                          }
                          true
                      } else false
                  }

                  chipPop.setOnClickListener {
                      highlightActiveChip(chipPop)
                      navHistory.clear()
                      openSpacePage(popularTabUrl, mode = PageMode.TRACKS, addToHistory = false)
                  }

                  chipNew.setOnClickListener {
                      highlightActiveChip(chipNew)
                      navHistory.clear()
                      openSpacePage(newTabUrl, mode = PageMode.TRACKS, addToHistory = false)
                  }

                  chipCats.setOnClickListener {
                      highlightActiveChip(chipCats)
                      navHistory.clear()
                      openSpacePage(categoriesTabUrl, mode = PageMode.FOLDERS, addToHistory = false)
                  }

                  chipOnline.setOnClickListener {
                      highlightActiveChip(chipOnline)
                      navHistory.clear()
                      openSpacePage("/music/", mode = PageMode.AUTO, addToHistory = false)
                  }

                  btnPlayPause.setOnClickListener {
                      if (player.isPlaying) player.pause() else player.play()
                  }

                  findViewById<Button>(R.id.btnNext).setOnClickListener { playNextTrack() }
                  findViewById<Button>(R.id.btnPrev).setOnClickListener { playPrevTrack() }

                  seekBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                          if (fromUser) tvCurrentTime.text = formatTime(progress * 1000L)
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) { isUserSeeking = true }
                      override fun onStopTrackingTouch(sb: SeekBar?) {
                          isUserSeeking = false
                          player.seekTo((sb?.progress ?: 0) * 1000L)
                      }
                  })
              }

              private fun showMirrorDialog() {
                  val input = EditText(this).apply {
                      setText(baseHost)
                      hint = "https://world84.spcs.bio"
                      setPadding(40, 30, 40, 30)
                  }
                  AlertDialog.Builder(this)
                      .setTitle("Зеркало Spaces")
                      .setMessage("Введите актуальный домен Spaces:")
                      .setView(input)
                      .setPositiveButton("Сохранить") { _, _ ->
                          val raw = input.text.toString().trim()
                          if (raw.isNotEmpty()) {
                              baseHost = extractCleanHost(raw)
                              getSharedPreferences("spaces_v6", Context.MODE_PRIVATE)
                                  .edit().putString("host", baseHost).apply()
                              navHistory.clear()
                              updateMirrorBadge()
                              bootstrapAndLoadPopular()
                          }
                      }
                      .setNegativeButton("Отмена", null)
                      .show()
              }

              private fun hideKeyboard() {
                  val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as? InputMethodManager
                  imm?.hideSoftInputFromWindow(etSearch.windowToken, 0)
              }

              private fun toAbsoluteUrl(hrefOrPath: String): String {
                  val clean = hrefOrPath.trim()
                  return when {
                      clean.startsWith("http://") || clean.startsWith("https://") -> clean
                      clean.startsWith("//") -> "https:$clean"
                      clean.startsWith("/") -> baseHost + clean
                      else -> "$baseHost/$clean"
                  }
              }

              private fun fetchDocument(urlOrPath: String): Document? {
                  return try {
                      val fullUrl = toAbsoluteUrl(urlOrPath)
                      val req = Request.Builder()
                          .url(fullUrl)
                          .header("User-Agent", MusicEngine.USER_AGENT)
                          .header("Accept", "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8")
                          .header("Accept-Language", "ru-RU,ru;q=0.9")
                          .header("Referer", "$baseHost/")
                          .build()

                      httpClient.newCall(req).execute().use { resp ->
                          if (!resp.isSuccessful) return null
                          val html = resp.body?.string() ?: return null
                          val finalHost = "${resp.request.url.scheme}://${resp.request.url.host}"
                          if (finalHost.contains("spcs") || finalHost.contains("spaces")) {
                              baseHost = finalHost
                          }
                          Jsoup.parse(html, resp.request.url.toString())
                      }
                  } catch (_: Exception) {
                      null
                  }
              }

              private fun extractExactTabsAndGenres(doc: Document) {
                  for (a in doc.select("a[href]")) {
                      val t = a.text().trim().lowercase()
                      val h = a.absUrl("href")
                      if (h.isEmpty() || isSystemNoiseUrl(h.lowercase())) continue
                      when (t) {
                          "категории" -> categoriesTabUrl = h
                          "популярные", "популярное" -> popularTabUrl = h
                          "новые", "новое", "новинки" -> newTabUrl = h
                      }
                  }
                  val folders = parseCleanItems(doc, mode = PageMode.FOLDERS)
                  if (folders.size >= 4) {
                      cachedGenres.clear()
                      cachedGenres.addAll(folders)
                  }
              }

              private fun bootstrapAndLoadPopular() {
                  loadJob?.cancel()
                  progressBar.visibility = View.VISIBLE
                  tvStatus.text = "Синхронизация разделов $baseHost..."
                  highlightActiveChip(chipPop)

                  loadJob = uiScope.launch {
                      val szDoc = withContext(Dispatchers.IO) { fetchDocument("/sz/muzyka/") }
                      if (szDoc == null) {
                          progressBar.visibility = View.GONE
                          tvStatus.text = "Нет ответа от $baseHost. Проверьте зеркало (⚙)."
                          return@launch
                      }

                      extractExactTabsAndGenres(szDoc)

                      val popDoc = withContext(Dispatchers.IO) { fetchDocument(popularTabUrl) }
                      if (popDoc != null) {
                          currentState = NavState(toAbsoluteUrl(popularTabUrl), PageMode.TRACKS)
                          displayParsedDocument(popDoc, resetList = true, mode = PageMode.TRACKS)
                      } else {
                          currentState = NavState(toAbsoluteUrl("/sz/muzyka/"), PageMode.FOLDERS)
                          highlightActiveChip(chipCats)
                          displayParsedDocument(szDoc, resetList = true, mode = PageMode.FOLDERS)
                      }
                  }
              }

              private fun openSpacePage(urlOrPath: String, mode: PageMode, addToHistory: Boolean) {
                  loadJob?.cancel()
                  val fullTarget = toAbsoluteUrl(urlOrPath)
                  if (addToHistory && currentState.url.isNotEmpty() && currentState.url != fullTarget) {
                      navHistory.push(currentState)
                  }
                  currentState = NavState(fullTarget, mode)
                  updateMirrorBadge()

                  progressBar.visibility = View.VISIBLE
                  tvStatus.text = "Загрузка..."

                  loadJob = uiScope.launch {
                      val doc = withContext(Dispatchers.IO) { fetchDocument(fullTarget) }
                      if (doc == null) {
                          progressBar.visibility = View.GONE
                          tvStatus.text = "Ошибка соединения со страницей"
                          return@launch
                      }
                      extractExactTabsAndGenres(doc)
                      displayParsedDocument(doc, resetList = true, mode = mode)
                  }
              }

              private fun loadNextPage() {
                  val nextUrl = nextPageUrl ?: return
                  isLoadingMore = true
                  progressBar.visibility = View.VISIBLE

                  uiScope.launch {
                      val doc = withContext(Dispatchers.IO) { fetchDocument(nextUrl) }
                      progressBar.visibility = View.GONE
                      isLoadingMore = false
                      if (doc != null) {
                          displayParsedDocument(doc, resetList = false, mode = currentState.mode)
                      }
                  }
              }

              private fun displayParsedDocument(doc: Document, resetList: Boolean, mode: PageMode) {
                  progressBar.visibility = View.GONE
                  updateMirrorBadge()

                  nextPageUrl = if (mode == PageMode.FOLDERS) null else findNextPageUrl(doc)

                  if (resetList) {
                      items.clear()
                      seenKeys.clear()
                  }

                  val parsed = parseCleanItems(doc, mode = mode)
                  for (item in parsed) {
                      if (seenKeys.add(item.idKey)) {
                          items.add(item)
                      }
                  }

                  adapter.notifyDataSetChanged()

                  val trackCount = items.count { !it.isFolder }
                  val folderCount = items.count { it.isFolder }

                  tvStatus.text = when {
                      trackCount > 0 && nextPageUrl != null -> "Треков: $trackCount (листайте вниз для автоподгрузки)"
                      trackCount > 0 -> "Треков: $trackCount"
                      folderCount > 0 -> "Жанры и категории: $folderCount — выберите папку"
                      else -> "В этом разделе пусто"
                  }
              }

              // ЧИСТЫЙ ПАРСЕР v6.0
              private fun parseCleanItems(doc: Document, mode: PageMode): List<SpaceItem> {
                  val cleanDoc = doc.clone()

                  cleanDoc.select(
                      "footer, header, nav, form, script, style, " +
                      "#footer, #header, #sidebar, #left_nav, #right_nav, #navi, " +
                      ".footer, .header, .sidebar, .menu, .pgn, .pagination, .breadcrumbs, .location_bar, .tabs"
                  ).remove()

                  val tracksFound = ArrayList<SpaceItem>()
                  val foldersFound = ArrayList<SpaceItem>()
                  val localTrackKeys = HashSet<String>()
                  val localFolderKeys = HashSet<String>()

                  for (el in cleanDoc.select("a[href]")) {
                      val rawHref = el.attr("href").trim()
                      if (rawHref.isEmpty() || rawHref.startsWith("#") || rawHref.startsWith("javascript")) continue

                      val absHref = el.absUrl("href").ifEmpty { toAbsoluteUrl(rawHref) }
                      val lowHref = absHref.lowercase()

                      if (isSystemNoiseUrl(lowHref)) continue

                      val linkText = el.text().trim()
                      val rowContainer = el.parents().firstOrNull {
                          it.hasClass("main_item") || it.hasClass("f-item") || it.hasClass("list-link") ||
                                  it.hasClass("m-item") || it.hasClass("__adv_list_track") || it.tagName() == "li" || it.tagName() == "tr"
                      }
                      val fullRowText = rowContainer?.text()?.trim() ?: el.parent()?.text()?.trim() ?: linkText

                      if (isInterfaceGarbageText(linkText) || isInterfaceGarbageText(fullRowText)) continue

                      // 1. ТРЕКИ
                      val isTrackLink = lowHref.contains("/music/view/") ||
                              lowHref.contains("/files/view/") ||
                              lowHref.contains("/file/view/") ||
                              (lowHref.contains("/sz/") && (lowHref.contains("/view/") || lowHref.contains("file_id") || lowHref.contains("fid="))) ||
                              lowHref.contains(".mp3") ||
                              lowHref.contains("/music/download/")

                      if (isTrackLink && mode != PageMode.FOLDERS) {
                          var candidateName = if (hasLetters(linkText) && !isGenericActionWord(linkText)) linkText else fullRowText
                          candidateName = cleanTrackName(candidateName)
                          if (!hasLetters(candidateName)) continue

                          val trackId = extractUniqueTrackKey(absHref)
                          if (!localTrackKeys.add(trackId)) continue

                          var directMp3 = if (isLikelyAudioBinaryUrl(lowHref)) absHref else ""
                          if (directMp3.isEmpty() && rowContainer != null) {
                              val dl = rowContainer.selectFirst("a[href*=.mp3], a[href*=/download/], audio[src], source[src], [data-mp3], [data-src]")
                              if (dl != null) {
                                  directMp3 = dl.absUrl("href").ifEmpty { dl.absUrl("src") }.ifEmpty { dl.attr("data-mp3") }
                              }
                          }

                          val parts = candidateName.split(" - ", " – ", " — ", limit = 2)
                          val artist = if (parts.size > 1) parts[0].trim() else "Spaces Музыка"
                          val title = if (parts.size > 1) parts[1].trim() else candidateName

                          if (!hasLetters(title)) continue

                          tracksFound.add(
                              SpaceItem(
                                  idKey = "track_$trackId",
                                  title = title.take(85),
                                  subtitle = artist.take(60),
                                  url = absHref,
                                  isFolder = false,
                                  directMp3 = directMp3
                              )
                          )
                          continue
                      }

                      // 2. КАТЕГОРИИ / ЖАНРЫ (/sz/russkij_pop/, /sz/zarubezhnyj_rock/ и т.д.)
                      if (mode != PageMode.TRACKS) {
                          val uri = Uri.parse(absHref)
                          val pathOnly = uri.path?.lowercase() ?: ""

                          val isGenreFolder = (pathOnly.startsWith("/sz/") &&
                                  pathOnly != "/sz/" &&
                                  !pathOnly.startsWith("/sz/muzyka") &&
                                  !pathOnly.contains("/view/") &&
                                  !pathOnly.contains("/search")) ||
                                  (pathOnly.startsWith("/music/") &&
                                          pathOnly != "/music/" &&
                                          !pathOnly.contains("/view/") &&
                                          !pathOnly.contains("/search") &&
                                          !pathOnly.contains("/top") &&
                                          !pathOnly.contains("/new"))

                          val hasBadParams = lowHref.contains("theme=") || lowHref.contains("writed=") ||
                                  lowHref.contains("sort=") || lowHref.contains("p=") || lowHref.contains("page=")

                          if (isGenreFolder && !hasBadParams && hasLetters(linkText) && linkText.length in 3..60) {
                              val countMatch = Regex("""(\d+[\s\d]*(?:тыс|млн))""", RegexOption.IGNORE_CASE).find(fullRowText)
                              val countText = countMatch?.value ?: ""

                              val cleanGenreTitle = linkText
                                  .replace(Regex("""\d+[\s\d]*(?:тыс|млн).*$""", RegexOption.IGNORE_CASE), "")
                                  .trim()

                              if (!hasLetters(cleanGenreTitle) || isInterfaceGarbageText(cleanGenreTitle)) continue

                              val folderKey = "folder_$pathOnly"
                              if (localFolderKeys.add(folderKey)) {
                                  val sub = if (countText.isNotEmpty()) "Жанр • $countText треков" else "Категория музыки"
                                  foldersFound.add(
                                      SpaceItem(
                                          idKey = folderKey,
                                          title = cleanGenreTitle,
                                          subtitle = sub,
                                          url = absHref,
                                          isFolder = true
                                      )
                                  )
                              }
                          }
                      }
                  }

                  return when (mode) {
                      PageMode.FOLDERS -> foldersFound
                      PageMode.TRACKS -> tracksFound
                      PageMode.AUTO -> if (tracksFound.isNotEmpty()) tracksFound else foldersFound
                  }
              }

              private fun extractUniqueTrackKey(url: String): String {
                  val viewId = Regex("""/(?:view|download|file)/[^/?#]*?(\d{4,})""").find(url)?.groupValues?.get(1)
                  if (viewId != null) return viewId
                  val paramId = Regex("""(?:file_id|fid|id)=(\d{4,})""").find(url)?.groupValues?.get(1)
                  if (paramId != null) return paramId
                  return url.substringBefore("?").substringBefore("#")
              }

              private fun hasLetters(text: String): Boolean {
                  return Regex("[a-zA-Zа-яА-ЯёЁ]{2,}").containsMatchIn(text)
              }

              private fun isSystemNoiseUrl(lowHref: String): Boolean {
                  val badTokens = listOf(
                      "/registration", "/login", "/auth", "/restore", "/anketa", "/diary",
                      "/forums", "/comm/", "/chat/", "/games", "/neo/", "/help", "/rules", "/settings",
                      "/ads", "/pictures/", "/video/", "/adult/", "theme=", "writed=", "translit",
                      "block_files", "/app/", "/support", "/user/", "/users/", "/blogs", "/kino"
                  )
                  return badTokens.any { lowHref.contains(it) }
              }

              private fun isGenericActionWord(text: String): Boolean {
                  val low = text.lowercase().trim()
                  return low in listOf("скачать", "слушать", "играть", "подробнее", "файл", "mp3", "аудио")
              }

              private fun isInterfaceGarbageText(text: String): Boolean {
                  val low = text.lowercase().trim()
                  if (low.isEmpty()) return true

                  val exactGarbage = setOf(
                      "назад", "вперед", "вперёд", "ещё", "еще", "далее", "показать ещё",
                      "категории", "популярные", "новые", "музыка", "зона обмена", "музыка онлайн",
                      "главная", "вход", "войти", "регистрация", "поиск", "найти", "меню",
                      "разделы сайта", "настройка", "правила", "помощь", "реклама", "о сайте",
                      "полная версия", "мобильная версия", "выход", "жалоба", "поделиться"
                  )
                  if (low in exactGarbage) return true

                  val substrGarbage = listOf(
                      "тема:", "тема :", "безопасный режим", "транслит", "блокировать фа",
                      "не можете войти", "мини игры", "шашки, шахматы", "ai hub",
                      "фильмы и сериалы", "знакомства", "блоги", "сообщества", "форум"
                  )
                  return substrGarbage.any { low.contains(it) }
              }

              private fun cleanTrackName(raw: String): String {
                  return raw
                      .replace(Regex("\\.mp3\\b", RegexOption.IGNORE_CASE), "")
                      .replace(Regex("\\b\\d+(\\.\\d+)?\\s*(Мб|Кб|Гб|MB|KB|mb|kb)\\b"), "")
                      .replace(Regex("\\b\\d{1,2}:\\d{2}\\b"), "")
                      .replace(Regex("(?<!\\d):\\d{2}\\b"), "")
                      .replace(Regex("\\b\\d+\\s*kbps\\b", RegexOption.IGNORE_CASE), "")
                      .replace(Regex("(?i)\\b(скачать|слушать|онлайн|бесплатно|аудиозапись)\\b"), "")
                      .replace(Regex("^[\\s:\\-–—•\\d.]+"), "")
                      .replace(Regex("\\s+"), " ")
                      .trim()
              }

              private fun findNextPageUrl(doc: Document): String? {
                  val pagLinks = doc.select("a.pg_next, a.next, .pgn a[href], .pagination a[href], a[href*=P=], a[href*=p=]")
                  for (a in pagLinks) {
                      val t = a.text().trim().lowercase()
                      if (t.contains("вперед") || t.contains("вперёд") || t.contains("след") || t == "»" || t == ">") {
                          val h = a.absUrl("href")
                          if (h.isNotEmpty() && h != currentState.url) return h
                      }
                  }
                  return null
              }

              // ГИБРИДНЫЙ ПОИСК v6.0: Ищет через формы Spaces + автоматически обходит подходящие жанровые папки (например "рок", "поп", "рэп")
              private fun performSpacesSearch(query: String) {
                  loadJob?.cancel()
                  progressBar.visibility = View.VISIBLE
                  tvStatus.text = "Поиск треков «$query»..."

                  loadJob = uiScope.launch {
                      val foundTracks = withContext(Dispatchers.IO) {
                          val results = ArrayList<SpaceItem>()
                          val encoded = URLEncoder.encode(query, "UTF-8")
                          val lowQuery = query.lowercase().trim()

                          // 1. Если кеш жанров еще пуст — подгружаем /sz/muzyka/
                          if (cachedGenres.isEmpty()) {
                              val szDoc = fetchDocument("/sz/muzyka/")
                              if (szDoc != null) extractExactTabsAndGenres(szDoc)
                          }

                          // 2. Проверяем совпадение запроса с жанровыми категориями (например "рок" -> Русский Рок, Зарубежный Rock)
                          val matchingGenres = cachedGenres.filter {
                              it.title.lowercase().contains(lowQuery) ||
                                      (lowQuery == "рок" && it.title.lowercase().contains("rock")) ||
                                      (lowQuery == "поп" && it.title.lowercase().contains("pop")) ||
                                      ((lowQuery == "рэп" || lowQuery == "реп") && (it.title.lowercase().contains("rap") || it.title.lowercase().contains("рэп"))) ||
                                      (lowQuery == "фонк" && it.title.lowercase().contains("phonk"))
                          }

                          for (genre in matchingGenres) {
                              val gDoc = fetchDocument(genre.url) ?: continue
                              val gTracks = parseCleanItems(gDoc, mode = PageMode.TRACKS)
                              if (gTracks.isNotEmpty()) {
                                  currentState = NavState(genre.url, PageMode.TRACKS)
                                  nextPageUrl = findNextPageUrl(gDoc)
                                  results.addAll(gTracks)
                              }
                          }

                          // 3. Отправляем запрос через реальные поисковые роуты Spaces
                          val searchUrls = ArrayList<String>()
                          val musicPage = fetchDocument("/music/")
                          if (musicPage != null) {
                              for (form in musicPage.select("form")) {
                                  val act = form.attr("action").lowercase()
                                  if (act.contains("login") || act.contains("reg") || act.contains("auth")) continue
                                  val inp = form.selectFirst("input[type=text], input[type=search], input[name*=q], input[name*=word], input[name*=search], input[name*=S]")
                                  if (inp != null) {
                                      val actionUrl = form.absUrl("action").ifEmpty { toAbsoluteUrl(form.attr("action")) }
                                      val param = inp.attr("name").ifEmpty { "q" }
                                      val hidden = form.select("input[type=hidden]").mapNotNull {
                                          val n = it.attr("name")
                                          val v = it.attr("value")
                                          if (n.isNotEmpty()) "$n=${URLEncoder.encode(v, "UTF-8")}" else null
                                      }.joinToString("&")
                                      val sep = if (actionUrl.contains("?")) "&" else "?"
                                      searchUrls.add("$actionUrl$sep$param=$encoded" + if (hidden.isNotEmpty()) "&$hidden" else "")
                                  }
                              }
                          }

                          searchUrls.addAll(
                              listOf(
                                  "/music/search/?q=$encoded",
                                  "/music/search/?word=$encoded",
                                  "/sz/search/?q=$encoded&T=6",
                                  "/mysite/find/?search=$encoded&type=26",
                                  "/mysite/find/?word=$encoded&type=26",
                                  "/search/?q=$encoded&type=music"
                              )
                          )

                          for (u in searchUrls.distinct()) {
                              val d = fetchDocument(u) ?: continue
                              val tList = parseCleanItems(d, mode = PageMode.TRACKS)
                              if (tList.isNotEmpty()) {
                                  if (results.isEmpty()) {
                                      currentState = NavState(toAbsoluteUrl(u), PageMode.TRACKS)
                                      nextPageUrl = findNextPageUrl(d)
                                  }
                                  results.addAll(tList)
                                  break
                              }
                          }

                          results
                      }

                      progressBar.visibility = View.GONE
                      updateMirrorBadge()
                      items.clear()
                      seenKeys.clear()
                      for (t in foundTracks) {
                          if (seenKeys.add(t.idKey)) items.add(t)
                      }
                      adapter.notifyDataSetChanged()

                      if (items.isNotEmpty()) {
                          tvStatus.text = "Найдено треков по запросу «$query»: ${items.size}"
                      } else {
                          tvStatus.text = "По запросу «$query» треков не найдено. Выберите жанр во вкладке «Жанры и категории»."
                      }
                  }
              }

              private fun onItemClicked(position: Int) {
                  if (position !in items.indices) return
                  val item = items[position]
                  if (item.isFolder) {
                      openSpacePage(item.url, mode = PageMode.AUTO, addToHistory = true)
                  } else {
                      playTrackAt(position)
                  }
              }

              // ПРОВЕРКА И РАЗРЕШЕНИЕ ПРЯМОЙ ССЫЛКИ НА MP3 (проходит редиректы CDN и отсекает HTML-страницы)
              private suspend fun resolveVerifiedStreamUrl(item: SpaceItem): String {
                  if (item.directMp3.isNotEmpty()) return item.directMp3

                  val fastUrl = withContext(Dispatchers.IO) {
                      val doc = fetchDocument(item.url) ?: return@withContext ""
                      val candidates = extractMp3CandidatesFromDoc(doc)
                      for (cand in candidates) {
                          val verified = verifyAudioStreamRedirect(cand, item.url)
                          if (verified.isNotEmpty()) return@withContext verified
                      }
                      ""
                  }

                  if (fastUrl.isNotEmpty()) {
                      item.directMp3 = fastUrl
                      return fastUrl
                  }

                  // Резервный перехват через фоновый WebView
                  val webUrl = withTimeoutOrNull(8000L) {
                      suspendCancellableCoroutine<String> { cont ->
                          webViewMp3Callback = { found ->
                              if (cont.isActive) cont.resume(found)
                          }
                          hiddenWebView.loadUrl(item.url)
                      }
                  } ?: ""

                  if (webUrl.isNotEmpty()) {
                      item.directMp3 = webUrl
                  }
                  return webUrl
              }

              private fun extractMp3CandidatesFromDoc(doc: Document): List<String> {
                  val list = ArrayList<String>()

                  for (el in doc.select("audio[src], audio source[src], [data-mp3], [data-src*=.mp3], [data-url*=.mp3], [data-file*=.mp3]")) {
                      val src = el.absUrl("src")
                          .ifEmpty { el.absUrl("data-mp3") }
                          .ifEmpty { el.absUrl("data-src") }
                          .ifEmpty { el.absUrl("data-url") }
                          .ifEmpty { el.absUrl("data-file") }
                      if (src.isNotEmpty()) list.add(src)
                  }

                  for (a in doc.select("a[href]")) {
                      val h = a.absUrl("href")
                      val lowH = h.lowercase()
                      val lowT = a.text().lowercase()
                      if (isLikelyAudioBinaryUrl(lowH) || (lowT.contains("скачать") && (lowH.contains("/download/") || lowH.contains(".mp3") || lowH.contains("file")))) {
                          list.add(h)
                      }
                  }

                  val unescapedHtml = doc.html().replace("\\/", "/").replace("&amp;", "&")
                  val regex = Regex("""https?://[^\s"'<>]+?\.mp3(?:\?[^\s"'<>]*)?""", RegexOption.IGNORE_CASE)
                  for (m in regex.findAll(unescapedHtml)) {
                      list.add(m.value)
                  }

                  return list.distinct()
              }

              // Делает пробный запрос с Range: bytes=0-1, чтобы получить финальный CDN-адрес и убедиться, что это не HTML
              private fun verifyAudioStreamRedirect(candidateUrl: String, refererUrl: String): String {
                  return try {
                      val req = Request.Builder()
                          .url(candidateUrl)
                          .header("User-Agent", MusicEngine.USER_AGENT)
                          .header("Referer", refererUrl)
                          .header("Range", "bytes=0-1")
                          .build()

                      httpClient.newCall(req).execute().use { resp ->
                          val ct = (resp.header("Content-Type") ?: "").lowercase()
                          val finalUrl = resp.request.url.toString()
                          if (resp.isSuccessful || resp.code == 206) {
                              if (ct.contains("audio") || ct.contains("octet-stream") || finalUrl.lowercase().contains(".mp3")) {
                                  return finalUrl
                              }
                          }
                          ""
                      }
                  } catch (_: Exception) {
                      ""
                  }
              }

              private fun playTrackAt(index: Int) {
                  if (index !in items.indices) return
                  val item = items[index]
                  if (item.isFolder) {
                      openSpacePage(item.url, mode = PageMode.AUTO, addToHistory = true)
                      return
                  }

                  currentIndex = index
                  adapter.selectedIndex = index
                  adapter.notifyDataSetChanged()

                  tvNowPlayingTitle.text = item.title
                  tvNowPlayingSub.text = "Загрузка аудиопотока..."
                  progressBar.visibility = View.VISIBLE

                  uiScope.launch {
                      val mp3Url = resolveVerifiedStreamUrl(item)
                      progressBar.visibility = View.GONE

                      if (mp3Url.isNotEmpty()) {
                          tvNowPlayingSub.text = item.subtitle

                          val cookieHeader = allCookies.values.joinToString("; ") { "${it.name}=${it.value}" }
                              .ifEmpty { CookieManager.getInstance().getCookie(mp3Url) ?: "" }

                          val dsFactory = DefaultHttpDataSource.Factory()
                              .setUserAgent(MusicEngine.USER_AGENT)
                              .setAllowCrossProtocolRedirects(true)
                              .setDefaultRequestProperties(
                                  mapOf(
                                      "Referer" to item.url,
                                      "Cookie" to cookieHeader
                                  )
                              )

                          val metadata = MediaMetadata.Builder()
                              .setTitle(item.title)
                              .setArtist(item.subtitle)
                              .build()

                          val mediaItem = MediaItem.Builder()
                              .setUri(mp3Url)
                              .setMediaMetadata(metadata)
                              .build()

                          val mediaSource = DefaultMediaSourceFactory(dsFactory)
                              .createMediaSource(mediaItem)

                          player.setMediaSource(mediaSource)
                          player.prepare()
                          player.play()

                          val nextIdx = (index + 1 until items.size).firstOrNull { !items[it].isFolder }
                          if (nextIdx != null) {
                              launch(Dispatchers.IO) { resolveVerifiedStreamUrl(items[nextIdx]) }
                          }
                      } else {
                          tvNowPlayingSub.text = "Не удалось получить прямой MP3-поток"
                      }
                  }
              }

              private fun playNextTrack() {
                  val nextIdx = (currentIndex + 1 until items.size).firstOrNull { !items[it].isFolder }
                  if (nextIdx != null) playTrackAt(nextIdx)
              }

              private fun playPrevTrack() {
                  val prevIdx = (currentIndex - 1 downTo 0).firstOrNull { !items[it].isFolder }
                  if (prevIdx != null) playTrackAt(prevIdx)
              }

              private fun formatTime(ms: Long): String {
                  if (ms <= 0) return "0:00"
                  val totalSec = ms / 1000
                  return String.format("%d:%02d", totalSec / 60, totalSec % 60)
              }

              override fun onBackPressed() {
                  if (navHistory.isNotEmpty()) {
                      val prev = navHistory.pop()
                      updateMirrorBadge()
                      openSpacePage(prev.url, mode = prev.mode, addToHistory = false)
                  } else {
                      super.onBackPressed()
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  handler.removeCallbacksAndMessages(null)
                  uiScope.cancel()
              }

              inner class SpaceAdapter(
                  private val list: List<SpaceItem>,
                  private val onClick: (Int) -> Unit
              ) : RecyclerView.Adapter<SpaceAdapter.VH>() {

                  var selectedIndex = -1

                  inner class VH(v: View) : RecyclerView.ViewHolder(v) {
                      val tvCover: TextView = v.findViewById(R.id.tvCover)
                      val tvTitle: TextView = v.findViewById(R.id.tvTitle)
                      val tvSubtitle: TextView = v.findViewById(R.id.tvSubtitle)
                      val tvPlayIcon: TextView = v.findViewById(R.id.tvPlayIcon)
                  }

                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                      val v = LayoutInflater.from(parent.context).inflate(R.layout.item_track, parent, false)
                      return VH(v)
                  }

                  override fun onBindViewHolder(holder: VH, position: Int) {
                      val item = list[position]
                      holder.tvTitle.text = item.title
                      holder.tvSubtitle.text = item.subtitle

                      if (item.isFolder) {
                          holder.tvCover.text = "📁"
                          holder.tvTitle.setTextColor(0xFFFFFFFF.toInt())
                          holder.tvPlayIcon.text = "›"
                      } else {
                          holder.tvCover.text = "♫"
                          val isSelected = position == selectedIndex
                          holder.tvTitle.setTextColor(if (isSelected) 0xFFFFCC00.toInt() else 0xFFFFFFFF.toInt())
                          holder.tvPlayIcon.text = if (isSelected) "⏸" else "▶"
                      }

                      holder.itemView.setOnClickListener { onClick(position) }
                  }

                  override fun getItemCount(): Int = list.size
              }
          }
          EOF

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpacesPlayer-v6-Pro-APK
          path: app/build/outputs/apk/debug/*.apk
