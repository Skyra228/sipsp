              private fun cleanNoiseFromMusicString(raw: String): String {
                  return raw.lowercase()
                      .replace('ё', 'е')
                      .replace(Regex("\\((?:[^)]*(?:zaycev|muzmo|spcs|spaces|320|128|kbps|mp3|official|audio|video|lyric|original|radio edit|ost)[^)]*)\\)"), " ")
                      .replace(Regex("\\[(?:[^\\]]*(?:zaycev|muzmo|spcs|spaces|320|128|kbps|mp3|official|audio|video)[^\\]]*)\\]"), " ")
                      .replace(Regex("[^\\p{L}\\p{N}\\s]"), " ")
                      .replace(Regex("\\s+"), " ")
                      .trim()
              }
          
              private fun extractCoreSongTitle(rawTitle: String): String {
                  val base = rawTitle.lowercase().replace('ё', 'е')
                      .substringAfter(" - ")
                      .replace(Regex("\\([^)]*\\)"), " ")
                      .replace(Regex("\\[[^\\]]*\\]"), " ")
                      .replace(Regex("(?i)\\b(?:feat\\.?|ft\\.?|при уч\\.?).*"), " ")
                      .replace(Regex("[^\\p{L}\\p{N}\\s]"), " ")
                      .replace(Regex("\\s+"), " ")
                      .trim()
                  return base.ifEmpty { cleanNoiseFromMusicString(rawTitle) }
              }
          
              private fun extractArtistName(item: SpaceItem?): String {
                  if (item == null) return ""
                  var raw = item.subtitle.substringBefore("•").trim()
                  raw = raw.removePrefix("Исполнитель").removePrefix("Альбом").trim().trimStart('•', ':', '-').trim()
                  if (raw.isEmpty() || raw.equals("Селюк мьюзик", ignoreCase = true) || raw.equals("Офлайн трек", ignoreCase = true)) {
                      if (item.title.contains(" - ")) {
                          raw = item.title.substringBefore(" - ").trim()
                      } else {
                          return ""
                      }
                  }
                  return raw
              }
          
              private fun extractPrimaryArtistOnly(rawArtist: String): String {
                  val first = rawArtist
                      .split(Regex("(?i)\\s+(?:feat\\.?|ft\\.?|при уч\\.?|vs\\.?|x|&|и)\\s+|,|;"))
                      .firstOrNull()?.trim() ?: rawArtist.trim()
                  val alias = resolveAliasFromDictionary(first)
                  return if (alias.isNotEmpty()) alias else first
              }
          
              private fun normalizePrimaryArtist(item: SpaceItem?): String {
                  val primary = extractPrimaryArtistOnly(extractArtistName(item))
                  return cleanNoiseFromMusicString(primary)
              }
          
              private fun extractCollaboratorsFromItem(item: SpaceItem): List<String> {
                  val combined = "${extractArtistName(item)} ${item.title}"
                  val results = LinkedHashSet<String>()
                  val parts = combined.split(Regex("(?i)\\b(?:feat\\.?|ft\\.?|при уч\\.?|&|x)\\b|,|\\(|\\)|\\[|\\]|-"))
                  val primaryNorm = normalizePrimaryArtist(item)
                  for (p in parts) {
                      val clean = p.trim()
                      if (clean.length in 2..28 && !isNoiseText(clean)) {
                          val alias = resolveAliasFromDictionary(clean)
                          if (alias.isNotEmpty() && cleanNoiseFromMusicString(alias) != primaryNorm) {
                              results.add(alias)
                          }
                      }
                  }
                  return results.toList()
              }
          
              private fun buildTrackFingerprint(item: SpaceItem): String {
                  val art = normalizePrimaryArtist(item)
                  val rawTitle = if (item.title.contains(" - ") && art.isNotEmpty()) item.title.substringAfter(" - ") else item.title
                  val normTitle = cleanNoiseFromMusicString(rawTitle)
                  return "$art::$normTitle"
              }
          
              private fun buildCoreTrackFingerprint(item: SpaceItem): String {
                  val art = normalizePrimaryArtist(item)
                  val coreTitle = extractCoreSongTitle(item.title)
                  return "$art::$coreTitle"
              }
          
              private fun recordTrackPlayedInWave(item: SpaceItem) {
                  wavePlayedKeys.add(item.idKey)
                  val fp = buildTrackFingerprint(item)
                  val coreFp = buildCoreTrackFingerprint(item)
                  if (fp.length > 3) wavePlayedFingerprints.add(fp)
                  if (coreFp.length > 3) wavePlayedFingerprints.add(coreFp)
                  for (collab in extractCollaboratorsFromItem(item)) {
                      if (!waveDiscoveredCollaborators.contains(collab)) {
                          waveDiscoveredCollaborators.add(0, collab)
                          if (waveDiscoveredCollaborators.size > 40) {
                              waveDiscoveredCollaborators.removeAt(waveDiscoveredCollaborators.size - 1)
                          }
                      }
                  }
                  persistWaveMemoryAsync()
              }
          
              private fun persistWaveMemoryAsync() {
                  uiScope.launch(Dispatchers.IO) {
                      try {
                          val prefs = getSharedPreferences("selyuk_v15", Context.MODE_PRIVATE)
                          val playedArr = JSONArray()
                          for (fp in wavePlayedFingerprints.toList().takeLast(450)) {
                              playedArr.put(fp)
                          }
                          val dislikedArr = JSONArray()
                          for (dfp in waveDislikedFingerprints.toList().takeLast(300)) {
                              dislikedArr.put(dfp)
                          }
                          val dislikedArtArr = JSONArray()
                          for (da in waveDislikedArtists.toList().takeLast(150)) {
                              dislikedArtArr.put(da)
                          }
                          prefs.edit()
                              .putString("wave_played_fps", playedArr.toString())
                              .putString("wave_disliked_fps", dislikedArr.toString())
                              .putString("wave_disliked_artists", dislikedArtArr.toString())
                              .apply()
                      } catch (_: Exception) {}
                  }
              }
          
              private fun loadWaveMemoryFromPrefs() {
                  try {
                      val prefs = getSharedPreferences("selyuk_v15", Context.MODE_PRIVATE)
                      val playedRaw = prefs.getString("wave_played_fps", "[]") ?: "[]"
                      val playedArr = JSONArray(playedRaw)
                      for (i in 0 until playedArr.length()) {
                          val s = playedArr.optString(i)
                          if (s.isNotEmpty()) wavePlayedFingerprints.add(s)
                      }
                      val dislikedRaw = prefs.getString("wave_disliked_fps", "[]") ?: "[]"
                      val dislikedArr = JSONArray(dislikedRaw)
                      for (i in 0 until dislikedArr.length()) {
                          val s = dislikedArr.optString(i)
                          if (s.isNotEmpty()) waveDislikedFingerprints.add(s)
                      }
                      val dislikedArtRaw = prefs.getString("wave_disliked_artists", "[]") ?: "[]"
                      val dislikedArtArr = JSONArray(dislikedArtRaw)
                      for (i in 0 until dislikedArtArr.length()) {
                          val s = dislikedArtArr.optString(i)
                          if (s.isNotEmpty()) waveDislikedArtists.add(s)
                      }
                  } catch (_: Exception) {}
              }
          
              private fun getBuiltInSimilarArtists(artistName: String): List<String> {
                  val canonical = resolveAliasFromDictionary(artistName).ifEmpty { artistName }
                  val targetNorm = cleanNoiseFromMusicString(canonical)
                  if (targetNorm.isEmpty()) return emptyList()
          
                  val matches = LinkedHashSet<String>()
                  for (cluster in artistSimilarityClusters) {
                      val hit = cluster.any { member ->
                          val mNorm = cleanNoiseFromMusicString(member)
                          mNorm == targetNorm || mNorm.contains(targetNorm) || targetNorm.contains(mNorm)
                      }
                      if (hit) {
                          for (member in cluster) {
                              if (cleanNoiseFromMusicString(member) != targetNorm) {
                                  matches.add(member)
                              }
                          }
                      }
                  }
                  return matches.toList()
              }
          
              private fun fetchDeezerSimilarArtists(artistName: String): List<String> {
                  val result = ArrayList<String>()
                  try {
                      val canonical = resolveAliasFromDictionary(artistName).ifEmpty { artistName }
                      val enc = URLEncoder.encode(canonical, "UTF-8")
                      val fastClient = httpClient.newBuilder()
                          .connectTimeout(2200, TimeUnit.MILLISECONDS)
                          .readTimeout(2200, TimeUnit.MILLISECONDS)
                          .build()
                      val searchReq = Request.Builder()
                          .url("https://api.deezer.com/search/artist?q=$enc&limit=2")
                          .header("User-Agent", MusicEngine.USER_AGENT)
                          .build()
                      var artistId = 0L
                      fastClient.newCall(searchReq).execute().use { resp ->
                          if (resp.isSuccessful) {
                              val data = JSONObject(resp.body?.string() ?: "{}").optJSONArray("data")
                              if (data != null && data.length() > 0) {
                                  artistId = data.optJSONObject(0)?.optLong("id", 0L) ?: 0L
                              }
                          }
                      }
                      if (artistId > 0L) {
                          val relReq = Request.Builder()
                              .url("https://api.deezer.com/artist/$artistId/related?limit=16")
                              .header("User-Agent", MusicEngine.USER_AGENT)
                              .build()
                          fastClient.newCall(relReq).execute().use { resp ->
                              if (resp.isSuccessful) {
                                  val data = JSONObject(resp.body?.string() ?: "{}").optJSONArray("data") ?: JSONArray()
                                  for (i in 0 until data.length()) {
                                      val name = data.optJSONObject(i)?.optString("name")?.trim() ?: ""
                                      if (name.isNotEmpty()) result.add(name)
                                  }
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  return result
              }
          
              private fun fetchLastFmSimilarArtists(artistName: String): List<String> {
                  val result = ArrayList<String>()
                  try {
                      val canonical = resolveAliasFromDictionary(artistName).ifEmpty { artistName }
                      val enc = URLEncoder.encode(canonical, "UTF-8")
                      val url = "https://www.last.fm/ru/music/$enc/+similar"
                      val fastClient = httpClient.newBuilder()
                          .connectTimeout(2200, TimeUnit.MILLISECONDS)
                          .readTimeout(2200, TimeUnit.MILLISECONDS)
                          .build()
                      val req = Request.Builder()
                          .url(url)
                          .header("User-Agent", MusicEngine.USER_AGENT)
                          .header("Accept-Language", "ru-RU,ru;q=0.9")
                          .build()
                      fastClient.newCall(req).execute().use { resp ->
                          if (resp.isSuccessful) {
                              val html = resp.body?.string() ?: ""
                              val doc = Jsoup.parse(html, url)
                              for (el in doc.select("h3.similar-artists-item-name a, .similar-artists-item-name a, .grid-items-item-main-text a")) {
                                  val name = el.text().trim()
                                  if (name.isNotEmpty() && !isNoiseText(name)) {
                                      result.add(name)
                                  }
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  return result
              }
          
              private fun fetchSpcsSimilarArtists(artistName: String): List<String> {
                  val result = ArrayList<String>()
                  try {
                      val canonical = resolveAliasFromDictionary(artistName).ifEmpty { artistName }
                      val enc = URLEncoder.encode(canonical, "UTF-8")
                      val searchArtistUrl = "$baseHost/music-online/search/index/?Link_id=1039269&T=29&sq=$enc"
                      val doc = fetchDocFast(searchArtistUrl)
                      if (doc != null) {
                          val foundArtists = parseMusicOnlineDoc(doc, TabMode.ARTISTS, searchArtistUrl)
                              .filter { it.type == ItemType.ARTIST }
                          val primaryArtistItem = foundArtists.firstOrNull()
                          if (primaryArtistItem != null && primaryArtistItem.url.isNotEmpty()) {
                              val baseArtistUrl = primaryArtistItem.url.substringBefore("?").trimEnd('/')
                              if (!waveDiscoveredArtistUrls.contains(baseArtistUrl)) {
                                  waveDiscoveredArtistUrls.add(0, baseArtistUrl)
                              }
                              val simDoc = fetchDocFast("$baseArtistUrl/similar/")
                              if (simDoc != null) {
                                  val simItems = parseMusicOnlineDoc(simDoc, TabMode.ARTISTS, "$baseArtistUrl/similar/")
                                      .filter { it.type == ItemType.ARTIST }
                                  for (s in simItems) {
                                      if (s.title.isNotEmpty()) result.add(s.title)
                                  }
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  return result
              }
          
              private suspend fun discoverSimilarArtistsSuspend(artistName: String, seedItem: SpaceItem? = null): List<String> {
                  val primary = extractPrimaryArtistOnly(artistName)
                  val normKey = cleanNoiseFromMusicString(primary)
                  if (normKey.isEmpty()) return emptyList()
          
                  val cached = similarArtistsCache[normKey]
                  if (cached != null && cached.size >= 5) return cached
          
                  val combined = LinkedHashSet<String>()
          
                  for (builtIn in getBuiltInSimilarArtists(primary)) {
                      combined.add(builtIn)
                  }
          
                  if (seedItem != null) {
                      for (collab in extractCollaboratorsFromItem(seedItem)) {
                          combined.add(collab)
                      }
                  }
          
                  val netResults = withTimeoutOrNull(2600L) {
                      coroutineScope {
                          val dDeezer = async(Dispatchers.IO) { fetchDeezerSimilarArtists(primary) }
                          val dLastFm = async(Dispatchers.IO) { fetchLastFmSimilarArtists(primary) }
                          val dSpcs = async(Dispatchers.IO) { fetchSpcsSimilarArtists(primary) }
                          listOf(dLastFm.await(), dDeezer.await(), dSpcs.await())
                      }
                  } ?: emptyList()
          
                  for (list in netResults) {
                      for (name in list) {
                          val clean = extractPrimaryArtistOnly(name)
                          val cNorm = cleanNoiseFromMusicString(clean)
                          if (cNorm.isNotEmpty() && cNorm != normKey && !waveDislikedArtists.contains(cNorm)) {
                              combined.add(clean)
                          }
                      }
                  }
          
                  val out = combined.filter {
                      val cn = cleanNoiseFromMusicString(it)
                      cn.isNotEmpty() && cn != normKey && !waveDislikedArtists.contains(cn)
                  }
                  if (out.isNotEmpty()) {
                      similarArtistsCache[normKey] = out
                  }
                  return out
              }
          
              private fun harvestRelatedFromTrackDoc(doc: Document, sourceItem: SpaceItem) {
                  try {
                      val seen = HashSet<String>()
                      seen.add(sourceItem.idKey)
                      val sourceNormArtist = normalizePrimaryArtist(sourceItem)
                      val pageCover = doc.selectFirst("div.content img[src], div.for_avatar img[src]")?.absUrl("src") ?: ""
                      val otherArtistsRelated = ArrayList<SpaceItem>()
                      val sameArtistRelated = ArrayList<SpaceItem>()
          
                      for (container in doc.select("div.__adv_list_track")) {
                          val parsed = parseTrackContainer(container, seen)
                          if (parsed != null && parsed.idKey != sourceItem.idKey) {
                              if (parsed.coverUrl.isEmpty() && pageCover.isNotEmpty()) parsed.coverUrl = pageCover
                              for (collab in extractCollaboratorsFromItem(parsed)) {
                                  if (!waveDiscoveredCollaborators.contains(collab)) {
                                      waveDiscoveredCollaborators.add(0, collab)
                                  }
                              }
                              if (normalizePrimaryArtist(parsed) == sourceNormArtist) {
                                  sameArtistRelated.add(parsed)
                              } else {
                                  otherArtistsRelated.add(parsed)
                              }
                          }
                      }
                      val orderedRelated = ArrayList<SpaceItem>()
                      orderedRelated.addAll(otherArtistsRelated)
                      orderedRelated.addAll(sameArtistRelated.take(3))
          
                      if (orderedRelated.isNotEmpty()) {
                          recentRelatedByTrackKey[sourceItem.idKey] = orderedRelated
                          for (r in otherArtistsRelated) {
                              if (recentRelatedPool.none { it.idKey == r.idKey }) {
                                  recentRelatedPool.add(0, r)
                              }
                          }
                          while (recentRelatedPool.size > 100) {
                              recentRelatedPool.removeAt(recentRelatedPool.size - 1)
                          }
                      }
          
                      for (a in doc.select("a[href*=/music-online/artist/], a[href*=/music-online/e/artist/]")) {
                          val u = a.absUrl("href").ifEmpty { toAbsoluteUrl(a.attr("href")) }.substringBefore("?").trimEnd('/')
                          if (u.isNotEmpty() && !u.endsWith("/tracks") && !u.endsWith("/albums") && !u.endsWith("/similar")) {
                              if (!waveDiscoveredArtistUrls.contains(u)) {
                                  waveDiscoveredArtistUrls.add(0, u)
                                  if (waveDiscoveredArtistUrls.size > 40) waveDiscoveredArtistUrls.removeAt(waveDiscoveredArtistUrls.size - 1)
                              }
                          }
                      }
                      for (g in doc.select("a[href*=/music-online/search/by_tag/]")) {
                          val u = g.absUrl("href").ifEmpty { toAbsoluteUrl(g.attr("href")) }
                          if (u.isNotEmpty() && !waveDiscoveredGenreUrls.contains(u)) {
                              waveDiscoveredGenreUrls.add(0, u)
                              if (waveDiscoveredGenreUrls.size > 30) waveDiscoveredGenreUrls.removeAt(waveDiscoveredGenreUrls.size - 1)
                          }
                      }
                  } catch (_: Exception) {}
              }
          
              private fun startTrackRadioWave(seed: SpaceItem, closeFullPlayer: Boolean) {
                  if (closeFullPlayer) {
                      fullPlayerOverlay.visibility = View.GONE
                  }
                  isWaveMode = true
                  waveSeedItem = seed
                  highlightActiveChip(chipWave)
                  val seedArtist = extractPrimaryArtistOnly(extractArtistName(seed)).ifEmpty { seed.title }
                  Toast.makeText(this, "🌊 Запущена волна по треку «${seed.title}» (подбираем похожих на $seedArtist)", Toast.LENGTH_SHORT).show()
                  openMyWaveScreen(seedTrack = seed, forceRestart = true)
              }
          
              private fun openMyWaveScreen(seedTrack: SpaceItem?, forceRestart: Boolean) {
                  loadJob?.cancel()
                  progressBar.visibility = View.GONE
                  if (::swipeRefresh.isInitialized) swipeRefresh.isRefreshing = false
                  nextPageUrl = null
                  rvTracks.visibility = View.VISIBLE
                  moreScreenContainer.visibility = View.GONE
                  sectionTabsScroll.visibility = View.VISIBLE
                  chipOfflineSort.visibility = View.GONE
                  chipOfflineDeleteAll.visibility = View.GONE
                  chipNewPlaylist.visibility = View.GONE
                  highlightActiveChip(chipWave)
          
                  if (seedTrack != null) {
                      waveSeedItem = seedTrack
                  }
          
                  val waveTitle = if (waveSeedItem != null) {
                      "🌊 Волна: ${waveSeedItem!!.title}"
                  } else {
                      "🌊 Моя волна • ${getWaveMoodShort(activeWaveMood)}"
                  }
          
                  currentEntry = NavEntry("", TabMode.MY_WAVE, waveTitle, activeBottomTab)
                  updateMirrorBadge()
                  updateSubFilterVisibilityAndCounts()
          
                  val needInitQueue = forceRestart || !isWaveMode || playbackQueue.isEmpty()
                  isWaveMode = true
          
                  if (needInitQueue) {
                      playbackQueue.clear()
                      playbackQueueIndex = -1
                      playbackContextTitle = waveTitle
                      val startSeed = seedTrack ?: waveSeedItem
                      if (startSeed != null && !startSeed.idKey.startsWith("seed_artist_")) {
                          playbackQueue.add(startSeed)
                          recordTrackPlayedInWave(startSeed)
                          renderWaveScreenToUi()
                          if (currentPlayingItem?.idKey != startSeed.idKey || !player.isPlaying) {
                              playFromQueueIndex(0)
                          } else {
                              playbackQueueIndex = 0
                          }
                          appendNextWaveBatchAsync(autoPlayFirst = false)
                      } else {
                          renderWaveScreenToUi()
                          appendNextWaveBatchAsync(autoPlayFirst = true)
                      }
                  } else {
                      renderWaveScreenToUi()
                      if (!player.isPlaying && playbackQueue.isNotEmpty()) {
                          val targetIdx = playbackQueueIndex.coerceIn(0, playbackQueue.size - 1)
                          playFromQueueIndex(targetIdx)
                      }
                      if (playbackQueue.size - 1 - playbackQueueIndex <= 7) {
                          appendNextWaveBatchAsync(autoPlayFirst = false)
                      }
                  }
                  currentPlayingItem?.let { updatePlayerUiForItem(it) }
              }
          
