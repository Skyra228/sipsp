Патч 1 — Стабильность в фоне, уведомление в шторке и Bluetooth-гарнитура
Что меняется:

В AndroidManifest.xml добавляются разрешения android.permission.WAKE_LOCK и android.permission.POST_NOTIFICATIONS (для Android 13+), у MainActivity выставляется android:launchMode="singleTop", а в PlaybackService добавляется фильтр android.media.browse.MediaBrowserService.

В PlaybackService.kt (MusicEngine.ensureInitialized) на ExoPlayer.Builder включается .setWakeMode(C.WAKE_MODE_NETWORK) и PowerManager.PARTIAL_WAKE_LOCK, а сам плеер оборачивается в ForwardingPlayer(exo), который принудительно объявляет команды COMMAND_SEEK_TO_NEXT, COMMAND_SEEK_TO_PREVIOUS, COMMAND_SEEK_TO_NEXT_MEDIA_ITEM и COMMAND_SEEK_TO_PREVIOUS_MEDIA_ITEM и перенаправляет seekToNext() / seekToPrevious() в колбэки MusicEngine.onNextRequested и MusicEngine.onPrevRequested.

В MainActivity.onCreate() добавляется запрос разрешения POST_NOTIFICATIONS на Android 13+, запуск сервиса через ContextCompat.startForegroundService(...) и привязка MediaController.Builder(appCtx, SessionToken(...)).buildAsync().

В PlaybackService.onStartCommand возвращается START_STICKY, а в onTaskRemoved сервис продолжает работу, если p.isPlaying || p.playWhenReady.

Зачем: без связки MediaController ↔ MediaSessionService и разрешения POST_NOTIFICATIONS Media3 не поднимает foreground-уведомление на Android 13+, а поскольку в ExoPlayer передаётся по одному треку за раз, без ForwardingPlayer система считает очередь пустой и блокирует кнопки «Следующий / Предыдущий» в шторке и на Bluetooth-наушниках.

Ожидаемый результат: при запуске трека в шторке и на экране блокировки сразу появляется медиа-уведомление с обложкой, названием и активными кнопками ⏮ / ⏯ / ⏭; музыка не прерывается при выключении экрана, сворачивании или смахивании карточки приложения из недавних задач, а кнопки на Bluetooth-наушниках переключают треки по списку.

Патч 2 — Рабочие подфильтры с подгрузкой полных подстраниц сайта
Что меняется:

В MainActivity.kt добавляются методы shouldShowSubFilters(), buildSubFilterUrl(entry, filter), onSubFilterClicked(filter) и кэш подстраниц subFilterCache = LruCache<String, CachedPage>(40).

При нажатии на чип 👤 Исполнители, 💿 Альбомы или ♪ Треки на кнопке сразу включается индикатор загрузки (⏳ Исполнители..., ⏳ Альбомы..., ⏳ Треки...) и формируется прямой запрос к соответствующей подстранице сайта Spaces Music Online:

В поиске: /music-online/search/index/?sq=<запрос>&T=1&CK=1 (треки), T=2 (артисты), T=3 (альбомы).

В карточке артиста: /music-online/artist/<slug>/tracks/, /albums/, /similar/.

Спарсенные элементы мёржатся в allParsedItems через seenKeys без дублей, сохраняются в subFilterCache, а nextPageUrl переключается на пагинацию выбранной подстраницы (p2, p3...).

Зачем: первая страница поиска (T=0) отдаёт только короткое превью каждого блока, тогда как полные списки с пагинацией лежат на отдельных подстраницах T=1/2/3 и /tracks/, /albums/.

Ожидаемый результат: подфильтры отображаются только в поиске, карточке артиста и жанре (и скрыты на главной, в избранном и истории), при нажатии показывают статус загрузки, подтягивают полный список выбранной категории с сайта с рабочей пагинацией и при повторном переключении открываются мгновенно из кэша.

Патч 3 — Разделение на 5 экранов, мини-плеер, полноэкранный плеер и переименование в «Селюк мьюзик»
Что меняется:

Название приложения заменено на «Селюк мьюзик» в AndroidManifest.xml (android:label="Селюк мьюзик"), settings.gradle.kts, заголовке шапки, мини-плеере, полноэкранном плеере, Splash-экране и диалоге «О приложении».

В activity_main.xml и MainActivity.kt (switchBottomTab) интерфейс разделён на 5 нижних вкладок (BottomTab):

🏠 Главная: переключение Онлайн и Популярные.

🎵 Музыка: переключение Жанры и Альбомы.

👤 Артисты: полный каталог исполнителей.

❤️ Своё: Любимые, История, Плейлисты и кнопка + Создать плейлист.

⚙️ Ещё: отдельный экран настроек (moreScreenContainer) с эквалайзером, таймером сна, выбором зеркала, переключением тёмной/светлой темы, очисткой кэша, экспортом/импортом JSON и справкой о приложении.

Над нижней навигацией размещён компактный miniPlayerBar (обложка, название, ⏮, ⏯, ⏭), нажатие на который раскрывает fullPlayerOverlay («Сейчас играет») с крупной обложкой 250dp, полосой перемотки и полным набором кнопок управления.

Поиск вынесен в раскрываемую панель по кнопке 🔍 в шапке (btnOpenSearch), при старте показывается плавный splashOverlay, а в NavEntry сохраняются scrollPos и scrollOffset (saveCurrentScrollPosition()) с восстановлением через lm.scrollToPositionWithOffset(...) при нажатии «Назад».

Зачем: разгружает главный экран от нагромождения из 11 чипов и совмещённого плеера, сохраняя при этом единый ExoPlayer и быструю навигацию.

Ожидаемый результат: чистый интерфейс с нижней панелью вкладок, сворачиваемым полноэкранным плеером, сохранением точной позиции прокрутки при возврате «Назад», переключением тёмной/светлой темы и названием «Селюк мьюзик» во всех точках системы.

Патч 4 — Производительность, кэш страниц и офлайн-кэш аудио
Что меняется:

В app/build.gradle.kts подключаются модули androidx.media3:media3-datasource:1.2.1 и androidx.media3:media3-database:1.2.1.

В MusicEngine создаётся дисковый кэш SimpleCache объёмом 250 МБ (LeastRecentlyUsedCacheEvictor(250L * 1024L * 1024L) + StandaloneDatabaseProvider) и оборачивается в CacheDataSource.Factory с флагом FLAG_IGNORE_CACHE_ON_ERROR, а каждому MediaItem задаётся .setCustomCacheKey(item.idKey).

В MainActivity.kt добавляется pageCache = LruCache<String, CachedPage>(60) для всех загруженных URL и поисковых запросов.

В SpaceAdapter обновление списка переведено с notifyDataSetChanged() на DiffUtil.calculateDiff(...) (submitList) и частичные payload-обновления ("PLAY_STATE", "COVER"), а rvTracks.itemAnimator = null убирает мерцание элементов.

Порог предзагрузки следующей страницы в OnScrollListener увеличен до 8 элементов до конца списка, а prefetchNextTracks заранее резолвит прямые ссылки .mp3 для двух следующих треков в очереди.

Зачем: исключает повторные сетевые запросы при навигации «Назад» и повторном входе в разделы, предотвращает повторное скачивание аудио при перемотке и убирает визуальное мигание RecyclerView.

Ожидаемый результат: возврат «Назад» и повторное открытие разделов происходят за 0 мс из памяти, перемотка внутри трека работает мгновенно, а уже прослушанные треки воспроизводятся полностью офлайн из дискового кэша.

Патч 5 — Обложки, Shuffle, 3 режима Repeat, свайпы, контекстное меню, плейлисты и JSON-бэкап
Что меняется:

В item_track.xml, мини-плеер и полноэкранный плеер добавлены ImageView (ivCover, ivMiniCover, ivFullCover), а в MainActivity.kt реализована асинхронная загрузка обложек с кэшем bitmapCache = LruCache<String, Bitmap>(80) и передачей setArtworkUri(Uri.parse(item.coverUrl)) в MediaMetadata для экрана блокировки.

Добавлены shuffleEnabled (🔀) и трёхпозиционный переключатель RepeatState (OFF → ALL → ONE) с сохранением в SharedPreferences("selyuk_v15").

К rvTracks подключён ItemTouchHelper: свайп вправо (→ с зелёной подсветкой) переключает избранное без удаления строки из списка, свайп влево (← с синей подсветкой) запускает скачивание .mp3 в Music/SelyukMusic/.

Долгое нажатие на любой трек (onLongClick) открывает контекстное меню (▶ Воспроизвести, ♥ В любимые / Удалить, ➕ Добавить в плейлист..., ⬇ Скачать MP3, 🔗 Скопировать ссылку).

Добавлено управление пользовательскими плейлистами (getPlaylistsObject, showPlaylistsScreen, showCreatePlaylistDialog, showAddToPlaylistDialog), сохранение и восстановление последнего трека и позиции (saveLastPlayedState / restoreLastPlayedState с отложенным seekTo без автозапуска), автодополнение строки поиска (AutoCompleteTextView) и экспорт/импорт всей медиатеки в Download/SelyukMusic_backup.json и буфер обмена.

Зачем: превращает приложение в полноценный плеер с пользовательскими плейлистами, жестами, обложками и переносом медиатеки между устройствами.

Ожидаемый результат: обложки отображаются в списке, плеере и шторке; работают свайпы вправо/влево и долгое нажатие; создаются и редактируются собственные плейлисты; при перезапуске приложение помнит последний трек и секунду, на которой остановилось.

