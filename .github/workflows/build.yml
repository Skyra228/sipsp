              private fun updateBatteryOptButtonLabel() {
                  if (!::btnBatteryOpt.isInitialized) return
                  try {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      val ignoring = if (Build.VERSION.SDK_INT >= 23) pm.isIgnoringBatteryOptimizations(packageName) else true
                      if (ignoring) {
                          btnBatteryOpt.text = "Фоновый режим: Без ограничений (Не спит) ✓"
                          btnBatteryOpt.setTextColor(0xFFA5D6A7.toInt())
                      } else {
                          btnBatteryOpt.text = "Отключить спящий режим в фоне (Батарея)"
                          btnBatteryOpt.setTextColor(0xFFFFE082.toInt())
                      }
                  } catch (_: Exception) {}
              }
          
              @SuppressLint("BatteryLife")
              private fun requestIgnoreBatteryOptimizations() {
                  try {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      if (Build.VERSION.SDK_INT >= 23 && !pm.isIgnoringBatteryOptimizations(packageName)) {
                          val pkg = packageName
                          val intent = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                              data = Uri.parse("package:$pkg")
                          }
                          startActivity(intent)
                      } else {
                          val intent = Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS)
                          startActivity(intent)
                      }
                  } catch (_: Exception) {
                      try {
                          startActivity(Intent(Settings.ACTION_SETTINGS))
                      } catch (_: Exception) {}
                  }
              }
          
